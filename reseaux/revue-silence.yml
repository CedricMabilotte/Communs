resume: >
  Mensuel indépendant fondé en 1982 à Lyon par des participant·es à la marche
  contre la centrale nucléaire de Superphénix de Creys-Malville. La revue est
  éditée par une association loi 1901 du même nom (Silence — Écologie,
  Alternatives, Non-violence), autogérée, sans publicité, financée par les
  abonnements et les dons. L'équipe combine une petite équipe salariée à
  temps partiel et un large réseau de bénévoles ; les décisions y sont
  collectives et les salaires égaux. Silence n'est pas un porteur foncier :
  la revue figure dans le corpus Communs comme média-pivot — source citée
  par plusieurs fiches du milieu de l'écologie sociale, du retrait et de
  l'autonomie (Cabrery, Mas de Granier, Hameau des Buis).
montage:
  type: null
  description: >
    Aucun portage foncier. Silence est une revue : une association loi 1901
    qui édite un mensuel autogéré, sans publicité, financé par les
    abonnements et les dons. Le modèle économique repose sur l'abonnement
    citoyen, des appels à soutien périodiques et une équipe à dominante
    bénévole épaulée par quelques salarié·es à temps partiel.
integrite_montage:
  niveau: null
  commentaire: >
    Non applicable. L'échelle d'intégrité du montage Communs évalue la
    protection d'un foncier porté hors marché ; Silence n'a pas de foncier
    propre. Le statut d'association loi 1901 sans capital appropriable, le
    refus de la publicité et la gouvernance collective signalent une
    intégrité éditoriale et économique du média — distincte de la grille
    foncière du corpus.
