resume: >
  Le réseau des Conservatoires d'espaces naturels rassemble les conservatoires
  régionaux et départementaux — associations loi 1901 d'intérêt général agréées
  conjointement par l'État et la Région au titre de l'article L. 414-11 du Code
  de l'environnement —, fédérés par la Fédération des Conservatoires d'espaces
  naturels (FCEN). Le réseau compte une vingtaine de conservatoires couvrant
  l'ensemble du territoire ; chaque conservatoire acquiert et protège du foncier
  naturel par une combinaison de propriété, de baux emphytéotiques, de baux
  ruraux environnementaux, d'obligations réelles environnementales et de
  conventions de gestion. La Fédération assure la représentation nationale du
  réseau, l'animation entre conservatoires et le portage de programmes communs ;
  elle n'est pas elle-même détentrice du foncier — ce sont les conservatoires
  membres qui portent les sites.
