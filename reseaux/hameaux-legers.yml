uid: hameaux-legers
categorie: reseau
nom: Hameaux Légers
sous_titre: Association d'accompagnement des écohameaux réversibles sur foncier communal
statut_fiche: publie
forme_juridique: Association déclarée (loi 1901)
localisation:
  commune: Saint-André-des-Eaux
  departement: Côtes-d'Armor (22)
  region: Bretagne
annee: 2017
url: https://hameaux-legers.org/
resume: 'Association loi 1901 à but non lucratif, se présentant comme reconnue d''intérêt général, qui
  accompagne depuis 2017 collectivités, citoyen·nes et professionnel·les dans la création d''écohameaux
  en habitat réversible — immatriculée au répertoire national le 13 novembre 2018, siège à Saint-André-des-Eaux
  (Côtes-d''Armor). Cofondée par Xavier Gisserot, elle emploie une dizaine de salarié·es et dit accompagner
  douze communes bretonnes en avril 2024. Son modèle type : une commune met un terrain à disposition par
  bail emphytéotique de longue durée, les habitant·es sont propriétaires de leur habitat démontable et
  non du sol. La page « Les projets accompagnés » du site liste, au 2026-11-20, vingt-huit projets dans
  cinq régions (dix-sept en Bretagne) : six habités (Le Placis à Saint-André-des-Eaux, Pont Rialland à
  Plessé, Guipel, Kerlisette à Plouigneau, Commana — hameau du Ti Dourig — et Trignac), quatre en chantier,
  douze en conception, trois à l''étude, trois en recherche de collectif. La page n''affiche aucun total
  ; la somme des foyers affichés sur vingt-sept cartes (Suze sans chiffre) est de 212, calcul de l''annuaire.
  Le réseau n''est pas un lieu : il fournit méthode et accompagnement, sans détenir de foncier.

  '
montage:
  type: propriete_protegee
  description: 'Le montage est porté commune par commune : la collectivité, propriétaire du terrain, le
    loue par bail emphytéotique long (80 ans au Placis) à un collectif d''habitant·es ; chaque foyer possède
    son habitat réversible, non le sol. L''association accompagne la commune et le collectif (étude, conception,
    recrutement du collectif, urbanisme) mais n''est partie ni au bail ni à la propriété. Ni charte type,
    ni statuts, ni modèle de bail ne sont publiés sur son site ; aucune règle commune de revente des habitats
    n''est documentée.

    '
integrite_montage:
  niveau: ig_institue
  commentaire: 'Association non lucrative d''accompagnement, sans foncier propre : le verrou de chaque
    hameau tient au portage public du sol et au bail long, non à un mécanisme de garantie porté par le
    réseau (à la différence de CLIP, co-membre de chaque association propriétaire). Le réseau situe, il
    ne verrouille pas.

    '
