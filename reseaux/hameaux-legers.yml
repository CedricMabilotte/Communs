analyse:
  forces:
  - 'Modèle reproductible et documenté : foncier communal, bail emphytéotique long, habitat réversible
    en propriété dissociée du sol.'
  - Équipe salariée, accompagnement d'une douzaine de communes bretonnes (Reporterre, 2024) ; vingt-huit
    projets listés sur le site au 2026-11-20, dont six habités et quatre en chantier.
  - Réponse concrète à la limitation de l'artificialisation (ZAN) en centre-bourg.
  fragilites:
  - 'Aucun mécanisme de garantie porté par le réseau : la solidité dépend de chaque commune et de chaque
    bail.'
  - Statuts, charte, modèle de bail et règles de revente des habitats non publiés.
  - Finalité centrée sur l'habitat humain ; le vivant n'apparaît que par l'évitement de l'artificialisation.
  leviers:
  - Publier un modèle de bail et une charte commune (destination, revente, retour du terrain).
  - Documenter chaque hameau avec sa délibération et son bail.
  - Intégrer une dimension de protection du vivant dans le modèle (part du terrain laissée au vivant,
    ORE).
  synthese: 'Hameaux Légers est un réseau de méthode plutôt qu''un réseau de garantie : il a fait exister
    un schéma — sol communal, bail long, habitat réversible — que le corpus admet déjà par ailleurs, et
    l''essaime auprès des communes. Sa valeur pour l''annuaire tient à la lisibilité de ce schéma et à
    la documentation de ses hameaux ; sa limite, à l''absence de verrou propre et de pièces publiées.

    '
fiabilite: 'Faits vérifiés le 2026-11-20 : association « HAMEAUX LEGERS », SIREN 844 725 440, créée le
  13 novembre 2018, état actif, catégorie 9220, NAF 94.99Z, siège 3 Le Champ aux Moines, 22630 Saint-André-des-Eaux
  (recherche-entreprises.api.gouv.fr) ; « Association loi 1901 à but non lucratif », action « depuis 2017
  », reconnue d''intérêt général selon le site, gouvernance partagée (hameaux-legers.org, accueil et page
  « L''association ») ; page « Les projets accompagnés » (hameaux-legers.org/projets, lue le 2026-11-20
  par WebFetch puis par curl depuis la machine, textes identiques) : 28 cartes de projets, chacune avec
  région, département, nombre de foyers et niveau d''avancement — Habité : Le Placis (Saint-André-des-Eaux,
  22, 8 foyers), Pont Rialland (Plessé, 44, 12), Guipel (35, 9), Kerlisette (Plouigneau, 29, 7), Commana
  (29, 7, « hameau du Ti Dourig »), Trignac (44, 4) ; En chantier : Trémargat (22, 8), Cormorance (La
  Ville-ès-Nonais, 35, 4), Les Cabanes Inspirées (Potelle, 59, 8), Kenvevan (Combrit Sainte-Marine, 29,
  8) ; En conception : Paimpol (22, 6), Rocles (07, 9), Saffré (44, 9), Guichen (35, 5), Brandivy (56,
  9), Saint-Julien-Molin-Molette (42, 10), Penmarc''h (29, 9), Limogne-en-Quercy (46, 8), Botmeur (29,
  8), Tiyourca (Le Bourget-du-Lac, 73, 11), La Sablière (Dieulefit, 26, 8), Suze (26, foyers non affichés)
  ; À l''étude : Pérignat-sur-Allier (63, 5), Saint-Quay-Perros (22, 6), Plouër-sur-Rance (22, 6) ; En
  recherche de collectif : Pluherlin (56, 6), Poilley (35, 7), Binic-Étables-sur-Mer (22, 15). La page
  n''affiche ni total de projets ni total de foyers : « 28 projets » et « 212 foyers » sont des comptes
  de l''annuaire. Xavier Gisserot cofondateur, douze communes accompagnées en Bretagne, habitant·es «
  propriétaires de leur habitat, mais pas du terrain », bail emphytéotique de longue durée, hameau de
  Commana sur un terrain communal (Reporterre, 10 avril 2024, lue depuis la machine) ; une dizaine de
  salarié·es, une dizaine de communes accompagnées (L''Info durable, 20 mai 2023). Non confirmé : statuts,
  RNA, nombre d''adhérent·es, comptes, charte, modèle de bail ; l''écart entre « depuis 2017 » (site)
  et l''immatriculation de novembre 2018 (registre) n''est pas expliqué par les sources. Correction du
  2026-11-20 après vérification aveugle : la version précédente de cette fiche attribuait à la page /projets
  « quatre hameaux, six projets, 27 foyers » et des statuts permutés ; valeurs remplacées par celles lues
  ce jour.

  '
