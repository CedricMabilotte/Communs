<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d">
  <title id="t">La chaîne des actes qu'un projet doit franchir, et ce que les juges en ont fait</title>
  <desc id="d">Un projet qui prend de la terre passe par une suite d'actes publics attaquables : utilité publique, cessibilité et expropriation, autorisation environnementale avec dérogation espèces protégées, puis police de l'eau. Dans les affaires étudiées, les juges ont validé les deux premiers maillons ; les annulations portent surtout sur le troisième et le quatrième, l'eau et le vivant. Quand le projet est abandonné, l'acte décisif devient celui qui attribue la terre.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="s-arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="s-mut" x="20" y="24" font-size="13">Actes publics, dans l'ordre où ils interviennent</text>

  <rect class="s-blue" x="20" y="36" width="156" height="78" rx="8"/>
  <text class="s-txt" x="98" y="66" font-size="14" text-anchor="middle">Utilité publique</text>
  <text class="s-mut" x="98" y="90" font-size="13" text-anchor="middle">décret ou arrêté</text>
  <rect class="s-blue" x="198" y="36" width="156" height="78" rx="8"/>
  <text class="s-txt" x="276" y="66" font-size="14" text-anchor="middle">Cessibilité</text>
  <text class="s-mut" x="276" y="90" font-size="13" text-anchor="middle">puis expropriation</text>
  <rect class="s-blue" x="376" y="36" width="156" height="78" rx="8"/>
  <text class="s-txt" x="454" y="60" font-size="14" text-anchor="middle">Autorisation</text>
  <text class="s-txt" x="454" y="80" font-size="14" text-anchor="middle">environnementale</text>
  <text class="s-mut" x="454" y="102" font-size="13" text-anchor="middle">espèces protégées</text>
  <rect class="s-blue" x="554" y="36" width="146" height="78" rx="8"/>
  <text class="s-txt" x="627" y="66" font-size="14" text-anchor="middle">Police de l'eau</text>
  <text class="s-mut" x="627" y="90" font-size="13" text-anchor="middle">prélèvements</text>
  <line class="s-arrow" x1="177" y1="75" x2="196" y2="75" marker-end="url(#ah)"/>
  <line class="s-arrow" x1="355" y1="75" x2="374" y2="75" marker-end="url(#ah)"/>
  <line class="s-arrow" x1="533" y1="75" x2="552" y2="75" marker-end="url(#ah)"/>

  <text class="s-mut" x="20" y="146" font-size="13">Ce que les juges en ont fait dans les affaires citées</text>

  <rect class="s-box" x="20" y="158" width="156" height="128" rx="8"/>
  <text class="s-txt" x="98" y="184" font-size="13" text-anchor="middle">NDDL : utilité</text>
  <text class="s-txt" x="98" y="202" font-size="13" text-anchor="middle">publique maintenue</text>
  <text class="s-mut" x="98" y="230" font-size="13" text-anchor="middle">abrogation refusée,</text>
  <text class="s-mut" x="98" y="248" font-size="13" text-anchor="middle">recours rejeté</text>
  <text class="s-mut" x="98" y="266" font-size="13" text-anchor="middle">(2013)</text>
  <rect class="s-box" x="198" y="158" width="156" height="128" rx="8"/>
  <text class="s-txt" x="276" y="184" font-size="13" text-anchor="middle">NDDL : cessibilité</text>
  <text class="s-txt" x="276" y="202" font-size="13" text-anchor="middle">définitive (2014)</text>
  <text class="s-mut" x="276" y="230" font-size="13" text-anchor="middle">Larzac : cessibilité</text>
  <text class="s-mut" x="276" y="248" font-size="13" text-anchor="middle">évoquée au Sénat</text>
  <text class="s-mut" x="276" y="266" font-size="13" text-anchor="middle">(janvier 1979)</text>
  <rect class="s-acc" x="376" y="158" width="156" height="128" rx="8"/>
  <text class="s-txt" x="454" y="184" font-size="13" text-anchor="middle">NDDL : validée</text>
  <text class="s-txt" x="454" y="202" font-size="13" text-anchor="middle">(2016)</text>
  <text class="s-txt" x="454" y="230" font-size="13" text-anchor="middle">A69 : annulée (2025)</text>
  <text class="s-txt" x="454" y="248" font-size="13" text-anchor="middle">puis validée en appel</text>
  <text class="s-txt" x="454" y="272" font-size="13" text-anchor="middle">4 réserves illégales</text>
  <rect class="s-acc" x="554" y="158" width="146" height="128" rx="8"/>
  <text class="s-txt" x="627" y="184" font-size="13" text-anchor="middle">15 réserves</text>
  <text class="s-txt" x="627" y="202" font-size="13" text-anchor="middle">annulées (2023)</text>
  <text class="s-txt" x="627" y="230" font-size="13" text-anchor="middle">Marais poitevin :</text>
  <text class="s-txt" x="627" y="248" font-size="13" text-anchor="middle">prélèvements</text>
  <text class="s-txt" x="627" y="266" font-size="13" text-anchor="middle">annulés (2024-2025)</text>

  <line class="s-arrow" x1="360" y1="300" x2="360" y2="338" marker-end="url(#ah)"/>
  <text class="s-mut" x="372" y="324" font-size="13">si le projet est abandonné</text>

  <rect class="s-ok" x="20" y="344" width="216" height="104" rx="8"/>
  <text class="s-txt" x="128" y="372" font-size="14" text-anchor="middle">Larzac</text>
  <text class="s-mut" x="128" y="396" font-size="13" text-anchor="middle">l'État garde la terre,</text>
  <text class="s-mut" x="128" y="416" font-size="13" text-anchor="middle">bail emphytéotique</text>
  <text class="s-mut" x="128" y="436" font-size="13" text-anchor="middle">à la SCTL</text>
  <rect class="s-ok" x="252" y="344" width="216" height="104" rx="8"/>
  <text class="s-txt" x="360" y="372" font-size="14" text-anchor="middle">Notre-Dame-des-Landes</text>
  <text class="s-mut" x="360" y="396" font-size="13" text-anchor="middle">le Département reprend</text>
  <text class="s-mut" x="360" y="416" font-size="13" text-anchor="middle">895 ha et signe</text>
  <text class="s-mut" x="360" y="436" font-size="13" text-anchor="middle">des baux ruraux</text>
  <rect class="s-box" x="484" y="344" width="216" height="104" rx="8"/>
  <text class="s-txt" x="592" y="372" font-size="14" text-anchor="middle">Ce choix est politique</text>
  <text class="s-mut" x="592" y="396" font-size="13" text-anchor="middle">aucun juge n'impose</text>
  <text class="s-mut" x="592" y="416" font-size="13" text-anchor="middle">de garder la terre</text>
  <text class="s-mut" x="592" y="436" font-size="13" text-anchor="middle">hors du marché</text>
</svg>
