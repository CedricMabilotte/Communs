<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556" role="img" aria-labelledby="t d">
  <title id="t">Le moment de bascule d'une transmission</title>
  <desc id="d">Une transmission se joue dans les cinq à dix ans qui précèdent le départ. L'intention du cédant, le recensement proposé par le point d'accueil départemental cinq ans avant l'âge légal, puis la déclaration à la MSA et le répertoire départ-installation préparent un moment de bascule : vendre, louer ou donner, d'un bloc ou par morceaux. Selon ce choix, la ferme est reprise entière par une installation, démantelée au profit de l'agrandissement des voisins, ou réduite à une maison gardée et des bâtiments vides.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="s-arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Étape 1 -->
  <text class="s-mut" x="20" y="28" font-size="13">10 à 5 ans avant le départ</text>
  <rect class="s-box" x="20" y="38" width="380" height="68" rx="8"/>
  <text class="s-txt" x="210" y="66" font-size="15" text-anchor="middle">Intention du cédant :</text>
  <text class="s-txt" x="210" y="88" font-size="15" text-anchor="middle">à qui transmettre ?</text>

  <rect class="s-box" x="450" y="38" width="250" height="68" rx="8"/>
  <text class="s-txt" x="575" y="66" font-size="14" text-anchor="middle">Diagnostic de la ferme</text>
  <text class="s-mut" x="575" y="88" font-size="13" text-anchor="middle">à sa demande (loi de 2025)</text>
  <line class="s-arrow" x1="448" y1="72" x2="404" y2="72" marker-end="url(#ah)"/>

  <line class="s-arrow" x1="370" y1="108" x2="370" y2="138" marker-end="url(#ah)"/>

  <!-- Étape 2 -->
  <text class="s-mut" x="20" y="132" font-size="13">5 ans avant l'âge légal</text>
  <rect class="s-blue" x="20" y="142" width="380" height="68" rx="8"/>
  <text class="s-txt" x="210" y="170" font-size="15" text-anchor="middle">Le point d'accueil unique</text>
  <text class="s-txt" x="210" y="192" font-size="15" text-anchor="middle">propose de recenser la ferme</text>

  <rect class="s-blue" x="450" y="142" width="250" height="68" rx="8"/>
  <text class="s-txt" x="575" y="170" font-size="14" text-anchor="middle">France services agriculture</text>
  <text class="s-mut" x="575" y="192" font-size="13" text-anchor="middle">partout au 1er janvier 2027</text>
  <line class="s-arrow" x1="448" y1="176" x2="404" y2="176" marker-end="url(#ah)"/>

  <line class="s-arrow" x1="370" y1="212" x2="370" y2="242" marker-end="url(#ah)"/>

  <!-- Étape 3 -->
  <text class="s-mut" x="20" y="236" font-size="13">2 à 3 ans avant</text>
  <rect class="s-blue" x="20" y="246" width="380" height="68" rx="8"/>
  <text class="s-txt" x="210" y="274" font-size="15" text-anchor="middle">Déclaration à la MSA (DICAA)</text>
  <text class="s-txt" x="210" y="296" font-size="15" text-anchor="middle">et répertoire (RDI)</text>

  <rect class="s-box" x="450" y="246" width="250" height="68" rx="8"/>
  <text class="s-txt" x="575" y="274" font-size="14" text-anchor="middle">Voisins, repreneur·ses,</text>
  <text class="s-txt" x="575" y="296" font-size="14" text-anchor="middle">bailleurs, notaire</text>
  <line class="s-arrow" x1="448" y1="280" x2="404" y2="280" marker-end="url(#ah)"/>

  <line class="s-arrow" x1="370" y1="316" x2="370" y2="346" marker-end="url(#ah)"/>

  <!-- Bascule -->
  <text class="s-mut" x="20" y="340" font-size="13">Le moment de bascule</text>
  <rect class="s-acc" x="20" y="350" width="380" height="68" rx="8"/>
  <text class="s-txt" x="210" y="378" font-size="15" text-anchor="middle">Vendre, louer ou donner ?</text>
  <text class="s-txt" x="210" y="400" font-size="15" text-anchor="middle">D'un bloc ou par morceaux ?</text>

  <rect class="s-blue" x="450" y="350" width="250" height="68" rx="8"/>
  <text class="s-txt" x="575" y="378" font-size="14" text-anchor="middle">SAFER informée d'une vente</text>
  <text class="s-mut" x="575" y="400" font-size="13" text-anchor="middle">droit de préemption</text>
  <line class="s-arrow" x1="448" y1="384" x2="404" y2="384" marker-end="url(#ah)"/>

  <!-- Issues -->
  <line class="s-arrow" x1="128" y1="420" x2="128" y2="458" marker-end="url(#ah)"/>
  <line class="s-arrow" x1="300" y1="420" x2="360" y2="458" marker-end="url(#ah)"/>
  <line class="s-arrow" x1="390" y1="420" x2="560" y2="458" marker-end="url(#ah)"/>

  <rect class="s-ok" x="20" y="462" width="216" height="84" rx="8"/>
  <text class="s-txt" x="128" y="488" font-size="15" text-anchor="middle">Reprise entière</text>
  <text class="s-mut" x="128" y="510" font-size="13" text-anchor="middle">une installation, souvent</text>
  <text class="s-mut" x="128" y="530" font-size="13" text-anchor="middle">hors cadre familial</text>

  <rect class="s-acc" x="252" y="462" width="216" height="84" rx="8"/>
  <text class="s-txt" x="360" y="488" font-size="15" text-anchor="middle">Démantèlement</text>
  <text class="s-mut" x="360" y="510" font-size="13" text-anchor="middle">les terres vont</text>
  <text class="s-mut" x="360" y="530" font-size="13" text-anchor="middle">à l'agrandissement</text>

  <rect class="s-box" x="484" y="462" width="216" height="84" rx="8"/>
  <text class="s-txt" x="592" y="488" font-size="15" text-anchor="middle">Un siège sans ferme</text>
  <text class="s-mut" x="592" y="510" font-size="13" text-anchor="middle">maison gardée,</text>
  <text class="s-mut" x="592" y="530" font-size="13" text-anchor="middle">bâtiments vides</text>
</svg>
