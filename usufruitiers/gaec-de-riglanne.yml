  synthese: >
    Le GAEC de Riglanne est le maillon usufruitier d'une ferme fromagère Terre
    de Liens en pleine transmission : un collectif de trois paysannes reprend en
    2025 une exploitation laitière biologique installée depuis 2002. Sa nature
    de groupement d'exploitation — bénéfice partagé entre associé·es — le situe
    du côté du mutualisme, mais son ouverture annoncée à de nouvelles activités
    est un atout.
fiabilite: >
  Faits vérifiés (sources Terre de Liens, Terre de Liens Pays de la Loire et
  presse spécialisée, consultées en mai 2026) : ferme fromagère de Riglanne à
  Campbon, élevage laitier biologique conduit depuis 2002 par Anne et Christian
  Bastard, foncier partiellement acquis par la Foncière Terre de Liens en 2013,
  parrainage de Loréna Serra, Nolwenn Thiriet et Valentine Temple à partir de
  février 2025, retraite des cédant·es en octobre 2025, reprise par le collectif,
  diversification bovin laitier et caprin, projet d'accueil de deux paysans
  boulangers. Non confirmé : forme et statuts précis du collectif repreneur,
  montant du fermage, nature exacte du bail, clause de dévolution.
