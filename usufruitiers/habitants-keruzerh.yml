  - critere: non_lucrativite_effective
    valeur: partiel
    note: "Le statut coopératif encadre la lucrativité et impose des réserves ; le détail de l'absence de partage de bénéfices n'est pas documenté."
  - critere: une_voix
    valeur: oui
    note: "La coopérative d'habitants repose par construction sur le principe « une personne, une voix », indépendamment du capital apporté."
  - critere: usagers_decident
    valeur: oui
    note: "Les habitant·es vivent et gouvernent le lieu en démocratie participative ; le collectif de huit familles décide collectivement des usages."
  - critere: ouverture_entrants
    valeur: partiel
    note: "Le projet prévoit sept logements à terme et a communiqué sur l'accueil de nouveaux habitant·es ; les modalités précises d'admission ne sont pas documentées."
