    valeur: oui
    note: "Le foncier reste la propriété de la SCIC ; les habitant·es, locataires, ne peuvent ni revendre ni capter à titre privé la valeur du foncier."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Une coopérative d'habitants comporte un capital en parts à lucrativité encadrée ; le détail du verrouillage des parts n'est pas documenté par les sources."
