resume: >
  Coopérative d'habitants réunissant les ménages de l'écovillage Demain en main,
  au hameau de Keruzerh à Locoal-Mendon (Morbihan). Dans le montage du projet,
  cette coopérative loue les logements à la SCIC Écovillage de Keruzerh, qui est
  propriétaire du foncier et du bâti. Le collectif réunit huit familles d'âges
  et d'horizons variés ; il vit le lieu en démocratie participative et porte
  l'usage habitant de l'écovillage, tandis qu'une SCOP agricole encadre la
  production maraîchère et l'accueil. Le projet vise à terme sept logements à
  haute performance énergétique.
montage:
  type: propriete_collective
  nu_proprietaire: "SCIC Écovillage de Keruzerh (société coopérative d'intérêt collectif)"
  usufruitier: "Coopérative d'habitants de Keruzerh (collectif d'habitant·es)"
  description: >
    La SCIC Écovillage de Keruzerh est propriétaire du foncier et du bâti du
    hameau. La coopérative d'habitants, structure distincte, loue les logements
    à la SCIC et porte l'usage habitant du lieu. La nature exacte du titre
    d'usage — bail, convention, contrat coopératif — et sa durée ne sont pas
    documentées par les sources publiques.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Coopérative d'habitants : structure collective de gouvernance des habitant·es,
    locataire des logements auprès de la SCIC propriétaire ; forme coopérative à
    lucrativité encadrée.
grille:
