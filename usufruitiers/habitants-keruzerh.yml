    note: "Le montant du loyer versé par la coopérative d'habitants à la SCIC n'est pas documenté par les sources."
  - critere: vivant_finalite
    valeur: non
    note: "La coopérative d'habitants porte l'usage habitant d'un écovillage pensé pour ses ménages membres ; la préservation de la biodiversité non-humaine n'est pas affichée parmi les finalités de ce maillon, l'activité maraîchère relevant d'une SCOP agricole distincte."
analyse:
  forces:
    - "Gouvernance habitante en démocratie participative, « une personne, une voix »."
    - "Foncier verrouillé hors appropriation privée par la propriété de la SCIC."
    - "Collectif diversifié de huit familles, issu d'un projet collectif structuré."
  fragilites:
    - "Nature et durée du titre d'usage non documentées : sécurité de jouissance incertaine."
    - "Montant du loyer et régime d'usage non documentés."
    - "Transparence comptable et clause de dévolution non documentées."
  leviers:
    - "Documenter et publier le titre d'usage liant la coopérative d'habitants à la SCIC."
    - "Préciser le régime du loyer et son caractère soutenable."
    - "Formaliser et publier les modalités d'accueil de nouveaux habitant·es."
  synthese: >
    La coopérative d'habitants de Keruzerh est le maillon usufruitier du montage
    Demain en main : un collectif qui gouverne en démocratie participative
    l'usage habitant d'un écovillage dont la SCIC porte la propriété. Sa solidité
    tient à sa gouvernance horizontale ; sa fragilité, à la non-publication du
    titre d'usage qui la lie à la SCIC.
fiabilite: >
  Faits vérifiés (sources Demain en main, Coopérative Oasis et presse régionale,
  consultées en mai 2026) : montage à plusieurs structures dont une coopérative
  d'habitants louant les logements à la SCIC propriétaire, collectif de huit
  familles, fonctionnement en démocratie participative, projet de sept logements
  à haute performance énergétique. Non confirmé : forme juridique précise et
  date de constitution de la coopérative d'habitants, nature et durée du titre
  d'usage, montant du loyer, clause de dévolution, publication des comptes.
