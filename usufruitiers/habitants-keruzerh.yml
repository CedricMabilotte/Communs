  - critere: objet_ig
    valeur: oui
    note: "L'objet — habitat écologique partagé articulé à un écovillage nourricier et d'accueil — porte un intérêt général d'habitat digne et de transition écologique."
  - critere: public_non_restreint
    valeur: partiel
    note: "L'écovillage accueille du public (ferme, accueil) ; l'usage habitant porté par la coopérative profite d'abord à ses ménages membres."
  - critere: duree_usage
    valeur: inconnu
    note: "La nature et la durée du titre d'usage liant la coopérative d'habitants à la SCIC propriétaire ne sont pas documentées par les sources."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'existence de clauses d'usage ou environnementales formalisées dans le titre d'usage n'est pas documentée par les sources."
  - critere: articulation_porteur
    valeur: oui
    note: "La coopérative d'habitants et la SCIC propriétaire sont issues d'un même projet collectif ; leur relation locative est clairement énoncée, même si ses clauses ne sont pas publiées."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "L'usage habitant repose sur un loyer versé à la SCIC ; son montant et son caractère non rentier ne sont pas documentés par les sources."
  - critere: loyer_soutenable
