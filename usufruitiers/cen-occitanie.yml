resume: >
  Association loi 1901 de protection de la nature, née en 2020 de la fusion des
  anciens Conservatoires d'espaces naturels de Midi-Pyrénées, du Languedoc-
  Roussillon et de Lozère. Le Conservatoire d'espaces naturels Occitanie est
  agréé par l'État et la Région au titre de l'article L. 414-11 du Code de
  l'environnement. Il intervient sur environ 370 sites couvrant quelque 36 000
  hectares d'espaces naturels, dont près de 1 600 hectares en pleine propriété,
  par une combinaison d'acquisitions, de conventions, de baux emphytéotiques, de
  baux ruraux environnementaux et d'obligations réelles environnementales. Il est
  notamment cogestionnaire, avec la commune de Sanilhac-Sagriès, de la réserve
  naturelle régionale des gorges du Gardon.
montage:
  type: propriete_sanctuarisee
  nu_proprietaire: "Propriétaires variables selon les sites (CEN Occitanie en propriété, communes, propriétaires privés)"
  usufruitier: "Conservatoire d'espaces naturels Occitanie (association loi 1901 agréée)"
  description: >
    Le Conservatoire d'espaces naturels Occitanie sécurise la protection des
    espaces naturels par la maîtrise foncière ou la maîtrise d'usage : il acquiert
    une partie des sites en pleine propriété, signe sur d'autres des conventions de
    gestion, des baux emphytéotiques, des baux ruraux environnementaux ou des
    obligations réelles environnementales. Sur la réserve naturelle régionale des
    gorges du Gardon, il intervient comme gestionnaire d'un foncier protégé par
    classement réglementaire de la Région, en cogestion avec la commune ; il y
    assure l'usage de conservation sans nécessairement détenir la propriété ou un
    titre d'usage de longue durée sur le périmètre.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Association loi 1901 d'intérêt général agréée par l'État et la Région :
    montage entièrement de droit civil non lucratif, à gouvernance associative
    inscrite dans un cadre public.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "Association loi 1901 sans capital social : ses membres ne peuvent ni revendre ni capter à titre privé la valeur du foncier qu'elle protège."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Association loi 1901 sans capital ni parts sociales : aucun titre cessible, aucune valeur foncière captable."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "Le sort de l'actif du Conservatoire en cas de dissolution n'est pas documenté par les sources consultées."
  - critere: personne_morale_civile
    valeur: oui
    note: "Association loi 1901 de protection de la nature, personne morale de droit civil structurellement non lucrative."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Association sans but lucratif : les ressources servent l'objet de protection des espaces naturels, sans partage de bénéfices."
  - critere: une_voix
    valeur: oui
    note: "Association loi 1901 dont la décision repose sur la vie associative et non sur un apport en capital."
  - critere: usagers_decident
    valeur: partiel
    note: "Le Conservatoire est gouverné par ses instances associatives ; il gère les sites par des équipes salariées et des plans de gestion, sans gouvernance par un collectif d'usager·es de chaque lieu."
  - critere: ouverture_entrants
    valeur: inconnu
    note: "Les modalités d'adhésion et de renouvellement des membres et administrateurs du Conservatoire ne sont pas documentées par les sources."
  - critere: transparence_interne
    valeur: partiel
    note: "Le Conservatoire publie un rapport d'activité annuel ; le détail de la transparence comptable et de la publication de ses décisions n'est pas documenté."
  - critere: objet_ig
    valeur: oui
    note: "L'objet — connaître, protéger, gérer et valoriser les espaces naturels — porte un intérêt général écologique reconnu par l'agrément État-Région au titre de l'article L. 414-11 du Code de l'environnement."
  - critere: public_non_restreint
    valeur: oui
    note: "La protection de la biodiversité et l'accueil du public sur des sites comme la réserve des gorges du Gardon bénéficient à la collectivité, bien au-delà des membres de l'association."
  - critere: duree_usage
    valeur: partiel
    note: "Le Conservatoire mobilise des titres d'usage longs (bail emphytéotique, obligation réelle environnementale) sur une partie de ses sites, mais sur la réserve des gorges du Gardon la durée et le renouvellement de la convention de cogestion ne sont pas documentés."
  - critere: clauses_usage
    valeur: oui
    note: "Sur la réserve des gorges du Gardon, l'usage est encadré par la réglementation de classement et un plan de gestion ; le Conservatoire recourt par ailleurs aux baux ruraux environnementaux et aux obligations réelles environnementales."
  - critere: articulation_porteur
    valeur: partiel
    note: "Le Conservatoire articule son action avec les propriétaires et la Région par conventions et classement, mais le détail de la relation contractuelle sur la réserve des gorges du Gardon n'est pas documenté."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "La gestion conservatoire des espaces naturels relève d'une mission d'intérêt général non lucrative ; une part des activités de valorisation et d'animation peut être tarifée, sans que le régime soit précisément documenté."
  - critere: loyer_soutenable
    valeur: inconnu
    note: "L'existence et le montant d'une redevance liée à la gestion de la réserve des gorges du Gardon ne sont pas documentés par les sources."
analyse:
  forces:
    - "Association loi 1901 d'intérêt général agréée par l'État et la Région : intégrité du montage élevée."
    - "Maîtrise foncière étendue — environ 36 000 hectares sur 370 sites, dont 1 600 en pleine propriété."
    - "Outils variés et protecteurs : acquisition, bail emphytéotique, bail rural environnemental, obligation réelle environnementale."
  fragilites:
    - "Gouvernance associative et salariée, sans participation directe d'un collectif d'usager·es des lieux."
    - "Clause de dévolution et transparence comptable non documentées."
    - "Sur la réserve des gorges du Gardon, durée et nature du titre d'usage non documentées."
  leviers:
    - "Documenter publiquement la clause de dévolution et les comptes de l'association."
    - "Privilégier l'acquisition et le bail emphytéotique pour sécuriser durablement les sites gérés."
    - "Préciser les conventions de cogestion et leur durée."
  synthese: >
    Le Conservatoire d'espaces naturels Occitanie est un maillon usufruitier
    robuste : association d'intérêt général agréée, il protège un vaste réseau de
    sites naturels par une palette d'outils fonciers solides. Sa logique est celle
    de l'intérêt général institué — gestion experte et descendante — plutôt que de
    l'autogestion citoyenne ; sa marge de progression tient à la transparence de
    son fonctionnement et à la sécurisation foncière de chaque site géré.
fiabilite: >
  Faits vérifiés (sources Conservatoire d'espaces naturels Occitanie et Fédération
  des conservatoires d'espaces naturels, consultées en mai 2026) : association loi
  1901 née en 2020 de la fusion des CEN de Midi-Pyrénées, du Languedoc-Roussillon
  et de Lozère, agréée par l'État et la Région au titre de l'article L. 414-11 du
  Code de l'environnement, intervention sur environ 370 sites couvrant quelque
  36 000 hectares dont près de 1 600 en pleine propriété, recours à l'acquisition,
  aux conventions, aux baux emphytéotiques, aux baux ruraux environnementaux et
  aux obligations réelles environnementales, cogestion de la réserve naturelle
  régionale des gorges du Gardon avec la commune de Sanilhac-Sagriès. Non
  confirmé : clause de dévolution, modalités d'adhésion, détail de la transparence
  comptable, conditions financières et durée des conventions de cogestion.
