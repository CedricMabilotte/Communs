resume: >
  Exploitation agricole à responsabilité limitée constituée par acte sous seing
  privé le 22 juillet 2021, immatriculée au lieu-dit Magnantru à Périgné
  (Deux-Sèvres), au capital de 7 500 euros. Gérée par Camille Touzeau et Raphaël
  Marquet, anciens salarié·es de la ferme de Magnantru qui en ont repris
  l'exploitation, elle reçoit l'usage de la ferme — environ 47 hectares en
  agriculture biologique — par un bail rural environnemental conclu avec la
  foncière solidaire de FEVE, propriétaire du foncier. L'EARL poursuit l'élevage
  bovin viande, les grandes cultures, la transformation et la vente à la ferme,
  l'accueil en chambres d'hôtes, et a introduit un élevage d'oies.
montage:
  type: propriete_protegee
  nu_proprietaire: "Foncière de FEVE — Fermes en Vie (société en commandite par actions à actionnariat solidaire)"
  usufruitier: "EARL La Ferme de Magnantru (société civile agricole)"
  description: >
    La propriété de la ferme — terres, bâtiments, partie du matériel — est
    portée par la foncière solidaire de FEVE, qui l'a acquise grâce à l'épargne
    citoyenne. L'usage est confié à l'EARL La Ferme de Magnantru par un bail
    rural environnemental, assorti de clauses en faveur de la biodiversité et du
    maintien de l'agriculture biologique. Le bail ouvre aux exploitant·es une
    option d'achat au bout de sept ans. FEVE n'est pas partie prenante de l'EARL,
    qui est détenue par les seul·es paysan·nes installé·es.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    L'usufruitier est une société civile à capital — EARL — détenue par les deux
    paysan·nes exploitant·es ; sa lucrativité n'est pas verrouillée par des
    statuts non lucratifs et le bénéfice de l'usage se concentre sur ses
    associé·es.
grille:
  - critere: non_appropriation
    valeur: partiel
    note: "La propriété reste à la foncière de FEVE, mais le bail ouvre une option d'achat à sept ans permettant aux exploitant·es d'acquérir le foncier."
  - critere: parts_non_cessibles
    valeur: non
    note: "L'EARL est une société civile à capital de 7 500 euros, dont les parts sont cessibles : aucun verrou statutaire ne plafonne leur valeur."
  - critere: devolution_usufruitier
    valeur: non
    note: "L'EARL est une société civile : en cas de dissolution, le boni de liquidation revient aux associé·es, sans clause de dévolution désintéressée."
  - critere: personne_morale_civile
    valeur: partiel
    note: "L'EARL est une personne morale de droit civil à objet agricole, mais c'est une société à capital sans verrou de non-lucrativité, et non une association ou une coopérative."
  - critere: non_lucrativite_effective
    valeur: non
    note: "L'EARL est une société d'exploitation à but lucratif : les bénéfices peuvent être distribués aux associé·es exploitant·es."
  - critere: une_voix
    valeur: partiel
    note: "L'EARL réunit deux associé·es co-gérant·es exerçant ensemble la décision ; le pouvoir y reste néanmoins lié aux parts sociales détenues."
  - critere: usagers_decident
    valeur: oui
    note: "Les deux paysan·nes qui exploitent la ferme au quotidien, Camille Touzeau et Raphaël Marquet, sont les gérant·es de l'EARL et décident de ses usages."
  - critere: ouverture_entrants
    valeur: partiel
    note: "L'accueil d'autres porteur·ses de projet sur la ferme est envisagé, mais les modalités d'entrée dans l'EARL elle-même ne sont pas documentées."
  - critere: transparence_interne
    valeur: partiel
    note: "Les statuts et l'immatriculation de l'EARL sont publics au registre des entreprises ; la publication régulière de ses comptes et décisions n'est pas documentée."
  - critere: objet_ig
    valeur: oui
    note: "L'objet — exploitation agricole biologique, élevage, transformation et accueil — porte un intérêt général agricole et alimentaire et illustre le renouvellement des générations paysannes."
  - critere: public_non_restreint
    valeur: partiel
    note: "Le lieu est ouvert au public par la vente à la ferme et l'accueil en chambres d'hôtes, mais l'exploitation profite d'abord aux deux associé·es de l'EARL."
  - critere: duree_usage
    valeur: oui
    note: "L'usage est confié par bail rural, d'une durée minimale de neuf ans et au renouvellement d'ordre public : l'EARL dispose d'une jouissance durable."
  - critere: clauses_usage
    valeur: oui
    note: "Le bail est un bail rural environnemental : il inscrit des clauses en faveur de la biodiversité et le maintien de l'agriculture biologique."
  - critere: articulation_porteur
    valeur: oui
    note: "L'EARL est liée à la foncière de FEVE par un bail rural environnemental clair ; FEVE n'est pas partie prenante de l'EARL, écartant les conflits d'intérêts."
  - critere: regime_usage_non_marchand
    valeur: non
    note: "L'usage que fait vivre l'EARL repose sur la production agricole vendue et l'accueil touristique payant : il relève d'une logique marchande."
  - critere: loyer_soutenable
    valeur: partiel
    note: "Le fermage versé à la foncière est encadré par arrêté préfectoral, écartant un loyer de marché ; son caractère soutenable pour l'EARL n'est pas documenté."
  - critere: vivant_finalite
    valeur: partiel
    note: "Le bail rural environnemental inscrit des clauses en faveur de la biodiversité et le maintien de l'agriculture biologique ; la finalité de l'EARL reste l'exploitation agricole, non la protection de la nature."
analyse:
  forces:
    - "Usage sécurisé par un bail rural environnemental long et renouvelable."
    - "Exploitation pilotée directement par les deux paysan·nes qui travaillent la ferme."
    - "Clauses environnementales et maintien de l'agriculture biologique inscrits au bail."
  fragilites:
    - "EARL : société civile à capital lucratif, sans verrou de non-lucrativité ni clause de dévolution désintéressée."
    - "Parts sociales cessibles ; option d'achat à sept ans pouvant faire sortir le foncier du portage."
    - "Bénéfice de l'usage concentré sur les deux associé·es exploitant·es."
  leviers:
    - "Documenter le fonctionnement interne, les comptes et l'ouverture à de nouveaux·elles associé·es."
    - "Privilégier le maintien du foncier dans la foncière de FEVE au terme des sept ans."
    - "Envisager une forme plus collective et non lucrative pour pérenniser l'usage au-delà du couple."
  synthese: >
    L'EARL La Ferme de Magnantru est le maillon usufruitier du modèle FEVE : une
    société agricole familiale qui exploite, par bail rural environnemental, une
    ferme dont la foncière solidaire porte le foncier. Solide sur la sécurité de
    jouissance et les clauses environnementales, elle reste, par sa nature de
    société civile à capital lucratif, plus proche d'une exploitation agricole
    classique que d'un commun citoyen autogéré.
fiabilite: >
  Faits vérifiés (sources Fermes en Vie, site de la ferme, presse agricole et
  registre des entreprises, consultées en mai 2026) : EARL constituée par acte
  sous seing privé le 22 juillet 2021, immatriculée au lieu-dit Magnantru à
  Périgné (SIREN 901915868), capital de 7 500 euros, gérée par Camille Touzeau
  et Raphaël Marquet, exploitation de la ferme de Magnantru par bail rural
  environnemental conclu avec la foncière de FEVE, option d'achat à sept ans,
  activités d'élevage bovin biologique, de grandes cultures, de transformation,
  de vente à la ferme et d'accueil en chambres d'hôtes. Non confirmé : montant
  du fermage, durée exacte du bail, clauses détaillées, comptes de la société.
