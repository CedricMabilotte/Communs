  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "Prélèvement limité aux besoins directs et locaux selon la communication officielle ; l'existence d'une commercialisation de bois n'est pas précisée."
  - critere: loyer_soutenable
    valeur: inconnu
    note: "Non applicable en l'état documenté (pas de loyer identifié, montage intégré)."
  - critere: vivant_finalite
    valeur: oui
    note: "Une partie du massif est explicitement laissée en libre évolution, et la restauration de la diversité des essences et des classes d'âge est un objectif affiché."
analyse:
  forces:
    - "Objectif écologique explicite : coupes rases évitées, part du massif en libre évolution, diversité des essences visée."
    - "Gouvernance intégrée : 200 associé·es à la fois propriétaires et décisionnaires, sans exploitant tiers."
    - "Usage du droit de préférence pour agrandir le massif par les parcelles voisines (Saint-Pardoux-la-Rivière)."
  fragilites:
    - "Régime des parts (valeur, cessibilité, plus-value) non documenté : le verrou anti-spéculatif n'est pas confirmé."
    - "Statuts non publiés ; forme juridique précise (société civile classique ou groupement forestier citoyen à clauses particulières) non confirmée."
    - "Divergence de surface (80 ou 81 ha) entre deux pages du même site officiel, non résolue."
  leviers:
    - "Publier les statuts et le régime de cession des parts."
    - "Documenter l'accès du public à la forêt et le mode de décision (une part = une voix, ou un·e associé·e = une voix)."
    - "Clarifier la surface exacte du massif."
  synthese: >
    Lu Picatau est un groupement forestier citoyen à la finalité écologique
    claire et à la gouvernance intégrée — propriétaires et gestionnaires sont
    les mêmes personnes — mais dont le verrou anti-spéculatif (régime des
    parts) n'est pas publiquement documenté. Comme le GFA de Mâlain, il
    illustre la famille des montages citoyens à société civile, dont la
    rigueur dépend de statuts non vérifiés par cette passe.
fiabilite: >
  Faits vérifiés (sources Réseau pour les alternatives forestières et site
  officiel gfclupicatau.fr, consultées le 2026-11-08) : création en 2020 au
  lieu-dit Grande Borne, Abjat-sur-Bandiat (Dordogne), 200 associé·es, surface
  de 80 ou 81 hectares selon la page consultée, acquisition par droit de
  préférence à Saint-Pardoux-la-Rivière, objectifs de protection forestière et
  de libre évolution partielle. Non confirmé : statuts, régime des parts,
  surface exacte, accès du public, mode de décision précis.
