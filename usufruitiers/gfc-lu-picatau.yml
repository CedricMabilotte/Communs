uid: gfc-lu-picatau
categorie: usufruitier
nom: "Groupement forestier citoyen Lu Picatau"
sous_titre: "Forêt citoyenne du Périgord vert, partiellement laissée en libre évolution"
statut_fiche: publie
forme_juridique: "Groupement forestier (société civile), associatif dans sa présentation"
nature_interet: inconnu
localisation:
  commune: "Abjat-sur-Bandiat"
  departement: "Dordogne (24)"
  region: "Nouvelle-Aquitaine"
annee: 2020
url: "https://www.gfclupicatau.fr/"
dossier:
  identite:
    siren: inconnu
  echelle:
    surface_ha: 80
