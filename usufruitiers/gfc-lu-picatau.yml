resume: >
  Groupement forestier citoyen fondé en 2020 au lieu-dit Grande Borne, commune
  d'Abjat-sur-Bandiat (Périgord vert, Dordogne), face à la multiplication des
  coupes rases dans la région. Il réunit environ 200 associé·es qui ont
  souscrit du capital pour acquérir des parcelles forestières, dont une à
  Saint-Pardoux-la-Rivière acquise par droit de préférence sur une parcelle
  voisine. La surface totale est donnée à 80 ou 81 hectares selon les pages du
  site officiel (divergence non résolue). L'objectif affiché : soustraire les
  parcelles à l'exploitation intensive, ne prélever que pour des besoins
  directs et locaux, restaurer la diversité des essences et des classes d'âge,
  et laisser une partie du massif en libre évolution. Lié au Réseau pour les
  alternatives forestières (RAF), comme « Forêts en vie ».
montage:
  type: propriete_collective
  description: >
    Le groupement forestier est à la fois porteur du foncier et gestionnaire
    de la forêt : aucune dissociation entre une entité propriétaire et une
    entité usufruitière distincte n'est documentée — les associé·es, en
    souscrivant du capital, sont à la fois propriétaires collectifs et
    décisionnaires de la gestion. Le régime des parts (valeur, cessibilité,
    plus-value éventuelle à la sortie) n'est pas documenté par les sources
    consultées ; la page de souscription en capital du site officiel n'a pas
    pu être récupérée pour cette passe.
integrite_montage:
  niveau: economie_marchande
  commentaire: >
    Groupement forestier citoyen à capital ouvert (société civile dans sa
    forme probable, présentation associative dans la communication) ; faute
    de statuts publiés et de confirmation du régime des parts, la nature de
    l'intérêt reste `inconnu` et le verdict du lieu associé ne peut pas être
    établi en l'état. Le pôle affiché est délibérément prudent.
grille:
