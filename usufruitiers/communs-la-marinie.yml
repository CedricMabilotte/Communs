  synthese: >
    Les Communs de la Marinie illustrent le maillon usufruitier du modèle
    Antidote : une association d'usager·es, à gouvernance citoyenne autogérée,
    qui fait vivre un lieu dont la propriété est sanctuarisée par un fonds de
    dotation et l'usage sécurisé pour un siècle. Sa marge de progression tient
    surtout à la publication de son fonctionnement interne.
