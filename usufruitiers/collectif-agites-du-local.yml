  synthese: >
    Les Agités du Local est le maillon vivant et l'association porteuse de
    l'usage de l'écolieu de Saleix : un habitat collectif réel, autosuffisant en
    fruits et légumes bio, à faible empreinte. L'association non lucrative et
    l'habitat sont solides ; mais le montage de propriété d'usage CLIP —
    association propriétaire, titre d'usage, inaliénabilité — n'est pas
    documenté et reste à instruire sur statuts.
