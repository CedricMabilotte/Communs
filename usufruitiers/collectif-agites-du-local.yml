resume: >
  Les Agités du Local est l'association loi 1901 (RNA W411008139, SIREN
  852581404, SIRET 85258140400021) qui porte l'écolieu de Saleix, installé sur
  une ancienne ferme familiale à Sorges-et-Ligueux-en-Périgord, en Dordogne.
  L'objet associatif est de favoriser la création, la cohabitation et l'action
  collective « dans un esprit de joie et de simplicité », et de promouvoir une
  diversité de pratiques (agriculture, artisanat, culture, social). Plus d'une
  dizaine de personnes — en yourtes, en familles, en solo, en colocation et en
  maisons individuelles — vivent collectivement sur place ; le lieu est
  quasi-autonome en eau et autosuffisant en fruits et légumes cultivés en bio.
  L'écolieu est membre du réseau CLIP — Réseau de lieux en propriété d'usage ;
  le détail du montage (association propriétaire, forme de la bascule) n'est pas
  documenté par les sources.
montage:
  type: propriete_collective
  nu_proprietaire: "Association propriétaire de l'écolieu de Saleix (CLIP — non documentée)"
  usufruitier: "Les Agités du Local (association habitante / usagère)"
  description: >
    Les Agités du Local habite et anime l'écolieu de Saleix. Le lieu est listé
    membre du réseau CLIP de propriété d'usage, dont le modèle suppose une
    association propriétaire distincte garante de la non-revente ; mais aucune
    source ne documente cette association propriétaire ni la nature et la durée
    du titre d'usage liant l'association usagère à la propriété. Le maillon
    propriétaire est pressenti, l'articulation reste à instruire sur statuts.
