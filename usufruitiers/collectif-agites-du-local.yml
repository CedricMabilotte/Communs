grille:
  - critere: non_appropriation
    valeur: partiel
    note: "L'appartenance au CLIP vise à exclure l'appropriation privée de la valeur foncière ; mais le montage propriétaire de Saleix n'étant pas documenté, le verrou anti-appropriation n'est pas recoupé."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Les Agités du Local est une association loi 1901 (association déclarée) sans capital appropriable : aucune part ni titre n'est cessible ni ne porte la valeur du foncier."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "Les statuts de l'association ne sont pas publiés en ligne ; l'existence d'une clause de dévolution désintéressée n'est pas documentée."
  - critere: personne_morale_civile
    valeur: oui
    note: "L'association est une personne morale de droit civil non lucrative (association déclarée, RNA W411008139, SIREN 852581404), et non une société commerciale."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Association sans partage de bénéfices ; objet de cohabitation et d'action collective, sans distribution aux membres."
  - critere: une_voix
    valeur: oui
    note: "Écolieu collectif ; une association loi 1901 fonctionne sur le principe « une personne, une voix » en assemblée, indépendamment des apports."
  - critere: usagers_decident
    valeur: oui
    note: "Les habitant·es vivent et animent collectivement l'écolieu ; l'objet associatif vise explicitement la cohabitation et l'action collective : les usager·es décident de ce qui les concerne."
  - critere: ouverture_entrants
    valeur: partiel
    note: "Le lieu accueille une diversité d'habitat (yourtes, familles, solo, colocation, maisons individuelles) et s'est étoffé sur ~18 mois ; les modalités formelles d'entrée de nouveaux membres ne sont pas documentées."
  - critere: transparence_interne
    valeur: partiel
    note: "L'association a un site et une présence publique ; la publication régulière des comptes et décisions n'est pas documentée."
  - critere: objet_ig
    valeur: oui
    note: "Objet associatif : favoriser la création, la cohabitation et l'action collective, promouvoir une diversité de pratiques (agriculture, artisanat, culture, social) — intérêt général identifié au-delà du seul logement des membres."
  - critere: public_non_restreint
    valeur: partiel
    note: "L'écolieu est un lieu de rencontre, d'accueil et de transmission ; mais le degré d'ouverture effective au-delà du collectif résident n'est pas précisément documenté."
  - critere: vivant_finalite
    valeur: partiel
    note: "L'écolieu cultive en bio et vise une faible empreinte carbone et une autonomie en eau — soin du milieu présent dans la pratique ; la reconnaissance explicite du vivant non-humain comme cohabitant (au-delà de la production) n'est pas affichée."
  - critere: duree_usage
    valeur: inconnu
    note: "La nature et la durée du titre d'usage liant l'association à la propriété ne sont pas documentées, le montage CLIP n'étant pas recoupé."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'inscription de clauses d'usage ou environnementales dans le titre liant l'association au foncier n'est pas documentée."
  - critere: articulation_porteur
    valeur: partiel
    note: "Le modèle CLIP fait de l'association usagère un membre de l'association propriétaire ; mais le maillon propriétaire de Saleix n'est pas documenté : l'articulation effective reste à recouper."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "L'écolieu repose sur une logique de cohabitation, d'autosuffisance et de partage ; le détail du régime d'accès (contributions, accueil) n'est pas documenté."
  - critere: loyer_soutenable
    valeur: inconnu
    note: "Le montant et le régime de la contribution ou redevance versée par l'association au porteur pressenti ne sont pas documentés."
