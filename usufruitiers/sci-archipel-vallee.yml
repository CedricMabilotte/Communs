  synthese: >
    La SCI de l'Archipel de la vallée est une chaîne intégrée : le foncier d'un
    tiers-lieu inclusif est porté par une société civile dont les associé·es
    sont trois associations, elles-mêmes usagères du lieu. Sa force tient à un
    objet social affirmé et à un sociétariat exclusivement associatif ; sa
    fragilité, à l'absence de verrous statutaires documentés dans la SCI.
fiabilite: >
  Faits vérifiés (sources ALC de Chevreuse, Coopérative Oasis et presse locale,
  consultées en mai 2026) : tiers-lieu inclusif de l'Archipel de la vallée à
  Chevreuse, maison et quatre hectares de prairies, projet lancé en 2023 par les
  associations Handi deuxmains, ALC et Quintette, foncier acquis en copropriété
  via une SCI réunissant les trois associations, acquisition définitive en
  juillet 2025, financement d'environ un million d'euros, apport de la
  Coopérative Oasis de 200 000 € sur 11 ans. Non confirmé : mode de décision au
  sein de la SCI, statuts et verrous anti-spéculatifs, clause de dévolution,
  régime d'accès au tiers-lieu, transparence comptable.
