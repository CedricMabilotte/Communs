resume: >
  Société civile immobilière constituée par trois associations — Handi
  deuxmains, Accueil Loisirs Culture (ALC) et Quintette — pour acquérir et faire
  vivre le tiers-lieu inclusif de l'Archipel de la vallée, à Chevreuse dans les
  Yvelines : une maison et quatre hectares de prairies, acquis définitivement en
  juillet 2025. Les trois associations collaborent au sein de la SCI pour
  exploiter ensemble l'espace d'activités, chacune dans son champ, autour d'un
  objectif commun d'adaptation aux handicaps mentaux, cognitifs et sensoriels.
  Les associations sont à la fois associées de la SCI propriétaire et usagères
  du lieu : la chaîne est intégrée. La Coopérative Oasis a soutenu le projet par
  un apport financier de 200 000 € sur 11 ans.
montage:
  type: propriete_collective
  nu_proprietaire: "SCI de l'Archipel de la vallée (société civile immobilière des trois associations)"
  usufruitier: "SCI de l'Archipel de la vallée — chaîne intégrée : les associations sont à la fois associées et usagères"
  description: >
    Le foncier a été acquis en copropriété, la SCI réunissant les trois
    associations Handi deuxmains, ALC et Quintette. Cette SCI détient la maison
    et les quatre hectares de terrain, et les associations qui la composent y
    exploitent ensemble l'espace d'activités. Propriété et usage sont portés par
    la même configuration collective : la chaîne est intégrée. Le financement de
    près d'un million d'euros a réuni dons, mécénat, subventions, apports
    personnels, prêts bancaires et l'apport de la Coopérative Oasis.
