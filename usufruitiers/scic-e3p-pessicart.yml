categorie: usufruitier
nom: "SCIC E3P — École de Permaculture du Petit Pessicart"
sous_titre: "Coopérative d'intérêt collectif propriétaire et usagère du Jardin du Petit Pessicart"
statut_fiche: publie
forme_juridique: "Société coopérative d'intérêt collectif (SCIC) sous forme de SAS à capital variable"
localisation:
  commune: "Nice"
  departement: "Alpes-Maritimes (06)"
  region: "Provence-Alpes-Côte d'Azur"
