uid: commune-flocques
categorie: usufruitier
nom: "Commune de Flocques"
sous_titre: "Collectivité bailleresse du foncier et garante locative des 12 logements Chênelet"
statut_fiche: publie
forme_juridique: "Collectivité territoriale (commune)"
localisation:
  commune: "Flocques"
  departement: "Seine-Maritime (76)"
  region: "Normandie"
annee: 2021
url: "https://fonciere-chenelet.org/constructions/operations/12-logements-flocques-76"
resume: >
  Petite commune rurale de Seine-Maritime, proche d'Eu et de la côte normande,
  porteuse avec la Foncière Chênelet d'un projet de revitalisation par le
  logement très social et écologique. La commune a fourni le terrain de
  l'opération de douze logements et en reste propriétaire, l'ayant confié à la
  Foncière par un bail emphytéotique de 99 ans. Elle assure une gestion locative
  de proximité : elle verse les loyers au bailleur puis les recouvre auprès des
  locataires, ce qui garantit des prix très modérés. Le projet, conduit depuis
  2016 entre le maire de Flocques et le président de la Foncière Chênelet, vise
  à maintenir les personnes âgées au village et à densifier l'habitat en cœur de
  bourg.
montage:
  type: propriete_sanctuarisee
  nu_proprietaire: "Foncière Chênelet (SAS, foncière solidaire agréée maîtrise d'ouvrage d'insertion / bailleur social)"
  usufruitier: "Commune de Flocques (collectivité publique)"
  description: >
    La commune de Flocques est propriétaire du terrain et l'a confié à la
    Foncière Chênelet par un bail emphytéotique de 99 ans : la Foncière construit
    et détient les murs des douze logements pendant la durée du bail, la commune
    en récupérant les constructions à son terme. La commune n'est pas titulaire
    d'un usufruit civil, mais elle organise l'usage du lieu : gestion locative de
    proximité, versement des loyers au bailleur et recouvrement auprès des
    locataires, garantie de loyers très modérés, association Béguinage et
    Compagnie mobilisée pour l'accueil des seniors.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Collectivité publique : personne morale de droit public structurellement non
    lucrative, à gouvernance représentative élue ; l'usage du lieu est administré
    par la municipalité, non par un collectif autogéré de locataires.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "Les locataires ne peuvent ni revendre ni capter à titre privé la valeur du foncier : le terrain reste à la commune, les murs à la Foncière Chênelet."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Une commune est une personne morale de droit public sans capital ni parts sociales : aucun titre cessible, aucune valeur foncière captable par un particulier."
  - critere: devolution_usufruitier
    valeur: oui
    note: "Une collectivité territoriale ne se dissout pas au profit de personnes privées ; son patrimoine relève du domaine public ou privé communal, sans dévolution vers des membres."
  - critere: personne_morale_civile
    valeur: partiel
    note: "La commune est une personne morale de droit public non lucrative — et non une société commerciale — mais elle relève du droit public, et non du droit civil au sens strict de la grille."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Une commune ne distribue pas de bénéfices : les ressources de l'opération servent le logement social et la revitalisation du village."
  - critere: une_voix
    valeur: partiel
    note: "Le conseil municipal décide selon le principe « un élu, une voix », mais il s'agit d'une gouvernance représentative élue, non d'une décision directe des usager·es du lieu."
  - critere: usagers_decident
    valeur: non
    note: "Les locataires des douze logements ne participent pas, selon les sources, aux décisions sur le devenir du lieu : l'usage est administré par la municipalité et la Foncière."
  - critere: ouverture_entrants
    valeur: partiel
    note: "L'opération vise à accueillir de nouveaux habitant·es au village, notamment des personnes âgées ; les modalités d'attribution des logements ne sont pas documentées."
  - critere: transparence_interne
    valeur: oui
    note: "Une commune est soumise à des obligations légales de publicité de ses délibérations et de ses comptes ; les détails propres à l'opération ne sont toutefois pas publiés."
  - critere: objet_ig
    valeur: oui
    note: "L'action communale porte un intérêt général identifié : logement très social et écologique, maintien des personnes âgées au village, revitalisation rurale."
  - critere: public_non_restreint
    valeur: oui
    note: "Les logements s'adressent à des ménages à bas revenus et à des personnes âgées du territoire ; ils ne profitent pas à un cercle restreint de membres fondateurs."
  - critere: duree_usage
    valeur: partiel
    note: "Le bail emphytéotique de 99 ans liant la commune et la Foncière assure une jouissance longue ; la durée et le renouvellement des baux d'habitation des locataires ne sont pas documentés."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'existence de clauses d'usage ou environnementales formalisées dans le bail emphytéotique ou les baux d'habitation n'est pas documentée par les sources."
  - critere: articulation_porteur
    valeur: oui
    note: "La commune est liée à la Foncière Chênelet par un bail emphytéotique clair de 99 ans, et coopère avec elle depuis 2016 dans un projet de territoire concerté."
  - critere: regime_usage_non_marchand
    valeur: non
    note: "L'usage repose sur un bail d'habitation et le paiement d'un loyer : régime locatif, certes très social, et non gratuité, don ou troc."
  - critere: loyer_soutenable
    valeur: oui
    note: "La commune verse les loyers au bailleur puis les recouvre auprès des locataires, garantissant des prix très modérés ; la Foncière Chênelet vise des loyers et charges très faibles, hors logique de rendement."
analyse:
  forces:
    - "Collectivité publique non lucrative, pérenne, soumise à publicité de ses comptes."
    - "Garantie communale des loyers : prix très modérés pour des ménages à bas revenus."
    - "Articulation loyale et concertée avec la Foncière Chênelet depuis 2016."
  fragilites:
    - "Gouvernance représentative élue : les locataires ne décident pas de l'usage du lieu."
    - "Régime locatif marchand, même très social, sans logique de partage non marchand."
    - "Personne morale de droit public, hors du droit civil non lucratif de référence."
  leviers:
    - "Associer les locataires à une instance de décision sur la vie du lieu."
    - "Publier la durée et le renouvellement des baux d'habitation."
    - "Documenter les clauses d'usage et environnementales du bail emphytéotique."
  synthese: >
    La commune de Flocques tient le maillon « usage » de l'opération Chênelet :
    collectivité publique non lucrative, propriétaire du terrain et garante des
    loyers, elle sécurise l'accès au logement très social de ménages à bas
    revenus. Mais l'usage demeure administré — gouvernance représentative élue,
    régime locatif — sans association des locataires à la décision : un intérêt
    général institué plus qu'un commun citoyen autogéré.
fiabilite: >
  Faits vérifiés (sources Foncière Chênelet, Réseau des Maisons de
  l'Architecture et presse locale, consultées en mai 2026) : la commune de
  Flocques (Seine-Maritime) a fourni le terrain de l'opération de douze
  logements sociaux écologiques et en reste propriétaire dans le cadre d'un bail
  emphytéotique de 99 ans confié à la Foncière Chênelet ; elle assure une
  gestion locative de proximité, verse les loyers au bailleur puis les recouvre
  auprès des locataires, garantissant des prix très modérés ; le projet est
  conduit avec la Foncière depuis 2016 et a été inauguré en novembre 2021. Non
  confirmé : montant des loyers, durée et renouvellement des baux d'habitation,
  modalités d'attribution des logements, clauses du bail emphytéotique.
