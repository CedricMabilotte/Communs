resume: >
  L'association des habitants du domaine d'Echoisy réunit les foyers qui vivent
  à l'Oasis du Coq à l'Âme, écolieu installé depuis 2021 sur le domaine
  d'Echoisy, à Cellettes, en Charente. La propriété du domaine est portée par la
  SCIC du projet ; l'association des habitant·es en reçoit l'usage par un bail
  emphytéotique. Le collectif rassemble une vingtaine de foyers réunis autour
  des cinq invariants des oasis — autonomie alimentaire, mutualisation, ouverture
  sur le monde, gouvernance partagée, sobriété énergétique et écoconstruction —
  et vise la « sobriété heureuse » : se nourrir, se loger et se chauffer pour un
  budget modéré. L'écolieu, retenu parmi les premiers ÉcoQuartiers citoyens,
  prévoit la construction de quinze maisons réversibles autonomes en eau et en
  électricité.
montage:
  type: propriete_collective
  nu_proprietaire: "SCIC de l'Oasis du Coq à l'Âme"
  usufruitier: "Association des habitants du domaine d'Echoisy (association loi 1901)"
  description: >
    La propriété du domaine d'Echoisy est portée par la SCIC de l'Oasis du Coq à
    l'Âme. L'association des habitant·es en reçoit l'usage par un bail
    emphytéotique conclu avec la SCIC : ce titre d'usage long permet au collectif
    de maîtriser le lieu dans la durée sans en détenir la propriété. L'écosystème
    du Coq à l'Âme réunit plusieurs structures — la SCIC, l'association
    historique reconnue d'intérêt général, l'association des habitant·es et une
    association d'activités — articulant propriété coopérative et usages
    associatifs.
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Association loi 1901 sans capital appropriable, à gouvernance partagée :
    les habitant·es de l'écolieu décident collectivement de l'usage du domaine.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "La propriété du domaine reste à la SCIC : les habitant·es, titulaires d'un bail emphytéotique, ne peuvent ni le revendre ni en capter la valeur à titre privé."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Association loi 1901 sans capital ni parts sociales : aucun titre cessible, aucune valeur foncière captable par ce maillon."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "Le sort de l'actif de l'association des habitant·es en cas de dissolution n'est pas documenté par les sources consultées."
  - critere: personne_morale_civile
    valeur: oui
    note: "Association loi 1901, personne morale de droit civil structurellement non lucrative."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Association sans but lucratif : ses ressources servent la vie collective et l'entretien du lieu, sans partage de bénéfices."
  - critere: une_voix
    valeur: oui
    note: "L'écolieu fonctionne en gouvernance partagée, l'un des cinq invariants des oasis : le pouvoir n'est pas indexé sur un apport en capital."
  - critere: usagers_decident
    valeur: oui
    note: "L'association réunit les foyers habitant le domaine et organise les décisions collectives sur l'usage du lieu, via un règlement intérieur public."
  - critere: ouverture_entrants
    valeur: partiel
    note: "L'écolieu prévoit d'accueillir une vingtaine de familles dans des maisons réversibles ; les modalités d'entrée de nouveaux foyers ne sont pas pleinement détaillées."
  - critere: transparence_interne
    valeur: partiel
    note: "Le projet publie son modèle juridique et le règlement intérieur de l'association des habitant·es ; la publication de ses comptes n'est pas documentée."
  - critere: objet_ig
    valeur: oui
    note: "L'objet — habitat sobre, autonomie alimentaire, écoconstruction, sensibilisation à la nature — porte un intérêt général écologique et social."
  - critere: public_non_restreint
    valeur: partiel
    note: "L'écolieu accueille des visiteur·ses et porte des actions ouvertes au territoire ; l'habitat lui-même bénéficie d'abord aux foyers du collectif."
  - critere: duree_usage
    valeur: oui
    note: "L'usage est reçu par bail emphytéotique, titre d'usage long pouvant courir jusqu'à 99 ans, bien au-delà du plafond de 30 ans de l'usufruit d'une personne morale."
  - critere: clauses_usage
    valeur: partiel
    note: "Le collectif s'est engagé dans une ORE signée avec la Coopérative Oasis ; l'inscription de clauses d'usage dans le bail emphytéotique lui-même n'est pas documentée."
  - critere: articulation_porteur
    valeur: oui
    note: "L'association des habitant·es est liée à la SCIC propriétaire par un bail emphytéotique clair, au sein d'un écosystème de structures articulées."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "L'écolieu vise une « sobriété heureuse » fondée sur la mutualisation, mais le modèle économique repose en partie sur des activités économiques marchandes."
  - critere: loyer_soutenable
    valeur: inconnu
    note: "Le montant de la redevance versée par l'association à la SCIC au titre du bail emphytéotique n'est pas documenté par les sources."
  - critere: vivant_finalite
    valeur: partiel
    note: "L'écolieu pratique l'autonomie alimentaire et la sensibilisation à la nature, et s'est engagé dans une ORE signée avec la Coopérative Oasis ; la biodiversité non-humaine n'est toutefois pas affichée comme une finalité centrale parmi les cinq invariants des oasis, axés sur le collectif humain."
