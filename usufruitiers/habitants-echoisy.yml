fiabilite: >
  Faits vérifiés (sources oasis-ducoqalame.fr, Coopérative Oasis et presse,
  consultées en mai 2026) : écolieu installé en 2021 sur le domaine d'Echoisy à
  Cellettes (Charente), collectif d'une vingtaine de foyers, propriété portée
  par la SCIC du projet, usage confié à l'association des habitant·es par bail
  emphytéotique, fonctionnement autour des cinq invariants des oasis dont la
  gouvernance partagée, projet retenu parmi les premiers ÉcoQuartiers citoyens.
  Non confirmé : année de création de l'association, montant de la redevance,
  clauses du bail, clause de dévolution, publication des comptes.
