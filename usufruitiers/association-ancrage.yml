analyse:
  forces:
    - "Gouvernance citoyenne autogérée, dans la culture d'horizontalité du réseau Antidote."
    - "Objet d'intérêt général combinant habitat solidaire, imprimerie et éducation populaire."
    - "Lieu ouvert sur le quartier, en partenariat avec d'autres associations locales."
  fragilites:
    - "Signature effective du bail emphytéotique non confirmée par les sources."
    - "Modèle économique partiellement marchand, adossé aux loyers des logements."
    - "Transparence comptable, clause de dévolution et montants des loyers non documentés."
  leviers:
    - "Confirmer et publier la signature du bail emphytéotique et sa durée."
    - "Documenter les montants des loyers modérés et le régime d'usage du lieu."
    - "Publier les statuts, les comptes et la clause de dévolution."
  synthese: >
    Ancrage est le maillon usufruitier d'un lieu urbain du réseau Antidote :
    une association de quartier à gouvernance citoyenne autogérée, qui fait
    vivre un immeuble voué à l'habitat solidaire et à l'éducation populaire.
    Sa marge de progression tient à la confirmation de la signature du bail et
    à l'explicitation de son modèle économique partiellement adossé aux loyers.
fiabilite: >
  Faits vérifiés (sources La Foncière Antidote, Récits de l'Anthropocène et
  presse spécialisée, consultées en mai 2026) : association loi 1901 nancéienne
  du quartier des Trois Maisons, née d'une lutte de quartier contre la
  gentrification, acquisition d'un immeuble d'environ 360 m² rue de Vayringe par
  dons, emprunt bancaire et subventions, campagne de dons via Antidote (environ
  68 000 euros), activités prévues — trois logements à loyers modérés dont un
  pour personnes exilées, imprimerie, bibliothèque, éducation populaire —,
  modèle Antidote de propriété au fonds de dotation et usage par bail
  emphytéotique de longue durée. Non confirmé : date de signature et durée du
  bail, montants des loyers, transparence comptable, clause de dévolution.
