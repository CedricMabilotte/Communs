url: "https://lafonciereantidote.org/qui-sommes-nous/nos-lieux/"
resume: >
  Association loi 1901 portée par un collectif nancéien du quartier des Trois
  Maisons, née d'une lutte contre la gentrification. Ancrage a acquis un
  immeuble de quatre étages (environ 360 m²) rue de Vayringe pour y regrouper
  des activités jusque-là précaires : trois logements à loyers modérés — dont
  un en partenariat avec une association d'aide aux personnes exilées —, un
  atelier d'imprimerie, une bibliothèque-librairie et un espace d'éducation
  populaire, de rencontre et de débat. La propriété a vocation à être portée
  hors marché par le fonds de dotation Antidote, qui en confie l'usage à
  l'association par bail emphytéotique de longue durée. Le projet vise une
  dynamique de quartier ouverte sur la rue, en partenariat avec d'autres
  associations locales.
montage:
  type: demembrement
  nu_proprietaire: "Antidote (fonds de dotation)"
  usufruitier: "Ancrage (association loi 1901)"
  description: >
    La propriété de l'immeuble a vocation à être portée durablement par le
    fonds de dotation Antidote ; son usage est confié à l'association Ancrage
    par un bail emphytéotique de longue durée — l'engagement décrit par Antidote
    culminant dans un bail de 99 ans — contre un loyer symbolique. L'association
    fait vivre le lieu en autogestion et, comme chaque lieu du réseau Antidote,
    participe à l'orientation du fonds via l'association « Les Passagères de
    l'usage » et son Conseil Communal. La date de signature du bail sur ce lieu
    n'est pas précisée par les sources consultées.
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Association loi 1901 sans capital appropriable, à gouvernance citoyenne
    autogérée : les usager·es de l'immeuble décident collectivement de ses
    usages.
