  synthese: >
    La Faille illustre le maillon usufruitier du modèle Antidote appliqué à un
    lieu collectif éprouvé : une association d'usager·es, à gouvernance citoyenne
    autogérée, qui fait vivre une ferme agricole et culturelle sanctuarisée par
    un fonds de dotation. Sa marge de progression tient à la publication de son
    fonctionnement interne et à l'explicitation du régime d'usage.
