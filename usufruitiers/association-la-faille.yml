resume: >
  L'association La Faille gère la ferme du Berquet, lieu collectif autogéré de
  Monoblet, en Sud-Cévennes dans le Gard, en activité agricole et culturelle
  depuis plus de douze ans. Son objet est de réunir les usager·es des lieux qui
  lui sont confiés afin de pérenniser leur vocation collective et leur
  autogestion. Le collectif fait vivre un lieu ouvert, attaché à l'accueil, à
  l'entraide et au lien social, avec une gouvernance qu'il veut toujours plus
  horizontale et inclusive : concerts et spectacles à bas coût, espaces de
  résidence à prix libre pour des compagnies peu subventionnées, maraîchage
  nourricier en traction animale, culture et transformation de la châtaigne.
  La propriété de la ferme a été acquise par le fonds de dotation Antidote, qui
  en confie l'usage à La Faille par un bail emphytéotique de longue durée.
montage:
  type: propriete_sanctuarisee
  nu_proprietaire: "Antidote (fonds de dotation)"
  usufruitier: "La Faille (association loi 1901)"
  description: >
    La propriété de la ferme du Berquet est portée durablement par le fonds de
    dotation Antidote ; son usage est confié à l'association La Faille par un
    bail emphytéotique de longue durée. La Faille, association d'usager·es,
    fait vivre le lieu en autogestion et, comme chaque lieu du réseau Antidote,
    participe à l'orientation du fonds via l'association faîtière « Les
    Passagères de l'usage ».
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Association loi 1901 sans capital appropriable, à gouvernance citoyenne
    autogérée que le collectif veut toujours plus horizontale et inclusive.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "La propriété reste au fonds de dotation Antidote : les usager·es ne peuvent ni revendre ni capter à titre privé la valeur du foncier."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Association loi 1901 sans capital ni parts sociales : aucun titre cessible, aucune valeur foncière captable."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "Le sort de l'actif de l'association en cas de dissolution n'est pas documenté par les sources consultées."
  - critere: personne_morale_civile
    valeur: oui
    note: "Association loi 1901, personne morale de droit civil structurellement non lucrative."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Association sans but lucratif : les ressources, dont l'activité châtaigne, servent l'objet et l'entretien du lieu, sans partage de bénéfices documenté."
  - critere: une_voix
    valeur: oui
    note: "L'association réunit les usager·es sur le principe d'une décision collective ; le pouvoir n'est pas indexé sur un apport en capital."
  - critere: usagers_decident
    valeur: oui
    note: "Le lieu est autogéré ; le collectif travaille une gouvernance qu'il veut toujours plus horizontale et inclusive."
  - critere: ouverture_entrants
    valeur: partiel
    note: "L'objet de l'association vise à réunir les usager·es des lieux confiés ; les modalités précises d'accueil de nouveaux·elles membres ne sont pas détaillées."
  - critere: transparence_interne
    valeur: inconnu
    note: "La publication des comptes et des décisions de l'association n'est pas documentée par les sources."
  - critere: objet_ig
    valeur: oui
    note: "L'objet — pérenniser un lieu agricole et culturel collectif, favoriser l'accès à la culture en milieu rural — porte un intérêt général culturel et agricole."
  - critere: public_non_restreint
    valeur: oui
    note: "Le lieu est ouvert : concerts à bas coût et résidences à prix libre bénéficient à un public et à des compagnies au-delà du cercle des membres."
  - critere: duree_usage
    valeur: oui
    note: "L'usage est confié par bail emphytéotique de longue durée : jouissance longue, bien au-delà du plafond de 30 ans de l'usufruit d'une personne morale."
  - critere: clauses_usage
    valeur: inconnu
