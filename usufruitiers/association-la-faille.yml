  - critere: articulation_porteur
    valeur: oui
    note: "L'association est liée au fonds de dotation Antidote par un bail emphytéotique ; chaque lieu du réseau intègre la gouvernance du fonds via « Les Passagères de l'usage »."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "Concerts à bas coût et résidences à prix libre relèvent d'une logique de partage ; l'activité châtaigne est commercialisée, et le régime d'accès aux fruits du lieu n'est pas pleinement documenté."
