nom: "SCIC Le Domaine des Éveils"
sous_titre: "Coopérative d'intérêt collectif exploitant le Domaine des Éveils, en Bresse bourguignonne"
statut_fiche: publie
forme_juridique: "Société coopérative d'intérêt collectif (SCIC) sous forme de SAS"
nature_interet: commerciale_encadree
localisation:
