synthese: >
  Le collectif de l'Aubascule est le maillon vivant de l'écolieu de l'Aube :
  un collectif citoyen autogéré, ouvert par son pôle solidaire au-delà de ses
  habitant·es, sur un foncier porté hors-marché par donation à un fonds de dotation.
  Il s'est doté fin 2024 d'une forme propre — l'association loi 1901
  « L'Aub'ascule » —, personne morale de droit civil non lucrative : le maillon
  usufruitier est solidement caractérisé. Sa zone d'ombre résiduelle est la
  nature du titre d'usage qui le lie au lieu, et la publication de ses statuts
  et comptes.
fiabilite: >
  Faits vérifiés (sources Coopérative Oasis et l'Aubascule, consultées en mai
  2026) : écolieu de l'Aube dans la Drôme aux pieds des Trois Becs, donation
  du lieu en 2022 au fonds de dotation Fraternité pour Demain, gestion confiée
  à la Coopérative Oasis qui y installe le collectif de l'Aubascule, collectif
  fondé par six personnes issues de la Pépinière Oasis 2021, aujourd'hui une
  quinzaine d'habitant·es, trois pôles d'activité (accueil de stages, accueil
  solidaire, permaculture), Obligation Réelle Environnementale. Forme juridique
  établie (registres publics consultés juin 2026) : association loi 1901
  « L'Aub'ascule », SIREN 938330586, déclarée à la préfecture de Die le
  12/10/2024, siège 4 les Combeaux, 26400 Piégros-la-Clastre, gestion
  officielle du lieu depuis le 1er novembre 2024. Non confirmé : nature et
  durée du titre d'usage, montant d'une éventuelle redevance, statuts et
  comptes (non publiés).
