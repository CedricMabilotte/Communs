resume: >
  Le collectif de l'Aubascule anime l'écolieu de l'Aube, niché dans une combe
  aux pieds des Trois Becs dans la Drôme. Composé à sa fondation de six
  personnes rencontrées lors du parcours de formation de la Pépinière Oasis en
  2021, c'est aujourd'hui un collectif intergénérationnel d'une quinzaine
  d'habitant·es. Il s'est installé à l'Aube en 2022, lorsque le lieu — légué
  par donation au fonds de dotation Fraternité pour Demain — a été confié en
  gestion à la Coopérative Oasis. Le collectif fait vivre trois pôles : accueil
  de stages, accueil solidaire de personnes en situation de vulnérabilité, et
  pôle permacole. Le lieu est engagé dans une démarche Oasis de Biodiversité
  via une Obligation Réelle Environnementale.
montage:
  type: propriete_protegee
  nu_proprietaire: "Fonds de dotation Fraternité pour Demain"
  usufruitier: "Collectif de l'Aubascule (collectif d'habitant·es)"
  description: >
    L'écolieu de l'Aube a fait l'objet en 2022 d'une donation au fonds de
    dotation Fraternité pour Demain, qui en conserve la propriété hors-marché.
    Le fonds en a confié la gestion à la Coopérative Oasis, laquelle — n'ayant
    pas vocation à gérer directement un écolieu — y a installé le collectif de
    l'Aubascule. Le collectif assure l'usage et l'animation du lieu en
    autogestion. Il s'est doté en octobre 2024 d'une forme juridique propre :
    l'association loi 1901 « L'Aub'ascule » (déclarée à la préfecture de Die le
    12/10/2024, SIREN 938330586), qui assure officiellement la gestion du lieu
    depuis le 1er novembre 2024. La nature exacte du titre d'usage liant
    l'association au foncier n'est pas précisée par les sources publiques.
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Collectif citoyen d'habitant·es autogéré faisant vivre le lieu, désormais
    constitué en association loi 1901 (« L'Aub'ascule ») — personne morale de
    droit civil structurellement non lucrative : le maillon usufruitier est de
    nature non lucrative établie. Subsiste un angle mort sur la nature du titre
    d'usage liant l'association au foncier.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "La propriété du lieu reste au fonds de dotation Fraternité pour Demain : le collectif ne peut ni revendre ni capter la valeur du foncier."
  - critere: parts_non_cessibles
    valeur: oui
    note: "L'usufruitier est une association loi 1901 (« L'Aub'ascule ») : une association n'a pas de capital social ni de parts, donc rien de cessible ni de captable."
  - critere: devolution_usufruitier
    valeur: partiel
    note: "L'association loi 1901 ne distribue pas son boni de liquidation à ses membres (art. 1er, loi de 1901) ; la clause statutaire précise de dévolution de l'actif en cas de dissolution n'est pas publiée."
  - critere: personne_morale_civile
    valeur: oui
    note: "« L'Aub'ascule » est une association loi 1901 déclarée (SIREN 938330586, préfecture de Die, 12/10/2024) : personne morale de droit civil sans but lucratif."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "L'usufruitier est une association loi 1901 à objet d'accueil et de transition écologique et sociale : structure non lucrative par construction, sans capital appropriable."
  - critere: une_voix
    valeur: oui
    note: "Le collectif, intergénérationnel et autogéré, fonctionne sur un mode horizontal de décision sans indexation sur un apport en capital."
  - critere: usagers_decident
    valeur: oui
    note: "Le collectif de l'Aubascule, qui habite et anime le lieu, en décide les usages en autogestion ; il consacre des temps réguliers au soin du lien collectif."
  - critere: ouverture_entrants
    valeur: partiel
    note: "Le collectif, parti de six personnes en 2022, réunit aujourd'hui une quinzaine d'habitant·es ; les modalités formelles d'accueil de nouveaux·elles membres ne sont pas détaillées."
  - critere: transparence_interne
    valeur: inconnu
    note: "La publication des comptes et des décisions du collectif n'est pas documentée par les sources."
  - critere: objet_ig
    valeur: oui
    note: "Objet statutaire de l'association : créer, gérer et animer un lieu de vie collectif et d'accueil de stages, formations et rencontres autour de la transition écologique et sociale, l'agroécologie, la solidarité, la culture et le développement personnel — intérêt général social et écologique."
  - critere: public_non_restreint
    valeur: oui
    note: "Le pôle d'accueil solidaire fait du lieu un espace de vie partagée entre résident·es et personnes vivant un moment de vulnérabilité : les bénéfices dépassent le cercle des habitant·es."
  - critere: duree_usage
    valeur: inconnu
    note: "La Coopérative Oasis a confié la gestion du lieu au collectif, mais la nature et la durée du titre d'usage le liant au foncier ne sont pas documentées par les sources."
  - critere: clauses_usage
    valeur: oui
    note: "Une Obligation Réelle Environnementale inscrit des engagements écologiques sur le lieu : interdiction d'intrants chimiques, pas de coupes rases, fauche raisonnée, protection des orchidées."
  - critere: articulation_porteur
    valeur: partiel
    note: "Le collectif est lié au fonds de dotation Fraternité pour Demain via la Coopérative Oasis, gestionnaire intermédiaire ; la contractualisation directe entre le collectif et le porteur n'est pas documentée."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "L'accueil solidaire et le pôle permacole relèvent d'une logique de partage ; le pôle d'accueil de stages comporte une part marchande qui coexiste avec cette logique."
  - critere: loyer_soutenable
    valeur: inconnu
    note: "L'existence et le montant d'une redevance versée au fonds de dotation ou à la Coopérative Oasis ne sont pas documentés par les sources."
  - critere: vivant_finalite
    valeur: oui
    note: "Le lieu est engagé dans une démarche Oasis de Biodiversité via une Obligation Réelle Environnementale : la préservation du vivant est affirmée et inscrite dans le droit du lieu."
