synthese: >
  Le collectif de l'Aubascule est le maillon vivant de l'écolieu de l'Aube :
  un collectif citoyen autogéré, ouvert par son pôle solidaire au-delà de ses
  habitant·es, sur un foncier sanctuarisé par donation à un fonds de dotation.
  Sa principale zone d'ombre est sa propre forme juridique et la nature du
  titre d'usage qui le lie au lieu.
fiabilite: >
  Faits vérifiés (sources Coopérative Oasis et l'Aubascule, consultées en mai
  2026) : écolieu de l'Aube dans la Drôme aux pieds des Trois Becs, donation
  du lieu en 2022 au fonds de dotation Fraternité pour Demain, gestion confiée
  à la Coopérative Oasis qui y installe le collectif de l'Aubascule, collectif
  fondé par six personnes issues de la Pépinière Oasis 2021, aujourd'hui une
  quinzaine d'habitant·es, trois pôles d'activité (accueil de stages, accueil
  solidaire, permaculture), Obligation Réelle Environnementale. Non confirmé :
  forme juridique du collectif, nature et durée du titre d'usage, montant
  d'une éventuelle redevance, transparence comptable.
