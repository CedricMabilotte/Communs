    note: "Les sources décrivent un « collectif » sans en préciser la forme juridique : son caractère de personne morale de droit civil ne peut être établi."
  - critere: non_lucrativite_effective
    valeur: partiel
    note: "Le collectif fait vivre un lieu d'accueil et de partage sans logique de profit apparente ; sa structure juridique n'étant pas documentée, la non-lucrativité effective n'est pas pleinement vérifiable."
  - critere: une_voix
    valeur: oui
    note: "Le collectif, intergénérationnel et autogéré, fonctionne sur un mode horizontal de décision sans indexation sur un apport en capital."
  - critere: usagers_decident
    valeur: oui
    note: "Le collectif de l'Aubascule, qui habite et anime le lieu, en décide les usages en autogestion ; il consacre des temps réguliers au soin du lien collectif."
  - critere: ouverture_entrants
    valeur: partiel
    note: "Le collectif, parti de six personnes en 2022, réunit aujourd'hui une quinzaine d'habitant·es ; les modalités formelles d'accueil de nouveaux·elles membres ne sont pas détaillées."
  - critere: transparence_interne
    valeur: inconnu
    note: "La publication des comptes et des décisions du collectif n'est pas documentée par les sources."
  - critere: objet_ig
    valeur: oui
    note: "Accueil de stages, accueil solidaire de personnes en situation de vulnérabilité, pôle permacole : l'objet porte un intérêt général social et écologique."
  - critere: public_non_restreint
    valeur: oui
    note: "Le pôle d'accueil solidaire fait du lieu un espace de vie partagée entre résident·es et personnes vivant un moment de vulnérabilité : les bénéfices dépassent le cercle des habitant·es."
  - critere: duree_usage
    valeur: inconnu
    note: "La Coopérative Oasis a confié la gestion du lieu au collectif, mais la nature et la durée du titre d'usage le liant au foncier ne sont pas documentées par les sources."
  - critere: clauses_usage
    valeur: oui
    note: "Une Obligation Réelle Environnementale inscrit des engagements écologiques sur le lieu : interdiction d'intrants chimiques, pas de coupes rases, fauche raisonnée, protection des orchidées."
  - critere: articulation_porteur
    valeur: partiel
    note: "Le collectif est lié au fonds de dotation Fraternité pour Demain via la Coopérative Oasis, gestionnaire intermédiaire ; la contractualisation directe entre le collectif et le porteur n'est pas documentée."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "L'accueil solidaire et le pôle permacole relèvent d'une logique de partage ; le pôle d'accueil de stages comporte une part marchande qui coexiste avec cette logique."
  - critere: loyer_soutenable
    valeur: inconnu
    note: "L'existence et le montant d'une redevance versée au fonds de dotation ou à la Coopérative Oasis ne sont pas documentés par les sources."
  - critere: vivant_finalite
    valeur: oui
    note: "Le lieu est engagé dans une démarche Oasis de Biodiversité via une Obligation Réelle Environnementale : la préservation du vivant est affirmée et inscrite dans le droit du lieu."
