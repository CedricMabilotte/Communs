resume: >
  Le collectif de l'Aubascule anime l'écolieu de l'Aube, niché dans une combe
  aux pieds des Trois Becs dans la Drôme. Composé à sa fondation de six
  personnes rencontrées lors du parcours de formation de la Pépinière Oasis en
  2021, c'est aujourd'hui un collectif intergénérationnel d'une quinzaine
  d'habitant·es. Il s'est installé à l'Aube en 2022, lorsque le lieu — légué
  par donation au fonds de dotation Fraternité pour Demain — a été confié en
  gestion à la Coopérative Oasis. Le collectif fait vivre trois pôles : accueil
  de stages, accueil solidaire de personnes en situation de vulnérabilité, et
  pôle permacole. Le lieu est engagé dans une démarche Oasis de Biodiversité
  via une Obligation Réelle Environnementale.
montage:
  type: propriete_protegee
  nu_proprietaire: "Fonds de dotation Fraternité pour Demain"
  usufruitier: "Collectif de l'Aubascule (collectif d'habitant·es)"
  description: >
    L'écolieu de l'Aube a fait l'objet en 2022 d'une donation au fonds de
    dotation Fraternité pour Demain, qui en conserve la propriété sanctuarisée.
    Le fonds en a confié la gestion à la Coopérative Oasis, laquelle — n'ayant
    pas vocation à gérer directement un écolieu — y a installé le collectif de
    l'Aubascule. Le collectif assure l'usage et l'animation du lieu en
    autogestion ; les sources publiques ne précisent ni sa forme juridique
    propre, ni la nature exacte du titre d'usage qui le lie au foncier.
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Collectif citoyen d'habitant·es autogéré faisant vivre le lieu ; sa forme
    juridique précise n'est pas documentée par les sources publiques, ce qui
    laisse un angle mort sur la nature du maillon usufruitier.
grille:
