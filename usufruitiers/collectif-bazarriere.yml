resume: >
  Le collectif Bazarrière est le groupe habitant et usager de la grande maison
  de 400 m² avec jardin, dans le quartier Mermoz à Lyon 8e. Une dizaine
  d'adultes et d'enfants — de 3 à 62 ans, soit onze personnes — y vivent et la
  restaurent collectivement, autour d'environ dix chambres et d'un dortoir,
  tout en y accueillant des activités artistiques, militantes et conviviales
  ouvertes au quartier : réunions, projections, repas, assemblées. Le collectif
  est membre du réseau CLIP — Réseau de lieux en propriété d'usage. Il use du
  lieu en propriété d'usage : la propriété de la maison est portée par
  l'association Les Recoins, dont le collectif et le CLIP sont les deux membres,
  le CLIP garantissant la non-revente.
montage:
  type: propriete_collective
  nu_proprietaire: "Association Les Recoins (association propriétaire CLIP)"
  usufruitier: "Collectif Bazarrière (association usagère / habitante)"
  description: >
    Le collectif Bazarrière habite et anime la maison ; il n'en est pas
    propriétaire. La propriété est portée par l'association Les Recoins, dont le
    collectif usager et le CLIP sont les deux membres. Le bien est mis à la
    disposition du collectif en propriété d'usage. La nature et la durée du
    titre d'usage liant le collectif à l'association propriétaire ne sont pas
    documentées par les sources publiques.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Collectif habitant porté par une association loi 1901 sans capital
    appropriable, usager d'un bien sorti du marché par le montage CLIP. Forme
    non lucrative ; la sécurité de jouissance et les statuts restent à recouper.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "Le collectif use du lieu sans en être propriétaire ; le bien est porté par l'association Les Recoins et verrouillé par le veto CLIP : les usager·es ne peuvent ni revendre ni capter à titre privé la valeur du foncier."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Le collectif est porté par une association loi 1901 sans capital appropriable : aucune part ni titre n'est cessible ni ne porte la valeur du bien."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "L'existence d'une clause de dévolution désintéressée dans les statuts du collectif n'est pas documentée par les sources."
  - critere: personne_morale_civile
    valeur: oui
    note: "Le collectif usager prend la forme d'une association loi 1901, personne morale de droit civil non lucrative, et non d'une société commerciale."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Une association sans capital ne partage pas de bénéfices ; le projet relève de l'habitat partagé et de l'activité militante et conviviale, sans distribution aux membres."
  - critere: une_voix
    valeur: oui
    note: "Le projet se revendique autogéré ; une association loi 1901 fonctionne sur le principe « une personne, une voix » en assemblée, indépendamment des apports."
  - critere: usagers_decident
    valeur: oui
    note: "Le collectif habitant restaure, habite et gouverne le lieu collectivement, en assemblées (réunions, AG) : les usager·es décident effectivement de ce qui les concerne."
  - critere: ouverture_entrants
    valeur: partiel
    note: "Le projet distingue un groupe d'habitant·es et un groupe élargi d'usager·es, et accueille largement le quartier ; les modalités formelles d'entrée de nouveaux habitant·es ne sont pas documentées."
  - critere: transparence_interne
    valeur: partiel
    note: "Le projet a été présenté publiquement (collecte, soirées de soutien) ; la publication régulière des comptes et décisions du collectif n'est pas documentée."
  - critere: objet_ig
    valeur: oui
    note: "Le projet associe habitat digne, lieu de vie ouvert au quartier et activités artistiques et militantes : objet d'intérêt général identifié, au-delà du seul logement de ses membres."
  - critere: public_non_restreint
    valeur: oui
    note: "Au-delà des onze habitant·es, le lieu vise un groupe élargi d'usager·es et accueille le quartier — réunions, projections, repas, assemblées : il ne sert pas un cercle restreint."
  - critere: vivant_finalite
    valeur: inconnu
    note: "Un jardin est attesté ; l'usage qui en est fait — potager, accueil de la biodiversité — et la place du vivant non-humain dans la finalité du collectif ne sont pas documentés."
  - critere: duree_usage
    valeur: partiel
    note: "Le modèle CLIP vise une jouissance durable, garantie par le veto réseau contre la revente ; la nature et la durée du titre d'usage liant le collectif à l'association propriétaire ne sont pas documentées."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'inscription de clauses d'usage ou environnementales dans le titre liant le collectif au bien n'est pas documentée par les sources."
  - critere: articulation_porteur
    valeur: oui
    note: "L'articulation est claire dans son principe : le collectif usager est membre de l'association propriétaire Les Recoins, aux côtés du CLIP — relation organique et loyale entre l'usage et la propriété, propre au modèle CLIP."
  - critere: regime_usage_non_marchand
    valeur: oui
    note: "L'accès au lieu pour ses habitant·es et au quartier repose sur une logique de partage et de mise en commun (santé, travail, alimentation), non sur une tarification de marché."
  - critere: loyer_soutenable
    valeur: partiel
    note: "Le modèle CLIP repose sur des contributions des habitant·es remboursant l'emprunt, dans une logique non rentière ; le montant et le caractère soutenable de cette contribution ne sont pas documentés."
