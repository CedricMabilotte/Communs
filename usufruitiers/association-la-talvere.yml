resume: >
  Association loi 1901 née en 2019 pour acquérir et faire vivre une ancienne
  maison, une grange et quelques dépendances sur les causses du Quercy, à Bio
  dans le Lot. L'association a réuni des apports militants et une campagne de
  dons pour l'achat ; la propriété a vocation à être portée durablement par le
  fonds de dotation Antidote, qui en confie l'usage à l'association par bail
  emphytéotique de longue durée. La Talvère réunit une dizaine de personnes
  actives qui gèrent l'accueil, le soin, la gestion, la communication et un
  « labo », et qui font du lieu un espace partagé, autogéré, attentif à ses
  modes relationnels et de gouvernance. Stages, rencontres, réunions, cercles,
  hébergements ponctuels et télétravail s'y développent peu à peu.
montage:
  type: demembrement
  nu_proprietaire: "Antidote (fonds de dotation)"
  usufruitier: "La Talvère (association loi 1901)"
  description: >
    La propriété du lieu a vocation à être portée durablement par le fonds de
    dotation Antidote ; son usage est confié à l'association La Talvère par un
    bail emphytéotique de longue durée — jusqu'à 99 ans dans le modèle Antidote
    — contre un loyer symbolique. L'association fait vivre le lieu en
    autogestion et, comme chaque lieu du réseau Antidote, participe à
    l'orientation du fonds via l'association « Les Passagères de l'usage » et
    son Conseil Communal. La signature effective du bail sur ce lieu n'est pas
    datée par les sources consultées.
