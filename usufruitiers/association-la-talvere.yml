  militants et campagne de dons via Antidote, lieu partagé autogéré par une
  dizaine de personnes actives, objectif déclaré d'accueil de nouvelles
  personnes, activités d'éducation populaire (stages, rencontres, cercles,
  hébergements ponctuels). Non confirmé : date de signature et durée du bail
  emphytéotique, montant du loyer, transparence comptable, clause de dévolution.
