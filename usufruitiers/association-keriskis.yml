resume: >
  Collectif autogéré qui fait vivre le lieu de Keriskis, ancienne ferme du
  Centre-Bretagne acquise en 2017 puis transmise au fonds de dotation Antidote
  en novembre 2024. Le collectif réunit les usager·es du lieu, qui en assurent
  l'autogestion : rénovation par chantiers participatifs souvent en mixité
  choisie, activités agricoles non marchandes au fil des saisons (verger,
  potager, vannerie, transformation des fruits, bûcheronnage). Il se réunit à
  chaque saison en assemblée générale, où des commissions thématiques —
  accessibilité, travaux, juridique — restituent leur travail. Comme les autres
  lieux du réseau Antidote, il reçoit l'usage du lieu par bail emphytéotique de
  longue durée. Le nom officiel et les statuts de la structure gestionnaire ne
  sont pas documentés publiquement par les sources consultées.
montage:
  type: propriete_protegee
  nu_proprietaire: "Antidote (fonds de dotation)"
  usufruitier: "Association d'usager·es de Keriskis (association loi 1901)"
  description: >
    La propriété du lieu de Keriskis est portée durablement par le fonds de
    dotation Antidote ; son usage est confié au collectif d'usager·es par un
    bail emphytéotique de longue durée. Le collectif fait vivre le lieu en
    autogestion et, comme chaque lieu du réseau Antidote, participe à
    l'orientation du fonds via l'association faîtière « Les Passagères de
    l'usage ». Le détail du montage et la forme juridique exacte de la structure
    gestionnaire ne sont pas documentés publiquement.
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Collectif d'usager·es sans capital appropriable, à gouvernance citoyenne
    autogérée par assemblées saisonnières ; statuts précis non publiés.
grille:
