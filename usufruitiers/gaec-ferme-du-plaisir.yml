resume: >
  Groupement agricole d'exploitation en commun (GAEC) qui exploite la Ferme du
  Plaisir à Sazilly, en sud-Touraine, dont le foncier — environ 23 hectares —
  a été acquis fin 2018 par la Foncière Terre de Liens. Le GAEC, gérance
  familiale animée par François et Sophie de la Monneraye, conduit une activité
  de polyculture paysanne : variétés anciennes de céréales panifiables
  transformées en farine et en pain au levain cuit au four à bois, complétées
  d'un petit élevage et, depuis 2022, d'une démarche d'agroforesterie sur
  13 hectares.
montage:
  type: propriete_protegee
  nu_proprietaire: "Foncière Terre de Liens (société en commandite par actions à actionnariat solidaire)"
  usufruitier: "GAEC Ferme du Plaisir (groupement agricole d'exploitation en commun)"
  description: >
    Le GAEC Ferme du Plaisir reçoit l'usage du foncier de la ferme par bail
    rural conclu avec la Foncière Terre de Liens, qui en a acquis la propriété
    fin 2018 grâce à l'épargne citoyenne. Le GAEC est une société civile
    agricole ; il exploite les terres et les bâtiments et y développe une
    activité paysanne de transformation.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Le GAEC est une société civile agricole dont le bénéfice agricole est partagé
    entre les associé·es, à gouvernance familiale resserrée : un mutualisme
    d'usagers au cercle fermé. Il s'articule à un porteur, la Foncière Terre de
    Liens, de nature sociétaire.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "La propriété du foncier reste à la Foncière Terre de Liens : le GAEC en a l'usage par bail rural et ne peut ni le revendre ni en capter la valeur."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Le GAEC est une société civile dont les parts sociales sont cessibles avec l'agrément des associés ; leur prix n'est pas statutairement plafonné, mais le GAEC ne détient pas le foncier."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "Le sort de l'actif du GAEC en cas de dissolution n'est pas documenté par les sources consultées."
  - critere: personne_morale_civile
    valeur: oui
    note: "Le GAEC est une société civile agricole de droit civil, et non une société commerciale."
  - critere: non_lucrativite_effective
    valeur: partiel
    note: "Le GAEC est une société civile agricole : les excédents d'exploitation rémunèrent le travail des associés et peuvent être partagés, sans logique de rendement du capital."
  - critere: une_voix
    valeur: oui
    note: "Le GAEC repose statutairement sur l'égalité des associés exploitants, qui participent tous au travail ; le pouvoir n'y est pas indexé sur le capital."
  - critere: usagers_decident
    valeur: oui
    note: "Les exploitant·es associé·es du GAEC — François et Sophie de la Monneraye — décident directement de la conduite de la ferme."
  - critere: ouverture_entrants
    valeur: inconnu
    note: "Les modalités d'accueil de nouveaux associés et de renouvellement du GAEC ne sont pas documentées par les sources."
  - critere: transparence_interne
    valeur: inconnu
    note: "La publication des comptes et des décisions du GAEC au-delà de ses associés n'est pas documentée."
  - critere: objet_ig
    valeur: oui
    note: "L'objet — agriculture paysanne, céréales anciennes, pain au levain, agroforesterie de restauration des sols — porte un intérêt général agricole et écologique."
  - critere: public_non_restreint
    valeur: partiel
    note: "La ferme vend en circuit court et a mobilisé des bénévoles pour ses plantations ; le GAEC reste une exploitation familiale dont les bénéfices profitent d'abord aux associés."
  - critere: duree_usage
    valeur: oui
    note: "Le GAEC dispose d'un bail rural, dont le renouvellement est d'ordre public : jouissance longue et sécurisée des terres."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'existence de clauses environnementales formalisées dans le bail rural (bail rural environnemental) n'est pas documentée par les sources."
  - critere: articulation_porteur
    valeur: oui
    note: "Le GAEC est lié à la Foncière Terre de Liens par un bail rural clair, conclu lors de l'acquisition du foncier fin 2018."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "La production de farine et de pain est vendue en circuit court ; l'activité relève d'une logique paysanne de proximité sans être non marchande."
  - critere: loyer_soutenable
    valeur: partiel
    note: "Le recours à Terre de Liens visait à limiter l'endettement à l'installation, ce qui suppose un fermage modéré ; son montant n'est pas documenté par les sources."
  - critere: vivant_finalite
    valeur: partiel
    note: "La ferme conduit une polyculture paysanne et une démarche d'agroforesterie de restauration des sols, pratiques écologiques revendiquées, sans que la biodiversité non-humaine soit affichée comme une finalité centrale du GAEC."
analyse:
  forces:
