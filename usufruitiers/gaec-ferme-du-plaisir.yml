    - "Usage du foncier sécurisé par bail rural à renouvellement d'ordre public."
    - "Objet agricole et écologique d'intérêt général : céréales anciennes, agroforesterie."
  fragilites:
    - "GAEC familial : gouvernance resserrée sur le couple exploitant."
    - "Ouverture aux nouveaux entrants et transmission non documentées."
    - "Transparence comptable, clause de dévolution et clauses du bail non documentées."
  leviers:
    - "Documenter publiquement les statuts, l'accueil de nouveaux associés et la transmission."
    - "Préciser les clauses environnementales du bail rural."
    - "Documenter le niveau du fermage et son caractère soutenable."
  synthese: >
    Le GAEC Ferme du Plaisir est le maillon usufruitier d'une chaîne Terre de
    Liens classique : une société civile agricole familiale qui exploite par
    bail rural un foncier porté hors-marché par la Foncière. Sa solidité civile est
    réelle ; sa marge de progression tient au caractère familial de sa
    gouvernance et à la documentation lacunaire de son fonctionnement.
fiabilite: >
  Faits vérifiés (sources Terre de Liens, Ferme du Plaisir et registres
  d'entreprises, consultées en mai 2026) : exploitation de la Ferme du Plaisir
  à Sazilly sous la forme d'un GAEC, gérance assurée par François et Sophie de
  la Monneraye, foncier acquis fin 2018 par la Foncière Terre de Liens,
  activité de paysan-boulanger (céréales anciennes, pain au levain), petit
  élevage, démarche d'agroforesterie depuis 2022. Non confirmé : montant du
  fermage, clauses du bail rural, transparence comptable, clause de dévolution,
  modalités d'accueil de nouveaux associés.
