analyse:
  forces:
    - "Dynamique collective réelle et documentée depuis 2016 : café, brasserie, festival, maraîchage, boulangerie paysanne."
    - "Ouverture effective au public au-delà du cercle des membres (festival ~1 300 entrées, café ouvert)."
    - "SIREN confirmé, existence juridique claire de l'association elle-même."
  fragilites:
    - "Titre d'usage précis liant Risomes au bâti (SCI) non documenté."
    - "Mélange d'activités non marchandes et commerciales (café, brasserie) sans détail sur le réinvestissement des excédents."
    - "Nue-propriété du bâtiment portée par une société (SCI) dont l'identification au registre n'est pas confirmée — voir porteurs/sci-convivium-malain.yml."
  leviers:
    - "Publier le titre d'usage (bail ou convention) liant l'association à la SCI."
    - "Documenter le mode de décision entre les huit « groupes action »."
    - "Clarifier le régime de réinvestissement des excédents des activités commerciales (café, brasserie)."
  synthese: >
    Risomes est une association d'animation locale solide et visible, mais le
    lien formel qui la rattache au foncier — tant pour le bâti (SCI) que pour
    les terres agricoles (GFA) — reste peu documenté par les sources
    publiques. Le lieu de Mâlain illustre un montage réel et ancien (2015) de
    « libération » citoyenne, dont la rigueur statutaire n'a pas pu être
    pleinement vérifiée dans cette passe.
fiabilite: >
  Faits vérifiés (source Reporterre, consultée le 2026-11-08, et recherche-
  entreprises.api.gouv.fr pour le SIREN) : association créée en 2016, SIREN
  820566511 confirmé (RESEAU D'INITIATIVES SOLIDAIRES MUTUELLES ET
  ECOLOGIQUES, 28-30 Rue de la Gare, 21410 Malain), huit « groupes action »,
  café associatif Le Chauffe-Savates ouvert début 2019, microbrasserie La
  Roche-Aiguë active depuis 2017, association La Milpa, festival biennal
  Atout bout d'champ (~1 300 entrées en 2017). Non confirmé : statuts, titre
  d'usage liant l'association à la SCI, mode de décision interne, régime de
  réinvestissement des excédents commerciaux.
