resume: >
  Association loi 1901 (« Réseau d'initiatives solidaires mutuelles et
  écologiques », sigle Risomes) créée en 2016 pour animer le tiers-lieu de
  Mâlain, dans le bâtiment acquis par la SCI Le Convivium de Mâlain. Elle
  réunit huit « groupes action » et porte plusieurs activités : un café
  associatif (Le Chauffe-Savates, ouvert en 2019, aménagé par chantiers
  collectifs et financement participatif), une microbrasserie artisanale bio
  (La Roche-Aiguë, depuis 2017), l'association La Milpa (troc de graines,
  permaculture) et un festival biennal (Atout bout d'champ, environ 1 300
  entrées à sa première édition en 2017). SIREN confirmé au répertoire
  national des entreprises.
montage:
  type: demembrement
  nu_proprietaire: "SCI Le Convivium de Mâlain"
  usufruitier: "Risomes (association loi 1901)"
  description: >
    Risomes occupe et anime le bâtiment porté par la SCI Le Convivium de
    Mâlain. Le titre précis (bail, convention d'occupation, mise à
    disposition) liant les deux entités n'est pas documenté par les sources
    consultées. L'association anime par ailleurs des activités agricoles et
    de maraîchage sur des parcelles du GFA Citoyen Champs Libres et de la SCI,
    sans que le lien institutionnel entre Risomes et le GFA soit détaillé par
    les sources.
