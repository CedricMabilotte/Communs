    - "Articulation claire dans le schéma CLIP : fonde l'association propriétaire et en est membre."
  fragilites:
    - "Nature et durée exactes du titre d'usage liant l'association habitante à l'association propriétaire non documentées."
    - "Statuts, gouvernance, comptes et montant du loyer interne non publiés."
    - "Acte d'achat du foncier (date, consistance, prix) non documenté, même si le lieu est attesté habité."
  leviers:
    - "Formaliser et publier le titre d'usage liant l'association habitante à l'association propriétaire (nature, durée, loyer)."
    - "Publier les statuts, la clause de dévolution et le régime d'usage interne."
    - "Documenter l'acte d'achat du foncier porté par l'association propriétaire."
synthese: >
  Les Habitants de la Porcheritz est le maillon usager d'un montage de propriété
  d'usage CLIP : association loi 1901 d'habitant·es, à l'objet d'habitat collectif
  solidaire et autogéré, qui fonde l'association propriétaire et en fait vivre
  l'usage. La forme est non lucrative, l'articulation au porteur lisible, et la
  résidence permanente du collectif sur place est désormais attestée (compte rendu
  d'AG du CLIP de janvier 2022) ; restent à confirmer la nature et la durée
  exactes du titre d'usage et le détail du régime interne.
fiabilite: >
  Faits relevés (sources : Assoce.fr, Pappers, Gralon, Annuaire des entreprises
  data.gouv.fr, site CLIP et compte rendu d'AG du CLIP du 29 janvier 2022,
  consultés les 31 mai et 1er juin 2026) : association
  loi 1901 Les Habitants de la Porcheritz, RNA
  W751219283, SIREN 812406882, déclarée le 8 avril 2013, siège RNA « La Cave » à
  Vichères (28480) — l'établissement SIRENE est enregistré au 156 boulevard de
  Magenta, 75010 Paris (NAF 9499Z) —, objet de créer et gérer un habitat
  collectif solidaire et
  autogéré et de mettre en place les structures juridiques nécessaires ;
  inscription dans le schéma CLIP (association habitante fondant l'association
  propriétaire La Porcheritz). Résidence permanente établie : le compte rendu
  d'AG du CLIP de janvier 2022 décrit La Porcheritz comme un lieu membre habité
  (collectif vivant sur place, chantiers, médiation interne, plénières,
  habitant·es représentant le lieu), et le modèle CLIP fait des occupant·es des
  locataires de la structure propriétaire (loyers remboursant l'emprunt). À
  confirmer : la nature et la durée du titre d'usage liant l'association habitante
  à l'association propriétaire, le montant du loyer interne, les statuts, la
  gouvernance et la transparence des comptes.
