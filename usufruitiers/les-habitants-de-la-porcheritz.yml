resume: >
  Les Habitants de la Porcheritz est l'association « habitante » du montage de
  propriété d'usage CLIP de La Porcheritz, lieu d'habitat collectif du Perche, à
  Vichères (Eure-et-Loir). Déclarée le 8 avril 2013 (RNA W751219283, SIREN
  812406882), siège « La Cave » à Vichères, elle a pour objet de créer et gérer
  un habitat collectif solidaire et autogéré et de mettre en place les
  structures juridiques nécessaires. Selon le schéma CLIP, elle porte l'usage et
  la gestion quotidienne du lieu et fonde l'association propriétaire La
  Porcheritz, dont elle est membre. La résidence permanente du collectif est
  désormais établie : le compte rendu d'AG du CLIP de janvier 2022 décrit La
  Porcheritz comme un lieu membre habité — collectif vivant sur place, chantiers,
  médiation interne, plénières, habitant·es représentant le lieu — et le réseau
  distingue explicitement ces collectifs « qui vivent sur place ».
montage:
  type: propriete_collective
  nu_proprietaire: "Association La Porcheritz (association propriétaire, second membre CLIP)"
  usufruitier: "Les Habitants de la Porcheritz (association habitante)"
  description: >
    Dans le schéma CLIP, l'association habitante Les Habitants de la Porcheritz
    porte l'usage et la gestion du lieu et fonde l'association propriétaire La
    Porcheritz, dont elle est membre aux côtés du réseau CLIP — second membre
    garant de la non-revente. C'est l'association propriétaire qui détient le
    foncier en propriété d'usage ; l'association habitante en fait vivre l'usage,
    pour un habitat collectif solidaire et autogéré. La résidence du collectif
    sur place est attestée par le compte rendu d'AG du CLIP de janvier 2022. À
    confirmer : la nature et la durée du titre d'usage liant les deux associations
    ne sont pas documentées par les sources publiques.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Association loi 1901 : forme structurellement non lucrative, à l'objet
    d'habitat collectif solidaire et autogéré. Maillon usager d'un montage de
    propriété d'usage CLIP, dont la résidence permanente du collectif est attestée
    (compte rendu d'AG du CLIP de janvier 2022). Réserve : la nature et la durée
    du titre d'usage liant l'association habitante à l'association propriétaire ne
    sont pas documentées.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "Une association loi 1901 n'a pas de capital appropriable : ses membres ne peuvent ni revendre ni capter à titre privé la valeur du foncier, porté par l'association propriétaire."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Une association loi 1901 n'a pas de parts ni de titres cessibles : aucune valeur n'est appropriable par un membre."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "L'existence d'une clause de dévolution désintéressée dans les statuts de l'association habitante n'est pas documentée par les sources."
  - critere: personne_morale_civile
    valeur: oui
    note: "Les Habitants de la Porcheritz est une association loi 1901 — personne morale de droit civil non lucrative — et non une société commerciale."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Une association loi 1901 ne partage pas de bénéfices : les éventuels excédents sont réinvestis dans l'objet — l'habitat collectif solidaire et autogéré."
  - critere: une_voix
    valeur: inconnu
    note: "Le principe « une personne, une voix » est usuel en association loi 1901, mais les statuts de l'association ne sont pas publiés : le mode de décision n'est pas documenté."
  - critere: usagers_decident
    valeur: partiel
    note: "Le compte rendu d'AG du CLIP de janvier 2022 atteste un collectif d'habitant·es vivant sur place et s'autogérant (plénières, chantiers, médiation interne, décisions prises en présence) : la résidence et l'autogestion sont documentées. Le détail formel des règles de décision (statuts, organe) reste non publié."
  - critere: ouverture_entrants
    valeur: inconnu
    note: "L'organisation de l'arrivée de nouveaux membres et du renouvellement n'est pas documentée par les sources."
  - critere: transparence_interne
    valeur: inconnu
    note: "L'accessibilité des comptes et décisions aux membres et au public n'est pas documentée par les sources."
  - critere: objet_ig
    valeur: partiel
    note: "L'objet — créer et gérer un habitat collectif solidaire et autogéré — relève d'un intérêt général (habitat digne, solidarité) ; sa portée au-delà d'un habitat partagé entre membres reste à préciser."
  - critere: public_non_restreint
    valeur: inconnu
    note: "L'ouverture du lieu au-delà du cercle de ses habitant·es n'est pas documentée par les sources."
  - critere: vivant_finalite
    valeur: inconnu
    note: "Une finalité explicite d'accueil ou de préservation du vivant non-humain n'est pas documentée par les sources."
  - critere: duree_usage
    valeur: partiel
    note: "Le modèle CLIP, documenté par le réseau, fait de l'association habitante la locataire stable de l'association propriétaire, et le lieu est attesté habité de longue date (compte rendu d'AG 2022) ; mais la nature juridique et la durée exactes du titre liant les deux associations ne sont pas documentées."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'inscription de clauses d'usage ou environnementales dans le titre liant l'association habitante au foncier n'est pas documentée par les sources."
  - critere: articulation_porteur
    valeur: oui
    note: "L'articulation est claire dans le schéma CLIP : l'association habitante fonde l'association propriétaire et en est membre, aux côtés de CLIP garant — relation contractualisée par la structure même du montage."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "Le modèle CLIP, documenté par le réseau, repose sur un loyer interne calibré pour rembourser l'emprunt d'acquisition (à prix coûtant, sans rendement) ; le principe non marchand est posé, mais le régime d'usage concret de La Porcheritz (gratuité, contribution, montant) n'est pas publié."
  - critere: loyer_soutenable
    valeur: partiel
    note: "Le modèle CLIP, documenté par le réseau, prévoit un loyer versé par l'association habitante à l'association propriétaire, calibré pour rembourser l'emprunt (sans marge ni rendement) ; le principe d'un loyer soutenable est posé, mais son montant pour ce lieu n'est pas publié."
