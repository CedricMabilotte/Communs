fiabilite: >
  Faits vérifiés (sources tera.coop, wiki TERA et presse, consultées en mai
  2026 ; forme juridique recoupée au registre — annuaire des associations,
  juin 2026) : la Coop du Tilleul est une association loi 1901 (RNA W473002310,
  SIREN 829556232, déclarée le 01/04/2017 à Masquières), structure d'usage des
  activités alimentaires de TERA ; la ferme de Lartel à Masquières lui est
  louée ; TERA est un projet né en 2015 et déployé sur trois communes du
  Lot-et-Garonne, environ 400 adhérent·es, épicerie « l'Alvéole » à
  Tournon-d'Agenais. Non confirmé : nature et durée du bail, montant du loyer,
  gouvernance interne, comptes.
