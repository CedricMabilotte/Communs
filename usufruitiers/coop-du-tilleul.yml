resume: >
  La Coop du Tilleul est la structure d'usage qui fait vivre la ferme de Lartel,
  à Masquières, au sein de l'écosystème coopératif TERA. La ferme appartient à la
  SCI Le Tilleul — elle-même majoritairement détenue par le fonds de dotation
  SDH — et est louée à la Coop du Tilleul, qui y développe les activités
  alimentaires du projet : maraîchage, forêt-jardin, compost, ainsi que
  l'épicerie « l'Alvéole » à Tournon-d'Agenais. TERA, « Tous Ensemble vers un
  Revenu d'Autonomie », est un projet de relocalisation des activités en zone
  rurale, né en 2015 de deux tours de France et installé sur le domaine du
  Tilleul ; il rassemble environ 400 adhérent·es et déploie ses activités sur
  trois communes du Lot-et-Garonne.
montage:
  type: propriete_collective
  nu_proprietaire: "SCI Le Tilleul, majoritairement détenue par le fonds de dotation SDH"
  usufruitier: "Coop du Tilleul (collectif d'usage de la ferme de Lartel)"
  description: >
    La ferme de Lartel appartient à la SCI Le Tilleul, société civile dont le
    fonds de dotation SDH détient la majorité des parts. La SCI loue la ferme à
    la Coop du Tilleul, qui en assure l'exploitation : c'est elle qui fait vivre
    le lieu au quotidien et porte les activités nourricières de TERA. Le titre
    d'usage de la Coop du Tilleul est un bail de location dont la nature exacte
    et la durée ne sont pas documentées par les sources.
