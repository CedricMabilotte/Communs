synthese: >
  Le collectif usager du Château de la Mhotte associe une école Steiner-Waldorf
  ancienne et un habitat participatif récent, réunis par un bail emphytéotique
  de 99 ans sur un domaine soustrait au marché par un fonds de dotation. Le montage est
  abouti côté foncier ; sa marge de progression tient à la publication du
  fonctionnement interne et du régime de la redevance.
fiabilite: >
  Faits vérifiés (sources Coopérative Oasis, École de la Mhotte et Acoeur,
  consultées en mai 2026) : domaine d'une quinzaine d'hectares à Saint-Menoux,
  École Steiner-Waldorf de la Mhotte créée en 1976 (environ 120 élèves),
  association Acoeur créée en 2021 (douzaine de foyers en habitat
  participatif), fonctionnement collégial et chantiers participatifs,
  acquisition du domaine en 2026 par le fonds de dotation Fraternité pour
  Demain, bail emphytéotique de 99 ans, Obligation Réelle Environnementale.
  Non confirmé : montant de la redevance, transparence comptable, clause de
  dévolution, modalités d'accueil.
