resume: >
  Le domaine du Château de la Mhotte, à Saint-Menoux dans l'Allier, est animé
  par deux projets associatifs qui en sont les usagers. L'École de la Mhotte
  est une école Steiner-Waldorf indépendante créée en 1976 — l'une des
  premières de France — qui accueille environ 120 élèves de la maternelle au
  collège. L'association Acoeur, créée en 2021, porte l'habitat participatif
  et solidaire installé dans les anciens communs du château : une douzaine de
  foyers, des ateliers, un potager et un verger. Les deux associations
  fonctionnent de manière collégiale et organisent des chantiers
  participatifs. Depuis 2026, elles disposent de l'usage du domaine par un
  bail emphytéotique de 99 ans consenti par le fonds de dotation Fraternité
  pour Demain.
montage:
  type: propriete_protegee
  nu_proprietaire: "Fonds de dotation Fraternité pour Demain"
  usufruitier: "École de la Mhotte et association Acoeur (associations loi 1901)"
  description: >
    Le domaine a été acquis en 2026 par le fonds de dotation Fraternité pour
    Demain, au terme d'une campagne internationale de collecte de dons. Le
    fonds met le domaine à disposition des deux associations usagères — École
    de la Mhotte et Acoeur — par un bail emphytéotique de 99 ans. Le foncier
    est ainsi soustrait au marché ; les associations en assurent l'usage
    et la gestion collégiale.
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Deux associations loi 1901 sans capital appropriable, à fonctionnement
    collégial : les familles de l'école et les habitant·es d'Acoeur prennent
    soin du lieu et participent à ses décisions.
