resume: >
  Exploitation agricole à responsabilité limitée immatriculée à Chaussy
  (Val-d'Oise), à la Ferme de la Bergerie de Villarceaux, au capital de 15 000
  euros, gérée par Olivier Ranke. Elle conduit l'exploitation agricole d'environ
  370 hectares du domaine de Villarceaux — dont la Fondation Charles Léopold
  Mayer pour le Progrès de l'Homme (FPH) détient le foncier — en polyculture-élevage
  biologique : bovins, ovins, céréales, légumineuses, boulange. Olivier Ranke a
  repris la ferme en 1995 et conduit la transition agroécologique du domaine.
  Elle exploite le domaine via un commodat (prêt à usage gratuit, dit « bail à
  commodat ») : mise à disposition gratuite des terres et des infrastructures
  consentie en 2006 pour 25 ans, sous condition de respecter une charte
  agroécologique stricte (agriculture biologique, certification Nature et
  Progrès) ; depuis 2006, l'EARL est indépendante de la fondation sur les plans
  décisionnel et économique. L'EARL est le maillon exploitant du site ; elle est
  lucrative pour ses associé·es (appropriation du bénéfice d'exploitation), sans
  détenir le foncier, porté par une fondation non lucrative.
montage:
  type: propriete_protegee
  nu_proprietaire: "Fondation Charles Léopold Mayer pour le Progrès de l'Homme (FPH)"
  usufruitier: "EARL du Chemin Neuf (société civile d'exploitation agricole, gérant Olivier Ranke)"
  description: >
    La propriété du domaine est portée par la FPH, fondation non lucrative.
    L'usage agricole — environ 370 hectares — est confié à l'EARL du Chemin Neuf,
    qui exploite la ferme en agroécologie. Le titre liant l'EARL à la fondation
    est établi : un commodat (prêt à usage gratuit) consenti en 2006 pour 25 ans,
    mise à disposition gratuite des terres et des infrastructures sous charte
    agroécologique stricte. L'EARL est preneuse, non détentrice, du foncier, sans
    verser de loyer rentier ; sa jouissance est durable (horizon 25 ans) mais
    juridiquement plus précaire qu'un bail rural — le commodat n'ouvre pas le
    droit au renouvellement d'ordre public du statut du fermage.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    L'usufruitier est une société civile à capital — EARL — exploitant la ferme
    pour le compte de ses associé·es ; sa lucrativité n'est pas verrouillée par
    des statuts non lucratifs et le bénéfice de l'exploitation se concentre sur
    ses associé·es. Le foncier reste hors de sa main, chez la fondation, et lui
    est confié par un commodat gratuit sous charte agroécologique : preneuse sous
    porteur hors-marché, elle relève d'une société civile d'exploitation agricole
    (nature_interet), non d'une logique commerciale de marché.
grille:
  - critere: non_appropriation
    valeur: oui
    note: "La propriété du domaine reste à la Fondation Charles Léopold Mayer ; l'EARL exploite sans détenir le foncier et ne peut en capter la valeur."
  - critere: parts_non_cessibles
    valeur: non
    note: "L'EARL est une société civile à capital de 15 000 euros, dont les parts sont cessibles : aucun verrou statutaire ne plafonne leur valeur."
  - critere: devolution_usufruitier
    valeur: non
    note: "L'EARL est une société civile : en cas de dissolution, le boni de liquidation revient aux associé·es, sans clause de dévolution désintéressée."
  - critere: personne_morale_civile
    valeur: partiel
    note: "L'EARL est une personne morale de droit civil à objet agricole, mais c'est une société à capital sans verrou de non-lucrativité, et non une association ou une coopérative."
  - critere: non_lucrativite_effective
    valeur: non
    note: "L'EARL est une société d'exploitation à but lucratif : les bénéfices peuvent être distribués à ses associé·es exploitant·es."
  - critere: une_voix
    valeur: partiel
    note: "L'EARL est gérée par Olivier Ranke ; le pouvoir y reste lié aux parts sociales détenues, sans principe « une personne, une voix »."
  - critere: usagers_decident
    valeur: oui
    note: "L'exploitant qui travaille la ferme, Olivier Ranke, est le gérant de l'EARL et décide de ses usages agricoles."
  - critere: ouverture_entrants
    valeur: inconnu
    note: "Les modalités d'entrée de nouveaux·elles associé·es dans l'EARL ne sont pas documentées par les sources."
  - critere: transparence_interne
    valeur: partiel
    note: "Les statuts et l'immatriculation de l'EARL sont publics au registre des entreprises ; la publication régulière de ses comptes et décisions n'est pas documentée."
  - critere: objet_ig
    valeur: oui
    note: "L'objet — exploitation agricole biologique en polyculture-élevage, boulange, formation à l'agroécologie — porte un intérêt général agricole et alimentaire."
  - critere: public_non_restreint
    valeur: partiel
    note: "La ferme accueille du public (vente, visites, rôle de centre technique de l'agriculture biologique), mais l'exploitation profite d'abord à ses associé·es."
  - critere: duree_usage
    valeur: partiel
    note: "Le titre est un commodat (prêt à usage gratuit) consenti en 2006 pour 25 ans. Horizon long, mais durée fixe sans droit au renouvellement d'ordre public (à la différence d'un bail rural) : reconduction au-delà de 2031 non documentée."
  - critere: clauses_usage
    valeur: oui
    note: "Le commodat est assorti d'une charte agroécologique stricte : engagement en agriculture biologique, certification Nature et Progrès. Des clauses d'usage environnementales encadrent donc effectivement l'exploitation."
  - critere: articulation_porteur
    valeur: oui
    note: "L'EARL exploite un foncier détenu par la FPH via un commodat (prêt à usage gratuit, 25 ans) : l'acte qui les lie est établi par les sources, même si son texte intégral n'est pas publié."
  - critere: regime_usage_non_marchand
    valeur: non
    note: "L'usage que fait vivre l'EARL repose sur la production agricole vendue (viande, farines, pain, légumineuses) : il relève d'une logique marchande."
  - critere: loyer_soutenable
    valeur: oui
    note: "Le commodat est par nature gratuit (art. 1875 C. civ.) : l'EARL ne verse pas de loyer à la fondation pour les terres et infrastructures. L'existence d'un éventuel forfait de charges n'est pas documentée."
  - critere: vivant_finalite
    valeur: partiel
    note: "L'EARL conduit une agroécologie de longue date (replantation de haies, agroforesterie) servant la biodiversité ; sa finalité reste néanmoins l'exploitation agricole, non la protection de la nature comme telle."
analyse:
  forces:
    - "Exploitation conduite en agroécologie depuis le milieu des années 1990 par l'exploitant qui travaille la ferme."
    - "Foncier sécurisé en amont par une fondation non lucrative, hors de la main de l'EARL."
    - "Polyculture-élevage biologique diversifiée, rôle de centre technique de l'agriculture biologique."
  fragilites:
    - "EARL : société civile à capital lucratif, sans verrou de non-lucrativité ni clause de dévolution désintéressée."
    - "Parts sociales cessibles ; bénéfice de l'exploitation concentré sur les associé·es."
    - "Titre d'usage par commodat : gratuit et long (25 ans), mais plus précaire qu'un bail rural — pas de renouvellement d'ordre public ; reconduction au-delà de 2031 non documentée."
  leviers:
    - "Publier l'acte de commodat (clauses, reconduction au-delà de 2031)."
    - "Sécuriser davantage la jouissance par un bail rural environnemental ou un usufruit ouvrant un droit au renouvellement."
    - "Documenter le fonctionnement interne, les comptes et l'ouverture à de nouveaux·elles associé·es."
  synthese: >
    L'EARL du Chemin Neuf est le maillon exploitant de Villarceaux : une société
    civile agricole qui conduit, de longue date et en agroécologie, l'exploitation
    d'un domaine dont la fondation porte le foncier. Elle est preneuse d'un
    commodat — prêt à usage gratuit consenti en 2006 pour 25 ans sous charte
    agroécologique stricte —, sans détenir le sol ni verser de loyer rentier :
    une société civile d'exploitation agricole sous porteur hors-marché, non
    commerciale au sens du marché. Sa lucrativité pour ses associé·es
    (appropriation du bénéfice d'exploitation) et la précarité relative du
    commodat (face à un bail rural) la maintiennent comme maillon à intérêt privé
    encadré, qui plafonne le lieu au degré hybride, sous le sommet du commun.
fiabilite: >
  Faits vérifiés (sources : site de la Bergerie de Villarceaux, registre des
  entreprises, presse, consultés en juin 2026) : EARL du Chemin Neuf immatriculée
  à Chaussy (SIREN 488246521), constituée en 2006, capital de 15 000 euros, gérée
  par Olivier Ranke, exploitation d'environ 370 hectares en polyculture-élevage
  biologique (bovins, ovins, céréales, légumineuses, boulange), reprise de la
  ferme en 1995 et conduite de la transition agroécologique du domaine de
  Villarceaux. Titre d'usage établi par recoupement de sources concordantes (site
  officiel de la Bergerie, FPH, Pollinis, ARC2020 / resilience.org, article INRA
  2014) : commodat (prêt à usage gratuit, « bail à commodat »), mise à disposition
  gratuite des terres et infrastructures consentie en 2006 pour 25 ans sous charte
  agroécologique stricte (bio, Nature et Progrès) ; EARL indépendante de la
  fondation sur les plans décisionnel et économique depuis 2006. Pièces lues :
  extraits secondaires concordants — l'acte primaire de commodat n'a pas été lu
  (non publié). Non confirmé : clauses exactes et reconduction du commodat au-delà
  de 2031, existence d'un forfait de charges, comptes de la société, modalités
  internes de gouvernance.
