  synthese: >
    L'Antre Toit illustre le maillon usufruitier du modèle Antidote appliqué à
    un lieu d'accueil social : une association d'usager·es qui coordonne un
    bâtiment sanctuarisé par un fonds de dotation et le met au service de
    l'hébergement de jeunes exilé·es. Sa marge de progression tient à la
    publication de son fonctionnement interne et de son lien avec L'Antre d'Eux.
