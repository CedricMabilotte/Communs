nom: "GAEC du Jointout"
sous_titre: "Groupement agricole d'exploitation en commun de la ferme collective du Jointout, à Torpes"
statut_fiche: publie
forme_juridique: "Groupement agricole d'exploitation en commun (GAEC)"
nature_interet: exploitation_agricole
