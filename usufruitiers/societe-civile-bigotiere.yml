nom: "Société civile de la Bigotière"
sous_titre: "Société civile d'habitant·es propriétaire et usagère de l'écohameau de la Bigotière"
statut_fiche: publie
forme_juridique: "Société civile d'attribution (SCIA, art. L.212-1 et s. CCH)"
