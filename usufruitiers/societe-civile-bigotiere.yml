resume: >
  Société civile constituée par les habitant·es de l'écohameau de la Bigotière,
  ancienne grande ferme de la commune d'Épiniac en Ille-et-Vilaine, achetée en
  septembre 2016 par un groupe de couples ami·es de la région rennaise. La
  société civile détient le foncier — un ensemble de 4,3 hectares dont 1,5 ha de
  terres agricoles, 0,5 ha de bois et environ 1 000 m² de bâtiments — et porte
  l'habitat participatif réhabilité : neuf logements, un gîte locatif, des
  logements d'accueil social, un fournil. Les habitant·es sont à la fois
  associé·es de la société civile propriétaire et usager·es du lieu : la chaîne
  est intégrée. La forme est établie par le registre (SIREN 821271442) : une
  société civile d'attribution (SCIA), dont l'objet est la division de
  l'ensemble immobilier en fractions attribuées en propriété ou en jouissance
  aux associé·es ; les parts, proportionnelles à la valeur du lot attribué
  (art. L.212-5 CCH), portent la valeur du bâti et sont cessibles sous agrément,
  sans verrou anti-spéculatif documenté. Les activités de transition écologique
  et alimentaire sont portées par une structure distincte, la SCIC Le Ruisseau.
montage:
  type: propriete_collective
  nu_proprietaire: "Société civile de la Bigotière (société civile d'habitant·es)"
  usufruitier: "Société civile de la Bigotière — chaîne intégrée : les habitant·es sont à la fois associé·es et usager·es"
  description: >
    Les habitant·es de la Bigotière se sont réuni·es dans une société civile
    d'attribution (SCIA) — forme établie par le registre — pour acquérir et
    réhabiliter l'écohameau. Cette société civile détient le foncier et le bâti
    et les attribue en propriété ou en jouissance à ses associé·es habitant·es,
    par fractions proportionnelles à la valeur du lot (art. L.212-5 CCH) :
    propriété et usage sont portés par la même entité collective, mais les parts
    portent une valeur patrimoniale appropriable à titre privé. La SCIC Le Ruisseau, structure distincte, porte
    les activités d'accueil et de transition et n'est pas propriétaire de
    l'habitat.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Société civile d'attribution d'habitant·es : structure collective de droit
    civil dont les parts, indexées sur la valeur du lot attribué, portent une
    valeur patrimoniale privée cessible et sans plafond documenté. Sans
    lucrativité d'exploitation spéculative, mais le bénéfice — la jouissance et
    la valeur des logements — est approprié par ses associé·es personnes
    physiques. Chaîne intégrée propriétaire ≡ usagère.
grille:
  - critere: non_appropriation
    valeur: non
    note: "Forme établie : société civile d'attribution (SCIA). Les parts, proportionnelles à la valeur du lot attribué (art. L.212-5 CCH), portent la valeur appropriable du bâti à titre privé ; aucun verrou anti-spéculatif n'est documenté."
  - critere: parts_non_cessibles
    valeur: non
    note: "En SCIA, les parts sont cessibles : librement entre associé·es, ascendants, descendants et conjoints, et aux tiers sous agrément collectif. Elles portent la valeur du lot attribué, sans plafonnement de prix documenté."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "Le sort de l'actif de la société civile en cas de dissolution n'est pas documenté par les sources consultées."
  - critere: personne_morale_civile
    valeur: oui
    note: "Société civile : personne morale de droit civil, et non société commerciale."
  - critere: non_lucrativite_effective
    valeur: non
    note: "Société civile d'attribution sans aucun verrou statutaire de non-lucrativité : les associé·es personnes physiques s'attribuent la propriété ou la jouissance de lots dont les parts portent une valeur patrimoniale privée et cessible. La lucrativité n'est pas spéculative d'exploitation, mais l'appropriation privée de la valeur n'est pas neutralisée."
  - critere: une_voix
    valeur: inconnu
    note: "Le mode de décision de la société civile — proportionnel aux parts ou « une personne, une voix » — n'est pas documenté par les sources."
  - critere: usagers_decident
    valeur: oui
    note: "Les habitant·es sont les associé·es de la société civile propriétaire : ils gouvernent eux-mêmes le lieu et son habitat."
  - critere: ouverture_entrants
    valeur: partiel
    note: "L'écohameau est passé de six couples à vingt-deux résident·es et accueille de nouveaux habitant·es ; les modalités d'admission au capital ne sont pas détaillées."
  - critere: transparence_interne
    valeur: inconnu
    note: "La publication des comptes et des décisions de la société civile n'est pas documentée par les sources."
  - critere: objet_ig
    valeur: oui
    note: "L'objet — habitat partagé écologique, accueil de mères isolées avec enfants, fournil, activités liées à la commune — porte un intérêt général d'habitat digne et de lien social."
  - critere: public_non_restreint
    valeur: oui
    note: "Au-delà des associé·es habitant·es, le lieu accueille des mères isolées avec enfants, des activités culturelles et une distribution de produits fermiers à une centaine d'adhérent·es."
  - critere: duree_usage
    valeur: oui
    note: "Les habitant·es détiennent leur jouissance via leur qualité d'associé·es de la société civile propriétaire : l'usage n'est pas précaire et n'est pas plafonné dans le temps."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'existence de clauses d'usage ou environnementales inscrites dans les statuts ou les conventions n'est pas documentée par les sources."
  - critere: articulation_porteur
    valeur: oui
    note: "Chaîne intégrée : la société civile est à la fois propriétaire et entité d'usage, ce qui supprime toute précarité locative vis-à-vis d'un tiers, mais prive le montage d'un contre-pouvoir externe entre propriété et usage."
  - critere: regime_usage_non_marchand
    valeur: partiel
    note: "L'usage habitant relève du partage entre associé·es ; une part marchande coexiste — gîte locatif, distribution de produits fermiers — sans tarification de marché documentée pour le lieu lui-même."
  - critere: loyer_soutenable
    valeur: inconnu
    note: "Les modalités financières entre la société civile et ses associé·es habitant·es — redevance, charges — ne sont pas documentées par les sources."
  - critere: vivant_finalite
    valeur: non
    note: "La société civile porte l'habitat participatif de l'écohameau, pensé pour ses associé·es habitant·es ; la préservation de la biodiversité non-humaine n'est pas affichée parmi les finalités de ce maillon."
analyse:
  forces:
    - "Foncier porté collectivement par les habitant·es eux-mêmes, en société civile."
    - "Chaîne intégrée : aucune précarité locative vis-à-vis d'un tiers."
    - "Lieu réellement ouvert : accueil social, fournil, distribution de produits fermiers."
    - "Société civile d'attribution : les parts portent la valeur appropriable du bâti et sont cessibles, sans verrou anti-spéculatif."
    - "Chaîne intégrée : pas de contre-pouvoir externe entre propriété et usage."
    - "Mode de décision, transparence comptable et clause de dévolution non documentés."
  leviers:
    - "Documenter et, le cas échéant, plafonner la valeur de cession des parts."
    - "Publier les statuts, le mode de décision et la clause de dévolution."
    - "Articuler une garantie foncière externe pour pérenniser la sortie du marché."
  synthese: >
    La société civile de la Bigotière est une société civile d'attribution
    (SCIA) à chaîne intégrée : les habitant·es sont à la fois propriétaires, via
    la société civile, et usager·es de l'écohameau. Sa force tient à l'absence
    de précarité locative et à une réelle ouverture sociale du lieu ; sa
    fragilité, à des parts qui portent la valeur appropriable du bâti, cessibles
    et sans verrou anti-spéculatif, et à l'absence de contre-pouvoir externe
    entre propriété et usage. La structure relève d'une lucrativité ouverte : la
    valeur du lieu reste captable à titre privé.
fiabilite: >
  Faits vérifiés (sources la Bigotière, Le Ruisseau Coopérative, Coopérative
  Oasis et presse, consultées en mai 2026) : écohameau d'Épiniac acheté en
  septembre 2016 par un groupe de couples, ensemble de 4,3 hectares dont 1,5 ha
  agricoles et 0,5 ha de bois, environ 1 000 m² de bâtiments, habitat
  participatif réhabilité (neuf logements, gîte, logements d'accueil social,
  fournil), constitution d'une société civile par les habitant·es pour acquérir
  et rénover le lieu, SCIC Le Ruisseau portant les activités de transition.
  Forme désormais établie par le registre (SIREN 821271442, annuaire-entreprises
  et Pappers) : société civile d'attribution, objet de division de l'ensemble
  immobilier en fractions attribuées en propriété ou en jouissance aux
  associé·es personnes physiques ; corroboré par la presse (France 3, qui
  mentionne la « société civile d'attribution » montée par le groupe fondateur).
  Non confirmé : mode de décision (proportionnel aux parts ou « une voix »),
  prix effectif de cession des parts et plafonnement éventuel, clause de
  dévolution, transparence comptable.
