    - "Préciser les modalités d'accueil de nouveaux·elles associé·es."
    - "Inscrire des clauses environnementales formelles dans le bail."
  synthese: >
    Le GAEC Les P'tites Berouettes est le maillon usufruitier classique d'une
    ferme Terre de Liens : une société civile d'exploitation dont les associé·es
    paysan·nes cultivent eux-mêmes une terre sanctuarisée hors marché. Sa nature
    de groupement d'exploitation — bénéfice partagé entre associé·es — le situe
    du côté du mutualisme plutôt que du commun citoyen.
fiabilite: >
  Faits vérifiés (sources Terre de Liens, GAEC Les P'tites Berouettes et presse
  agricole spécialisée, consultées en mai 2026) : GAEC constitué en 2022 par
  David Lécrivain et Jonas Cadieu à Luitré-Dompierre, maraîchage diversifié en
  agriculture biologique, environ 3 hectares de plein champ et 1 200 m² de
  serres, une quarantaine de légumes, vente en circuits courts, foncier acquis
  par la Foncière Terre de Liens. Non confirmé : montant du fermage, nature
  exacte du bail, clause de dévolution, transparence comptable.
