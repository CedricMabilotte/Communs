    - "Documenter la gouvernance et le nombre de membres."
    - "Rendre compte annuellement des prélèvements et du suivi écologique."
  synthese: >
    Sous Lou Boès est le maillon vivant du montage de Chaudeyrolles : une
    association d'habitant·es qui gère, sans la posséder, une forêt tenue hors
    marché par un fonds de dotation. Le schéma est celui de référence du corpus ;
    la pièce manquante est le bail lui-même, dont on ne connaît que l'existence
    et la vocation.
fiabilite: >
