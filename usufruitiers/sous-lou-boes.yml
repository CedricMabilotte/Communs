  forestier à clauses environnementales et sociales, pratiques annoncées
  (page RAF) ; parcelle de 3,6 ha acquise par Forêts en Vie en 2022, animée par
  l'association (page des sept forêts du fonds). Non confirmé : statuts,
  nombre de membres, durée et loyer du bail, mode de décision.
