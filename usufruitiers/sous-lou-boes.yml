resume: >
  Association créée en octobre 2022 par quelques habitant·es de Boussoulet et
  des environs, dans le massif du Mézenc (Haute-Loire), à l'occasion de
  l'acquisition par le fonds de dotation Forêts en Vie d'une parcelle boisée de
  3,6 hectares à Chaudeyrolles. L'association en est locataire par un bail
  forestier à clauses environnementales et sociales et en assure la gestion
  collective : bois de chauffage et de construction récoltés à plusieurs, sans
  abatteuse, débardage à cheval, chantiers de transmission de compétences,
  vieux arbres laissés sur pied, protection des habitats de rapaces nocturnes
  et de blaireaux, suivi à long terme vers une forêt mélangée en âges et en
  essences. Immatriculée au répertoire national le 26 octobre 2022, siège à
  Champclause, commune voisine.
montage:
  type: propriete_protegee
  nu_proprietaire: "Fonds de dotation Forêts en Vie (propriétaire de la parcelle)"
  usufruitier: "Association Sous Lou Boès (locataire par bail forestier à clauses)"
  description: >
    L'association ne détient pas le sol : elle est locataire d'une parcelle
    dont le fonds de dotation Forêts en Vie est propriétaire, par un bail
    forestier à clauses environnementales et sociales (page RAF, octobre 2022).
    La nature juridique exacte du bail (emphytéotique ou bail civil long), sa
    durée pour Chaudeyrolles et le loyer éventuel ne sont pas publiés : la
    durée « de 15 à 99 ans » affichée par le fonds concerne le bail signé
    entre un·e propriétaire et Forêts en Vie, non le bail fonds → association.
