analyse:
  forces:
    - "Collectif d'habitant·es réel et installé (huit foyers), organisé en association."
    - "Bail de 80 ans sur un sol qui reste public : aucun foyer ne possède la terre."
    - "Communs concrets : maison commune, véhicules et outils partagés, café coopératif du bourg."
  fragilites:
    - "Qualité de preneuse du bail non confirmée par une pièce publique."
    - "Habitats en propriété privée sans règle de revente publiée : plus-value individuelle possible."
    - "Statuts, gouvernance et règles d'entrée non documentés."
  leviers:
    - "Publier les statuts et confirmer l'identité du preneur du bail."
    - "Formaliser et publier une clause anti-spéculative sur la revente des habitats."
    - "Documenter les règles de gouvernance et d'accueil de nouveaux foyers."
  synthese: >
    Le collectif du Placis est le maillon usager du premier hameau léger
    breton : il habite un sol public qu'il ne possède pas et mutualise ses
    communs. Le montage est solide côté sol ; il reste fragile côté bâti,
    propriété de chacun·e sans verrou publié, et côté pièces, puisque ni le
    bail ni l'identité exacte du preneur ne sont publics.
fiabilite: >
  Faits vérifiés le 2026-11-20 : association « HAMEAU LEGER DU PLACIS »,
  SIREN 904 835 600, créée le 15 octobre 2021, état actif, catégorie 9220,
  siège 9 Le Placis, 22630 Saint-André-des-Eaux (recherche-entreprises.api.gouv.fr) ;
  huit habitats réversibles, terrain communal d'environ 4 700 m², bail
  emphytéotique de 80 ans, 5 000 euros par an soit environ 50 euros par foyer
  et par mois, décision du collectif en novembre 2020, vote municipal du
  29 juin 2021, autorisation d'occupation temporaire, coopérative de plus de
  cent sociétaires en octobre 2022, propriété du bâti dissociée du sol
  (hameaux-legers.org, page du Placis) ; huit maisons, emprise d'environ 20 m²,
  coût de 12 000 à 15 000 euros, loyer de 50 euros par mois et par maison,
  « personne n'est propriétaire de son terrain » (L'Info durable, 20 mai 2023) ;
  preneur décrit comme « un groupe de personnes », café repris en SCIC en avril
  2022, épicerie de 130 adhérent·es (Banque des Territoires, 18 janvier 2023).
  Non confirmé : qualité de preneuse du bail, statuts, objet, nombre de
  membres, règles de revente des habitats, date d'emménagement.
