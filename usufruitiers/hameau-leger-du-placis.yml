resume: >
  Association déclarée, immatriculée le 15 octobre 2021 au répertoire national
  sous le nom « Hameau léger du Placis », siège au 9 Le Placis, à
  Saint-André-des-Eaux (Côtes-d'Armor). Elle porte le nom et l'adresse du
  premier hameau léger breton : huit foyers d'adultes de 25 à 30 ans,
  rencontré·es au sein de l'association Hameaux Légers, qui décident de se
  lancer en novembre 2020, obtiennent le soutien du conseil municipal le
  29 juin 2021, occupent d'abord le terrain à titre temporaire puis y
  installent huit habitats réversibles autoconstruits (emprise d'environ
  20 m², coût de 12 000 à 15 000 euros) et une maison commune bioclimatique
  (buanderie, chambre d'amis, salles communes). Chaque foyer est propriétaire
  de son habitat, aucun du sol, loué à la commune pour environ 50 euros par
  mois et par maison. Une partie du groupe a repris le café-épicerie du bourg,
  L'Éprouvette, en société coopérative d'intérêt collectif (plus de cent
  sociétaires en octobre 2022). Les sources publiques ne nomment pas
  l'association comme preneuse du bail : l'identification repose sur le nom,
  l'adresse et la date de création, concordants avec le projet.
montage:
  type: propriete_protegee
  nu_proprietaire: "Commune de Saint-André-des-Eaux (propriétaire du terrain)"
  usufruitier: "Collectif des habitant·es du Placis (association déclarée, preneuse présumée du bail)"
  description: >
    Le terrain reste communal ; il est loué par bail emphytéotique de 80 ans
    pour 5 000 euros par an. Les habitant·es sont propriétaires de leurs
    habitats réversibles et non du sol. Les sources décrivent le preneur comme
    « un groupe de personnes » ou « le collectif » ; l'association « Hameau
    léger du Placis », créée en octobre 2021 à l'adresse du hameau, en est le
    support juridique le plus probable, non confirmé par la délibération ni par
    le bail, non publiés.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Collectif d'habitant·es organisé en association, mutualisant terrain,
    maison commune, véhicules et outils ; l'usage profite d'abord à ses huit
    foyers, avec une ouverture au bourg par le café coopératif et les temps de
    rencontre. Aucune règle de revente des habitats ni de sélection des
    entrant·es n'est publiée.
