    acheté en octobre 2017 par l'association propriétaire Les Donnettes ; une
    parcelle complémentaire (« du broc ») a été acquise par financement
    participatif et chantiers collectifs. Le foncier est soustrait au marché :
    CLIP, membre de l'asso propriétaire, garantit la non-revente, et tout lieu
    du réseau dispose d'un veto sur la mise en marché des autres.

