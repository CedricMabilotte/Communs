note_genese: >
  Promu en pré-fiche par l'opérateur (passe de qualification lot Bascule,
  31 mai 2026), puis APPROFONDI le 31 mai 2026 (recherche web). DÉCISION
  OPÉRATEUR : lieu ÉLIGIBLE AU CORPUS — il y a un collectif d'habitat et une
  activité diversifiée ; la réserve initiale « bâti industriel » est LEVÉE vers
  l'inclusion. La recherche confirme par ailleurs un vivant non-humain tangible
  (2 000 m² de faysses en permaculture, ~20 ruches, ~60 poules, fruitiers), donc
  la 2e réserve (« vivant non documenté ») tombe aussi. Mécanisme foncier
  formalisé : SCIC SAS loi 1947 propriétaire (murs + part des terrasses), usage
  par parts sociales non spéculatives + droit d'usage (pacte d'associés : mise
  récupérée sans plus-value ; parts « V » de travail). Verdict pressenti : HYBRIDE
  (propriété d'usage coopérative + habitat collectif + dimension vivante).
  Collectif : 23 fondateur·rices (2019), ~60 membres SCIC, cible ~30 résident·es /
  17 foyers, premiers foyers en travaux depuis 2024. À confirmer pour fiche :
  effectif installé en 2026, existence d'un collège habitant·es distinct, montants
  d'accès à jour, statut des faysses non détenues par la SCIC. Seul lien externe
  attesté : accompagnement par la Coopérative Oasis ; aucun lien formel avec la
  Bascule Argoat.
