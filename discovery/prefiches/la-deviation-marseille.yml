note_genese: >
  Pré-fiche générée le 2026-05-31 depuis le lead la-deviation-marseille.md
  (graine de l'étude réseau CLIP). Le point ouvert au départ — habitat
  permanent vs simple lieu d'activité/résidence artistique — est levé : une
  source (Arteplan) confirme une dizaine d'habitats légers individuels en
  carrière, occupés par les membres actifs, où l'on vit, travaille et reçoit.
  Montage propriété d'usage confirmé (achat 2019, double association + CLIP).
  À approfondir avant fiche publiée : SIREN/RNA des deux associations, statuts
  de Parpaing Libre (clause anti-revente, dévolution), place explicite du
  vivant non-humain (carrière, falaise). Aucune donnée inventée.
