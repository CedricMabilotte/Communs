  contexte: "ancienne cimenterie / carrière sur les hauteurs de L'Estaque, Val de Riaux — 1220 m² bâti, 1500 m² terrain"

entites_pressenties:
  - nom: Parpaing Libre (Parpaings Libres)
    role: association propriétaire
    note: "objet : devenir propriétaire de bâtiments pour les affecter à des lieux solidaires et autogérés (habitat ou profession) en propriété d'usage ; empêcher la revente. SIREN/RNA à confirmer."
  - nom: La Déviation
    role: association usagère / collectif gestionnaire
    note: "env. 15 membres actifs ; SIREN/RNA à confirmer"
  - nom: CLIP (Collectif pour l'Institutionnalisation de la Propriété d'usage)
    role: réseau garant — second membre de l'asso propriétaire, veille anti-revente

montage:
  type: propriete_collective
  articulations:
    - "asso usagère (La Déviation) — usage, habitat léger, création artistique"
    - "asso propriétaire (Parpaing Libre) — détient le foncier, objet anti-revente"
    - "CLIP — instance de veille garantissant la non-revente (droit de veto inter-lieux)"
  description: >
    Propriété d'usage formalisée. Achat en 2019 pour 410 000 €, sans banque,
    via de nombreux prêts solidaires (collecte « Libérons les parpaings »).
    Le bien est porté par l'association propriétaire Parpaing Libre, dont
    l'objet statutaire est d'empêcher la revente et d'affecter le bâti à des
    usages solidaires et autogérés en propriété d'usage. La propriété est
    légitimée par l'usage du collectif, non par l'argent ; CLIP est le second
    membre garant.

chaine:
