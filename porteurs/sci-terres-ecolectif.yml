resume: >
  La SCI Terres d'Ecolectif, créée en 2012, est la société civile immobilière
  qui détient le foncier de l'écohameau Écolectif — un domaine agricole d'environ
  46 hectares à Gensac-de-Boulogne, en Haute-Garonne, entre Toulouse et Tarbes.
  Ses parts sociales sont détenues par l'association collégiale Chemins
  d'Ecolectif et par la société MV Finance. La SCI loue le foncier et les
  habitations aux résident·es de l'écohameau, qui sont tout à la fois prêteur·ses,
  locataires et co-gérant·es du lieu : à l'entrée, les nouveaux membres apportent
  une somme à la SCI sous forme de prêt, restituée dans les six mois aux membres
  qui partent. La SCI est gérée par l'association Chemins d'Ecolectif, désignée
  comme associée gérante.
montage:
  type: propriete_collective
  description: >
    La SCI Terres d'Ecolectif détient le foncier et le bâti de l'écohameau
    Écolectif. Son capital est partagé entre l'association collégiale Chemins
    d'Ecolectif et la société MV Finance ; l'association en est l'associée
    gérante. La SCI loue logements et terres aux résident·es, qui contribuent au
    capital par des prêts d'entrée restituables au départ. Le montage est une
    propriété collective verrouillée par une société civile à parts non
    négociables, mais une fraction du capital est détenue par une société tierce
    et la SCI demeure une structure de forme civile et non non lucrative.
integrite_montage:
  niveau: economie_marchande
  commentaire: >
    Société civile immobilière à parts non librement négociables, gérée par une
    association collégiale ; une fraction du capital est toutefois détenue par
    une société tierce (MV Finance), au régime de rémunération non documenté, et
    le prix de cession des parts n'est pas plafonné. La SCI n'est pas une
    structure structurellement non lucrative et son intérêt privé n'est ni
    désactivé (capital non intégralement non lucratif) ni statutairement encadré
    par un verrou documenté : sa nature reste commerciale (lucrativité ouverte).
    Le fonctionnement interne est mutualiste — usager·es prêteur·ses-cogérant·es,
    loyers modiques — mais la présence d'un co-associé commercial sans plafond de
    cession maintient le foncier valorisable à titre privé, ce qui place le
    profil au pôle de l'économie marchande tant que le capital n'est pas verrouillé.
grille:
  - critere: inalienabilite
    valeur: partiel
    note: "Le foncier est porté par une SCI dédiée à l'écohameau ; aucune clause statutaire d'inaliénabilité explicite n'est documentée par les sources."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Les parts d'une SCI ne sont pas librement négociables sur un marché et leur cession est soumise à agrément ; le prix de cession n'est toutefois pas plafonné et une société tierce en détient une fraction."
  - critere: nature_protectrice
    valeur: partiel
    note: "La société civile figure au bas de l'échelle de protection foncière, en dessous de la fondation, du fonds de dotation et de la personne publique."
  - critere: clause_devolution
    valeur: inconnu
    note: "L'existence d'une clause de dévolution désintéressée du patrimoine de la SCI n'est pas documentée par les sources consultées."
  - critere: forme_non_lucrative
    valeur: non
    note: "La SCI est une société civile de forme classique, et non une structure structurellement non lucrative (fondation, fonds de dotation, association)."
  - critere: non_lucrativite_effective
    valeur: partiel
    note: "Les apports des résident·es sont des prêts restituables et non du capital rémunéré ; la part détenue par la société MV Finance et son régime de rémunération ne sont pas documentés."
  - critere: gestion_desinteressee
    valeur: partiel
    note: "La SCI est gérée par l'association collégiale Chemins d'Ecolectif, à but non lucratif ; le rôle de la société MV Finance dans la gestion n'est pas documenté."
  - critere: independance_rendement
    valeur: partiel
    note: "Les résident·es-prêteur·ses n'attendent pas de rendement, leurs apports étant restituables au nominal ; la logique de la société MV Finance vis-à-vis de la SCI n'est pas documentée."
  - critere: ca_collegial
    valeur: oui
    note: "La SCI est gérée par l'association Chemins d'Ecolectif, dirigée par un Cercle d'administration collégial décidant au consentement."
  - critere: parties_prenantes
    valeur: oui
    note: "Les résident·es de l'écohameau sont associé·es à la gouvernance : ils sont tout à la fois prêteur·ses, locataires et co-gérant·es du lieu."
  - critere: autogestion_usagers
    valeur: oui
    note: "Les résident·es sont à la fois prêteur·ses, locataires et co-gérant·es de la SCI, via l'association collégiale Chemins d'Ecolectif (associée gérante) qui décide au consentement : les usager·es du foncier tranchent eux-mêmes les décisions structurantes sur leurs conditions d'usage."
  - critere: transparence
    valeur: partiel
    note: "Le projet publie en ligne son cadre légal et ses statuts ; la publication régulière des comptes de la SCI n'est pas confirmée par les sources."
  - critere: objet_foncier_protecteur
    valeur: partiel
    note: "La SCI a pour fonction de porter le foncier de l'écohameau ; un objet statutaire explicite de soustraction au marché n'est pas documenté par les sources."
  - critere: agrement_ig
    valeur: non
    note: "La SCI Terres d'Ecolectif ne bénéficie d'aucune reconnaissance d'utilité publique ni d'agrément d'intérêt général documenté."
  - critere: risque_requalification
    valeur: inconnu
    note: "L'exposition de la SCI à un risque de requalification fiscale n'est pas documentée par les sources consultées."
  - critere: redevabilite_publique
    valeur: partiel
    note: "Le projet rend compte de son fonctionnement par un site public détaillant son cadre légal ; une reddition de comptes formelle au-delà des membres n'est pas documentée."
  - critere: regime_usage_offert
    valeur: oui
    note: "La SCI loue logements et terres aux résident·es à des loyers modiques (de 60 à 200 euros tout compris), sans rechercher de revenu locatif de marché."
  - critere: securite_usage_offerte
    valeur: partiel
    note: "Les résident·es disposent d'un bail d'occupation de leur espace de vie ; la durée et les conditions de renouvellement de ces baux ne sont pas documentées."
  - critere: vivant_finalite
    valeur: non
    note: "La SCI porte le foncier d'un écohameau destiné à ses résident·es humain·es ; aucune finalité de préservation de la biodiversité n'est documentée par les sources."
