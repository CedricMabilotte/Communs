resume: >
  Dans le modèle de propriété d'usage du CLIP, la propriété de chaque lieu est
  portée par une association propriétaire distincte de l'association usagère,
  le CLIP en étant le second membre et le garant de la non-revente. Pour
  l'écolieu de Saleix, membre du réseau CLIP, aucune source consultée ne
  documente l'association propriétaire : ni son existence formelle, ni ses
  identifiants, ni la forme et la date de la bascule en propriété d'usage. Cette
  fiche décrit le maillon propriétaire pressenti d'un montage dont le détail
  reste à instruire sur statuts. La cotation est prudente : l'inaliénabilité est
  l'inférence du réseau, non un fait recoupé.
montage:
  type: propriete_collective
  description: >
    L'écolieu de Saleix, installé sur une ancienne ferme familiale, est listé
    parmi les lieux du réseau CLIP. Le modèle CLIP suppose une association
    propriétaire — dont l'association usagère et le CLIP seraient les membres —
    qui détiendrait le foncier hors marché. Mais aucune source ne documente cette
    association propriétaire pour Saleix : son existence, sa titularité du
    foncier, ses statuts et le titre d'usage liant l'usage à la propriété ne sont
    pas établis. Le maillon propriétaire est ici pressenti, non documenté.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Maillon propriétaire pressenti d'un montage CLIP — association loi 1901
    non lucrative visée comme porteuse, le CLIP en garant. Mais l'existence et
    la titularité du foncier de cette association ne sont pas documentées : le
    montage reste à recouper sur statuts.
