resume: >
  Société civile immobilière créée en 2015 par les futurs habitant·es du
  tiers-lieu de Mâlain (Côte-d'Or) pour acquérir un bâtiment d'environ 800 m²
  habitables face à la gare du village, aujourd'hui occupé par l'association
  Risomes (café associatif, brasserie, activités). L'existence et la date de
  création de cette société sont documentées par un reportage de Reporterre ;
  **elle n'a pas été identifiée dans le répertoire national des entreprises
  sous ce nom** lors d'une recherche conduite le 2026-11-08 (possible
  changement de dénomination, dissolution, ou appellation informelle dans
  l'article) — SIREN non confirmé, statuts non publiés.
montage:
  type: demembrement
  description: >
    La SCI détient la nue-propriété du bâtiment et en confie l'usage, par un
    titre non documenté par les sources consultées, à l'association Risomes,
    qui y développe un café associatif, une brasserie artisanale et des
    activités d'éducation populaire. Le régime des parts de la SCI (associés,
    cessibilité, valeur) n'est pas documenté.
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Société civile créée par les futurs usager·es du lieu — proche dans son
    intention d'un commun citoyen — mais sans statuts publiés ni identification
    au registre confirmée par cette passe : l'appréciation reste provisoire.
