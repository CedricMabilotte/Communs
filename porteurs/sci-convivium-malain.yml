fiabilite: >
  Faits vérifiés (source Reporterre, consultée le 2026-11-08) : création en
  2015 par les futurs habitant·es, acquisition d'un bâtiment d'environ 800 m²
  habitables à Mâlain. Non confirmé : SIREN, statuts, régime des parts, titre
  liant la SCI à l'association Risomes. Recherche menée le 2026-11-08 sur
  recherche-entreprises.api.gouv.fr (requête « Convivium », code postal 21410)
  sans résultat correspondant — à retenter ou à vérifier directement auprès du
  collectif.
