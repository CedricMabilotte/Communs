uid: fonds-sdh
categorie: porteur
nom: "Fonds de dotation SDH"
sous_titre: "Fonds de dotation portant le foncier de l'écosystème TERA en Lot-et-Garonne"
statut_fiche: publie
forme_juridique: "Fonds de dotation (loi du 4 août 2008)"
localisation:
  commune: "Masquières / Tournon-d'Agenais"
  departement: "Lot-et-Garonne (47)"
  region: "Nouvelle-Aquitaine"
annee: null
url: "https://sdh-lefonds.org/"
resume: >
  Le fonds de dotation « Solidarité pour un Développement Humain » (SDH) est la
  structure foncière sur laquelle s'appuie l'écosystème coopératif TERA depuis
  ses débuts en Lot-et-Garonne. Sa mission affichée est de préserver, renouveler
  et transmettre aux générations futures un milieu naturel propice à la vie, et
  d'en garantir l'accès, notamment aux habitant·es les plus vulnérables des
  zones de revitalisation rurale. SDH détient la majorité des parts sociales de
  la SCI Le Tilleul, société civile immobilière qui possède la ferme de Lartel à
  Masquières et les terres de Lustrac à Trentels ; la SCI lui a été transmise en
  2017. Le fonds sert aussi d'intermédiaire pour les dons destinés aux
  associations membres du projet et a été labellisé « 1 % pour la planète »
  depuis décembre 2023.
montage:
  type: propriete_collective
  description: >
    Le foncier de TERA n'est pas détenu directement par le fonds : il appartient
    à la SCI Le Tilleul, dont le fonds de dotation SDH détient la majorité des
    parts sociales depuis 2017. SDH est donc un porteur indirect, propriétaire
    majoritaire de la société civile qui possède la ferme de Lartel et les
    terres de Lustrac. La SCI loue ces biens aux structures d'usage du projet.
    Le montage est une propriété collective dont le maillon dominant est un
    fonds de dotation non lucratif, mais qui transite par une société civile à
    usage locatif.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Fonds de dotation non lucratif, mais propriétaire majoritaire d'une société
    civile immobilière à usage locatif ; gouvernance portée par les instances du
    fonds et non directement par les usager·es du lieu.
