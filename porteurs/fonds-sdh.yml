  leviers:
    - "Documenter publiquement les statuts, la gouvernance et les comptes du fonds."
    - "Renforcer le verrouillage de la SCI au sein du fonds."
    - "Préciser le régime de location et la durée des titres d'usage accordés."
  synthese: >
    Le fonds de dotation SDH est un porteur foncier non lucratif à objet
    protecteur clair, qui pilote l'écosystème TERA via la détention majoritaire
    d'une SCI. Sa solidité gagnerait à un verrouillage complet de la société
    civile et à la publication de sa gouvernance et de ses comptes.
fiabilite: >
  Faits vérifiés (sources SDH-lefonds.org, wiki TERA et presse, consultées en
  mai 2026) : fonds de dotation « Solidarité pour un Développement Humain », rôle
  de structure foncière de l'écosystème TERA, détention majoritaire des parts de
  la SCI Le Tilleul transmise au fonds en 2017, SCI propriétaire de la ferme de
  Lartel (Masquières) et des terres de Lustrac (Trentels), mission de
  préservation d'un milieu naturel, label « 1 % pour la planète » depuis
  décembre 2023. Non confirmé : année de création du fonds, composition de sa
  gouvernance, clause de dévolution, publication des comptes, régime des loyers.
