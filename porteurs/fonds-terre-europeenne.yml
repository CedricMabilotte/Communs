uid: fonds-terre-europeenne
categorie: porteur
nom: "Fonds de Terre Européenne"
sous_titre: "Fondation de droit suisse détenant les terres de Longo Maï"
statut_fiche: publie
forme_juridique: "Fondation de droit suisse"
nature_interet: non_lucrative
localisation: null
annee: null
url: "https://www.prolongomaif.ch/"
resume: >
  Fondation de droit suisse qui regroupe et détient collectivement et de façon
  inaliénable les terres des coopératives Longo Maï, afin de les soustraire à la
  spéculation. Elle constitue le porteur de propriété du réseau des coopératives
  autogérées, dont l'usage des terres est assuré par les collectifs eux-mêmes.
montage:
  type: propriete_protegee
  description: >
    Les terres des coopératives Longo Maï sont transférées à la fondation, qui en
    assure une propriété explicitement inaliénable. L'usage est confié aux
    coopératives autogérées. Le démembrement nue-propriété/usufruit au sens du
    droit français n'est pas en cause : il s'agit d'une propriété sanctuarisée en
    fondation.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Fondation non lucrative assurant une détention inaliénable du foncier, mais
    relevant du droit suisse et non du droit français.
grille:
  - critere: forme_non_lucrative
    valeur: oui
    note: "Le Fonds de Terre Européenne est une fondation, forme structurellement non lucrative."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Une fondation n'a pas de capital social appropriable : aucune rémunération du capital, ni dividende, ni plus-value distribuée."
  - critere: agrement_ig
    valeur: partiel
    note: "La fondation poursuit une finalité d'intérêt général, mais aucune reconnaissance au regard du droit français n'est documentée."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet est explicitement de regrouper et détenir les terres de façon inaliénable, à l'abri de la spéculation."
  - critere: gestion_desinteressee
    valeur: oui
    note: "Une fondation suppose une gestion désintéressée au service de sa mission."
  - critere: inalienabilite
    valeur: oui
    note: "La fondation détient les terres de façon explicitement inaliénable."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Une fondation n'a ni capital social ni parts : il n'existe aucun titre appropriable, donc aucune captation possible de la valeur foncière."
  - critere: nature_protectrice
    valeur: oui
    note: "Une fondation se situe en haut de l'échelle de protection foncière."
  - critere: clause_devolution
    valeur: inconnu
    note: "Le sort de l'actif en cas de dissolution n'est pas documenté par les sources consultées."
  - critere: independance_rendement
    valeur: oui
    note: "Une fondation ne dépend d'aucun investisseur attendant une plus-value sur le foncier."
  - critere: ca_collegial
    valeur: inconnu
    note: "La composition des instances de la fondation n'est pas documentée par les sources consultées."
  - critere: parties_prenantes
    valeur: partiel
    note: "La fondation porte le foncier de coopératives autogérées, mais l'articulation formelle avec leur gouvernance n'est pas documentée."
  - critere: autogestion_usagers
    valeur: non
    note: "Fondation de droit suisse dont les instances décident du sort du foncier ; même si les coopératives Longo Maï sont autogérées dans leur usage, aucun dispositif statutaire ne leur confère de voix délibérative au sein de la fondation sur les conditions d'usage, loyers ou transmission du foncier porté."
  - critere: transparence
    valeur: partiel
    note: "L'existence et la mission de la fondation sont publiques, mais la publication régulière de comptes n'est pas confirmée."
  - critere: risque_requalification
    valeur: inconnu
    note: "La fondation relève du droit suisse ; son exposition à un risque de requalification fiscale au regard du droit français n'est pas documentée."
  - critere: regime_usage_offert
    valeur: partiel
    note: "La fondation soustrait les terres à la spéculation et en confie l'usage aux coopératives autogérées de Longo Maï, hors logique de rendement ; les conditions financières précises de cet usage ne sont pas documentées."
  - critere: securite_usage_offerte
    valeur: inconnu
    note: "L'usage des terres est assuré durablement par les coopératives elles-mêmes, mais la nature et la durée des titres d'usage formalisés ne sont pas documentées par les sources."
  - critere: redevabilite_publique
    valeur: partiel
    note: "L'existence et la mission de la fondation sont publiques, mais la reddition de comptes régulière n'est pas confirmée."
  - critere: vivant_finalite
    valeur: non
    note: "L'objet de la fondation est de détenir les terres de façon inaliénable au profit des coopératives autogérées de Longo Maï ; aucune finalité de préservation de la biodiversité n'est affichée."
analyse:
  forces:
    - "Détention explicitement inaliénable des terres : verrou foncier fort."
    - "Objet statutaire de protection foncière clair."
    - "Forme de fondation, protectrice par nature."
  fragilites:
    - "Relève du droit suisse et non du droit français."
    - "Gouvernance et clause de dévolution non documentées."
    - "Transparence des comptes non confirmée."
  leviers:
    - "Documenter publiquement la gouvernance et le sort de l'actif en cas de dissolution."
    - "Formaliser l'articulation avec les coopératives usagères."
    - "Publier régulièrement les comptes de la fondation."
  synthese: >
    Le Fonds de Terre Européenne assure une sanctuarisation foncière solide pour
    Longo Maï grâce à une détention inaliénable. Sa singularité tient au recours
    au droit suisse et à une gouvernance peu documentée.
fiabilite: >
  Faits vérifiés : statut de fondation de droit suisse, mission de regroupement et
  détention inaliénable des terres de Longo Maï, finalité de soustraction à la
  spéculation. Non confirmé : composition de la gouvernance, clause de dévolution,
  publication des comptes.
