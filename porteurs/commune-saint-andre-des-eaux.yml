nom: "Commune de Saint-André-des-Eaux (Côtes-d'Armor)"
sous_titre: "Commune propriétaire du terrain du hameau léger du Placis, confié par bail emphytéotique de 80 ans"
statut_fiche: publie
forme_juridique: "Collectivité territoriale (commune)"
nature_interet: non_lucrative
