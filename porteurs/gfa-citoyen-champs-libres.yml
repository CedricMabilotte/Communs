resume: >
  Groupement foncier agricole créé en juillet 2015 par les futurs habitant·es du
  tiers-lieu de Mâlain (Côte-d'Or), pour acquérir 3 hectares de terres agricoles
  face à la gare du village. La collecte citoyenne a réuni 36 000 euros auprès de
  103 personnes ; cinq cogérant·es sont élu·es pour administrer le groupement.
  Le GFA loue une partie de ses terres — environ 2 hectares — à un paysan-
  boulanger installé depuis 2016, et met à disposition d'autres parcelles pour du
  maraîchage. C'est un GFA bailleur de type citoyen/mutuel : capital ouvert à des
  personnes physiques, sans vocation spéculative affichée, mais sans clause de
  verrouillage statutaire documentée par les sources consultées.
montage:
  type: demembrement
  description: >
    Le GFA, société civile, détient la nue-propriété des 3 hectares et les loue
    par bail rural aux exploitant·es en place (paysan-boulanger, maraîcher·e).
    La collecte citoyenne de 2015 (103 souscripteur·ices, 36 000 euros) et
    l'élection de cinq cogérant·es indiquent une gouvernance ouverte aux
    personnes ayant apporté des parts ; le régime exact des parts (valeur
    nominale, cessibilité, plafond par souscripteur·ice) n'est pas documenté par
    les sources consultées.
integrite_montage:
