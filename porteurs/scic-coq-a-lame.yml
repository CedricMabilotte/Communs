uid: scic-coq-a-lame
categorie: porteur
nom: "SCIC de l'Oasis du Coq à l'Âme"
sous_titre: "Société coopérative propriétaire du domaine d'Echoisy en Charente"
statut_fiche: publie
forme_juridique: "Société coopérative d'intérêt collectif (SCIC)"
localisation:
  commune: "Cellettes"
  departement: "Charente (16)"
  region: "Nouvelle-Aquitaine"
annee: 2021
url: "https://oasis-ducoqalame.fr/"
resume: >
  La SCIC de l'Oasis du Coq à l'Âme est la société coopérative d'intérêt
  collectif qui détient la propriété du domaine d'Echoisy, ancien hameau de la
  commune de Cellettes, en Charente. Le domaine, comprenant plusieurs bâtiments
  et 26 hectares de terres, a été acquis pour près de 800 000 euros : les
  membres ont mis leur épargne en commun et prêté à la SCIC des sommes allant de
  500 à 200 000 euros par personne, inscrites en comptes courants d'associés
  destinés à être remboursés sur vingt-cinq ans grâce au développement des
  activités économiques du site. La SCIC porte le foncier et l'inscrit dans le
  champ de l'économie sociale et solidaire ; elle confie l'usage du domaine à
  l'association des habitant·es par un bail emphytéotique.
montage:
  type: propriete_collective
  description: >
    La SCIC de l'Oasis du Coq à l'Âme est propriétaire du domaine d'Echoisy.
    L'achat — près de 800 000 euros pour les bâtiments et 26 hectares — a été
    financé par les apports des membres en comptes courants d'associés,
    remboursables sur vingt-cinq ans. La SCIC est une société coopérative à
    lucrativité encadrée par le statut de l'économie sociale et solidaire ; elle
    confie l'usage du domaine à l'association des habitant·es du domaine
    d'Echoisy par un bail emphytéotique, dissociant ainsi la propriété coopérative
    de l'usage associatif.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Société coopérative d'intérêt collectif : forme sociétaire à lucrativité
    encadrée par le statut de l'économie sociale et solidaire, dont le
    sociétariat réunit les membres du projet.
grille:
  - critere: inalienabilite
    valeur: partiel
    note: "Le foncier est porté par une SCIC dédiée au projet ; aucune clause d'inaliénabilité statutaire explicite n'est documentée par les sources."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Les parts d'une SCIC ne sont pas librement négociables et la valeur nominale est encadrée par le statut coopératif ; les modalités de cession propres à cette SCIC ne sont pas documentées."
  - critere: nature_protectrice
    valeur: partiel
    note: "La SCIC est une société coopérative non spéculative, mais reste une société de forme commerciale, en dessous de la fondation et du fonds de dotation sur l'échelle de protection."
  - critere: clause_devolution
    valeur: partiel
    note: "Le statut SCIC impose des réserves impartageables, mais la clause de dévolution propre à cette société n'est pas documentée par les sources."
  - critere: forme_non_lucrative
    valeur: partiel
    note: "La SCIC relève de l'économie sociale et solidaire à lucrativité encadrée ; elle reste une société commerciale et non une structure structurellement non lucrative."
  - critere: non_lucrativite_effective
    valeur: partiel
    note: "Les apports des membres sont inscrits en comptes courants d'associés remboursables ; le statut SCIC encadre la rémunération du capital sans l'interdire totalement."
  - critere: gestion_desinteressee
    valeur: partiel
    note: "Le projet revendique un fonctionnement solidaire fondé sur un principe de « valorimètre » ; le caractère bénévole de la direction n'est pas documenté."
  - critere: independance_rendement
    valeur: partiel
    note: "Les apports proviennent de l'épargne des membres et non d'investisseurs en rendement, mais sont remboursables sur vingt-cinq ans via les activités économiques du site."
  - critere: ca_collegial
    valeur: inconnu
    note: "La composition de l'organe de direction de la SCIC n'est pas documentée par les sources consultées."
  - critere: parties_prenantes
    valeur: partiel
    note: "La SCIC associe par nature plusieurs collèges de sociétaires ; le détail de ses collèges et leur ouverture ne sont pas documentés par les sources."
  - critere: transparence
    valeur: partiel
    note: "Le projet publie son modèle juridique et son règlement intérieur en ligne ; la publication régulière des comptes de la SCIC n'est pas confirmée."
  - critere: objet_foncier_protecteur
    valeur: partiel
    note: "La SCIC porte le foncier du projet dans le champ de l'ESS ; un objet statutaire explicite de protection foncière n'est pas documenté par les sources."
  - critere: agrement_ig
    valeur: oui
    note: "L'écosystème du Coq à l'Âme comporte une association reconnue d'intérêt général ; ce statut est un tag informatif, non un gage de libération."
  - critere: risque_requalification
    valeur: inconnu
    note: "L'exposition de la SCIC à un risque de requalification fiscale n'est pas documentée par les sources consultées."
  - critere: redevabilite_publique
    valeur: partiel
    note: "Le projet documente publiquement son montage et ses règles de vie ; une reddition de comptes formelle au-delà des sociétaires n'est pas documentée."
  - critere: regime_usage_offert
    valeur: partiel
    note: "La SCIC confie l'usage du domaine à l'association des habitant·es par bail emphytéotique ; le montant de la redevance n'est pas documenté par les sources."
  - critere: securite_usage_offerte
    valeur: oui
    note: "La SCIC accorde à l'association des habitant·es un bail emphytéotique, titre d'usage long pouvant courir jusqu'à 99 ans."
analyse:
  forces:
    - "Foncier porté par une coopérative dédiée, hors propriété privée individuelle."
    - "Achat financé par l'épargne mise en commun des membres, sans endettement spéculatif."
    - "Usage confié par bail emphytéotique : titre d'usage long et sécurisé."
  fragilites:
    - "Forme sociétaire commerciale : la non-lucrativité dépend du maintien du statut SCIC."
    - "Apports remboursables sur vingt-cinq ans : le foncier porte une dette de long terme."
    - "Clause de dévolution, gouvernance et comptes non documentés."
  leviers:
    - "Inscrire dans les statuts une clause d'inaliénabilité et un objet foncier explicites."
    - "Documenter publiquement la gouvernance, les collèges et les comptes de la SCIC."
    - "Sécuriser le remboursement des apports sans fragiliser le foncier."
  synthese: >
    La SCIC de l'Oasis du Coq à l'Âme porte le foncier d'un écolieu charentais
    par une coopérative non spéculative et le confie en bail emphytéotique. Sa
    forme sociétaire et la dette de long terme adossée au foncier appellent un
    verrouillage statutaire pour consolider la sortie du marché.
fiabilite: >
  Faits vérifiés (sources oasis-ducoqalame.fr, Coopérative Oasis et presse,
  consultées en mai 2026) : SCIC propriétaire du domaine d'Echoisy à Cellettes
  (Charente), domaine acquis pour près de 800 000 euros avec 26 hectares de
  terres, achat financé par les apports des membres en comptes courants
  d'associés remboursables sur vingt-cinq ans, usage confié à l'association des
  habitant·es par bail emphytéotique, installation du collectif en 2021. Non
  confirmé : année de constitution exacte de la SCIC, composition de sa
  gouvernance, clause de dévolution, montant de la redevance emphytéotique,
  publication des comptes.
