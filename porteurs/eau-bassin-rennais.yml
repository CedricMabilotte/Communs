uid: eau-bassin-rennais
categorie: porteur
nom: "Collectivité Eau du Bassin Rennais"
sous_titre: "Syndicat mixte d'agglomération acquéreur du foncier des aires de captage"
statut_fiche: publie
forme_juridique: "Syndicat mixte fermé (collectivité publique)"
nature_interet: non_lucrative
localisation:
  region: "Bretagne"
  departement: "Ille-et-Vilaine (35)"
  commune: "Rennes"
annee: 2015
url: "https://www.eaudubassinrennais-collectivite.fr/"
resume: >
  La Collectivité Eau du Bassin Rennais (CEBR) est le syndicat mixte autorité
  organisatrice du service public d'eau potable sur 75 communes de
  l'agglomération rennaise, pour environ 560 000 habitant·es. Issue au 1er
  janvier 2015 de la transformation du Syndicat Mixte de Production d'eau
  potable du Bassin Rennais (SMPBR, créé en 1992), elle regroupe Rennes
  Métropole et six communautés de communes périphériques (Montfort
  Communauté, St-Méen Montauban, Brocéliande, Vallons de Haute-Bretagne,
  Val d'Ille-Aubigné). Depuis des décennies, la collectivité mène une
  politique d'acquisition foncière à l'amiable sur les aires d'alimentation
  des captages pour protéger durablement la ressource en eau : elle détient
  aujourd'hui environ 708 hectares en amont de ses captages (dont 189 ha
  d'eau, soit ≈ 518 ha de terres émergées), aménagés en boisements, haies,
  mares ou remis à des exploitant·es agricoles par bail rural à clauses
  environnementales (BRCE). Le foncier reste propriété publique ;
  l'organisation des débouchés agricoles est confiée à la SCIC Terres de
  Sources créée en 2022. La politique d'acquisition foncière de la CEBR a
  reçu le prix national du génie écologique en 2014 pour le captage de la
  Chèze-Canut.
montage:
  type: propriete_publique
  description: >
    La CEBR acquiert directement le foncier sur les aires d'alimentation de
    captage par voie amiable (sans recours à la préemption ou à
    l'expropriation systématique), ce qui inscrit la terre dans le
    patrimoine d'une personne morale de droit public soustraite au marché.
    Les parcelles sont soit aménagées et gérées par la collectivité
    elle-même (boisements, haies bocagères, mares), soit remises à des
    exploitant·es agricoles par bail rural à clauses environnementales
    (BRCE) — bail rural classique assorti de clauses opposables imposant
    des pratiques protectrices de l'eau (couvert végétal, agroforesterie,
    interdiction de phytosanitaires, etc.), en contrepartie d'un fermage
    réduit (de l'ordre d'un quart du fermage classique). Les débouchés
    agricoles des fermes engagées sont organisés par la SCIC Terres de
    Sources (créée le 24 février 2022 dans le prolongement du programme
    Terres de Sources lancé en 2015 par EBR) via les marchés publics de
    restauration collective.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Personne morale de droit public à compétence eau potable, sans capital
    appropriable ni actionnariat. Le foncier acquis relève du patrimoine
    public, fortement protégé contre la revente. Le couplage avec la SCIC
    Terres de Sources institutionnalise le débouché agricole sans toucher
    à la propriété publique du sol.
grille:
  - critere: forme_non_lucrative
    valeur: oui
    note: "Syndicat mixte fermé, personne morale de droit public sans actionnariat ni dividende."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Aucun capital social appropriable, aucune rémunération du capital, aucune plus-value foncière distribuable."
  - critere: agrement_ig
    valeur: oui
    note: "La compétence eau potable d'un syndicat mixte est une mission de service public d'intérêt général au sens du Code général des collectivités territoriales."
  - critere: objet_foncier_protecteur
    valeur: partiel
    note: "L'objet statutaire principal est la production et la distribution d'eau potable ; l'acquisition foncière est une compétence opérationnelle d'appui (protection qualitative de la ressource) reconnue dans les statuts mais pas la finalité première."
  - critere: gestion_desinteressee
    valeur: oui
    note: "Personne publique régie par le droit public, ne fonctionne pas au profit d'un cercle restreint de personnes."
  - critere: inalienabilite
    valeur: partiel
    note: "Le foncier acquis relève d'une propriété publique fortement protégée contre la revente, mais aucun statut formel d'inaliénabilité (domanialité publique au sens du CG3P, dotation non consomptible) n'est documenté par les sources : il s'agit de biens du domaine privé d'une personne publique, dont l'aliénation reste juridiquement possible sous délibération de l'assemblée."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Personne publique sans capital social : aucune part ne porte la valeur foncière des terres acquises."
  - critere: nature_protectrice
    valeur: oui
    note: "Une personne publique se situe au sommet de l'échelle de protection foncière, sous réserve de l'inscription explicite des biens au domaine public."
  - critere: clause_devolution
    valeur: oui
    note: "Les biens d'un syndicat mixte ne peuvent retourner dans un patrimoine privé : en cas de dissolution, ils sont dévolus aux collectivités membres selon le droit public."
  - critere: independance_rendement
    valeur: oui
    note: "Personne publique financée par la redevance d'eau et des subventions, sans investisseurs attendant une plus-value sur le foncier."
  - critere: ca_collegial
    valeur: oui
    note: "Le comité syndical réunit 46 délégué·es désigné·es par les sept structures membres (Rennes Métropole + 6 communautés de communes), assurant un fonctionnement collégial entre les EPCI du bassin."
  - critere: parties_prenantes
    valeur: partiel
    note: "Les élu·es des EPCI membres siègent au comité syndical ; les usager·es de l'eau et les exploitant·es agricoles preneur·euses ne participent pas directement à la gouvernance du syndicat (ils sont représenté·es à la SCIC Terres de Sources, qui organise les débouchés mais ne gouverne pas le foncier)."
  - critere: autogestion_usagers
    valeur: non
    note: "Personne publique dont les décisions structurantes (acquisitions, mise à disposition, clauses contractuelles des BRCE, politique foncière) relèvent du comité syndical à composition élective indirecte ; aucun dispositif statutaire n'accorde aux usager·es de l'eau ou aux exploitant·es-preneur·euses une voix délibérative sur le foncier qu'ils cultivent. Gouvernance institutionnelle descendante, par défaut « non » pour une personne publique."
  - critere: transparence
    valeur: oui
    note: "Délibérations publiées sur la plateforme open data Mégalis Bretagne ; rapports annuels, budgets et politique foncière documentés sur le site officiel ; rapport public de la Cour des comptes (chambre régionale Bretagne) sur la CEBR rendu en 2023."
  - critere: risque_requalification
    valeur: oui
    note: "Personne publique de droit public investie par la loi d'une mission de service public d'eau potable : pas de risque de requalification fiscale."
  - critere: redevabilite_publique
    valeur: oui
    note: "Soumise au contrôle de légalité préfectoral et au contrôle de la chambre régionale des comptes (rapport 2023 publié) ; rend compte publiquement de son activité et de son budget."
  - critere: regime_usage_offert
    valeur: partiel
    note: "Le foncier acquis est remis aux exploitant·es agricoles par BRCE assorti d'un fermage réduit (de l'ordre du quart du fermage classique selon les sources), donc hors logique de revenu locatif de marché ; le détail des conditions financières par parcelle n'est pas publié."
  - critere: securite_usage_offerte
    valeur: oui
    note: "Le bail rural assure une jouissance d'au moins neuf ans avec un droit au renouvellement d'ordre public ; les clauses environnementales sont opposables. La sécurité d'usage relève du régime du bail rural classique, renforcée par les clauses."
  - critere: vivant_finalite
    valeur: partiel
    note: "La finalité centrale est la protection qualitative de la ressource en eau potable ; l'aménagement des parcelles non agricoles en boisements, haies bocagères et mares porte une action concrète favorable au vivant non-humain, sans que la biodiversité en soit la finalité statutaire centrale."
analyse:
  forces:
    - "Acquisition foncière publique amiable par une personne morale pérenne, soustraite au marché."
    - "Patrimoine foncier substantiel (≈ 708 ha dont ≈ 518 ha de terres émergées) en amont des captages."
    - "Articulation systématique avec un BRCE à fermage réduit, qui inscrit la protection dans le droit du lieu."
    - "Reconnaissance institutionnelle (prix national du génie écologique 2014, rapport CRC favorable)."
    - "Couplage opérationnel avec la SCIC Terres de Sources, qui sécurise les débouchés."
  fragilites:
    - "Le foncier acquis relève du domaine privé de la personne publique : aliénation juridiquement possible sous délibération."
    - "Compétence foncière secondaire dans les statuts (production/distribution d'eau au premier plan)."
    - "Gouvernance institutionnelle descendante : les exploitant·es-preneur·euses et usager·es ne participent pas à la décision foncière."
    - "Modèle adossé à une politique publique locale volontariste, difficilement reproductible sans concertation avec les EPCI membres."
  leviers:
    - "Inscrire explicitement le patrimoine de protection foncière dans une logique d'irréversibilité (délibération de classement, convention de gestion avec un conservatoire, etc.)."
    - "Documenter publiquement la liste des parcelles, leur statut juridique précis et le contenu type des clauses des BRCE."
    - "Associer plus formellement les exploitant·es preneur·euses et les communes-membres concernées à la gouvernance des opérations foncières."
    - "Capitaliser l'expérience comme référence de foncière publique de l'eau pour d'autres bassins versants."
  synthese: >
    Eau du Bassin Rennais incarne la voie publique de la libération des terres
    par le service public d'eau potable : une collectivité gestionnaire de la
    ressource acquiert le foncier à l'amiable sur les aires de captage et le
    soustrait durablement au marché agricole intensif et spéculatif. Le
    montage est solide sur la propriété et sur la finalité (protection
    qualitative de l'eau, accueil opérationnel du vivant non-humain), mais
    sa nature reste celle d'une personne publique au foncier juridiquement
    aliénable, sous gouvernance institutionnelle des EPCI membres.
fiabilite: >
  Faits vérifiés (sources Eau du Bassin Rennais, annuaire-entreprises.data.gouv.fr,
  Cour des comptes — chambre régionale Bretagne, La Gazette des Communes,
  La Relève et la Peste, consultées en mai 2026) : transformation du SMPBR
  (créé en 1992) en Collectivité Eau du Bassin Rennais au 1er janvier 2015
  par arrêté préfectoral du 29 décembre 2014, suite à la loi MAPTAM ;
  syndicat mixte fermé regroupant Rennes Métropole et 6 communautés de
  communes (Montfort Communauté, St-Méen Montauban, Brocéliande, Vallons de
  Haute-Bretagne, Val d'Ille-Aubigné) ; 75 communes membres et environ
  559 900 habitant·es desservi·es (chiffres 2022-2025) ; comité syndical de
  46 délégué·es ; SIREN 253502629 ; siège statutaire 2 rue de la Mabilais,
  Rennes ; politique d'acquisition foncière amiable de longue date sur les
  aires de captage ; environ 708 hectares détenus en amont des captages
  (dont 189 ha d'eau, soit ≈ 518 ha de terres émergées) ; remise par BRCE
  avec fermage réduit (≈ 1/4 du fermage classique) ; prix national du génie
  écologique 2014 pour le captage de la Chèze-Canut ; création de la SCIC
  Terres de Sources le 24 février 2022. Non confirmé : statut formel
  d'inaliénabilité des parcelles de protection (domanialité publique ou
  simple domaine privé de la personne publique), contenu type des clauses
  des BRCE, surface foncière à jour la plus récente, montant exact du
  fermage moyen.
