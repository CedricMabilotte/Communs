analyse:
  forces:
    - "Sociétariat multiple associant habitant·es, collectivités et investisseur·ses solidaires."
    - "Foncier acquis par capital coopératif et épargne solidaire, hors logique spéculative."
    - "Reconnaissance ESUS attestant l'utilité sociale du projet."
  fragilites:
    - "Forme sociétaire SCIC : pas de dotation inaliénable, protection foncière intermédiaire."
    - "Absence de clause d'inaliénabilité et de dévolution documentée."
    - "Convention d'usage avec la coopérative d'habitants non documentée publiquement."
  leviers:
    - "Documenter et, le cas échéant, inscrire une clause d'inaliénabilité du foncier."
    - "Publier les statuts, les comptes et la clause de dévolution."
    - "Formaliser et publier le titre d'usage liant la SCIC à la coopérative d'habitants."
  synthese: >
    La SCIC Écovillage de Keruzerh est un porteur de type mutualiste : une
    coopérative d'intérêt collectif qui a acquis le hameau par capital
    coopératif et épargne solidaire. Sa solidité tient à son sociétariat
    pluraliste et à sa reconnaissance ESUS ; sa marge de progression, à
    l'absence de verrou d'inaliénabilité et à la non-publication de la
    convention d'usage.
fiabilite: >
  Faits vérifiés (sources Demain en main, Coopérative Oasis et presse régionale,
  consultées en mai 2026) : SCIC constituée début 2021, propriétaire du hameau
  de Keruzerh à Locoal-Mendon depuis le début 2021, foncier d'une vingtaine
  d'hectares dont une dizaine de terres agricoles, reconnaissance ESUS, soutien
  de la Coopérative Oasis (apport de 100 000 € en 2020 puis 125 000 € en 2024),
  coopérative d'habitants louant les logements à la SCIC. Non confirmé : clause
  d'inaliénabilité, clause de dévolution, montant du loyer, durée du titre
  d'usage, publication des comptes.
