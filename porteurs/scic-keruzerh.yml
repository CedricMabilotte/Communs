resume: >
  Société coopérative d'intérêt collectif constituée début 2021 par le collectif
  Demain en main pour acquérir et porter le hameau de Keruzerh, à Locoal-Mendon
  dans le Morbihan : une vingtaine d'hectares dont une dizaine de terres
  agricoles, le reste en forêt, et un ancien hameau de bâtiments. La SCIC achète
  la propriété et en gère le patrimoine ; elle réunit habitant·es, salarié·es,
  collectivités et investisseur·ses solidaires, et a été reconnue Entreprise
  solidaire d'utilité sociale (ESUS). Le foncier appartient à la SCIC depuis le
  début de 2021. La Coopérative Oasis a soutenu l'acquisition par un apport
  financier (100 000 € en 2020 sur 7 ans, puis 125 000 € en 2024 sur 10 ans).
montage:
  type: propriete_collective
  description: >
    La SCIC Écovillage de Keruzerh détient en pleine propriété le foncier et le
    bâti du hameau. Une coopérative d'habitants distincte loue les logements à
    la SCIC ; une SCOP agricole encadre la production maraîchère et l'accueil.
    Le foncier est porté par une société commerciale de forme coopérative dont
    les statuts SCIC encadrent la lucrativité, sans qu'une clause
    d'inaliénabilité du foncier soit documentée par les sources.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Société coopérative d'intérêt collectif : forme sociétaire à lucrativité
    encadrée, sociétariat multiple incluant habitant·es, collectivités et
    investisseur·ses solidaires.
