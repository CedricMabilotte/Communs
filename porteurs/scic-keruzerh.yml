nom: "SCIC Écovillage de Keruzerh"
sous_titre: "Coopérative d'intérêt collectif propriétaire du hameau de l'écovillage Demain en main"
statut_fiche: publie
forme_juridique: "Société coopérative d'intérêt collectif (SCIC)"
