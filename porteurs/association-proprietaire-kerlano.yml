nom: "Association propriétaire de Kerlano (en cours de constitution)"
sous_titre: "Maillon propriétaire pressenti du montage de propriété d'usage CLIP de Kerlano, à Rosnoën — bascule en cours"
statut_fiche: publie
forme_juridique: "Association loi 1901 (propriétaire CLIP — en cours de constitution)"
nature_interet: non_lucrative
localisation:
  commune: "Rosnoën"
  departement: "Finistère (29)"
  region: "Bretagne"
