uid: fonds-fraternite-pour-demain
categorie: porteur
nom: "Fonds de dotation Fraternité pour Demain"
sous_titre: "Fonds de dotation qui sanctuarise le foncier des oasis hors marché"
statut_fiche: publie
forme_juridique: "Fonds de dotation (loi du 4 août 2008)"
localisation:
  commune: null
  departement: null
  region: "France"
annee: 2021
url: "https://fraternitepourdemain.org/"
resume: >
  Fonds de dotation créé en 2021 par une famille de professionnel·les de
  l'immobilier, avec pour objet de faciliter l'accès au foncier des
  porteur·ses de projets d'écolieux — les « oasis ». Son action centrale est
  la sanctuarisation : il acquiert, par dons et collectes, des biens fonciers
  partagés pour en garantir durablement l'usage, en dissociant la propriété de
  l'usage et en soustrayant ces biens à la logique marchande et successorale.
  La propriété ainsi sanctuarisée est conservée par le fonds ; l'usage est
  confié à des collectifs chargés d'en prendre soin. Le fonds porte notamment
  le foncier du Château de la Mhotte (Allier) et de l'Aube (Drôme), deux
  écolieux du réseau de la Coopérative Oasis.
montage:
  type: propriete_sanctuarisee
  description: >
    Le fonds de dotation acquiert la pleine propriété de biens fonciers par
    dons et collectes solidaires, et la conserve durablement hors marché. Il
    en confie l'usage à des collectifs usagers par des baux de long terme
    (bail emphytéotique de 99 ans) ou des conventions de gestion. Le montage
    dissocie la propriété sanctuarisée, portée par le fonds, et l'usage
    autogéré confié aux collectifs ; ce n'est pas un démembrement civil mais
    une propriété sanctuarisée doublée d'un titre d'usage long.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Fonds de dotation de droit privé non lucratif, à objet explicite de
    sanctuarisation foncière ; gouvernance portée par un conseil
    d'administration, dont la composition n'est pas documentée par les
    sources publiques.
grille:
  - critere: inalienabilite
    valeur: partiel
    note: "Le fonds a pour objet de sanctuariser durablement le foncier qu'il porte ; le caractère consomptible ou non de sa dotation n'est pas confirmé par les sources publiques."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Un fonds de dotation n'a ni capital ni parts sociales appropriables : aucun titre ne porte la valeur du foncier."
  - critere: nature_protectrice
    valeur: partiel
    note: "Fonds de dotation : forme non lucrative protectrice, mais en deçà de la fondation reconnue d'utilité publique et de la personne publique sur l'échelle de protection."
  - critere: clause_devolution
    valeur: inconnu
    note: "La clause de dévolution de l'actif du fonds en cas de dissolution n'est pas documentée par les sources consultées."
  - critere: forme_non_lucrative
    valeur: oui
    note: "Le fonds de dotation est une forme structurellement non lucrative, instituée par la loi du 4 août 2008."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Le fonds ne rémunère aucun capital : il acquiert le foncier par dons et collectes, sans dividende ni plus-value distribuée."
  - critere: gestion_desinteressee
    valeur: inconnu
    note: "Le caractère bénévole ou la rémunération encadrée des dirigeant·es du fonds n'est pas documenté par les sources."
  - critere: independance_rendement
    valeur: oui
    note: "Le foncier est acquis par dons, hors logique d'investisseurs attendant un rendement ou une plus-value."
  - critere: ca_collegial
    valeur: inconnu
    note: "La composition et le caractère collégial du conseil d'administration du fonds ne sont pas documentés par les sources publiques."
  - critere: parties_prenantes
    valeur: partiel
    note: "Le fonds confie l'usage à des collectifs usagers et travaille en lien avec la Coopérative Oasis ; la représentation formelle des parties prenantes dans ses instances n'est pas documentée."
  - critere: transparence
    valeur: partiel
    note: "Le fonds publie ses projets de sanctuarisation et ses collectes ; la publication régulière de ses comptes n'est pas documentée par les sources."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet du fonds est explicitement de sanctuariser le foncier partagé et de le soustraire à la logique marchande et successorale."
  - critere: agrement_ig
    valeur: oui
    note: "Le fonds de dotation relève par sa forme du régime fiscal de l'intérêt général ; tag informatif, non un gage de libération."
  - critere: risque_requalification
    valeur: inconnu
    note: "L'exposition du fonds à un risque de requalification fiscale n'est pas documentée par les sources."
  - critere: redevabilite_publique
    valeur: partiel
    note: "Le fonds rend compte publiquement de ses projets de sanctuarisation ; une reddition de comptes complète au-delà de ses donateur·rices n'est pas documentée."
  - critere: regime_usage_offert
    valeur: partiel
    note: "Le fonds confie l'usage de ses fonciers à des collectifs par bail emphytéotique ou convention ; le caractère non rentier de la redevance demandée n'est pas documenté par les sources."
  - critere: securite_usage_offerte
    valeur: oui
    note: "Le fonds accorde des titres d'usage longs — bail emphytéotique de 99 ans au Château de la Mhotte — assurant aux collectifs une jouissance sécurisée de très long terme."
analyse:
  forces:
    - "Objet statutaire explicite de sanctuarisation foncière hors marché et hors succession."
    - "Forme non lucrative sans capital appropriable : aucune valeur foncière captable."
    - "Titres d'usage longs accordés aux collectifs (bail emphytéotique de 99 ans)."
  fragilites:
    - "Fonds de dotation se créant sans agrément : la solidité dépend entièrement de ses statuts."
    - "Gouvernance, clause de dévolution et caractère non consomptible de la dotation non documentés."
    - "Fonds créé par une famille de professionnel·les de l'immobilier : indépendance des instances à vérifier."
  leviers:
    - "Publier les statuts, la clause de dévolution et le caractère consomptible ou non de la dotation."
    - "Documenter la composition du conseil d'administration et l'association des parties prenantes."
    - "Confirmer le caractère non rentier des redevances demandées aux collectifs usagers."
synthese: >
  Fraternité pour Demain illustre le maillon porteur du modèle de la
  Coopérative Oasis : un fonds de dotation dont l'objet déclaré est de
  sanctuariser le foncier des écolieux et d'en confier l'usage par baux longs.
  Sa solidité de principe — forme non lucrative, objet foncier explicite —
  reste à confirmer par la publication de ses statuts, de sa gouvernance et de
  sa clause de dévolution.
fiabilite: >
  Faits vérifiés (sources Fraternité pour Demain et Coopérative Oasis,
  consultées en mai 2026) : fonds de dotation créé en 2021 par une famille de
  professionnel·les de l'immobilier, objet de facilitation de l'accès au
  foncier des oasis, action de sanctuarisation par dissociation propriété /
  usage, portage du foncier du Château de la Mhotte et de l'Aube. Non
  confirmé : composition du conseil d'administration, clause de dévolution,
  caractère consomptible de la dotation, montant des redevances, statut
  d'agrément.
