resume: >
  Le Jardin du Petit Pessicart est un tiers-lieu d'un hectare perché sur la
  colline de Pessicart, au-dessus de Nice, dédié à la compréhension et à la
  régénération des écosystèmes. Né d'un projet d'« école dans un centre de
  permaculture » lancé en 2015, il a ouvert au public en 2017 et est devenu
  ferme pédagogique de l'Éducation nationale en 2019. À l'été 2020, le lieu
  étant mis en vente, parents et soutiens du projet se sont réunis dans la SCIC
  E3P (École de Permaculture du Petit Pessicart), constituée en juin 2021 ;
  celle-ci a acheté le Jardin en septembre 2021 pour 420 000 €, sans emprunt
  bancaire. La coopérative est ainsi à la fois propriétaire et usagère du lieu,
  qu'elle fait vivre autour de trois pôles — Centre de Permaculture, École de
  la Forêt, Agora du Design Régénératif. Le Jardin est une oasis financée par
  la Coopérative Oasis à hauteur de 130 000 €.
montage:
  type: propriete_collective
  articulations:
    - usufruitier: scic-e3p-pessicart
      titre: integre
  description: >
    La SCIC E3P, société coopérative d'intérêt collectif constituée sous forme
    de SAS à capital variable, a acquis en septembre 2021 la pleine propriété
    du Jardin du Petit Pessicart grâce à une collecte de fonds, sans recours à
    l'emprunt bancaire. La coopérative est à la fois propriétaire du foncier et
    collectif usager : la chaîne est intégrée, sans tiers entre la propriété et
    l'usage. La sortie du marché repose sur les statuts coopératifs SCIC ;
    aucune structure non lucrative tierce ne porte le foncier en nue-propriété.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Chaîne intégrée : une société coopérative d'intérêt collectif sous forme
    de SAS, à la fois propriétaire et usagère. Forme sociétaire commerciale, à
    lucrativité encadrée par le statut SCIC.
grille:
  - critere: foncier_hors_marche
    valeur: partiel
    note: "Le foncier est porté par la SCIC E3P et n'est pas destiné à la revente ; mais il est détenu par la coopérative usagère elle-même, sans structure non lucrative tierce ni dispositif d'inaliénabilité documenté."
  - critere: montage_documente
    valeur: oui
    note: "Le montage — achat du Jardin en 2021 par la SCIC E3P pour 420 000 € sans emprunt — est public et documenté par la Coopérative Oasis et les registres des sociétés."
  - critere: irreversibilite
    valeur: partiel
    note: "Le statut SCIC place les excédents en réserves impartageables et encadre la cession des parts ; mais aucun dispositif d'inaliénabilité du foncier ni clause anti-spéculative spécifique n'est documenté."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le Jardin a été acquis en 2021 par une collecte de fonds réunis dans la coopérative, sans emprunt bancaire ni endettement attendant une plus-value."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Une SCIC à capital variable rembourse les parts à leur valeur nominale et place ses excédents en réserves impartageables ; la cession est encadrée sans être verrouillée comme dans une structure non lucrative."
  - critere: non_lucratif_global
    valeur: partiel
    note: "Le statut SCIC encadre la lucrativité et impose des réserves impartageables ; mais la SCIC, société commerciale, autorise une rémunération encadrée du capital."
  - critere: montage_non_commercial
    valeur: partiel
    note: "Le seul maillon de la chaîne est une SCIC sous forme de SAS : société commerciale à lucrativité encadrée, ce qui correspond à la valeur « partiel » de la grille."
  - critere: gouvernance_collective
    valeur: oui
    note: "Les coopérateur·rices qui font vivre le Jardin décident ensemble de son devenir, sur un modèle inspiré de l'holacratie à trois pôles."
  - critere: tripartisme
    valeur: partiel
    note: "Le Jardin travaille avec l'Éducation nationale, les écoles de design locales et l'Université Côte d'Azur ; l'association du voisinage et des collectivités à la gouvernance n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "La SCIC à capital variable permet l'entrée de nouveaux·elles coopérateur·rices ; les dispositifs formels de transmission du lieu ne sont pas détaillés."
  - critere: usage_interet_general
    valeur: oui
    note: "Formation à la permaculture, école de la forêt, recherche sur la revégétalisation périurbaine et accueil de classes servent un intérêt général écologique et éducatif."
  - critere: ancrage_territorial
    valeur: oui
    note: "Ferme pédagogique de l'Éducation nationale, lié aux écoles de design et à l'Université Côte d'Azur, le Jardin est ancré dans son territoire niçois et ouvert au public."
  - critere: usage_non_marchand
    valeur: partiel
    note: "Chantiers participatifs et accueil de classes relèvent d'une logique de partage ; formations certifiantes et accueil de groupes en team-building comportent une part marchande."
  - critere: loyer_non_rentier
    valeur: oui
    note: "La SCIC étant propriétaire du foncier, aucun loyer n'est versé à un tiers ; le lieu a en outre été acquis sans emprunt bancaire."
  - critere: securite_jouissance
    valeur: oui
    note: "La SCIC est propriétaire du foncier : son usage n'est borné par aucun titre à terme, la chaîne étant intégrée."
  - critere: milieu_protege
    valeur: non
    note: "Aucun dispositif opposable et durable de protection du milieu (ORE, statut d'espace protégé, clause environnementale) n'est documenté ; la chaîne étant intégrée, aucun bail ni convention ne porte de clause de cette nature."
  - critere: vivant_finalite
    valeur: oui
    note: "Le lieu est dédié à « la compréhension et à la régénération des écosystèmes » ; École de la Forêt et recherche sur la revégétalisation périurbaine traduisent concrètement cette finalité."
  - critere: usage_non_degradant
    valeur: oui
    note: "Centre de permaculture et démarche de design régénératif : les pratiques visent explicitement à entretenir et régénérer le sol et le milieu."
  - critere: place_au_vivant
    valeur: oui
    note: "Tiers-lieu d'un hectare conduit en permaculture avec une École de la Forêt et une recherche sur la revégétalisation : des espaces sont effectivement aménagés pour le vivant."
analyse:
  forces:
    - "Foncier acquis comptant en 2021, sans emprunt bancaire, par une collecte de fonds."
    - "Chaîne intégrée : aucune précarité locative vis-à-vis d'un tiers propriétaire."
    - "Gouvernance coopérative ouverte aux nouveaux entrants, ancrée dans le territoire niçois."
  fragilites:
    - "Foncier porté par une SCIC sous forme de SAS : société commerciale, sans structure non lucrative ni inaliénabilité."
    - "Chaîne intégrée : la coopérative est juge et partie, sans contre-pouvoir externe entre propriété et usage."
    - "Aucun verrou anti-spéculatif spécifique au foncier documenté au-delà du statut SCIC."
  leviers:
    - "Renforcer le verrou anti-spéculatif statutaire du foncier au-delà du seul cadre SCIC."
    - "Envisager un porteur non lucratif tiers pour introduire un contre-pouvoir entre propriété et usage."
    - "Publier les statuts, la clause de dévolution et les comptes de la coopérative."
  synthese: >
    Le Jardin du Petit Pessicart est un tiers-lieu de permaculture exemplaire
    par sa gouvernance et son usage, acquis comptant par sa propre coopérative.
    Mais le foncier est porté par une SCIC — société commerciale — qui est juge
    et partie : la chaîne intégrée supprime la précarité locative au prix d'un
    verrou anti-spéculatif et d'un contre-pouvoir externe manquants.
fiabilite: >
  Faits vérifiés (sources Coopérative Oasis, societe.com et Zeste, consultées
  en mai 2026) : tiers-lieu d'un hectare au-dessus de Nice, projet lancé en
  2015, ouverture au public en 2017, ferme pédagogique de l'Éducation nationale
  en 2019, SCIC E3P constituée sous forme de SAS à capital variable le 21 juin
  2021, achat du Jardin en septembre 2021 pour 420 000 € sans emprunt bancaire,
  une vingtaine de coopérateur·rices, trois pôles d'activité, financement de
  130 000 € par la Coopérative Oasis. Non confirmé : clause de dévolution
  statutaire, transparence comptable, dispositifs de transmission.
