    note: "Le montage — acquisition par la Foncière Terre de Liens, usage confié au GAEC par bail rural — est public et documenté par Terre de Liens."
  - critere: irreversibilite
    valeur: oui
    note: "Le portage de long terme par la Foncière, structure non spéculative dédiée à la préservation du foncier agricole, soustrait durablement la terre au marché."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le foncier a été acquis grâce à une collecte d'épargne solidaire citoyenne, hors tout endettement attendant une plus-value."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "La Foncière Terre de Liens est une société en commandite par actions dont les actions sont cessibles ; les parts du GAEC, sans valeur foncière, sont cédées sous agrément des associé·es."
  - critere: non_lucratif_global
    valeur: partiel
    note: "La Foncière ne verse pas de dividende, mais le GAEC est une société civile d'exploitation dont le revenu agricole est partagé entre les associé·es."
  - critere: montage_non_commercial
    valeur: partiel
    note: "La Foncière Terre de Liens est une société en commandite par actions à actionnariat solidaire ; le GAEC est une société civile agricole — aucun maillon n'est une société commerciale à lucrativité ouverte, mais la chaîne est entièrement sociétaire."
  - critere: gouvernance_collective
    valeur: oui
    note: "La ferme est exploitée par le GAEC Les P'tites Berouettes : les associé·es paysan·nes décident ensemble des choix de l'exploitation, avec des réunions de coordination régulières."
  - critere: tripartisme
    valeur: non
    note: "La gouvernance de la ferme repose sur les deux associé·es du GAEC ; l'association du voisinage ou des collectivités n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "Le GAEC a accueilli un second associé en 2022 ; les dispositifs de transmission et de renouvellement de l'exploitation ne sont pas documentés."
  - critere: usage_interet_general
    valeur: oui
    note: "Installation paysanne, maraîchage diversifié en agriculture biologique, vente en circuits courts : la ferme sert un intérêt général agricole et alimentaire."
  - critere: ancrage_territorial
    valeur: partiel
    note: "La ferme approvisionne le territoire via des circuits courts (restaurateur·rices, magasins spécialisés) ; son ouverture au public au-delà de la vente n'est pas documentée."
  - critere: usage_non_marchand
    valeur: non
    note: "L'activité de la ferme est une production maraîchère vendue en circuits courts au prix du marché ; l'usage n'est pas non marchand."
  - critere: loyer_non_rentier
    valeur: partiel
    note: "Les actions de la Foncière ne versent pas de dividende, écartant une logique de rendement ; le montant du fermage versé par le GAEC n'est pas documenté."
  - critere: securite_jouissance
    valeur: oui
    note: "L'usage est confié par bail rural, dont le renouvellement est d'ordre public : le GAEC dispose d'une jouissance durable et sécurisée."
  - critere: milieu_protege
    valeur: non
    note: "Aucune clause environnementale, ORE ou statut protégé n'est inscrit au bail rural ; la fiche note d'ailleurs parmi ses leviers d'« inscrire des clauses environnementales formelles dans le bail »."
  - critere: vivant_finalite
    valeur: non
    note: "La vocation documentée du lieu est une production maraîchère destinée aux circuits courts ; le vivant non-humain n'apparaît pas parmi les finalités affichées."
  - critere: usage_non_degradant
    valeur: oui
    note: "La ferme est conduite en agriculture biologique : les pratiques culturales attestées entretiennent la capacité régénérative du sol sans recours aux intrants de synthèse."
  - critere: place_au_vivant
    valeur: non
    note: "L'existence de haies, mares, friches ou continuités écologiques sur les 7 hectares de la ferme n'est pas documentée par les sources."
  - critere: travail_non_marchandise
    valeur: oui
    note: "GAEC Les P'tites Berouettes : société civile d'exploitation dont les associé·es paysan·nes exploitent eux-mêmes la ferme, non salarié·es."
