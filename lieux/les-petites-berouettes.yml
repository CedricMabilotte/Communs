resume: >
  Ferme maraîchère d'environ 7 hectares à Luitré-Dompierre, à une quinzaine de
  minutes de Fougères, en Ille-et-Vilaine. Son foncier a été acquis en 2022 par
  la Foncière Terre de Liens, grâce à une collecte d'épargne solidaire
  citoyenne, qui l'a retiré du marché et en a confié l'usage par bail rural au
  GAEC Les P'tites Berouettes, constitué la même année par David Lécrivain et
  Jonas Cadieu. La ferme est conduite en agriculture biologique : une
  quarantaine de légumes cultivés toute l'année sur environ 3 hectares de plein
  champ et 1 200 m² de serres, complétés par une production d'œufs et d'agneau,
  vendus en circuits courts à des restaurateur·rices et des magasins
  spécialisés.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: gaec-les-ptites-berouettes
      titre: bail_rural
  description: >
    Le foncier de la ferme est porté durablement par la Foncière Terre de Liens,
    structure non spéculative qui l'a acquis en 2022 par l'épargne citoyenne et
    l'a retiré du marché spéculatif. Son usage est confié par bail rural au
    GAEC Les P'tites Berouettes, société civile agricole dont les associé·es
    exploitent eux-mêmes la ferme en maraîchage biologique. La collecte
    publique visait environ 47 728 euros pour couvrir 60 % du prix total
    d'acquisition, travaux et frais inclus.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Foncier protégé par la Foncière Terre de Liens, structure non spéculative
    à gouvernance solidaire descendante ; le porteur est une société en
    commandite par actions à actionnariat solidaire, et l'usufruitier un GAEC,
    société civile d'exploitation dont le bénéfice est partagé entre les
    paysan·nes associé·es. Le profil relève de l'intérêt général institué et
    non du mutualisme : aucun maillon n'est une coopérative ou SCIC à
    sociétariat ; le GAEC est une exploitation agricole, non une mutuelle
    d'usagers.
grille:
