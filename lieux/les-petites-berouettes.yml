  Liens en 2022, usage confié au GAEC Les P'tites Berouettes constitué la même
  année par David Lécrivain et Jonas Cadieu, maraîchage diversifié en
  agriculture biologique, environ 3 hectares de plein champ et 1 200 m² de
  serres, vente en circuits courts, collecte d'environ 47 728 euros. Non
  confirmé : montant du fermage, nature exacte du bail, surface définitive
  cultivée.
