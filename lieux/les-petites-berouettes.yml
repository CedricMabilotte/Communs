  synthese: >
    Les Petites Berouettes illustrent le modèle Terre de Liens appliqué à une
    petite ferme maraîchère : un foncier protégé par l'épargne citoyenne,
    confié par bail rural à un GAEC qui l'exploite en bio. La chaîne, entièrement
    sociétaire — société en commandite par actions en amont, GAEC en aval —
    libère effectivement la terre du marché sans atteindre le profil du commun
    citoyen.
fiabilite: >
  Faits vérifiés (sources Terre de Liens, GAEC Les P'tites Berouettes et presse
