uid: village-vertical
categorie: lieu
nom: "Le Village Vertical"
sous_titre: "Première coopérative d'habitants de France au XXIe siècle"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Villeurbanne"
  departement: "Rhône (69)"
  region: "Auvergne-Rhône-Alpes"
  geoportail: "https://www.geoportail.gouv.fr/carte?c=4.8740,45.7565&z=16"
annee: 2010
url: "https://www.village-vertical.org/"
resume: >
  Le Village Vertical est une coopérative d'habitants — société coopérative à
  capital variable — créée en 2010 à Villeurbanne ; son immeuble unique a été
  livré en juin 2013. La coopérative est l'unique propriétaire du bâti et du
  foncier ; chaque ménage est locataire de son logement et détenteur de parts
  sociales, dont la valeur est déconnectée de celle du bien. À la sortie, les
  parts sont remboursées à leur valeur nominale, sans plus-value. Projet initié
  en 2005 et accompagné par Habicoop, il est la première coopérative
  d'habitants créée en France au XXIe siècle.
montage:
  type: propriete_collective
  articulations:
    - usufruitier: le-village-vertical
      titre: integre
      note: "Chaîne intégrée : la coopérative d'habitants est à la fois propriétaire et titulaire de l'usage ; chaque ménage signe un contrat coopératif conférant un droit de jouissance."
  description: >
    La coopérative d'habitants est l'unique propriétaire de l'immeuble et du
    foncier. Chaque ménage signe un contrat coopératif lui conférant un droit
    de jouissance sur un logement, en contrepartie de parts sociales et d'une
    redevance. La valeur des parts est déconnectée de celle du bien : à la
    sortie, elles sont remboursées au nominal, sans plus-value. En cas de
    revente du bâtiment, le surplus ne peut être distribué aux membres : la
    sortie du système spéculatif est garantie statutairement.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Société coopérative d'habitants à capital variable ; forme sociétaire mais
    statuts anti-spéculatifs verrouillant la valeur des parts au nominal.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "Le bâti et le foncier sont la propriété unique de la coopérative ; ils ne sont pas destinés à la revente sur le marché libre."
  - critere: montage_documente
    valeur: oui
    note: "Le montage — coopérative d'habitants propriétaire, ménages locataires et détenteurs de parts — est public et largement documenté."
  - critere: irreversibilite
    valeur: oui
    note: "Les statuts interdisent la distribution du surplus aux membres en cas de revente et plafonnent les parts au nominal : le retour au marché spéculatif est verrouillé."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le projet associe épargne des coopérateur·rices et logement social, hors logique d'endettement attendant une plus-value."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Les parts sociales sont remboursées à leur valeur nominale sans plus-value : la valeur du foncier n'est captable par aucun titre."
  - critere: usage_interet_general
    valeur: oui
    note: "L'immeuble compte 14 logements dont 9 sociaux et 4 très sociaux : l'usage sert un intérêt général de logement abordable."
  - critere: non_lucratif_global
    valeur: oui
    note: "Aucun maillon du montage ne capte de plus-value foncière : la déconnexion de la valeur des parts est statutaire."
  - critere: ancrage_territorial
    valeur: oui
    note: "Projet urbain ancré à Villeurbanne, articulé au logement social et accompagné comme pilote par Habicoop."
  - critere: gouvernance_collective
    valeur: oui
    note: "La coopérative d'habitants fonctionne sur le principe « une personne, une voix » : les coopérateur·rices décident collectivement."
  - critere: tripartisme
    valeur: partiel
    note: "Le projet associe bailleur social et collectivité au montage, mais une gouvernance tripartite formalisée n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "La forme coopérative organise la durée, mais les dispositifs de renouvellement des coopérateur·rices ne sont pas tous documentés."
  - critere: montage_non_commercial
    valeur: partiel
    note: "Le foncier est porté par une société coopérative d'habitants à capital variable : société commerciale de forme coopérative, à lucrativité encadrée par des statuts anti-spéculatifs."
  - critere: usage_non_marchand
    valeur: partiel
    note: "L'accès au logement repose sur une redevance et non sur la gratuité, mais l'immeuble compte 9 logements sociaux et 4 très sociaux : une logique de logement abordable coexiste avec une part contributive."
  - critere: loyer_non_rentier
    valeur: oui
    note: "La redevance versée par les ménages couvre les charges de la coopérative sans nourrir de rendement ; les parts sont remboursées au nominal sans plus-value et le surplus de revente ne peut être distribué."
  - critere: securite_jouissance
    valeur: oui
    note: "Chaque ménage signe un contrat coopératif lui conférant un droit de jouissance durable sur son logement, sans précarité locative de marché."
  - critere: milieu_protege
    valeur: non
    note: "Le lieu est un immeuble d'habitat coopératif urbain ; aucun dispositif opposable de protection d'un milieu (ORE, clause environnementale) n'est documenté ni n'a d'objet évident à cette échelle."
  - critere: vivant_finalite
    valeur: non
    note: "Le projet — coopérative d'habitants, logement abordable et non spéculatif — est pensé pour ses usager·es humain·es ; l'accueil du vivant non-humain ne figure pas parmi ses finalités."
  - critere: usage_non_degradant
    valeur: oui
    note: "Immeuble BBC en ossature bois-béton, sobre par conception : l'usage d'habitation ne dégrade pas le fonds."
  - critere: place_au_vivant
    valeur: non
    note: "À l'échelle d'un immeuble urbain, le critère s'évalue par les espaces de pleine terre, cour ou toiture ; les sources ne documentent aucun aménagement de ce type pour le vivant non-humain."
analyse:
  forces:
    - "Parts plafonnées au nominal : sortie du marché spéculatif garantie statutairement."
    - "Première coopérative d'habitants française du XXIe siècle, projet pilote éprouvé."
    - "Gouvernance « une personne, une voix » réellement participative."
  fragilites:
    - "Forme sociétaire : l'anti-spéculation dépend du maintien des clauses statutaires."
    - "Gouvernance tripartite avec voisinage et collectivité non formalisée."
    - "Dispositifs de renouvellement des coopérateur·rices peu documentés."
  leviers:
    - "Capitaliser l'expérience comme modèle reproductible d'habitat coopératif."
    - "Formaliser l'association du voisinage et de la collectivité à la gouvernance."
    - "Documenter l'accueil et le renouvellement des coopérateur·rices."
  synthese: >
    Le Village Vertical est le lieu emblématique de l'habitat coopératif
    français : une coopérative d'habitants propriétaire de son immeuble, aux
    parts plafonnées au nominal. Sa solidité tient au verrouillage statutaire
    de l'anti-spéculation.
fiabilite: >
  Faits vérifiés (sources Le Village Vertical, Habicoop et Le Labo de l'ESS,
  consultées en mai 2026) : coopérative d'habitants créée en 2010, immeuble
  unique livré en juin 2013, projet initié en 2005, première coopérative
  d'habitants française du XXIe siècle, immeuble BBC en ossature bois-béton de
  14 logements dont 9 sociaux et 4 très sociaux, propriété unique du bâti et du
  foncier par la coopérative, parts remboursées au nominal sans plus-value,
  accompagnement par Habicoop comme projet pilote. Non confirmé : modalités
  détaillées de renouvellement des coopérateur·rices.
chaine:
  porteurs: [le-village-vertical]
  usufruitiers: [le-village-vertical]
