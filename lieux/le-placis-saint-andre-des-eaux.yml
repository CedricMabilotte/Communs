uid: le-placis-saint-andre-des-eaux
categorie: lieu
nom: "Hameau léger du Placis"
sous_titre: "Premier hameau léger breton : huit habitats réversibles sur un terrain communal loué 80 ans"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Saint-André-des-Eaux"
  departement: "Côtes-d'Armor (22)"
  region: "Bretagne"
  geoportail: "https://www.geoportail.gouv.fr/carte?c=-2.0131,48.3745&z=16"
annee: 2022
url: "https://hameaux-legers.org/projets/placis"
resume: >
  Au cœur du bourg de Saint-André-des-Eaux, commune d'environ 400 habitant·es
  à dix kilomètres de Dinan, la mairie préempte en 2019 un terrain avec une
  bâtisse (de 4 500 à 5 000 m² selon les sources) pour y accueillir un hameau
  léger : huit habitats réversibles autoconstruits (emprise d'environ 20 m²,
  12 000 à 15 000 euros chacun) et une maison commune bioclimatique, portés par
  un groupe de huit adultes de 25 à 30 ans rencontré·es au sein de
  l'association Hameaux Légers. Le conseil municipal vote son soutien le
  29 juin 2021, le permis d'aménager est délivré en avril 2022, les permis de
  construire en août 2022, et le conseil acte en juillet 2022 la location du
  terrain par bail emphytéotique de 80 ans pour 5 000 euros par an, soit
  environ 50 euros par mois et par foyer. Les habitant·es sont propriétaires
  de leur habitat, non du sol. Une partie du groupe a repris le dernier
  commerce du village, le café-épicerie L'Éprouvette, en coopérative d'intérêt
  collectif. Le lieu est habité ; la localisation géoportail pointe le centre
  du bourg, non la parcelle.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: hameau-leger-du-placis
      titre: bail_emphyteotique
      duree: "80 ans"
      note: "Bail emphytéotique de 80 ans voté par le conseil municipal en juillet 2022, loyer de 5 000 euros par an ; les sources nomment le preneur « un groupe de personnes » ou « le collectif » — l'association « Hameau léger du Placis » (créée en octobre 2021 à l'adresse du hameau) en est le support juridique présumé, non confirmé par la délibération ni par le bail, non publiés."
  description: >
    La commune reste propriétaire du sol, qu'elle loue par bail emphytéotique
    de 80 ans au collectif des habitant·es ; chaque foyer est propriétaire de
    son habitat réversible. Le montage dissocie donc explicitement le sol,
    public et hors marché pour la durée du bail, du bâti, privé et démontable.
    Il rejoint le schéma déjà admis au corpus pour les logements Chênelet de
    Flocques (commune propriétaire, bail emphytéotique long), avec une
    différence : l'usager est ici le collectif habitant lui-même, non un
    bailleur social. Aucune règle de revente des habitats n'est publiée.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Chaîne entièrement non lucrative (commune, association) : le verdict peut
    se calculer. Le sol est tenu hors marché par une personne publique et un
    bail de 80 ans ; l'usage est celui d'un collectif d'habitant·es organisé en
    association. Le pôle retenu est celui du portage public — l'affectation
    relève d'une décision municipale, les habitant·es n'ont pas de voix
    statutaire documentée sur le foncier, et le bâti reste en propriété privée
    sans verrou publié. Finalité du vivant absente.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "Le sol est propriété communale et le reste ; aucun foyer n'en est propriétaire."
  - critere: montage_documente
    valeur: partiel
    note: "Propriétaire, durée du bail, loyer et principe de dissociation sol/bâti sont publics (Banque des Territoires, L'Info durable, Hameaux Légers) ; délibération, bail et identité du preneur ne le sont pas."
  - critere: irreversibilite
    valeur: partiel
    note: "Bail de 80 ans sur un terrain du domaine privé communal : durable, mais aliénable par délibération au-delà du bail ; aucune clause d'inaliénabilité ni affectation permanente documentée."
  - critere: origine_non_speculative
    valeur: oui
    note: "Préemption communale en 2019 pour accueillir des habitant·es en centre-bourg et limiter l'étalement urbain ; loyer modéré."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Ni la commune ni l'association n'ont de parts ; mais chaque foyer possède son habitat, cessible, sans clause anti-spéculative publiée."
  - critere: milieu_protege
    valeur: non
    note: "Aucun dispositif opposable de protection du milieu ; un « espace naturel préservé » au nord-ouest du terrain est mentionné sans dispositif."
  - critere: non_lucratif_global
    valeur: partiel
    note: "Chaîne non lucrative (commune, association), mais habitats en propriété privée des foyers, à plus-value possible faute de verrou publié."
  - critere: montage_non_commercial
    valeur: oui
    note: "Aucune société dans la chaîne foncière ; la SCIC du café est une activité connexe, hors chaîne."
  - critere: gouvernance_collective
    valeur: partiel
    note: "Le collectif habitant conçoit et gère le hameau ; les conditions foncières relèvent du conseil municipal ; mode de décision interne non documenté."
  - critere: tripartisme
    valeur: partiel
    note: "Commune et collectif ont construit le projet ensemble (accord de principe, vote de soutien, autorisation temporaire, bail) ; une instance permanente associant voisinage et commune n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: inconnu
    note: "Règles de remplacement d'un foyer et de transmission non documentées."
  - critere: travail_non_marchandise
    valeur: partiel
    note: "Autoconstruction et gestion bénévole des communs ; le café-épicerie repris en SCIC emploie des salarié·es (activité connexe)."
  - critere: usage_interet_general
    valeur: partiel
    note: "Habitat accessible et réversible, revitalisation d'un bourg et de son dernier commerce : intérêt local réel, mais l'usage principal est résidentiel au profit des huit foyers."
  - critere: ancrage_territorial
    valeur: oui
    note: "Centre-bourg, café-épicerie coopératif ouvert au village (plus de cent sociétaires, 130 adhérent·es à l'épicerie), temps de rencontre avec le voisinage dans la maison commune."
  - critere: vivant_finalite
    valeur: non
    note: "Finalité d'habitat ; l'écologie porte sur la réversibilité et l'évitement de l'artificialisation, sans finalité de biodiversité."
  - critere: usage_non_marchand
    valeur: partiel
    note: "Loyer foncier modéré et communs mutualisés (maison commune, véhicules, outils) ; régime locatif tout de même, habitats en propriété privée."
  - critere: loyer_non_rentier
    valeur: oui
    note: "5 000 euros par an pour l'ensemble du terrain, environ 50 euros par mois et par foyer : hors logique de rendement."
  - critere: securite_jouissance
    valeur: oui
    note: "Bail emphytéotique de 80 ans."
  - critere: usage_non_degradant
    valeur: partiel
    note: "Habitats réversibles sur sols perméables, cheminements doux, assainissement par phytoépuration ; aucune évaluation ni engagement opposable documentés."
  - critere: place_au_vivant
    valeur: partiel
    note: "Un « espace naturel préservé » au nord-ouest et des plantations comestibles sont mentionnés par la page du projet ; surface et régime non documentés."
analyse:
  forces:
    - "Sol public tenu hors marché par une commune et un bail de 80 ans ; aucun foyer ne possède la terre."
    - "Loyer foncier très modéré et habitats accessibles (12 000 à 15 000 euros autoconstruits)."
    - "Collectif habitant réel, communs mutualisés, reprise coopérative du dernier commerce du bourg."
  fragilites:
    - "Bâti en propriété privée des foyers sans clause anti-spéculative publiée."
    - "Délibération et bail non publiés ; preneur non nommé par les sources publiques."
    - "Aucune finalité ni dispositif en faveur du vivant non-humain."
  leviers:
    - "Publier la délibération de juillet 2022 et les clauses du bail."
    - "Formaliser une règle de revente des habitats (prix plafonné, agrément du collectif)."
    - "Donner un statut à l'espace naturel préservé du terrain."
  synthese: >
    Le Placis transpose à l'habitat léger le schéma public déjà présent au
    corpus avec Flocques : une commune préempte, garde le sol et le loue
    80 ans à des conditions non rentières. La nouveauté est que l'usager est le
    collectif habitant lui-même. Le montage est solide côté sol et fragile
    côté bâti et côté pièces ; il est, par ailleurs, sans finalité pour le
    vivant — un hybride assumé, non un sanctuaire.
fiabilite: >
  Faits vérifiés le 2026-11-20 : préemption en 2019 d'un terrain de 5 000 m²
  (4 500 m² dans l'encadré), bail emphytéotique de 80 ans acté en juillet 2022,
  loyer de 5 000 euros par an, permis d'aménager en avril 2022, permis de
  construire en août 2022, 5 logements autorisés d'abord et 8 à terme,
  autorisation d'occupation temporaire, café repris en SCIC en avril 2022,
  épicerie de 130 adhérent·es (Banque des Territoires, 18 janvier 2023) ; huit
  maisons, emprise d'environ 20 m², coût de 12 000 à 15 000 euros, loyer de
  50 euros par mois et par maison, « personne n'est propriétaire de son
  terrain », association de Xavier Gisserot employant une dizaine de salarié·es
  (L'Info durable, 20 mai 2023) ; terrain communal d'environ 4 700 m², huit
  habitats réversibles, statut « habité », décision du collectif en novembre
  2020, vote municipal du 29 juin 2021, coopérative de plus de cent
  sociétaires en octobre 2022, maison commune, espace naturel préservé
  (hameaux-legers.org, page du Placis) ; « premier hameau léger breton »
  (Reporterre, 10 avril 2024, lue depuis la machine) ; association « Hameau
  léger du Placis », SIREN 904 835 600, créée le 15 octobre 2021, siège
  9 Le Placis (recherche-entreprises.api.gouv.fr) ; centre de la commune
  -2.0131, 48.3745, population 409 (geo.api.gouv.fr). Non confirmé :
  délibération, texte du bail, identité du preneur, surface exacte, règles de
  revente, date d'emménagement, références cadastrales.
