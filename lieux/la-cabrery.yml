    gouvernance au territoire.
fiabilite: >
  Faits vérifiés (sources La Cabrery, Pro Longo Maï et Revue Silence,
  consultées en mai 2026) : ferme d'environ 23 hectares à Vitrolles-en-Lubéron
  acquise en 1993, dont 8 hectares de vigne, production d'environ 12 000
  bouteilles de vin nature par an, maraîchage et transformation pain/fromage,
  une dizaine d'habitant·es pris en charge par la communauté via une caisse
  commune, rattachement au réseau Longo Maï dont le foncier est détenu par le
  Fonds de Terre Européenne. Non confirmé : surface définitive, actes
  formalisant l'usage, existence d'un loyer, dispositifs de transmission.
