categorie: lieu
nom: "Longo Maï — La Cabrery"
sous_titre: "Ferme viticole collective du réseau Longo Maï en Luberon"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Vitrolles-en-Lubéron"
  departement: "Vaucluse (84)"
  region: "Provence-Alpes-Côte d'Azur"
annee: 1993
url: "https://www.lacabrery.org/"
resume: >
  Ferme collective du réseau Longo Maï à Vitrolles-en-Lubéron, dans le
  Vaucluse. La Cabrery est acquise en 1993 : une ferme d'environ 23 hectares,
  dont 8 hectares de vigne, avec une cave, un atelier mécanique et un atelier
  de transformation du pain et du fromage. L'activité principale est la
  viticulture et la vinification de vins nature — environ 12 000 bouteilles par
  an — complétée par maraîchage, céréales, bois, élevage de chèvres et de
  volailles. Une dizaine d'adultes et quelques enfants y vivent, entièrement
  pris en charge par la communauté. Le foncier est détenu de façon inaliénable
  par le Fonds de Terre Européenne ; la coopérative autogérée en assure l'usage.
montage:
  type: propriete_sanctuarisee
  nu_proprietaire: "Fonds de Terre Européenne (fondation de droit suisse)"
  usufruitier: "Coopérative Longo Maï de La Cabrery (collectif autogéré)"
  description: >
    Le foncier de La Cabrery est détenu de façon inaliénable par le Fonds de
    Terre Européenne, fondation de droit suisse qui sanctuarise la propriété
    des terres de Longo Maï. La coopérative autogérée, de statut associatif, en
    assure l'usage et la gouverne collectivement. Le démembrement
    nue-propriété/usufruit au sens du droit français n'est pas formalisé : il
    s'agit d'une propriété sanctuarisée en fondation et d'un usage collectif.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Foncier sanctuarisé de manière inaliénable dans une fondation de droit
    suisse ; usage collectif autogéré dont la formalisation contractuelle n'est
    pas documentée.
grille:
