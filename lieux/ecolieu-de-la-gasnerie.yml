  - critere: usage_non_degradant
    valeur: inconnu
    note: "Les sources décrivent un jardin arboré et fleuri et une rénovation éco-responsable, mais les pratiques d'entretien du lieu ne sont pas documentées avec assez de précision pour conclure."
  - critere: place_au_vivant
    valeur: oui
    note: "Le domaine d'un hectare comprend un jardin très arboré et fleuri, deux mares et de petits ruisseaux, espaces effectivement laissés au vivant non-humain."
analyse:
  forces:
    - "Lieu porté et habité par son collectif, qui en décide les usages."
    - "Projet écologique et social affirmé, tiers-lieu ouvert au territoire visé."
    - "Écolieu retenu et financé par la Coopérative Oasis."
  fragilites:
    - "Montage juridique non documenté publiquement : structure foncière, titre d'usage, formes inconnus."
    - "Projet jeune, en rénovation, association tiers-lieu encore « en construction »."
    - "Aucun dispositif d'irréversibilité ni de soustraction au marché documenté."
  leviers:
    - "Publier le montage juridique : structure portant le foncier, titre d'usage, formes."
    - "Finaliser l'association La Grainerie et rendre publique sa gouvernance."
    - "Documenter le plan de financement et l'apport de la Coopérative Oasis."
  synthese: >
    L'Écolieu de la Gasnerie est un jeune écolieu de Maine-et-Loire, oasis
    financée par la Coopérative Oasis et encore en rénovation. Sa fiche est
    volontairement lacunaire : le montage juridique n'est pas documenté
    publiquement. Sa silhouette ne pourra être appréciée qu'à la publication de
    la structure portant le foncier et du titre d'usage du collectif.
fiabilite: >
  Faits vérifiés (sources Écolieu de la Gasnerie et Coopérative Oasis,
  consultées en mai 2026) : écolieu à Morannes-sur-Sarthe en Maine-et-Loire,
  jardin arboré d'un peu plus d'un hectare à 5 km de la gare TER de Morannes,
  projet initié par Lucile et Pauline puis rejoint par Lucas et Lénou,
  association La Grainerie annoncée « en construction », travaux de rénovation
  en 2025, écolieu figurant parmi les oasis financées par la Coopérative Oasis.
  Non confirmé : structure détenant le foncier, montage juridique, montant et
  date de l'apport de la Coopérative Oasis, titre et durée de l'usage, plan de
  financement. Fiche à compléter dès publication de ces éléments.
