resume: >
  Écolieu de la Gasnerie, à Morannes-sur-Sarthe en Maine-et-Loire, à 5 km de la
  gare TER reliant Angers et Le Mans : un jardin arboré et fleuri d'un peu plus
  d'un hectare. Le projet, initié par Lucile et Pauline et rejoint par Lucas et
  Lénou, veut déployer un mode de vie écologique, équitable et solidaire :
  espace de vie coopératif et lieu d'accueil ouvert pour des séjours, ateliers,
  formations et résidences d'artistes. Une association, La Grainerie, « en
  construction » selon les sources, doit porter la fonction de tiers-lieu. Le
  lieu figure parmi les oasis financées par la Coopérative Oasis et faisait
  l'objet en 2025 de travaux de rénovation. Son montage juridique n'est pas
  documenté publiquement : cette fiche est lacunaire et signalée comme telle.
montage:
  type: propriete_collective
  articulations:
    - usufruitier: collectif-gasnerie
      titre: integre
      note: "Chaîne provisoirement renseignée comme intégrée sur le collectif faute de structure foncière distincte documentée."
  description: >
    L'Écolieu de la Gasnerie est habité et rénové par son collectif. Les sources
    publiques ne documentent pas la structure juridique détenant le foncier, ni
    le titre d'usage, ni la forme juridique du collectif. La Coopérative Oasis
    est intervenue comme financeur et accompagnateur — l'écolieu figure parmi
    ses oasis financées — sans être un maillon de la chaîne. Faute de structure
    foncière distincte documentée, la chaîne est provisoirement renseignée comme
    intégrée sur le collectif, sous réserve de confirmation.
integrite_montage:
  commentaire: >
    Écolieu porté par un collectif citoyen ; la nature juridique du portage du
    foncier n'étant pas documentée — chaîne entièrement cotée « inconnu »,
    verdict suspendu —, aucun pôle d'intégrité n'est projeté : l'apposer
    (a fortiori le pôle de tête) contredirait la réserve honnête tant que le
    montage n'est pas établi.
