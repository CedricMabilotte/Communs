  porté par l'association Les Agités du Local (RNA W411008139, SIREN 852581404),
  installé sur une ancienne ferme familiale à Sorges-et-Ligueux-en-Périgord ;
  plus d'une dizaine d'habitant·es (yourtes, familles, solo, colocation, maisons
  individuelles) vivant sur place depuis ~18 mois ; quasi-autonomie en eau,
  autonomie électrique en projet ; autosuffisance en fruits et légumes cultivés
  en bio ; faible empreinte carbone ; lieu d'accueil, de rencontre et de
  transmission ; membre du réseau CLIP. Non confirmé : association propriétaire
  au sens CLIP, forme et date de la bascule en propriété d'usage, statuts
  (clause de dévolution), nature et durée du titre d'usage, surface du lieu,
  régime des contributions, place du vivant non-humain au-delà de la production.
