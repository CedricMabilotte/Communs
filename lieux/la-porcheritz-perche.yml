uid: la-porcheritz-perche
categorie: lieu
nom: "La Porcheritz"
sous_titre: "Habitat collectif du Perche en propriété d'usage CLIP, à Vichères (Eure-et-Loir)"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Vichères (Perche)"
  departement: "Eure-et-Loir (28)"
  region: "Centre-Val de Loire"
  geoportail: "https://www.geoportail.gouv.fr/carte?c=0.9333,48.2667&z=14"
annee: 2014
url: "https://clip.ouvaton.org/les-projets/"
resume: >
  La Porcheritz est un lieu d'habitat collectif du Perche, à Vichères en
  Eure-et-Loir, membre du réseau CLIP (Réseau de lieux en propriété d'usage). Le
  projet repose sur le schéma CLIP à deux associations : une association
  habitante, Les Habitants de la Porcheritz (déclarée en 2013, siège « La Cave »
  à Vichères), qui porte l'usage et fonde une association propriétaire, La
  Porcheritz (déclarée en 2014 à Paris), laquelle a vocation à détenir le
  foncier en propriété d'usage ; le réseau CLIP, second membre de l'association
  propriétaire, garantit la non-revente par un droit de veto inter-lieux. Le
  montage d'inaliénabilité est confirmé dans sa structure, et la résidence
  permanente est désormais établie : le compte rendu d'AG du CLIP (29 janvier
  2022) décrit La Porcheritz comme un lieu membre habité — collectif vivant sur
  place, chantiers, médiation interne, habitant·es représentant le lieu — et le
  site du CLIP la liste parmi ses lieux (et non plus comme un « projet »). En
  revanche, l'acte d'achat lui-même (date, consistance, prix) n'est pas
  directement documenté par les sources publiques consultées.
montage:
  type: propriete_collective
  articulations:
    - usufruitier: les-habitants-de-la-porcheritz
      titre: convention
      note: "Association habitante qui porte l'usage du lieu et fonde l'association propriétaire qui détient le foncier en propriété d'usage ; le titre et la durée de l'usage liant les deux associations ne sont pas formalisés ni documentés."
  description: >
    La Porcheritz suit le montage de propriété d'usage propre au réseau CLIP, à
    deux associations. L'association habitante Les Habitants de la Porcheritz
    (RNA W751219283, Vichères) porte l'usage et la gestion du lieu et fonde
    l'association propriétaire La Porcheritz (RNA W751224981, Paris), dont elle
    est membre ; le réseau CLIP est le second et unique autre membre de
    l'association propriétaire et garantit la non-revente par un droit de veto
    inter-lieux. C'est l'association propriétaire qui a vocation à acheter le bien
    et à le porter en propriété d'usage : la propriété est légitimée par l'usage
    reconnu du collectif, non par le titre. Il s'agit de propriété d'usage
    associative — non d'un démembrement notarié ni d'une foncière classique. Le
    compte rendu d'AG du CLIP de janvier 2022 atteste un lieu membre habité
    (collectif vivant sur place, chantiers, AG annuelles des associations
    propriétaires). À confirmer : l'acte d'achat (date, consistance, prix) n'a pas
    été retrouvé dans les sources publiques, et les statuts (clause anti-revente,
    dévolution) ne sont pas publiés.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Montage associatif de propriété d'usage CLIP : deux associations loi 1901
    non lucratives, veto réseau de CLIP comme co-membre de l'association
    propriétaire, visant l'inaliénabilité hors marché. Réserve : l'achat effectif
    du foncier n'est pas documenté et les statuts (clauses anti-revente et de
    dévolution) ne sont pas publics ; la solidité concrète du verrou reste à
    recouper sur pièces.
grille:
  - critere: foncier_hors_marche
    valeur: partiel
    note: "Le schéma CLIP vise à soustraire le foncier au marché par l'association propriétaire et le veto réseau ; mais l'achat effectif du bien n'est pas documenté et les statuts ne sont pas publiés : la soustraction est posée en principe, non vérifiée."
  - critere: montage_documente
    valeur: partiel
    note: "Le schéma à deux associations + CLIP garant est public et lisible (RNA, dates, objets statutaires) ; mais l'acte d'achat, les statuts et le titre d'usage liant les deux associations ne sont pas documentés."
  - critere: irreversibilite
    valeur: partiel
    note: "Le modèle CLIP repose sur un droit de veto inter-lieux exercé par CLIP, co-membre de l'association propriétaire ; ce dispositif d'irréversibilité est inscrit dans le principe du réseau, mais les clauses statutaires propres à La Porcheritz ne sont pas publiées."
  - critere: origine_non_speculative
    valeur: inconnu
    note: "Le modèle CLIP finance l'acquisition par emprunt remboursé par les loyers, sans plus-value attendue ; mais l'achat effectif de La Porcheritz et ses modalités de financement ne sont pas documentés."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Les deux maillons du montage sont des associations loi 1901 sans capital appropriable ni parts cessibles : aucune valeur foncière n'est captable à titre privé."
  - critere: milieu_protege
    valeur: inconnu
    note: "Aucun dispositif opposable et durable de protection du milieu (ORE, espace protégé, clause environnementale) n'est documenté par les sources."
  - critere: non_lucratif_global
    valeur: oui
    note: "Les deux maillons — association habitante et association propriétaire — sont des associations loi 1901 non lucratives, et CLIP est lui-même une association : aucun maillon ne capte de plus-value foncière à titre privé."
  - critere: montage_non_commercial
    valeur: oui
    note: "Tous les maillons de la chaîne sont des associations loi 1901 : aucun maillon commercial dans le montage."
  - critere: gouvernance_collective
    valeur: partiel
    note: "Le compte rendu d'AG du CLIP de janvier 2022 atteste un collectif d'habitant·es vivant sur place, en autogestion (plénières, chantiers, médiation interne, prise de décision en présence) : la résidence permanente et l'autogestion sont désormais documentées. Le détail des règles décisionnelles (statuts, organe) reste non publié."
  - critere: tripartisme
    valeur: partiel
    note: "Le réseau CLIP, tiers garant, est associé au montage comme second membre de l'association propriétaire ; l'association du voisinage et des collectivités à la gouvernance n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: inconnu
    note: "Les dispositifs de transmission du lieu et de renouvellement des habitant·es ne sont pas documentés ; CLIP désignerait le cas échéant le collectif gestionnaire suivant, mais le détail propre à ce lieu n'est pas connu."
  - critere: travail_non_marchandise
    valeur: inconnu
    note: "La nature du travail qui fait vivre le lieu — bénévole, salarié, entraide — n'est pas documentée par les sources."
  - critere: usage_interet_general
    valeur: partiel
    note: "L'objet — habitat collectif solidaire et autogéré — relève d'un intérêt général (habitat digne, solidarité) ; sa portée au-delà des habitant·es n'est pas documentée."
  - critere: ancrage_territorial
    valeur: inconnu
    note: "L'utilité du lieu à son territoire et son ouverture au-delà de ses résident·es ne sont pas documentées par les sources."
  - critere: vivant_finalite
    valeur: inconnu
    note: "Une finalité explicite d'accueil ou de préservation du vivant non-humain n'est pas documentée par les sources."
  - critere: usage_non_marchand
    valeur: inconnu
    note: "Le régime d'accès au lieu et à ses fruits — gratuité, contribution, loyer interne — n'est pas documenté par les sources."
  - critere: loyer_non_rentier
    valeur: partiel
    note: "Le modèle CLIP, documenté par le réseau, repose sur des loyers calibrés pour rembourser l'emprunt d'acquisition (sans rendement d'investisseur ni plus-value) ; le principe non rentier est posé, mais le montant du loyer interne à La Porcheritz n'est pas publié."
  - critere: securite_jouissance
    valeur: partiel
    note: "Le modèle CLIP, documenté par le réseau, fait des occupant·es des locataires de la structure propriétaire (loyers remboursant l'emprunt) ; le principe d'un titre d'usage durable est posé, mais la nature et la durée exactes du titre liant les deux associations de La Porcheritz ne sont pas documentées."
  - critere: usage_non_degradant
    valeur: inconnu
    note: "Les pratiques d'entretien et d'usage du lieu et leur effet sur le fonds ne sont pas documentés par les sources."
  - critere: place_au_vivant
    valeur: inconnu
    note: "La place concrète faite au vivant non-humain sur le lieu n'est pas documentée par les sources."
analyse:
  forces:
    - "Chaîne entièrement associative : deux associations loi 1901 non lucratives, sans capital appropriable."
    - "Inscription dans le schéma CLIP : association propriétaire dont CLIP est second membre garant, droit de veto inter-lieux contre la revente."
    - "Objet d'habitat collectif solidaire et autogéré, porté par les habitant·es eux-mêmes."
  fragilites:
    - "Acte d'achat du foncier (date, consistance, prix) non retrouvé dans les sources publiques, même si la résidence du collectif est, elle, attestée par le compte rendu d'AG du CLIP de janvier 2022."
    - "Statuts non publiés : clauses anti-revente et de dévolution non vérifiées sur pièces."
    - "Nature et durée exactes du titre d'usage liant les deux associations non documentées."
  leviers:
    - "Documenter l'acte d'achat — date, consistance et prix du bien porté en propriété d'usage."
    - "Publier les statuts des deux associations (clause anti-revente, dévolution)."
    - "Formaliser et publier le titre d'usage liant les deux associations (nature, durée, loyer)."
  synthese: >
    La Porcheritz est un lieu d'habitat collectif du Perche bâti sur le montage
    de propriété d'usage CLIP : une chaîne entièrement associative et non
    lucrative, où l'association propriétaire est verrouillée par le veto du
    réseau. Le mécanisme d'inaliénabilité est confirmé dans sa structure, et la
    résidence permanente du collectif est désormais attestée par le compte rendu
    d'AG du CLIP de janvier 2022 (collectif vivant sur place, autogestion,
    chantiers), ce qui lève le doute majeur sur la réalité vécue. Reste à établir
    sur pièces le maillon foncier : l'acte d'achat (date, consistance, prix) et
    les statuts ne sont pas publics — d'où une qualification désormais solide sur
    le vécu et le principe, à consolider sur la preuve d'acquisition.
fiabilite: >
  Faits relevés (sources : Assoce.fr, Net1901, Gralon, Pappers, Annuaire des
  entreprises data.gouv.fr, site CLIP et compte rendu d'AG du CLIP du 29 janvier
  2022, consultés les 31 mai et 1er juin 2026) :
  lieu d'habitat collectif du Perche à Vichères
  (28480), membre du réseau CLIP ; montage à deux associations — Les Habitants de
  la Porcheritz (RNA W751219283, SIREN 812406882, déclarée le 8 avril 2013,
  Vichères, objet d'habitat collectif solidaire et autogéré) et La Porcheritz
  (RNA W751224981 réconciliée avec le SIREN 810886952, déclarée le 12 juin 2014,
  siège 15 rue Émile Pierre Casel, 75020 Paris, objet de propriété d'usage) —
  avec CLIP second membre garant de la non-revente (veto réseau). Résidence
  permanente désormais établie : le compte rendu d'AG du CLIP de janvier 2022
  décrit La Porcheritz comme un lieu membre habité — collectif vivant sur place,
  chantiers d'automne, médiation interne, plénières, habitant·es représentant le
  lieu (Sidonie, Meghan, Laurent) — et le réseau distingue explicitement ces
  collectifs « qui vivent sur place » ; le site du CLIP la liste parmi ses lieux
  (et non comme un « projet »), et un mandat actif y est confié à un membre de
  Porcheritz. Le modèle CLIP fait des occupant·es des locataires de la structure
  propriétaire, les loyers remboursant l'emprunt d'acquisition. À confirmer :
  l'acte d'achat (date, consistance, prix) n'a pas été retrouvé dans les sources
  publiques ; les statuts des associations (clause anti-revente, dévolution), la
  nature et la durée du titre d'usage liant les deux associations, le montant du
  loyer et la place du vivant non-humain ne sont pas documentés.
