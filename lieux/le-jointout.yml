resume: >
  Ferme collective d'élevage et de polyculture située à Torpes, en Bresse
  bourguignonne. Son foncier — environ 50 hectares, dont 41 hectares de prairies
  — a été racheté en 2011 par Terre de Liens, pour permettre l'installation de
  paysan·nes et faire du lieu un site de production agricole et d'échanges
  culturels. Exploitée collectivement depuis 2010, la ferme réunit six
  associé·es en GAEC autour de plusieurs ateliers : élevage de brebis et de
  chèvres laitières avec transformation fromagère, céréales et boulangerie,
  porcs plein air, maraîchage et élevage-dressage de chevaux de trait. Le lieu
  voisine l'écolieu du Portail, site d'habitat groupé écologique.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: gaec-du-jointout
      titre: bail_rural
  description: >
    Le foncier du Jointout — environ 50 hectares — a été racheté en 2011 par
    Terre de Liens pour soustraire la terre au marché et permettre
    l'installation de paysan·nes. Les sources publiques consultées indiquent
    « Terre de Liens » sans préciser le véhicule porteur ; la Foncière Terre de
    Liens, bras d'acquisition par l'épargne citoyenne, est l'hypothèse la plus
    probable, mais le portage par la Fondation n'est pas exclu. L'usage est
    confié par bail rural au collectif paysan, structuré en GAEC, qui exploite
    le lieu de façon collective depuis 2010.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Foncier soustrait au marché par une structure non spéculative du réseau Terre de
    Liens ; le véhicule porteur exact (Foncière ou Fondation) n'est pas
    confirmé, et l'usage est exploité par un GAEC, société civile agricole.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "Le foncier d'environ 50 hectares a été racheté en 2011 par Terre de Liens, mouvement non spéculatif, et retiré du marché."
  - critere: montage_documente
    valeur: partiel
    note: "Le principe — rachat par Terre de Liens en 2011, exploitation collective en GAEC — est public, mais le véhicule porteur exact (Foncière ou Fondation) n'est pas précisé par les sources."
  - critere: irreversibilite
    valeur: oui
    note: "Le portage de long terme par Terre de Liens et la vocation agricole maintenue soustraient durablement le foncier au marché spéculatif."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le foncier a été racheté en 2011 par Terre de Liens, mouvement citoyen mobilisant épargne solidaire, dons et legs, hors logique de plus-value."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Selon l'hypothèse la plus probable, le foncier est porté par la Foncière Terre de Liens, société en commandite par actions dont les actions sont cessibles ; leur revalorisation rend la valeur foncière partiellement captable."
  - critere: non_lucratif_global
    valeur: oui
    note: "Les véhicules de Terre de Liens ne versent pas de dividende et le GAEC, société civile agricole, ne capte pas la valeur du foncier porté : aucune plus-value foncière privée n'est captée."
  - critere: montage_non_commercial
    valeur: partiel
    note: "Selon l'hypothèse la plus probable, le porteur est la Foncière Terre de Liens — société commerciale à actionnariat solidaire et lucrativité encadrée ; un portage par la Fondation, non lucrative, est possible mais non confirmé."
  - critere: gouvernance_collective
    valeur: oui
    note: "La ferme est exploitée collectivement depuis 2010 par six associé·es réuni·es en GAEC, qui décident ensemble de la conduite du lieu."
  - critere: travail_non_marchandise
    valeur: oui
    note: "Le travail-cœur est porté par le GAEC du Jointout — société civile agricole dont les six associé·es exploitant·es ne sont pas salarié·es."
  - critere: tripartisme
    valeur: partiel
    note: "Le Jointout se définit comme un site d'échanges culturels et voisine l'écolieu du Portail ; l'association formelle du voisinage à la gouvernance n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: oui
    note: "Le GAEC a accueilli de nouveaux·elles associé·es au fil des années (notamment en 2021, 2022 et 2024), assurant le renouvellement du collectif exploitant."
  - critere: usage_interet_general
    valeur: oui
    note: "Élevage laitier, transformation fromagère, boulangerie et maraîchage en agriculture biologique : le lieu sert un intérêt général agricole et alimentaire."
  - critere: ancrage_territorial
    valeur: oui
    note: "La ferme vend en circuit court (marchés, AMAP) et se conçoit comme un lieu d'échanges culturels, ouvert au territoire de la Bresse bourguignonne."
  - critere: usage_non_marchand
    valeur: partiel
    note: "La production fromagère, boulangère et maraîchère est vendue en circuit court ; l'usage relève d'une logique nourricière de proximité sans être pleinement non marchand."
  - critere: loyer_non_rentier
    valeur: partiel
    note: "L'usage est confié par bail rural moyennant un fermage ; les véhicules de Terre de Liens ne recherchent pas de rendement, mais le niveau du fermage n'est pas documenté."
  - critere: securite_jouissance
    valeur: oui
    note: "L'usage est confié par bail rural, dont le renouvellement est d'ordre public : le collectif dispose d'une jouissance durable et sécurisée depuis 2010-2011."
  - critere: milieu_protege
    valeur: non
    note: "Aucune clause environnementale au bail rural, ORE ou statut d'espace protégé n'est documenté pour le foncier du Jointout."
  - critere: vivant_finalite
    valeur: non
    note: "Le lieu se conçoit comme un site de production agricole et d'échanges culturels ; le vivant non-humain n'est pas affiché comme finalité au-delà des pratiques agricoles biologiques."
  - critere: usage_non_degradant
    valeur: oui
    note: "Élevage et polyculture conduits en agriculture biologique, dont 41 hectares de prairies : des pratiques de maintien de la capacité régénérative du sol sont attestées."
  - critere: place_au_vivant
    valeur: non
    note: "Le maintien de 41 hectares de prairies est favorable au vivant, mais l'existence d'éléments dédiés (haies, mares, continuités écologiques) n'est pas documentée par les sources."
analyse:
  forces:
    - "Foncier porté hors-marché par Terre de Liens depuis 2011."
    - "Ferme collective réunissant six associé·es en GAEC, avec renouvellement effectif."
    - "Exploitation diversifiée — élevage laitier, fromage, boulangerie, maraîchage, chevaux de trait."
  fragilites:
    - "Véhicule porteur exact (Foncière ou Fondation) non confirmé par les sources publiques."
    - "Le GAEC partage les résultats entre associé·es : il n'est pas structurellement non lucratif."
    - "Niveau du fermage et association formelle du voisinage non documentés."
  leviers:
    - "Documenter publiquement le véhicule porteur et l'acte d'acquisition de 2011."
    - "Documenter le niveau du fermage et son caractère soutenable."
    - "Formaliser l'association du voisinage et de l'écolieu du Portail à la gouvernance."
  synthese: >
    Le Jointout illustre le modèle Terre de Liens à l'échelle d'une ferme
    collective : un foncier soustrait au marché en 2011 et exploité depuis 2010 par un
    GAEC de six associé·es aux ateliers diversifiés, avec un renouvellement
    effectif du collectif. Sa principale réserve documentaire tient à
    l'imprécision des sources sur le véhicule porteur exact.
fiabilite: >
  Faits vérifiés (sources Terre de Liens Bourgogne-Franche-Comté, ferme du
  Jointout et presse agricole, consultées en mai 2026) : ferme collective
  d'élevage et de polyculture à Torpes en Bresse bourguignonne, foncier
  d'environ 50 hectares racheté par Terre de Liens en 2011, exploitation
  collective depuis 2010, GAEC de six associé·es, ateliers de brebis et chèvres
  laitières avec transformation fromagère, céréales et boulangerie, porcs plein
  air, maraîchage et chevaux de trait, voisinage de l'écolieu du Portail. Non
  confirmé : véhicule porteur exact (Foncière ou Fondation Terre de Liens),
  niveau du fermage, clauses du bail.
