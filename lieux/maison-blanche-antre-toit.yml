resume: >
  La « Maison Blanche » est une maison d'environ 100 m² à Gaillac, dans le Tarn,
  maison collective et autogérée qui accueille en permanence des jeunes
  exilé·es en attente de reconnaissance de leur minorité par l'État français.
  Le lieu sert aussi de siège social et d'espace d'accueil de journée pour les
  démarches administratives. La maison, d'abord mise à disposition par des
  bénévoles, fait l'objet d'un rachat en propriété d'usage : sa propriété est
  acquise par le fonds de dotation Antidote, qui en confie l'usage par bail
  emphytéotique à l'association d'usager·es du lieu, L'Antre Toit. C'est
  l'association d'accueil L'Antre d'Eux — née en 2019 de l'initiative
  d'habitant·es du Gaillacois — qui y héberge et accompagne les jeunes :
  recours juridique, accès aux soins, à la scolarité, au sport et aux loisirs.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: association-antre-toit
      titre: bail_emphyteotique
      note: "Durée précise du bail non documentée par les sources."
  description: >
    La Maison Blanche, mise à disposition par des bénévoles puis rachetée grâce
    à une levée de fonds, voit sa propriété acquise par le fonds de dotation
    Antidote, qui la soustrait au marché. L'usage en est confié par bail
    emphytéotique à l'association L'Antre Toit, qui réunit les usager·es du lieu
    et en coordonne les activités. La maison est mise à disposition de
    l'association d'accueil L'Antre d'Eux. La chaîne distingue donc le porteur
    (Antidote), l'usufruitier-gestionnaire du lieu (L'Antre Toit) et
    l'association d'activité (L'Antre d'Eux).
integrite_montage:
  niveau: commun_citoyen
  commentaire: >
    Foncier porté par un fonds de dotation non lucratif ; usage confié par bail
    emphytéotique à une association d'usager·es de droit civil ; aucun maillon
    commercial dans la chaîne.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "La propriété de la maison est acquise par le fonds de dotation Antidote, structure non spéculative qui la détient hors marché."
  - critere: montage_documente
    valeur: oui
    note: "Le montage — propriété Antidote, bail emphytéotique à l'association L'Antre Toit, mise à disposition de L'Antre d'Eux — est public et documenté."
  - critere: irreversibilite
    valeur: partiel
    note: "La propriété par un fonds de dotation soustrait durablement le lieu ; le caractère consomptible ou non de la dotation d'Antidote n'est pas confirmé par les sources."
  - critere: origine_non_speculative
    valeur: oui
    note: "La maison était mise à disposition par des bénévoles ; son rachat est financé par dons et levée de fonds solidaire, hors logique de plus-value."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Ni le fonds de dotation Antidote ni les associations loi 1901 ne comportent de capital appropriable : aucune part ne porte la valeur foncière."
  - critere: non_lucratif_global
    valeur: oui
    note: "Fonds de dotation et associations loi 1901 : aucun maillon du montage ne capte de plus-value foncière à titre privé."
  - critere: montage_non_commercial
    valeur: oui
    note: "La chaîne ne comporte aucune société commerciale : un fonds de dotation porte le foncier, des associations en assurent l'usage et l'activité."
  - critere: gouvernance_collective
    valeur: oui
    note: "La maison est collective et autogérée ; les jeunes qui y vivent participent aux décisions concernant l'avenir du lieu, et l'association se forme à la décision collective."
  - critere: tripartisme
    valeur: partiel
    note: "L'association travaille en lien avec d'autres associations locales et un large réseau de soutien ; l'association du voisinage ou des collectivités à la gouvernance du lieu n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "L'autogestion par les habitant·es organise la transmission entre arrivant·es ; les dispositifs formels de renouvellement ne sont pas détaillés."
  - critere: usage_interet_general
    valeur: oui
    note: "Hébergement et accompagnement de jeunes exilé·es vers leurs droits fondamentaux : le lieu sert un intérêt général social manifeste qui dépasse ses occupant·es."
  - critere: ancrage_territorial
    valeur: oui
    note: "L'association est ancrée dans le Gaillacois, participe à des événements locaux et s'appuie sur un large réseau de soutien et de familles solidaires."
  - critere: usage_non_marchand
    valeur: oui
    note: "L'accueil et l'hébergement des jeunes sont gratuits ; le projet est autofinancé par des événements de soutien (concerts, repas, projections)."
  - critere: loyer_non_rentier
    valeur: inconnu
    note: "Le montant et l'existence d'une redevance versée à Antidote par L'Antre Toit ne sont pas documentés par les sources."
  - critere: securite_jouissance
    valeur: oui
    note: "L'usage est confié par bail emphytéotique de longue durée, qui sécurise la jouissance du lieu bien au-delà du plafond de 30 ans des démembrements civils."
  - critere: milieu_protege
    valeur: non
    note: "Aucun dispositif de protection durable et opposable du milieu (clause environnementale au bail, ORE, statut protégé) n'est documenté pour cette maison urbaine de Gaillac."
  - critere: vivant_finalite
    valeur: non
    note: "La vocation du lieu est l'accueil et l'accompagnement de jeunes exilé·es ; le vivant non-humain n'apparaît pas parmi les finalités déclarées."
  - critere: usage_non_degradant
    valeur: inconnu
    note: "Le lieu est une maison d'habitation d'environ 100 m² en ville ; les pratiques d'entretien et leur effet sur le fonds ne sont pas documentés."
  - critere: place_au_vivant
    valeur: non
    note: "À l'échelle d'un lieu d'habitat urbain, l'existence d'une cour, d'un pied d'immeuble végétalisé ou de tout espace laissé au vivant n'est pas documentée par les sources."
