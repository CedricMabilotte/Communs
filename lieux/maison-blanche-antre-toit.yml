  synthese: >
    La Maison Blanche illustre le modèle Antidote appliqué à un lieu d'accueil
    social urbain : un bâtiment sanctuarisé par un fonds de dotation, confié
    par bail long à une association d'usager·es, au service de l'hébergement de
    jeunes exilé·es. Sa marge de progression tient à l'explicitation du bail et
    de l'articulation entre les deux associations.
