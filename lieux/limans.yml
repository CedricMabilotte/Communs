uid: limans
categorie: lieu
nom: "Longo Maï — Limans"
sous_titre: "Coopérative fondatrice de Longo Maï, sur 270 hectares protégés"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Limans"
  departement: "Alpes-de-Haute-Provence (04)"
  region: "Provence-Alpes-Côte d'Azur"
  geoportail: "https://www.geoportail.gouv.fr/carte?c=5.7311,43.9852&z=16"
annee: 1973
url: "https://www.prolongomaif.ch/"
resume: >
  Site fondateur du réseau Longo Maï, près de Forcalquier. En juillet 1973, une
  vingtaine de jeunes venu·es de deux collectifs militants — Spartakus et Hydra,
  dans l'esprit de Mai 68 — rachètent par une collecte un domaine de 270
  hectares pour y établir une coopérative rurale autogérée d'inspiration
  libertaire. La terre est aujourd'hui détenue de façon inaliénable par le Fonds
  de Terre Européenne ; la coopérative autogérée en assure l'usage : élevage
  ovin, agriculture, vigne, transformation (conserves, laine, cosmétiques),
  artisanat et accueil.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: cooperatives-longo-mai
      titre: convention
      note: "Titre précis non documenté par les sources : les actes formalisant l'usage collectif liant la coopérative au foncier de la fondation ne sont pas détaillés."
  description: >
    Le foncier de Limans est détenu de façon inaliénable par le Fonds de Terre
    Européenne, fondation de droit suisse qui protège la propriété des
    terres de Longo Maï. La coopérative autogérée, de statut associatif, en
    assure l'usage et la gouverne collectivement. Le démembrement
    nue-propriété/usufruit au sens du droit français n'est pas formalisé : il
    s'agit d'une propriété protégée en fondation et d'un usage collectif.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Foncier protégé de manière inaliénable dans une fondation de droit
    suisse ; usage collectif autogéré dont la formalisation contractuelle n'est
    pas documentée.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "Les 270 hectares sont détenus de façon inaliénable par le Fonds de Terre Européenne, à l'abri de la spéculation."
  - critere: montage_documente
    valeur: partiel
    note: "Le principe — propriété en fondation, usage par la coopérative — est public, mais les actes formalisant l'usage ne sont pas détaillés."
  - critere: irreversibilite
    valeur: oui
    note: "La fondation détient le foncier de façon explicitement inaliénable depuis des décennies."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le domaine a été racheté en 1973 par une collecte militante, hors toute logique de plus-value."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Le foncier est détenu par une fondation sans capital appropriable : aucune part ne porte la valeur foncière."
  - critere: non_lucratif_global
    valeur: oui
    note: "Fondation et coopérative autogérée de statut associatif ne captent aucune plus-value foncière privée."
  - critere: montage_non_commercial
    valeur: oui
    note: "La chaîne ne comporte aucune société commerciale : une fondation porte le foncier, un collectif associatif autogéré en assure l'usage."
  - critere: gouvernance_collective
    valeur: oui
    note: "La coopérative fonctionne en autogestion depuis 1973 : les usager·es décident collectivement, dans une tradition libertaire."
  - critere: tripartisme
    valeur: non
    note: "La gouvernance repose sur les coopérant·es ; l'association du voisinage ou des pouvoirs publics n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "Le site fonctionne de façon continue depuis 1973, mais les dispositifs explicites de transmission et de renouvellement ne sont pas décrits."
  - critere: usage_interet_general
    valeur: partiel
    note: "Élevage, agriculture, transformation et accueil ont une portée collective ; l'ouverture au-delà du cercle des coopérant·es n'est pas explicitée."
  - critere: ancrage_territorial
    valeur: partiel
    note: "Site fondateur ancré localement depuis un demi-siècle ; le degré d'ouverture au territoire n'est pas documenté."
  - critere: usage_non_marchand
    valeur: partiel
    note: "L'autogestion et les activités collectives relèvent d'une logique de partage, mais une part marchande (vente de produits transformés) coexiste."
  - critere: loyer_non_rentier
    valeur: inconnu
    note: "L'existence et la nature d'un loyer ou d'une redevance entre la fondation et la coopérative ne sont pas documentées."
  - critere: securite_jouissance
    valeur: partiel
    note: "Le foncier est protégé de façon inaliénable et le site fonctionne depuis 1973, mais les actes formalisant la durée de l'usage ne sont pas documentés."
  - critere: milieu_protege
    valeur: non
    note: "La détention inaliénable par la fondation protège la propriété mais n'est pas un dispositif de protection du milieu ; aucune ORE, clause environnementale ou statut d'espace protégé n'est documenté."
  - critere: vivant_finalite
    valeur: non
    note: "Les sources décrivent une coopérative d'autosubsistance — élevage, agriculture, transformation, artisanat — sans mention du vivant non-humain parmi les finalités déclarées."
  - critere: usage_non_degradant
    valeur: inconnu
    note: "Le site pratique élevage ovin, céréales et vigne dans une logique d'autosubsistance, mais les sources ne précisent ni label bio ni mode de conduite : l'effet des pratiques sur le fonds n'est pas attesté."
  - critere: place_au_vivant
    valeur: non
    note: "Le domaine de 270 hectares comporte des terres labourables et de la forêt, mais aucun espace effectivement dédié au vivant non-humain (haies, mares, friches) n'est documenté."
  - critere: travail_non_marchandise
    valeur: oui
    note: "Coopérative autogérée d'inspiration libertaire depuis 1973 : les coopérant·es travaillent en autogestion, hors rapport salarial."
analyse:
  forces:
    - "Foncier protégé de façon inaliénable depuis 1973."
    - "Autogestion effective et continue depuis un demi-siècle."
    - "Activités diversifiées assurant une réelle autonomie au collectif."
  fragilites:
    - "Propriété portée par une fondation de droit suisse, hors cadre juridique français."
    - "Gouvernance centrée sur les coopérant·es, peu ouverte au voisinage."
    - "Formalisation contractuelle de l'usage non documentée."
  leviers:
    - "Documenter publiquement les actes liant la fondation et la coopérative."
    - "Organiser explicitement l'accueil de nouveaux·elles entrant·es."
    - "Articuler la gouvernance avec le territoire et les collectivités."
  synthese: >
    Limans est le berceau de Longo Maï : un foncier protégé en fondation et
    une autogestion libertaire qui dure depuis 1973. Sa singularité — recours au
    droit suisse, gouvernance centrée sur les coopérant·es — gagnerait en
    ancrage à s'ouvrir davantage au territoire.
fiabilite: >
  Faits vérifiés (sources Pro Longo Maï, Wikipédia et presse spécialisée,
  consultées en mai 2026) : fondation du réseau à Limans en juillet 1973, achat
  d'un domaine de 270 hectares par une collecte militante, collectifs fondateurs
  Spartakus et Hydra, autogestion d'inspiration libertaire, activités d'élevage,
  d'agriculture et de transformation, détention inaliénable du foncier par le
  Fonds de Terre Européenne. Non confirmé : actes formalisant l'usage, existence
  d'un loyer, dispositifs de transmission.
chaine:
  porteurs: [fonds-terre-europeenne]
  usufruitiers: [cooperatives-longo-mai]
sources:
