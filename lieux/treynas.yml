resume: >
  Communauté du réseau Longo Maï installée au hameau de Treynas, à environ 970
  mètres d'altitude au bout de la vallée de l'Eyrieux, en Ardèche. Issu d'une
  première vague de militant·es de 1968, le collectif rejoint le réseau des
  coopératives Longo Maï à la fin des années 1980. Le site s'étend sur environ
  200 hectares, dont une moitié de forêt, et fait vivre une trentaine de
  personnes. Les activités principales sont la sylviculture — exploitation
  d'une douglasaie, scierie produisant poutres et planches — ainsi que
  l'agriculture, le maraîchage et l'élevage. Le foncier est détenu de façon
  inaliénable par le Fonds de Terre Européenne ; la coopérative autogérée en
  assure l'usage.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: cooperatives-longo-mai
      titre: convention
      note: "Titre précis non documenté par les sources : les actes formalisant l'usage de Treynas ne sont pas détaillés."
  description: >
    Le foncier de Treynas est détenu de façon inaliénable par le Fonds de Terre
    Européenne, fondation de droit suisse qui sanctuarise la propriété des
    terres de Longo Maï. La coopérative autogérée, de statut associatif, en
    assure l'usage et la gouverne collectivement. Le démembrement
    nue-propriété/usufruit au sens du droit français n'est pas formalisé : il
    s'agit d'une propriété sanctuarisée en fondation et d'un usage collectif.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Foncier sanctuarisé de manière inaliénable dans une fondation de droit
    suisse ; usage collectif autogéré dont la formalisation contractuelle n'est
    pas documentée.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "Les quelque 200 hectares sont détenus de façon inaliénable par le Fonds de Terre Européenne, à l'abri de la spéculation."
  - critere: montage_documente
    valeur: partiel
    note: "Le principe — propriété en fondation, usage par la coopérative — est public, mais les actes formalisant l'usage de Treynas ne sont pas détaillés."
  - critere: irreversibilite
    valeur: oui
    note: "Le Fonds de Terre Européenne détient le foncier de Longo Maï de façon explicitement inaliénable."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le site, repris par un collectif issu de 1968 puis rattaché à Longo Maï, n'a pas été acquis dans une logique de plus-value."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Le foncier est détenu par une fondation sans capital appropriable : aucune part ne porte la valeur foncière."
  - critere: non_lucratif_global
    valeur: oui
    note: "Fondation et coopérative autogérée de statut associatif ne captent aucune plus-value foncière privée."
  - critere: montage_non_commercial
    valeur: oui
    note: "La chaîne ne comporte aucune société commerciale : une fondation porte le foncier, un collectif associatif autogéré en assure l'usage."
  - critere: gouvernance_collective
    valeur: oui
    note: "La trentaine de personnes du hameau décide collectivement, sans hiérarchie ni salariat, dans la tradition libertaire de Longo Maï."
  - critere: tripartisme
    valeur: non
    note: "La gouvernance repose sur les coopérant·es ; l'association du voisinage ou des pouvoirs publics n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "Le site fonctionne de façon continue depuis la fin des années 1980 et a connu un passage de génération, mais les dispositifs explicites de transmission ne sont pas décrits."
  - critere: usage_interet_general
    valeur: partiel
    note: "Sylviculture, scierie et agriculture entretiennent un territoire de montagne et une activité collective ; l'ouverture au-delà du réseau n'est pas pleinement explicitée."
  - critere: ancrage_territorial
    valeur: partiel
    note: "Le hameau perpétue une vie rurale dans une vallée de montagne enclavée ; le degré d'ouverture au territoire n'est pas documenté."
  - critere: usage_non_marchand
    valeur: partiel
    note: "L'autogestion et l'absence de propriété individuelle relèvent d'une logique de partage, mais une part marchande coexiste (vente de bois sciés)."
  - critere: loyer_non_rentier
    valeur: inconnu
    note: "L'existence et la nature d'un loyer ou d'une redevance entre la fondation et la coopérative ne sont pas documentées."
  - critere: securite_jouissance
    valeur: partiel
    note: "Le foncier est sanctuarisé de façon inaliénable et le site fonctionne depuis la fin des années 1980, mais les actes formalisant la durée de l'usage ne sont pas documentés."
  - critere: milieu_protege
    valeur: inconnu
    note: "Le site mêle forêt et terres agricoles, mais aucun dispositif opposable et durable de protection du milieu (ORE, espace protégé, clause environnementale) n'est documenté pour le foncier de Treynas."
  - critere: vivant_finalite
    valeur: partiel
    note: "La gestion d'une forêt de 100 hectares et l'agriculture entretiennent un milieu de montagne, mais la préservation de la biodiversité non-humaine n'est pas affichée comme une finalité propre du lieu dans les sources."
  - critere: usage_non_degradant
    valeur: partiel
    note: "L'agriculture et le maraîchage relèvent de pratiques de maintien, mais la sylviculture porte sur une douglasaie, plantation résineuse exploitée, dont le caractère régénérant n'est pas documenté : pratiques mixtes."
  - critere: place_au_vivant
    valeur: partiel
    note: "Le site comporte une forêt et un milieu de montagne au bout d'une vallée enclavée, mais aucun aménagement explicite en faveur du vivant ni gestion conservatoire de la forêt n'est documenté."
analyse:
  forces:
    - "Foncier de 200 hectares sanctuarisé de façon inaliénable."
    - "Sylviculture intégrée et autogérée, de la forêt à la scierie."
    - "Autogestion sans hiérarchie ni salariat, avec passage de génération réussi."
  fragilites:
    - "Propriété portée par une fondation de droit suisse, hors cadre juridique français."
    - "Gouvernance centrée sur les coopérant·es, peu ouverte au voisinage."
    - "Formalisation contractuelle de l'usage non documentée ; date d'intégration au réseau imprécise."
  leviers:
    - "Documenter publiquement les actes liant la fondation et la coopérative."
    - "Préciser les dispositifs d'accueil de nouveaux·elles entrant·es."
    - "Articuler la gouvernance avec le territoire et les collectivités."
  synthese: >
    Treynas est un site forestier de Longo Maï : 200 hectares de montagne
    sanctuarisés en fondation, une douglasaie et une scierie autogérées. Sa
    singularité — droit suisse, autogestion sans hiérarchie — gagnerait en
    lisibilité à voir son montage et son histoire mieux documentés.
fiabilite: >
  Faits vérifiés (sources Pro Longo Maï, Réseau pour les Alternatives
  Forestières et presse, consultées en mai 2026) : hameau de Treynas à environ
  970 mètres d'altitude dans la vallée de l'Eyrieux, site d'environ 200
  hectares dont une moitié de forêt, activités de sylviculture, scierie et
  agriculture, trentaine de personnes, rattachement au réseau Longo Maï à la
  fin des années 1980, foncier détenu par le Fonds de Terre Européenne. Non
  confirmé : année exacte d'intégration au réseau (estimée à 1989), commune de
  rattachement précise, actes formalisant l'usage, existence d'un loyer.
