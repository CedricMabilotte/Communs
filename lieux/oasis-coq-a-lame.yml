categorie: lieu
nom: "Oasis du Coq à l'Âme"
sous_titre: "Écolieu charentais accompagné par la Coopérative Oasis, futur ÉcoQuartier citoyen"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Cellettes"
  departement: "Charente (16)"
  region: "Nouvelle-Aquitaine"
