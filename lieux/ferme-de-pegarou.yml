uid: ferme-de-pegarou
categorie: lieu
nom: "Ferme de Pégarou"
sous_titre: "Ferme collective de maraîchage, céréales et brassage sur foncier Terre de Liens, en Ariège"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "La Bastide-de-Besplas"
  departement: "Ariège (09)"
  region: "Occitanie"
