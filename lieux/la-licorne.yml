    valeur: partiel
    note: "L'usage est confié par bail rural moyennant un fermage ; les actions de la Foncière ne versent pas de dividende, mais le niveau du fermage n'est pas documenté."
  - critere: securite_jouissance
    valeur: oui
    note: "L'usage est confié par bail rural, dont le renouvellement est d'ordre public : le collectif dispose d'une jouissance durable et sécurisée."
  - critere: milieu_protege
    valeur: oui
    note: "L'usage est confié par un bail rural environnemental selon le cadre Terre de Liens : dispositif opposable et durable inscrivant la préservation du milieu dans le contrat de location."
  - critere: vivant_finalite
    valeur: partiel
    note: "La conduite en agriculture biologique limite les atteintes au milieu, mais la vocation documentée est nourricière ; l'accueil de la biodiversité non-humaine n'est pas affiché parmi les finalités."
  - critere: usage_non_degradant
    valeur: oui
    note: "Polyculture-élevage, maraîchage et céréales conduits en agriculture biologique : pratiques de prélèvement sans intrants de synthèse, entretenant la capacité du sol à se régénérer."
  - critere: place_au_vivant
    valeur: non
    note: "Ferme de quelque 50 hectares de polyculture-élevage près des gorges de la Sioule, milieu diversifié ; aucun aménagement écologique délibéré (haies, mares) n'est documenté par les sources."
