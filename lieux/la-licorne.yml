  synthese: >
    La Licorne illustre une acquisition récente du modèle Terre de Liens : un
    foncier de polyculture-élevage protégé fin 2024 par l'épargne citoyenne
    et confié par bail rural à un collectif paysan en GAEC. Sa principale
    réserve tient à la nature sociétaire du porteur, la Foncière, et aux angles
    morts d'une ferme acquise depuis peu.
fiabilite: >
  Faits vérifiés (sources Terre de Liens Auvergne, consultées en mai 2026) :
  ferme de polyculture-élevage au lieu-dit Péraclos à Chouvigny, environ 50
  hectares acquis par la Foncière Terre de Liens fin 2024, 18e ferme portée par
  Terre de Liens en Auvergne, collecte d'épargne citoyenne couvrant environ 60 %
  du prix, cinq associé·es, activités d'élevage, maraîchage, céréales,
  boulangerie et transformation fromagère, marché à la ferme. Non confirmé :
  surface exacte (50 ha annoncés, mention secondaire de 54 ha), niveau du
  fermage, statut précis du bail, dispositifs de transmission du GAEC.
