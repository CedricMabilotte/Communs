resume: >
  Ferme collective de polyculture-élevage située au lieu-dit Péraclos, sur la
  commune de Chouvigny, près des gorges de la Sioule. Ses quelque 50 hectares
  ont été acquis fin 2024 par la Foncière Terre de Liens, grâce à une collecte
  d'épargne citoyenne couvrant environ 60 % du prix total. C'est la 18e ferme
  portée par Terre de Liens en Auvergne. Le foncier, retiré du marché, est
  confié par bail rural au collectif qui l'exploite : cinq associé·es y
  conduisent élevage (vaches, brebis, porcs, volailles), maraîchage, céréales,
  boulangerie paysanne et transformation fromagère, avec un marché à la ferme.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: gaec-de-la-licorne
      titre: bail_rural
      note: "Bail rural environnemental selon le cadre Terre de Liens ; statut précis du bail non confirmé par les sources."
  description: >
    Le foncier de la Licorne — environ 50 hectares — a été acquis fin 2024 par
    la Foncière Terre de Liens, structure non spéculative qui mobilise l'épargne
    solidaire citoyenne pour retirer les terres du marché. Son usage est confié
    par bail rural — un bail rural environnemental selon le cadre Terre de Liens
    — au collectif paysan qui l'exploite, structuré en GAEC. La Foncière reste
    propriétaire durable ; le GAEC n'achète pas la terre et n'en capte pas la
    valeur.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Foncier protégé par une structure non spéculative ; le porteur, la
    Foncière Terre de Liens, est toutefois une société en commandite par
    actions à actionnariat solidaire et lucrativité encadrée.
grille:
  - critere: foncier_hors_marche
