    valeur: inconnu
    note: "Les dispositifs de transmission de la ferme et de renouvellement des associé·es du GAEC ne sont pas documentés par les sources consultées."
  - critere: usage_interet_general
    valeur: oui
    note: "Polyculture-élevage nourricière, maraîchage, boulangerie et transformation fromagère en agriculture biologique : le lieu sert un intérêt général agricole et alimentaire."
  - critere: ancrage_territorial
    valeur: oui
    note: "La ferme tient un marché à la ferme et accueille des activités d'agritourisme, ouverts au territoire et au public."
