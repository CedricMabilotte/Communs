resume: >
  À Mâlain, village de 740 habitant·es à 20 km à l'ouest de Dijon, la mairie a
  permis l'accès à un bâtiment d'environ 800 m² habitables et à 3 hectares de
  terres agricoles, face à la gare. Les futurs habitant·es créent en 2015 deux
  sociétés civiles distinctes — le GFA Citoyen Champs Libres pour les terres
  (36 000 euros collectés auprès de 103 personnes) et la SCI Le Convivium de
  Mâlain pour le bâtiment — puis l'association Risomes en 2016 pour animer le
  lieu. S'y développent un café associatif (Le Chauffe-Savates, 2019), une
  microbrasserie bio (La Roche-Aiguë, 2017), une boulangerie paysanne (2016),
  du maraîchage, un élevage de poules et un festival biennal réunissant environ
  1 300 personnes à sa première édition (2017). Montage réel et documenté,
  mais aux verrous statutaires incertains : deux sociétés civiles (GFA, SCI)
  dont le régime des parts n'est pas publié, et une SCI non identifiée au
  registre sous ce nom lors de la vérification du 2026-11-08.
montage:
  type: propriete_collective
  articulations:
    - usufruitier: association-risomes
      titre: convention
      note: "Titre précis non documenté : la nature et la durée du titre liant Risomes à la SCI Le Convivium de Mâlain ne sont pas publiées."
  description: >
    Le foncier de Mâlain est porté par deux sociétés civiles distinctes créées
    par les futurs usager·es en 2015 : le GFA Citoyen Champs Libres pour les 3
    hectares de terres agricoles, et la SCI Le Convivium de Mâlain pour le
    bâtiment. L'association Risomes, créée en 2016, anime le bâtiment et une
    partie des terres. Les terres agricoles sont par ailleurs louées
    directement, par bail rural, à des exploitant·es individuel·les — un
    paysan-boulanger depuis 2016, un·e maraîcher·e depuis 2019, un·e
    éleveuse de poules depuis 2017 — dont les sources consultées ne donnent
    que le prénom : ces preneurs ne sont pas modélisés en personne morale
    distincte dans ce corpus (règle #11 — empreinte publique insuffisante
    pour une fiche nommée), mais leur activité réelle est mentionnée ici pour
    la complétude du tableau.
integrite_montage:
  niveau: economie_marchande
  commentaire: >
    Montage ancien (2015-2016) et documenté dans son principe — deux sociétés
    civiles citoyennes et une association d'animation — mais dont la nature
    de l'intérêt (`nature_interet`) des deux porteurs reste `inconnu`, faute
    de statuts publiés : le verdict calculé du lieu ne peut donc pas être
    établi en l'état (chaîne non entièrement qualifiée), et le pôle affiché
    ici est délibérément prudent plutôt qu'aspirationnel. Proche dans
    l'esprit du commun citoyen (collecte de 103 personnes, gouvernance par
    cogérant·es élu·es), sans les garanties structurelles — ni la
    vérification — des montages à fonds de dotation ou fondation du corpus.
grille:
