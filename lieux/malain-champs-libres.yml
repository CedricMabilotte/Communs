    note: "Le projet est centré sur l'activité humaine (agriculture vivrière, animation) ; les sources ne documentent pas d'espace dédié ou laissé au vivant non-humain."
analyse:
  forces:
    - "Montage citoyen ancien (2015) et toujours actif dix ans plus tard, avec une diversité d'activités réelles."
    - "Collecte citoyenne réussie (103 personnes, 36 000 euros) pour l'acquisition des terres."
    - "Facilitation initiale par la commune, qui a permis l'accès au bâtiment et aux terres."
  fragilites:
    - "Deux sociétés civiles à capital (GFA, SCI) sans clause d'inaliénabilité ni de non-cessibilité des parts documentée."
    - "SCI Le Convivium de Mâlain non identifiée au registre national des entreprises sous ce nom (vérification du 2026-11-08)."
    - "Aucune dimension de protection du vivant non-humain, à la différence d'autres lieux du corpus."
  leviers:
    - "Publier les statuts du GFA et de la SCI, en particulier le régime des parts."
    - "Documenter le titre d'usage liant Risomes à la SCI et au GFA."
    - "Clarifier l'identité juridique exacte de la SCI (dénomination, SIREN)."
  synthese: >
    Mâlain est un cas réel et documenté de « champs libres » citoyens — un
    village qui s'est doté, par souscription, d'un GFA et d'une SCI pour
    sécuriser un tiers-lieu rural actif depuis dix ans. Mais le montage
    emprunte aux sociétés civiles à capital plutôt qu'aux formes non
    lucratives verrouillées du cœur du corpus (fonds de dotation, fondation,
    propriété publique inaliénable) : son inclusion illustre, par comparaison,
    la fragilité structurelle des formules à parts déjà identifiée par la
    revue mémoire du projet.
fiabilite: >
  Faits vérifiés (source Reporterre, consultée le 2026-11-08, et recherche-
  entreprises.api.gouv.fr) : village de 740 habitant·es, accès facilité par la
  mairie à un bâtiment de ~800 m² et 3 ha de terres, création du GFA Citoyen
  Champs Libres (SIREN 812835882) et de la SCI Le Convivium de Mâlain en 2015,
  association Risomes (SIREN 820566511) créée en 2016, café Le Chauffe-Savates
  ouvert début 2019, microbrasserie La Roche-Aiguë depuis 2017, boulangerie
  paysanne depuis 2016, maraîchage depuis 2019, élevage de poules depuis 2017,
  festival Atout bout d'champ (~1 300 entrées en 2017). Non confirmé : statuts
  des trois entités, SIREN de la SCI, titres d'usage précis, régime des parts.
