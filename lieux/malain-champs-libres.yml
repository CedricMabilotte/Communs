    note: "Aucun dispositif d'inaliénabilité, de droit de veto ou de clause anti-spéculative n'est documenté pour le GFA ou la SCI."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le foncier a été acquis par une collecte citoyenne (103 personnes, 36 000 euros pour le GFA) dans une logique déclarée d'accès à la terre, non de placement."
  - critere: parts_non_cessibles
    valeur: inconnu
    note: "Le régime de cessibilité des parts du GFA et de la SCI n'est pas documenté par les sources consultées."
  - critere: milieu_protege
    valeur: non
    note: "Aucun dispositif opposable de protection du milieu (ORE, espace protégé, clause environnementale) n'est documenté."
  - critere: non_lucratif_global
    valeur: partiel
    note: "L'association Risomes est non lucrative, mais le GFA et la SCI sont des sociétés civiles à capital dont le régime de lucrativité effective n'est pas documenté."
  - critere: montage_non_commercial
    valeur: non
    note: "La chaîne comporte deux sociétés civiles à capital (GFA, SCI), bien que de nature civile et non commerciale au sens strict du droit des sociétés — à distinguer d'une SAS ou SCIC commerciale."
  - critere: gouvernance_collective
    valeur: partiel
    note: "Le GFA est administré par cinq cogérant·es élu·es et Risomes s'organise en huit « groupes action » ; l'articulation entre souscripteur·ices du GFA/SCI et usager·es de Risomes n'est pas détaillée."
  - critere: tripartisme
    valeur: partiel
    note: "La mairie de Mâlain a facilité l'accès initial au bâtiment et aux terres ; son association continue à la gouvernance du lieu n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: inconnu
    note: "Les dispositifs de transmission et de renouvellement des cogérances et des groupes action ne sont pas documentés."
  - critere: travail_non_marchandise
    valeur: partiel
    note: "Le lieu mêle travail bénévole associatif (Risomes, La Milpa) et activités salariées ou indépendantes tarifées (café, brasserie, boulangerie paysanne)."
  - critere: usage_interet_general
    valeur: oui
    note: "Éducation populaire, animation locale, relocalisation alimentaire (boulangerie, maraîchage, troc de graines) : vocation d'intérêt général social et culturel."
  - critere: ancrage_territorial
    valeur: oui
    note: "Le lieu est ouvert au village (740 habitant·es) et au-delà : café, festival biennal (~1 300 entrées en 2017), activités agricoles vendues localement."
  - critere: vivant_finalite
    valeur: non
    note: "Aucune finalité de préservation de la biodiversité n'est affichée ; le projet est centré sur l'agriculture paysanne et l'animation sociale et culturelle."
  - critere: usage_non_marchand
    valeur: partiel
    note: "Les activités d'éducation populaire et de troc relèvent du non-marchand ; le café, la brasserie et la boulangerie sont des activités commerciales tarifées."
  - critere: loyer_non_rentier
    valeur: inconnu
    note: "Les montants des loyers versés par les preneurs de baux ruraux ne sont pas documentés."
  - critere: securite_jouissance
    valeur: partiel
    note: "Les baux ruraux bénéficient du statut protecteur du fermage (ordre public) ; le titre liant Risomes à la SCI n'est pas documenté."
  - critere: usage_non_degradant
    valeur: inconnu
    note: "Les pratiques agricoles précises (conduite en bio ou non pour l'ensemble des activités) ne sont pas détaillées par les sources consultées."
  - critere: place_au_vivant
