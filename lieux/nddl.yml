nom: "ZAD de Notre-Dame-des-Landes"
sous_titre: "Bocage acquis par un fonds de dotation après l'abandon de l'aéroport"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Notre-Dame-des-Landes"
  departement: "Loire-Atlantique (44)"
  region: "Pays de la Loire"
