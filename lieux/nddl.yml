  - critere: parts_non_cessibles
    valeur: oui
    note: "Le foncier est porté par un fonds de dotation, sans capital social ni parts ; les dons sont irrévocables et ne confèrent aucun titre : aucune captation possible de la valeur foncière."
  - critere: usage_interet_general
    valeur: oui
    note: "Agriculture, préservation du bocage et activités collectives servent un intérêt général écologique et social."
  - critere: non_lucratif_global
    valeur: oui
    note: "Le fonds de dotation est non lucratif et les dons ne donnent pas de parts de capital ; aucune plus-value foncière n'est captée."
  - critere: ancrage_territorial
    valeur: oui
    note: "Le projet s'inscrit dans le bocage de Notre-Dame-des-Landes et les activités collectives issues de la lutte."
  - critere: gouvernance_collective
    valeur: partiel
    note: "L'usage relève de collectifs d'habitant·es, mais l'articulation avec la gouvernance du fonds n'est pas documentée."
  - critere: tripartisme
    valeur: inconnu
    note: "L'association formelle du voisinage et des pouvoirs publics à la gouvernance n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: inconnu
    note: "Les dispositifs de transmission et de renouvellement ne sont pas décrits par les sources consultées."
  - critere: montage_non_commercial
    valeur: oui
    note: "La chaîne ne comporte aucune société commerciale : le foncier est porté par le fonds de dotation « La Terre en commun », non lucratif, et l'usage relève de collectifs d'habitant·es."
  - critere: usage_non_marchand
    valeur: partiel
    note: "Les activités collectives nées de la lutte relèvent d'une logique de commun et de partage, mais le régime précis d'accès au lieu et à ses fruits n'est pas documenté."
  - critere: loyer_non_rentier
    valeur: inconnu
    note: "Les montages d'usage parcelle par parcelle et l'existence éventuelle d'une redevance ne sont pas confirmés par les sources."
  - critere: securite_jouissance
    valeur: inconnu
    note: "La nature et la durée des titres d'usage des collectifs d'habitant·es ne sont pas documentées ; les conventions d'usage ne sont pas confirmées."
  - critere: milieu_protege
    valeur: partiel
    note: "Les terres agricoles de la commune sont depuis 2019 dans un périmètre de protection des espaces agricoles et naturels, qui freine l'urbanisation ; mais aucun dispositif opposable spécifique (ORE, classement) attaché aux terres du fonds de dotation n'est documenté."
  - critere: vivant_finalite
    valeur: oui
    note: "Le fonds de dotation a été créé pour soustraire les terres à l'agriculture intensive et préserver le bocage humide ; la préservation de cette biodiversité remarquable est une finalité affichée et agie du lieu."
  - critere: usage_non_degradant
    valeur: oui
    note: "Les activités agricoles nées de la lutte récusent l'agriculture intensive ; le maintien du bocage et des pratiques non extractives est un objectif explicite du projet."
  - critere: place_au_vivant
    valeur: oui
    note: "Le bocage humide — haies, mares, prairies — est conservé comme tel ; les naturalistes y ont relevé des populations-sources d'espèces protégées, et le lieu fait du maintien de ce milieu une part centrale de son projet."
analyse:
  forces:
    - "Foncier acquis par un fonds de dotation non lucratif, sur la base de dons."
    - "Forte dynamique collective issue de la lutte et de l'usage du bocage."
    - "Outil juridique (fonds de dotation) éprouvé pour soustraire la terre au marché."
