resume: >
  Bocage de l'ancien projet d'aéroport, abandonné en 2018, sur les communes de
  Notre-Dame-des-Landes et alentour. Le fonds de dotation « La Terre en commun »
  a été créé fin 2018 pour acquérir bâtis et terres mis en vente et les soustraire
  à l'appropriation privée et à l'agriculture intensive. Environ 700 000 euros
  avaient été collectés moins d'un an après sa création. Les collectifs
  d'habitant·es et les activités collectives nées de la lutte en assurent l'usage.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: assemblee-des-usages-nddl
      titre: convention
      note: "Titre non documenté : l'usage relève des collectifs d'habitant·es et des activités collectives nées de la lutte, mais les actes liant le fonds de dotation aux usager·es, parcelle par parcelle, ne sont pas confirmés par les sources consultées."
  description: >
    Le fonds de dotation « La Terre en commun », personne morale créée par la loi
    du 4 août 2008, acquiert progressivement bâtis et terres pour en faire une
    propriété collective au service du bien commun. L'usage relève de collectifs
    d'habitant·es ; les détails des montages d'usage parcelle par parcelle ne sont
    pas confirmés par les sources consultées.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Foncier porté par un fonds de dotation non lucratif ; la solidité dépend de
    statuts (dotation consomptible ou non) qui ne sont pas détaillés par les
    sources.
grille:
  - critere: foncier_hors_marche
