  leviers:
    - "Sécuriser une dotation non consomptible rendant le foncier inaliénable."
    - "Documenter et publier les montages d'usage et la gouvernance."
    - "Formaliser des conventions d'usage entre le fonds et les collectifs."
  synthese: >
    Notre-Dame-des-Landes montre la capacité d'un fonds de dotation à racheter
    un foncier convoité. La solidité du verrou dépendra du caractère non
    consomptible de la dotation et d'une articulation lisible avec les usager·es.
fiabilite: >
  Faits vérifiés : abandon du projet d'aéroport en 2018, création du fonds de
  dotation « La Terre en commun » fin 2018, environ 700 000 euros collectés en
  moins d'un an, dons irrévocables sans parts de capital. Non confirmé :
  acquisitions et surfaces récentes 2023-2024, caractère non consomptible de la
  dotation, montages d'usage et gouvernance.
