uid: ecolieu-la-filerie
categorie: lieu
nom: "Écolieu la Filerie"
sous_titre: "Écolieu solognot financé par la Coopérative Oasis, sur un foncier privé en bail à construction"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Controis-en-Sologne"
  departement: "Loir-et-Cher (41)"
  region: "Centre-Val de Loire"
  geoportail: "https://www.geoportail.gouv.fr/carte?c=1.3876,47.4205&z=17"
annee: 2019
url: "https://www.lafilerie.org/"
resume: >
  L'Écolieu la Filerie occupe une ancienne ferme du hameau de la Filerie, en
  Sologne, dans la communauté de communes du Controis-en-Sologne, à une vingtaine
  de kilomètres au sud de Blois — un hectare de terrain au milieu de cent
  hectares de forêt. La famille Bargue, à l'origine du projet, est propriétaire
  des lieux et y habite ; elle a signé un bail à construction de dix-huit ans
  avec la SCIC Les Semeurs de Graines, créée en décembre 2022 et réunissant
  vingt-huit sociétaires en majorité du territoire. Le lieu héberge un centre de
  formation aux métiers de la transition écologique et un centre d'écotourisme,
  ainsi que les ateliers de l'association Fil good ; il est labellisé Fabrique de
  territoire. La Coopérative Oasis a soutenu le projet par un financement de
  150 000 euros au taux de 1,5 % sur huit ans pour rénover des granges, et
  l'accompagne une journée par an.
montage:
  type: propriete_privee_individuelle
  articulations:
    - usufruitier: scic-semeurs-de-graines
      titre: bail_a_construction
      duree: "dix-huit ans"
  description: >
    La propriété de l'Écolieu la Filerie appartient à la famille Bargue, qui
    habite sur place : le foncier n'est pas porté par une structure non
    lucrative dédiée. La SCIC Les Semeurs de Graines occupe le site par un bail
    à construction de dix-huit ans, qui lui confère un droit réel sur les
    constructions qu'elle édifie et la qualité de « quasi-propriétaire » pendant
    cette durée, sans transfert de la propriété du sol. Le montage repose donc
    sur un occupant coopératif lié à un propriétaire privé par un bail de durée
    limitée, et non sur une dissociation propriété non lucrative / usage.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Chaîne dont l'occupant est une SCIC — société coopérative à lucrativité
    encadrée — sur un foncier qui demeure une propriété privée familiale ; pas de
    porteur non lucratif soustrayant le sol au marché.
grille:
  - critere: foncier_hors_marche
    valeur: non
    note: "Le foncier reste la propriété privée de la famille Bargue : il n'est pas porté par une structure non spéculative et n'est pas soustrait au marché."
  - critere: montage_documente
    valeur: oui
    note: "Le montage — propriété familiale, bail à construction de dix-huit ans avec la SCIC Les Semeurs de Graines — est public et documenté par le projet et la Coopérative Oasis."
  - critere: irreversibilite
    valeur: non
    note: "Aucun dispositif d'irréversibilité ne grève le foncier : la propriété privée du sol peut en principe être revendue librement à l'issue du bail."
  - critere: origine_non_speculative
    valeur: partiel
    note: "La rénovation du site repose sur un prêt à taux modéré de la Coopérative Oasis et sur l'épargne citoyenne ; l'acquisition initiale du foncier par la famille n'est pas documentée."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Les parts de la SCIC ne sont pas librement négociables, mais le foncier lui-même demeure une propriété privée librement transmissible."
  - critere: non_lucratif_global
    valeur: partiel
    note: "La SCIC est une coopérative à lucrativité encadrée, mais le foncier est détenu par des particuliers : aucune structure non lucrative ne porte la propriété."
  - critere: montage_non_commercial
    valeur: partiel
    note: "L'occupant est une SCIC, société commerciale à lucrativité encadrée ; le propriétaire est une famille privée — aucun maillon non lucratif dans la chaîne."
  - critere: gouvernance_collective
    valeur: oui
    note: "La SCIC Les Semeurs de Graines fonctionne sur le principe coopératif « une personne, une voix », en cercles de gouvernance, avec vingt-huit sociétaires."
  - critere: tripartisme
    valeur: partiel
    note: "Le lieu est labellisé Fabrique de territoire et ses sociétaires sont en majorité du territoire ; une gouvernance tripartite formalisée n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "La SCIC, ouverte à de nouveaux sociétaires, organise sa durée ; la transmission du foncier au-delà du bail de dix-huit ans n'est pas sécurisée."
  - critere: usage_interet_general
    valeur: oui
    note: "Formation aux métiers de la transition, écotourisme, ateliers de sensibilisation, visites apprenantes : le lieu sert un intérêt général écologique et pédagogique."
  - critere: ancrage_territorial
    valeur: oui
    note: "Sociétaires en majorité du territoire, label Fabrique de territoire, visites apprenantes pour porteurs de projets : le lieu est fortement ancré localement."
  - critere: usage_non_marchand
    valeur: partiel
    note: "Les activités de formation et d'écotourisme relèvent en partie d'une logique marchande, tempérée par la vocation de transition et l'ouverture des ateliers."
  - critere: loyer_non_rentier
    valeur: inconnu
    note: "Le montant de la redevance versée par la SCIC à la famille Bargue au titre du bail à construction n'est pas documenté par les sources."
  - critere: securite_jouissance
    valeur: partiel
    note: "Le bail à construction sécurise la jouissance pour dix-huit ans : durée significative mais bornée, et le renouvellement au-delà n'est pas garanti par les sources."
  - critere: milieu_protege
    valeur: non
    note: "Aucune obligation réelle environnementale ni clause environnementale inscrite au bail à construction n'est documentée ; l'existence d'un dispositif opposable n'est pas établie par les sources."
  - critere: vivant_finalite
    valeur: partiel
    note: "Le lieu affiche une vocation de transition écologique et de formation à ses métiers, mais le vivant non-humain comme cohabitant n'est pas posé explicitement parmi les finalités statutaires."
  - critere: usage_non_degradant
    valeur: oui
    note: "Le site cultive des jardins en permaculture, pratique de maintien et de régénération du sol."
  - critere: place_au_vivant
    valeur: partiel
    note: "Le terrain d'un hectare s'inscrit au milieu de cent hectares de forêt et comporte des jardins en permaculture ; des aménagements dédiés au vivant non-humain ne sont pas davantage documentés."
analyse:
  forces:
    - "Occupant coopératif ancré localement, vingt-huit sociétaires du territoire."
    - "Usage d'intérêt général : formation à la transition et écotourisme."
    - "Financement par l'épargne citoyenne via la Coopérative Oasis, hors logique bancaire."
  fragilites:
    - "Le foncier demeure une propriété privée familiale, hors structure non lucrative."
    - "Bail à construction limité à dix-huit ans : sécurité de jouissance bornée."
    - "Aucun dispositif d'irréversibilité ne soustrait le sol au marché."
  leviers:
    - "Confier le foncier à un porteur non lucratif pour le soustraire au marché."
    - "Sécuriser une jouissance de long terme au-delà des dix-huit ans du bail."
    - "Documenter la redevance et les clauses du bail à construction."
  synthese: >
    L'Écolieu la Filerie est un lieu d'intérêt général vivant et bien ancré, mais
    son montage reste éloigné du modèle de libération des terres : le foncier
    demeure une propriété privée familiale et la SCIC ne l'occupe que par un bail
    à construction de dix-huit ans. La sortie du marché du sol reste à faire.
fiabilite: >
  Faits vérifiés (sources lafilerie.org, Coopérative Oasis et presse, consultées
  en mai 2026) : Écolieu la Filerie dans la communauté de communes du
  Controis-en-Sologne (Loir-et-Cher), un hectare au milieu de cent hectares de
  forêt, propriété des lieux détenue par la famille Bargue qui habite sur place,
  bail à construction de dix-huit ans liant la famille à la SCIC Les Semeurs de
  Graines créée en décembre 2022, vingt-huit sociétaires, centre de formation et
  centre d'écotourisme, association Fil good créée en novembre 2019, label
  Fabrique de territoire, financement de 150 000 euros à 1,5 % sur huit ans par
  la Coopérative Oasis. Non confirmé : montant de la redevance du bail, clauses
  du bail, conditions de renouvellement au-delà de dix-huit ans.
