  fragilites:
    - "Titre d'usage liant l'association au foncier non documenté : sécurité de jouissance inconnue."
    - "Gestion intermédiée par la Coopérative Oasis : articulation directe collectif-porteur non documentée."
    - "Caractère consomptible de la dotation du fonds non confirmé."
  leviers:
    - "Sécuriser et publier un titre d'usage long et direct sur le foncier."
    - "Formaliser une articulation directe entre l'association et le fonds de dotation."
    - "Confirmer le caractère non consomptible de la dotation du fonds."
  synthese: >
    L'Aube est un écolieu d'accueil dont le foncier a été protégé par
    donation à un fonds de dotation : un montage solide côté propriété et
    ouvert par son pôle solidaire. La chaîne est entièrement non lucrative —
    fonds de dotation porteur, association loi 1901 (« L'Aub'ascule »)
    usufruitière. Sa zone d'ombre résiduelle est le titre d'usage liant
    l'association au foncier, qui reste à documenter et à sécuriser.
fiabilite: >
  Faits vérifiés (sources Coopérative Oasis et l'Aubascule, consultées en mai
  2026) : écolieu de l'Aube dans la Drôme aux pieds des Trois Becs, une
  quinzaine d'habitant·es, installation initiale de Louis et Mary à la fin des
  années 1970, donation du lieu en 2022 au fonds de dotation Fraternité pour
  Demain, gestion confiée à la Coopérative Oasis qui y installe le collectif de
  l'Aubascule, trois pôles d'activité, Obligation Réelle Environnementale,
  lieu à l'origine du projet de foncière de la Coopérative Oasis. Forme
  juridique de l'usufruitier établie (registres publics consultés juin 2026) :
  association loi 1901 « L'Aub'ascule », SIREN 938330586, déclarée à la
  préfecture de Die le 12/10/2024, gestion officielle du lieu depuis le 1er
  novembre 2024. Non confirmé : nature et durée du titre d'usage, montant
  d'une éventuelle redevance, caractère consomptible de la dotation. Commune
  identifiée (juin 2026) : Piégros-la-Clastre (26400), au lieu-dit La Motte /
  Les Combeaux (sources Drôme Tourisme, Pages Jaunes, Coopérative Oasis) — le
  champ `commune` reste à renseigner par l'opérateur. Le repère Geoportail est
  centré sur le bourg de Piégros-la-Clastre (zoom élargi z=14) : l'emplacement
  exact de l'écolieu (lieu-dit en combe non géocodable depuis les sources)
  n'étant pas localisable au mètre, la localisation est approximative.
