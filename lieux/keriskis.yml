resume: >
  Keriskis (« chez les chelous » en breton) est un lieu autogéré à la campagne,
  en Centre-Bretagne, ancienne ferme acquise en 2017 puis transmise au fonds de
  dotation Antidote en novembre 2024 — au terme de plusieurs années de travail
  pour la sortir de la propriété privée et pérenniser sa vocation collective. Le
  lieu cherche à générer entraide et lien social entre des personnes qui se
  sentent isolées ou marginalisées dans la ruralité, à faire circuler pratiques
  et connaissances, et à offrir un espace de mise au vert, de rencontres
  politiques et de chantiers collectifs souvent en mixité choisie. Le collectif
  rénove la ferme par chantiers participatifs et mène des activités agricoles
  non marchandes (verger, potager, vannerie, bûcheronnage, transformation des
  fruits) ; il se réunit à chaque saison en assemblée générale, avec des
  commissions thématiques (accessibilité, travaux, juridique).
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: association-keriskis
      titre: bail_emphyteotique
      duree: "longue durée"
      note: "Durée exacte et clauses du bail non confirmées par les sources ; structure gestionnaire non documentée publiquement."
  description: >
    La ferme de Keriskis, acquise en propriété privée en 2017, a été transmise
    par donation au fonds de dotation Antidote en novembre 2024, ce qui la
    soustrait durablement au marché. Comme pour les autres lieux du réseau
    Antidote, l'usage en est confié à une association d'usager·es par un bail
    emphytéotique de longue durée. Le nom et les statuts précis de l'association
    gestionnaire ne sont pas documentés publiquement par les sources consultées.
