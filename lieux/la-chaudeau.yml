  - critere: usage_non_degradant
    valeur: oui
    note: "La ferme est exploitée en maraîchage biologique : pratiques de prélèvement sans recours aux intrants de synthèse, entretenant la capacité du sol à se régénérer."
  - critere: place_au_vivant
    valeur: non
    note: "Ancien site de cresson et de pisciculture remis en culture sur 3,66 hectares ; aucune trace d'aménagement délibéré (haies, mares, friches) pour le vivant non-humain dans les sources."
