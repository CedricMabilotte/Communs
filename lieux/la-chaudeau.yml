    valeur: partiel
    note: "L'usage est confié par bail rural moyennant un fermage ; les actions de la Foncière ne versent pas de dividende, mais le niveau du fermage n'est pas documenté."
  - critere: securite_jouissance
    valeur: oui
    note: "L'usage est confié par bail rural, dont le renouvellement est d'ordre public : l'exploitant dispose d'une jouissance durable et sécurisée."
  - critere: milieu_protege
    valeur: non
    note: "L'usage est confié par bail rural sans que les sources précisent s'il s'agit d'un bail à clauses environnementales ; aucun autre dispositif opposable de protection du milieu n'est documenté."
  - critere: vivant_finalite
    valeur: non
