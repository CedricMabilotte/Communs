  - critere: usage_interet_general
    valeur: oui
    note: "Maraîchage biologique nourricier, remise en culture d'une terre abandonnée et approvisionnement d'une AMAP : le lieu sert un intérêt général agricole et alimentaire."
  - critere: ancrage_territorial
    valeur: oui
    note: "La ferme approvisionne une AMAP de plusieurs dizaines de familles et vend en circuit court à des commerces et restaurants du territoire."
  - critere: usage_non_marchand
    valeur: partiel
