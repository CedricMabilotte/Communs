resume: >
  Ferme maraîchère biologique à Pierre-la-Treiche, petit village près de Toul.
  Ancienne exploitation de cresson et de pisciculture puis ferme maraîchère
  semi-industrielle, le site avait été abandonné après la tempête de 1999 qui
  détruisit ses serres et mit fin à une dizaine d'emplois. En 2013, la Foncière
  Terre de Liens a acquis les 3,66 hectares et les bâtiments grâce à une
  souscription publique d'environ 160 000 euros, retirant la terre du marché et
  la confiant par bail rural à un porteur de projet, Sébastien, en maraîchage
  biologique. La ferme produit légumes, safran, champignons et endives,
  écoulés via une AMAP et en circuit court.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: exploitation-maraichere-la-chaudeau
      titre: bail_rural
  description: >
    Le foncier de la Chaudeau — 3,66 hectares et environ 1 200 m² de bâtiments
    avec espace de vente et de transformation — a été acquis en 2013 par la
    Foncière Terre de Liens, structure non spéculative, grâce à une souscription
    publique citoyenne. Son usage est confié par bail rural au maraîcher
    installé, qui devient fermier de la Foncière. L'exploitation n'est pas
    portée par une structure collective documentée : il s'agit d'une
    exploitation maraîchère individuelle.
integrite_montage:
  niveau: economie_marchande
  commentaire: >
    Foncier protégé par une structure non spéculative ; le porteur, la
    Foncière Terre de Liens, est une société en commandite par actions à
    actionnariat solidaire. L'usage est exploité à titre individuel, sans
    gouvernance collective documentée.
grille:
