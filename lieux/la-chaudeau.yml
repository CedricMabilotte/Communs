  forces:
    - "Foncier protégé hors marché par l'épargne citoyenne depuis 2013."
    - "Remise en culture d'une terre abandonnée après la tempête de 1999."
    - "Maraîchage biologique nourricier ancré dans le territoire via une AMAP."
  fragilites:
    - "Le porteur, la Foncière Terre de Liens, est une société en commandite par actions à actionnariat solidaire."
    - "Exploitation individuelle : pas de gouvernance collective du lieu."
    - "Niveau du fermage et dispositifs de transmission non documentés."
  leviers:
    - "Documenter le niveau du fermage et son caractère soutenable."
    - "Anticiper et formaliser la transmission de la ferme."
    - "Associer plus largement le voisinage et la collectivité à la vie du lieu."
  synthese: >
    La Chaudeau illustre le modèle Terre de Liens appliqué à une installation
    individuelle : un foncier maraîcher abandonné, protégé par l'épargne
    citoyenne et remis en culture par un porteur de projet. Le foncier est
    libéré du marché et l'usage sécurisé, mais l'absence de structure
    collective limite la gouvernance partagée du lieu.
fiabilite: >
  Faits vérifiés (sources Terre de Liens Lorraine, Banque des Territoires et
  presse régionale, consultées en mai 2026) : ferme maraîchère à
  Pierre-la-Treiche, ancien site de cresson et pisciculture abandonné après la
  tempête de 1999, acquisition par la Foncière Terre de Liens en 2013, 3,66
  hectares et environ 1 200 m² de bâtiments, souscription publique d'environ
  160 000 euros, installation d'un maraîcher en agriculture biologique,
  production de légumes, safran, champignons et endives, approvisionnement
  d'une AMAP. Non confirmé : existence d'une structure d'exploitation
  collective, niveau du fermage, dispositifs de transmission.
