uid: villarceaux
categorie: lieu
nom: "Bergerie de Villarceaux"
sous_titre: "Domaine agroécologique du Vexin français"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Chaussy"
  departement: "Val-d'Oise (95)"
  region: "Île-de-France"
