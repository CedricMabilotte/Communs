    note: "L'usufruitier inclut l'EARL du Chemin Neuf, société commerciale d'exploitation agricole dont la non-lucrativité n'est pas établie ; le foncier est en revanche porté par une fondation non lucrative."
  - critere: usage_non_marchand
    valeur: inconnu
    note: "Le régime d'accès à la terre et à ses fruits n'est pas documenté ; l'exploitation agroécologique est conduite par une EARL et le détail des activités de formation et d'accueil n'est pas précisé."
  - critere: loyer_non_rentier
    valeur: inconnu
    note: "Les actes liant la fondation et les structures d'exploitation ne sont pas publiquement détaillés : l'existence et la nature d'un loyer ou d'une redevance ne sont pas documentées."
  - critere: securite_jouissance
    valeur: inconnu
    note: "Le montage d'usage n'est pas un démembrement strict et reste partiellement opaque : la nature et la durée des titres d'usage ne sont pas documentées."
  - critere: milieu_protege
    valeur: partiel
    note: "Le domaine est inclus dans le Parc naturel régional du Vexin français, cadre de protection sans portée directement contraignante sur le foncier ; aucun dispositif opposable spécifique (ORE, classement, clause au bail) n'est documenté."
  - critere: vivant_finalite
    valeur: oui
    note: "La replantation des haies pour abriter oiseaux, faune auxiliaire et pollinisateurs, et le rôle de centre technique de l'agriculture biologique, traduisent une finalité de préservation du vivant affirmée et agie."
  - critere: usage_non_degradant
    valeur: oui
    note: "Ferme de polyculture-élevage conduite en agroécologie depuis le milieu des années 1990, avec agroforesterie : des pratiques de maintien et de régénération attestées."
  - critere: place_au_vivant
    valeur: oui
    note: "Le domaine compte environ 5 km de haies héritées et 8 km de haies plantées, des alignements intra-parcellaires et plus de 650 arbres champêtres, aménagés pour rétablir l'équilibre écologique : une place concrète et substantielle faite au vivant."
  - critere: travail_non_marchandise
    valeur: oui
    note: "Travail-cœur agricole porté par l'EARL du Chemin Neuf, société civile d'exploitation dont l'exploitant travaille la ferme, hors rapport salarial."
analyse:
  forces:
    - "Foncier de grande ampleur durablement détenu par une fondation non lucrative."
    - "Transition agroécologique engagée de longue date, garantie de sécurité foncière."
    - "Pluralité de structures permettant d'articuler exploitation, animation et formation."
  fragilites:
    - "Montage d'usage peu documenté publiquement et non assimilable à un démembrement strict."
    - "Présence d'une EARL, forme commerciale dont la non-lucrativité n'est pas établie."
    - "Gouvernance et dispositifs de transmission non décrits par les sources."
  leviers:
    - "Documenter et publier les actes liant fondation et structures d'usage."
    - "Formaliser l'usage par un bail rural environnemental ou un usufruit explicite."
    - "Ouvrir la gouvernance du lieu au voisinage et au territoire du Vexin."
  synthese: >
    Villarceaux illustre un foncier solidement protégé chez une fondation,
    mais dont le montage d'usage reste partiellement opaque. La consolidation
    passerait par une contractualisation explicite de l'usage et une plus grande
    transparence sur la gouvernance.
fiabilite: >
  Faits vérifiés : propriété du domaine par la FPH, surface d'environ 600 hectares,
  passage en EARL (EARL du Chemin Neuf) en 2005, transition agroécologique,
  cohabitation de six structures juridiques distinctes dont l'association
  Écosite et la coopérative Saveurs du Vexin. Non confirmé : nature exacte des actes d'usage,
  existence d'un démembrement strict, modalités de gouvernance et de transmission.
