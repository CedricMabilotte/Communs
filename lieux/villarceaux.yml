url: "https://www.bergerie-villarceaux.org/"
resume: >
  Domaine d'environ 600 hectares (terres agricoles, forêt, golf, châteaux) situé
  dans le Parc naturel régional du Vexin français, propriété de la Fondation
  Charles Léopold Mayer pour le Progrès de l'Homme. La ferme, d'environ 370
  hectares, est conduite en agroécologie depuis le milieu des années 1990 et
  confiée depuis 2005 à une structure d'exploitation tierce. Six structures
  juridiques distinctes cohabitent sur le site, dont l'exploitation agricole,
  l'association Écosite et la coopérative Saveurs du Vexin.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: ecosite-villarceaux
      titre: convention
      note: "Titre précis non documenté par les sources : les actes liant la fondation aux structures d'usage ne sont pas publiquement détaillés ; le montage n'est pas un démembrement strict."
    - usufruitier: earl-du-chemin-neuf
      titre: commodat
      note: "L'EARL du Chemin Neuf exploite le domaine via un commodat (prêt à usage gratuit, dit « bail à commodat » par la Bergerie) : depuis 2006, mise à disposition gratuite des terres et des infrastructures pour 25 ans, sous condition de respecter une charte agroécologique stricte (agriculture biologique, certification Nature et Progrès). Titre gratuit (pas de loyer rentier capté par la fondation) et durable, mais juridiquement plus précaire qu'un bail rural — le commodat n'ouvre pas le droit au renouvellement d'ordre public du statut du fermage."
  description: >
    La fondation conserve la pleine propriété du domaine et en confie l'usage à
    des structures tierces. L'exploitation agricole a pris en 2006 la forme d'une
    EARL ; une association Écosite porte des activités d'animation et de
    formation. Le titre liant l'EARL à la fondation est désormais établi : un
    commodat (prêt à usage gratuit) consenti en 2006 pour 25 ans, mise à
    disposition gratuite des terres et des infrastructures sous condition d'une
    charte agroécologique stricte. Le démembrement strict nue-propriété/usufruit
    au sens du Code civil n'est pas le mécanisme retenu : il s'agit d'une propriété
    de fondation assortie d'un commodat à clauses environnementales — durable et
    gratuit, mais plus précaire qu'un bail rural.
integrite_montage:
  niveau: ig_institue
  commentaire: >
    Foncier protégé chez une fondation non lucrative, mais le montage d'usage
    n'est pas un démembrement strict et reste partiellement documenté.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "Le domaine est porté par la Fondation Charles Léopold Mayer, structure non lucrative, et n'est pas destiné à la revente."
  - critere: montage_documente
    valeur: oui
    note: "La propriété par la FPH est avérée et le titre d'usage de l'EARL est établi par les sources : un commodat (prêt à usage gratuit) consenti en 2006 pour 25 ans, sous charte agroécologique. Le détail de l'acte (clauses exactes, modalités de reconduction au-delà de 2031) n'est pas publié intégralement."
  - critere: irreversibilite
    valeur: partiel
    note: "La détention par une fondation protège le foncier, mais aucune clause d'inaliénabilité spécifique n'est documentée par les sources."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le domaine est propriété d'une fondation d'intérêt général, hors logique d'endettement spéculatif."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Le domaine est porté par une fondation, sans capital social ni parts ; sa valeur foncière n'est captable par aucun titre cessible."
  - critere: usage_interet_general
    valeur: oui
    note: "Agriculture agroécologique, élevage, formation et accueil servent un intérêt dépassant les seuls occupant·es."
  - critere: non_lucratif_global
    valeur: partiel
    note: "Le porteur est non lucratif, mais une EARL — société civile d'exploitation agricole — exploite la ferme : lucrative pour ses associé·es, sa non-lucrativité n'est pas établie."
  - critere: ancrage_territorial
    valeur: oui
    note: "Le domaine s'inscrit dans le Parc naturel régional du Vexin français et accueille formation et public."
  - critere: gouvernance_collective
    valeur: inconnu
    note: "Les modalités de décision entre fondation, exploitation et association ne sont pas documentées par les sources."
  - critere: tripartisme
    valeur: inconnu
    note: "L'association du voisinage, des citoyen·nes ou des collectivités à la gouvernance n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: inconnu
    note: "Les dispositifs de transmission et de renouvellement ne sont pas décrits par les sources consultées."
  - critere: montage_non_commercial
    valeur: oui
    note: "L'usufruitier inclut l'EARL du Chemin Neuf, société civile d'exploitation agricole : non commerciale au sens du marché, et preneuse d'un commodat (prêt à usage gratuit, 25 ans) sous une fondation non lucrative — elle exploite sans détenir le foncier ni verser de loyer rentier. Aucun titre cessible ne rend la valeur du foncier captable (porteur hors-marché), et son titre — un commodat gratuit sous porteur hors-marché — est désormais créditant (décision #11) : le maillon d'exploitation garde sa nature `exploitation_agricole`, ce qui tient le lieu en hybride (sous le sommet), sans le rendre marchand. L'EARL reste lucrative pour ses associé·es, ce qui le maintient sous le sommet."
  - critere: usage_non_marchand
    valeur: inconnu
    note: "Le régime d'accès à la terre et à ses fruits n'est pas documenté ; l'exploitation agroécologique est conduite par une EARL et le détail des activités de formation et d'accueil n'est pas précisé."
  - critere: loyer_non_rentier
    valeur: oui
    note: "Le titre liant l'EARL à la fondation est un commodat — prêt à usage gratuit : la mise à disposition des terres et des infrastructures est sans loyer ni redevance. La fondation ne capte aucun fructus rentier sur le foncier."
  - critere: securite_jouissance
    valeur: partiel
    note: "Le titre est désormais établi : un commodat consenti en 2006 pour 25 ans (mise à disposition gratuite des terres et infrastructures, charte agroécologique). Horizon long, mais sécurité plus faible qu'un bail rural — le commodat n'ouvre pas le droit au renouvellement d'ordre public du statut du fermage et reste, en principe, plus reprenable par le prêteur."
  - critere: milieu_protege
    valeur: partiel
    note: "Le domaine est inclus dans le Parc naturel régional du Vexin français, cadre de protection sans portée directement contraignante sur le foncier ; aucun dispositif opposable spécifique (ORE, classement, clause au bail) n'est documenté."
  - critere: vivant_finalite
    valeur: oui
    note: "La replantation des haies pour abriter oiseaux, faune auxiliaire et pollinisateurs, et le rôle de centre technique de l'agriculture biologique, traduisent une finalité de préservation du vivant affirmée et agie."
  - critere: usage_non_degradant
    valeur: oui
    note: "Ferme de polyculture-élevage conduite en agroécologie depuis le milieu des années 1990, avec agroforesterie : des pratiques de maintien et de régénération attestées."
  - critere: place_au_vivant
    valeur: oui
    note: "Le domaine compte environ 5 km de haies héritées et 8 km de haies plantées, des alignements intra-parcellaires et plus de 650 arbres champêtres, aménagés pour rétablir l'équilibre écologique : une place concrète et substantielle faite au vivant."
  - critere: travail_non_marchandise
    valeur: oui
    note: "Travail-cœur agricole porté par l'EARL du Chemin Neuf, société civile d'exploitation dont l'exploitant travaille la ferme, hors rapport salarial."
analyse:
  forces:
    - "Foncier de grande ampleur durablement détenu par une fondation non lucrative."
    - "Transition agroécologique engagée de longue date, garantie de sécurité foncière."
    - "Pluralité de structures permettant d'articuler exploitation, animation et formation."
  fragilites:
    - "Titre d'usage par commodat : gratuit et long (25 ans), mais plus précaire qu'un bail rural — pas de renouvellement d'ordre public, reprise par le prêteur en principe possible."
    - "Présence d'une EARL, société civile d'exploitation lucrative pour ses associé·es, dont la non-lucrativité n'est pas établie."
    - "Gouvernance et dispositifs de transmission non décrits par les sources."
  leviers:
    - "Publier l'acte de commodat (clauses, durée, reconduction au-delà de 2031)."
    - "Sécuriser davantage l'usage par un bail rural environnemental ou un usufruit explicite, ouvrant un droit au renouvellement."
    - "Ouvrir la gouvernance du lieu au voisinage et au territoire du Vexin."
  synthese: >
    Villarceaux illustre un foncier solidement protégé chez une fondation non
    lucrative, dont l'usage agricole est confié à l'EARL du Chemin Neuf par un
    commodat — prêt à usage gratuit consenti pour 25 ans sous charte
    agroécologique stricte. Le foncier est hors-marché et sans loyer rentier ;
    un commodat gratuit sous un porteur hors-marché est, par décision #11, un
    titre **créditant** (la gratuité et la solidité du porteur l'emportent sur
    la précarité formelle du prêt à usage). Le lieu est donc **hybride** :
    l'EARL reste une société civile d'exploitation lucrative pour ses associé·es
    (appropriation du bénéfice), ce qui le tient sous le sommet sans le rendre
    marchand. La consolidation passerait par un titre ouvrant un droit au
    renouvellement (bail rural environnemental, usufruit) et par plus de
    transparence sur la gouvernance.
fiabilite: >
  Faits vérifiés : propriété du domaine par la FPH, surface d'environ 600 hectares,
  exploitation par l'EARL du Chemin Neuf (constituée en 2006), transition
  agroécologique, cohabitation de six structures juridiques distinctes dont
  l'association Écosite et la coopérative Saveurs du Vexin. Titre d'usage établi
  par recoupement de sources concordantes (site officiel de la Bergerie, FPH,
  Pollinis, ARC2020 / resilience.org, article INRA 2014) : l'EARL exploite via un
  commodat — prêt à usage gratuit (« bail à commodat ») —, mise à disposition
  gratuite des terres et infrastructures consentie en 2006 pour 25 ans, sous
  condition d'une charte agroécologique stricte (bio, Nature et Progrès) ; depuis
  2006 l'EARL est indépendante de la fondation sur les plans décisionnel et
  économique. Pièces lues : extraits secondaires concordants (pas de lecture de
  l'acte primaire de commodat, non publié). Non confirmé : clauses exactes et
  reconduction du commodat au-delà de 2031, montant d'un éventuel forfait de
  charges, modalités internes de gouvernance et de transmission.
