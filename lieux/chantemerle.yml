resume: >
  Site du réseau Longo Maï à Chantemerle, hameau de Saint-Chaffrey près de
  Briançon, dans la vallée de la Guisane. En 1976, la coopérative Longo Maï
  rachète une ancienne filature textile inactive depuis 1969 pour y établir une
  filière laine de bout en bout. L'atelier transforme la laine des troupeaux du
  réseau — mérinos d'Arles notamment — en vêtements, draps et couvertures, en
  maîtrisant toutes les étapes : tonte, tri, lavage, cardage, filage, tissage,
  tricotage et confection. La terre et les bâtiments sont détenus de façon
  inaliénable par le Fonds de Terre Européenne ; la coopérative autogérée en
  assure l'usage.
montage:
  type: propriete_protegee
  articulations:
    - usufruitier: cooperatives-longo-mai
      titre: convention
      note: "Titre précis non documenté par les sources : le démembrement civil n'est pas formalisé et les actes liant la fondation à la coopérative ne sont pas détaillés."
  description: >
    Le foncier et les bâtiments de la filature de Chantemerle sont détenus de
    façon inaliénable par le Fonds de Terre Européenne, fondation de droit
    suisse qui sanctuarise la propriété des terres et des sites de Longo Maï.
    La coopérative autogérée, de statut associatif, en assure l'usage et la
    gouverne collectivement. Le démembrement nue-propriété/usufruit au sens du
    droit français n'est pas formalisé : il s'agit d'une propriété sanctuarisée
    en fondation et d'un usage collectif.
