    coopérant·es — gagnerait en ancrage à s'ouvrir davantage au territoire.
fiabilite: >
  Faits vérifiés (sources Filature de Chantemerle — Longo Maï et presse
  spécialisée, consultées en mai 2026) : rachat en 1976 d'une filature de
  Saint-Chaffrey inactive depuis 1969, mise en place d'une filière laine
  intégrée et autogérée, transformation de la laine des troupeaux du réseau,
  rattachement au réseau Longo Maï dont le foncier est détenu par le Fonds de
  Terre Européenne. Non confirmé : surface du site, actes formalisant l'usage,
  existence d'un loyer, dispositifs de transmission.
