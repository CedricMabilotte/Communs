url: "https://asso-alc.com/archipel-de-la-vallee"
resume: >
  Tiers-lieu inclusif de l'Archipel de la vallée, à Chevreuse dans les Yvelines,
  au cœur du parc naturel régional de la haute vallée de Chevreuse : une maison
  et quatre hectares de prairies. Le projet a été lancé en 2023 par trois
  associations — Handi deuxmains, Accueil Loisirs Culture (ALC) et Quintette —
  pour créer un espace adapté aux handicaps mentaux, cognitifs et sensoriels,
  favorisant la rencontre entre la communauté du handicap et les habitant·es du
  territoire. Le foncier a été acquis en copropriété via une société civile
  immobilière réunissant les trois associations, l'acquisition définitive ayant
  eu lieu en juillet 2025. La Coopérative Oasis a soutenu le projet par un
  apport financier de 200 000 € sur 11 ans, en complément de dons, mécénat,
  subventions et prêts bancaires.
montage:
  type: propriete_collective
  articulations:
    - usufruitier: sci-archipel-vallee
      titre: integre
      note: "Chaîne intégrée : la SCI propriétaire et l'usagère sont la même entité, dont les associé·es — trois associations — exploitent elles-mêmes le tiers-lieu."
  description: >
    Le foncier — maison et quatre hectares — est détenu par une société civile
    immobilière dont les associé·es sont les trois associations Handi
    deuxmains, ALC et Quintette. Ces mêmes associations exploitent ensemble le
    tiers-lieu, chacune dans son champ d'action : propriété et usage sont portés
    par la même configuration collective, la chaîne est intégrée. La Coopérative
    Oasis est intervenue comme financeur (apport de 200 000 € sur 11 ans), non
    comme maillon de la chaîne.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Foncier porté par une société civile immobilière dont le sociétariat est
    composé de trois associations non lucratives ; chaîne intégrée propriétaire
    ≡ usagère.
grille:
  - critere: foncier_hors_marche
    valeur: partiel
    note: "Le foncier est porté par une SCI dont les seul·es associé·es sont trois associations non lucratives ; aucune clause d'inaliénabilité ni de verrou anti-spéculatif n'est documentée."
  - critere: montage_documente
    valeur: oui
    note: "Le montage — SCI réunissant trois associations, acquisition de juillet 2025, sources de financement — est public et présenté par les associations et la Coopérative Oasis."
  - critere: irreversibilite
    valeur: partiel
    note: "La détention par une SCI dont les associé·es sont des associations non lucratives freine le retour au marché ; aucune clause d'inaliénabilité ni de dévolution n'est documentée."
  - critere: origine_non_speculative
    valeur: oui
    note: "L'acquisition a réuni dons, mécénat, subventions, apports personnels, prêts bancaires et apport solidaire de la Coopérative Oasis, hors logique de plus-value."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Les parts de la SCI sont cessibles sous agrément ; détenues par des associations, leur cession à un tiers privé est peu probable, mais sans plafonnement de prix documenté."
  - critere: non_lucratif_global
    valeur: partiel
    note: "Les associé·es de la SCI sont des associations non lucratives ; la SCI elle-même n'a pas de verrou statutaire de non-lucrativité documenté."
  - critere: montage_non_commercial
    valeur: oui
    note: "La chaîne ne comporte aucune société commerciale : une société civile immobilière porte le foncier, trois associations en sont les associé·es et les usagères."
  - critere: gouvernance_collective
    valeur: oui
    note: "Les trois associations qui exploitent le lieu sont les associé·es de la SCI propriétaire : les usagères gouvernent elles-mêmes le tiers-lieu."
  - critere: tripartisme
    valeur: partiel
    note: "Le projet est porté par trois associations et soutenu par le parc naturel régional ; une gouvernance associant formellement le voisinage et les collectivités n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: inconnu
    note: "Les dispositifs de transmission et de renouvellement des personnes gouvernant le lieu ne sont pas documentés par les sources."
  - critere: usage_interet_general
    valeur: oui
    note: "Tiers-lieu inclusif adapté aux handicaps, favorisant la rencontre entre la communauté du handicap et les habitant·es : l'usage sert un intérêt général social affirmé."
  - critere: ancrage_territorial
    valeur: oui
    note: "Le lieu, au cœur du parc naturel régional, est conçu pour tisser des liens avec les habitant·es du territoire autour de projets collectifs."
  - critere: usage_non_marchand
    valeur: inconnu
    note: "Le régime d'accès au tiers-lieu et à ses activités — gratuité, contribution, tarification — n'est pas documenté par les sources."
  - critere: loyer_non_rentier
    valeur: inconnu
    note: "Les modalités financières entre la SCI et les associations usagères ne sont pas documentées par les sources."
  - critere: securite_jouissance
    valeur: oui
    note: "Les associations exploitent le lieu en leur qualité d'associé·es de la SCI propriétaire : l'usage n'est ni précaire ni plafonné dans le temps."
  - critere: milieu_protege
    valeur: non
    note: "Le lieu est au cœur du parc naturel régional de la haute vallée de Chevreuse, qui encadre l'usage des sols ; aucun dispositif opposable propre au lieu (ORE, clause environnementale au bail) n'est documenté."
  - critere: vivant_finalite
    valeur: non
    note: "La vocation affichée — tiers-lieu inclusif adapté aux handicaps, rencontre avec le territoire — est pensée pour ses usager·es humain·es ; le vivant non-humain ne figure pas parmi les finalités."
  - critere: usage_non_degradant
    valeur: inconnu
    note: "Les quatre hectares sont décrits comme prairies ; les sources ne documentent ni usage agricole ni mode d'entretien du milieu permettant d'apprécier leur caractère dégradant ou non."
  - critere: place_au_vivant
    valeur: non
    note: "Le lieu comprend quatre hectares de prairies en milieu rural ; aucun aménagement délibéré pour le vivant (haies, mares, continuités) n'est documenté par les sources."
