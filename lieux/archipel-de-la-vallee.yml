categorie: lieu
nom: "L'Archipel de la vallée"
sous_titre: "Tiers-lieu inclusif de trois associations à Chevreuse, financé par la Coopérative Oasis"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Chevreuse"
  departement: "Yvelines (78)"
  region: "Île-de-France"
  geoportail: "https://www.geoportail.gouv.fr/carte?c=2.0374,48.7071&z=16"
