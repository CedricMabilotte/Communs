fiabilite: >
  Faits vérifiés (sources ALC de Chevreuse, Coopérative Oasis et presse locale,
  consultées en mai 2026) : tiers-lieu inclusif à Chevreuse, maison et quatre
  hectares de prairies, projet lancé en 2023 par les associations Handi
  deuxmains, ALC et Quintette, foncier acquis en copropriété via une SCI
  réunissant les trois associations, acquisition définitive en juillet 2025,
  financement d'environ un million d'euros, apport de la Coopérative Oasis de
  200 000 € sur 11 ans. Non confirmé : statuts et verrous anti-spéculatifs de la
  SCI, clause de dévolution, régime d'accès au tiers-lieu, dispositifs de
  transmission, transparence comptable.
