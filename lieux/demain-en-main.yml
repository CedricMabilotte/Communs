    valeur: oui
    note: "Le montage — SCIC propriétaire, coopérative d'habitants locataire, SCOP agricole — est public et présenté par le collectif et la Coopérative Oasis."
  - critere: irreversibilite
    valeur: partiel
    note: "Le statut SCIC impose des réserves impartageables qui freinent la captation de valeur ; aucune clause d'inaliénabilité du foncier ni de dévolution n'est documentée."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le foncier a été acquis par capital coopératif, épargne solidaire et l'apport de la Coopérative Oasis, hors endettement spéculatif."
  - critere: parts_non_cessibles
    valeur: partiel
