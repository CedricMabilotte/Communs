    valeur: inconnu
    note: "Le montant du loyer versé par la coopérative d'habitants à la SCIC et son caractère non rentier ne sont pas documentés par les sources."
  - critere: securite_jouissance
    valeur: inconnu
    note: "La nature et la durée du titre d'usage liant la coopérative d'habitants à la SCIC propriétaire ne sont pas documentées par les sources."
analyse:
  forces:
    - "Chaîne entièrement coopérative, sans maillon marchand à lucrativité ouverte."
    - "Gouvernance habitante en démocratie participative, ancrée sur le territoire."
    - "Foncier acquis hors spéculation, par capital coopératif et épargne solidaire."
  fragilites:
    - "Aucune clause d'inaliénabilité ni de dévolution documentée : la soustraction au marché repose sur les statuts coopératifs."
    - "Titre d'usage liant la coopérative d'habitants à la SCIC non documenté."
    - "Montant du loyer et régime d'usage non documentés."
  leviers:
    - "Inscrire et publier une clause d'inaliénabilité du foncier porté par la SCIC."
    - "Documenter et publier le titre d'usage et le régime du loyer."
    - "Formaliser les dispositifs de renouvellement des habitant·es."
  synthese: >
    Demain en main est un écovillage à chaîne entièrement coopérative : une SCIC
    porte le foncier, une coopérative d'habitants en porte l'usage, le tout
    gouverné en démocratie participative et financé hors spéculation. Sa
    silhouette est solide sur la gouvernance et la finalité ; sa marge de
    progression tient à l'absence de verrou d'inaliénabilité et à la
    non-publication de la convention d'usage interne au montage.
fiabilite: >
  Faits vérifiés (sources Demain en main, Coopérative Oasis et presse régionale,
  consultées en mai 2026) : écovillage du hameau de Keruzerh à Locoal-Mendon,
  foncier d'une vingtaine d'hectares dont une dizaine agricoles, intention
  formulée fin 2016, foncier acquis début 2021 par la SCIC Écovillage de
  Keruzerh, coopérative d'habitants louant les logements à la SCIC, SCOP
  agricole, reconnaissance ESUS, apport de la Coopérative Oasis (100 000 € en
  2020, 125 000 € en 2024). Non confirmé : clause d'inaliénabilité et de
  dévolution, nature et durée du titre d'usage, montant du loyer, publication
  des comptes.
