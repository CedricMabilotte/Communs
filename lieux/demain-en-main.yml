  - critere: non_lucratif_global
    valeur: partiel
    note: "Aucun maillon ne recherche de plus-value foncière, mais la chaîne est composée de sociétés coopératives à capital social, et non de structures structurellement non lucratives."
  - critere: montage_non_commercial
    valeur: partiel
    note: "La chaîne est entièrement coopérative : SCIC et coopérative d'habitants sont des sociétés commerciales de forme coopérative, à lucrativité encadrée."
  - critere: gouvernance_collective
    valeur: oui
    note: "Le collectif de huit familles vit et gouverne le lieu en démocratie participative ; les habitant·es décident ensemble de son devenir."
  - critere: tripartisme
    valeur: partiel
    note: "Le statut SCIC associe des collectivités au sociétariat ; une gouvernance tripartite formalisée avec le voisinage n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "Les formes coopératives organisent la durée et le projet prévoit l'accueil de nouveaux habitant·es ; les dispositifs précis de renouvellement ne sont pas documentés."
  - critere: usage_interet_general
    valeur: oui
    note: "Maraîchage, ferme-auberge, accueil et habitat écologique : l'activité du lieu sert un intérêt général agricole, social et de transition écologique."
  - critere: ancrage_territorial
    valeur: oui
    note: "L'écovillage se veut un projet de territoire mobilisant les citoyen·nes ; sa reconnaissance ESUS et son ancrage local en attestent."
  - critere: usage_non_marchand
    valeur: partiel
    note: "L'usage habitant repose sur un loyer et l'accueil sur des activités économiques ; une logique de mise en commun coexiste avec une part marchande."
