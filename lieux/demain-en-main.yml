uid: demain-en-main
categorie: lieu
nom: "Demain en main — écovillage de Keruzerh"
sous_titre: "Écovillage nourricier porté par une SCIC, financé par la Coopérative Oasis"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Locoal-Mendon"
  departement: "Morbihan (56)"
  region: "Bretagne"
annee: 2021
url: "https://demainenmain.fr/"
resume: >
  Écovillage du hameau de Keruzerh, à Locoal-Mendon dans le Morbihan : une
  vingtaine d'hectares, dont une dizaine de terres agricoles et le reste en
  forêt, et un ancien hameau de bâtiments avec four à pain. Né d'une intention
  formulée fin 2016 par Julien et son frère Fanch, le projet associe habitat,
  production agricole et accueil. Le foncier a été acquis début 2021 par la SCIC
  Écovillage de Keruzerh ; une coopérative d'habitants loue les logements à la
  SCIC et une SCOP agricole encadre le maraîchage et la ferme-auberge. La
  Coopérative Oasis a soutenu l'acquisition par un apport financier (100 000 €
  en 2020 sur 7 ans, puis 125 000 € en 2024 sur 10 ans), en complément des
  capitaux propres des habitant·es.
montage:
  type: propriete_collective
  nu_proprietaire: "SCIC Écovillage de Keruzerh (société coopérative d'intérêt collectif)"
  usufruitier: "Coopérative d'habitants de Keruzerh (collectif d'habitant·es)"
  description: >
    Le foncier et le bâti du hameau de Keruzerh sont détenus en pleine propriété
    par la SCIC Écovillage de Keruzerh, société coopérative d'intérêt collectif
    à sociétariat multiple (habitant·es, salarié·es, collectivités,
    investisseur·ses solidaires). Une coopérative d'habitants distincte loue les
    logements à la SCIC et porte l'usage habitant. La Coopérative Oasis est
    intervenue comme financeur de l'acquisition, non comme maillon de la chaîne.
    La nature et la durée du titre d'usage liant la coopérative d'habitants à la
    SCIC ne sont pas documentées par les sources.
integrite_montage:
  niveau: mutualisme
  commentaire: >
    Chaîne entièrement coopérative : une SCIC porte le foncier, une coopérative
    d'habitants en porte l'usage. Formes sociétaires à lucrativité encadrée,
    sociétariat de type mutualiste.
