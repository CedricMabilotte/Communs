uid: foret-lu-picatau
categorie: lieu
nom: "Forêt Lu Picatau"
sous_titre: "Massif forestier citoyen du Périgord vert, géré par ses 200 associé·es"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Abjat-sur-Bandiat"
  departement: "Dordogne (24)"
  region: "Nouvelle-Aquitaine"
  geoportail: "https://www.geoportail.gouv.fr/carte?c=0.8647,45.5161&z=15"
annee: 2020
url: "https://www.gfclupicatau.fr/"
resume: >
  Massif forestier d'environ 80 hectares au lieu-dit Grande Borne, commune
  d'Abjat-sur-Bandiat, en Périgord vert (Dordogne). Face à la multiplication
  des coupes rases dans la région, environ 200 citoyen·nes se sont réuni·es
  en 2020 au sein du groupement forestier Lu Picatau pour acquérir et gérer
  collectivement des parcelles, dont une obtenue par droit de préférence sur
  une parcelle voisine à Saint-Pardoux-la-Rivière. Les coupes rases y sont
  exclues ; le prélèvement de bois se limite aux besoins directs et locaux,
  et une partie du massif est explicitement laissée en libre évolution.
montage:
  type: propriete_collective
  articulations:
    - usufruitier: gfc-lu-picatau
      titre: integre
      note: "Montage intégré : les 200 associé·es du groupement forestier sont à la fois propriétaires du foncier et décisionnaires de sa gestion, sans structure foncière distincte documentée."
  description: >
    Le groupement forestier citoyen Lu Picatau détient et gère directement le
    massif : il n'y a pas de dissociation documentée entre une entité
    porteuse de la nue-propriété et une entité usufruitière distincte. Le
    régime des parts (valeur, cessibilité) des 200 associé·es n'est pas
    publié par les sources consultées.
integrite_montage:
  niveau: economie_marchande
  commentaire: >
    Montage intégré, à finalité écologique explicite (libre évolution
    partielle, exclusion des coupes rases), mais dont le verrou anti-
    spéculatif (régime des parts du groupement forestier) n'est pas
    documenté : la nature de l'intérêt du maillon reste `inconnu` et le
    verdict du lieu ne peut pas être établi en l'état. Le pôle affiché est
    délibérément prudent plutôt qu'aspirationnel.
