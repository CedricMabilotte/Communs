nom: "Collectif de Kerlano"
sous_titre: "Habitat collectif solidaire et autogéré, en bascule vers la propriété d'usage CLIP, à Rosnoën (Finistère)"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Rosnoën"
  departement: "Finistère (29)"
  region: "Bretagne"
  adresse: "Lieu-dit Kerlano, 29590 Rosnoën (fond de la rade de Brest)"
  geoportail: "https://www.geoportail.gouv.fr/carte?c=-4.2167,48.2667&z=15"
