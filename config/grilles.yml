# ─────────────────────────────────────────────────────────────────────────────
# grilles.yml — Grilles de lecture et d'analyse stratégique (modèle v2)
# ─────────────────────────────────────────────────────────────────────────────
# Une grille complète par catégorie (porteur · usufruitier · lieu). Chaque grille
# comporte CINQ familles de critères, une par axe du modèle, plus une LECTURE
# STRATÉGIQUE. Chaque critère est rattaché à un AXE (1 à 5) et pondéré.
#
# Ce fichier est ÉDITABLE : ajouter / retirer / repondérer des critères ici
# suffit — le générateur recalcule scores et fiches. Chaque fiche YAML évalue
# ces critères via une liste `grille:` (valeur : oui | partiel | non | inconnu).
#
# Les cinq axes (définis dans ranking.yml) :
#   1 — Le sol         soustraction à l'exploitation abusive (marché + dégradation)
#   2 — La structure   nature civile et non lucrative
#   3 — Le pouvoir     gouvernance citoyenne et collective
#   4 — La finalité    finalité ouverte — intérêt général et habitat du vivant
#   5 — L'usage        usage non marchand, non abusif et hospitalier
# ─────────────────────────────────────────────────────────────────────────────
version: 3
date: 2026-05-26

grilles:

  # ═══════════════════════════════════════════════════════════════════════════
  # GRILLE 1 — PORTEUR DE NUE-PROPRIÉTÉ
  # ═══════════════════════════════════════════════════════════════════════════
  porteur:
    titre: "Grille de lecture — Porteur de nue-propriété"
    objet: >
      Apprécier la solidité d'un organisme appelé à détenir durablement la
      nue-propriété d'un foncier : sa capacité à verrouiller la terre hors
      marché, sa nature non lucrative, sa gouvernance, sa vocation d'intérêt
      général et la qualité des usages qu'il rend possibles.
    familles:
      - id: sol
        label: "Le sol — soustraction à l'exploitation abusive"
        axe: 1
        criteres:
          - id: inalienabilite
            label: "Inaliénabilité / dotation non consomptible"
            axe: 1
            poids: 3
            definition: >
              Le foncier est rendu inaliénable au sein de l'organisme (dotation
              non consomptible d'un fonds de dotation, domanialité, clause
              statutaire d'inaliénabilité justifiée).
          - id: parts_non_cessibles
            label: "Parts / titres non cessibles ou cession encadrée"
            axe: 1
            poids: 3
            definition: >
              Les parts, actions ou titres de la structure ne sont pas
              librement cessibles sur un marché : soit la structure n'a pas de
              capital appropriable (fondation, association), soit ses statuts
              encadrent strictement la cession. « oui » : aucune part
              appropriable, ou cession verrouillée au nominal ; « partiel » :
              cession soumise à agrément mais à un prix non plafonné ; « non » :
              parts librement cessibles, valeur foncière captable.
          - id: nature_protectrice
            label: "Nature juridique protectrice"
            axe: 1
            poids: 2
            definition: >
              Échelle de protection décroissante : personne publique >
              fondation RUP > fonds de dotation > société civile.
          - id: clause_devolution
            label: "Clause de dévolution désintéressée"
            axe: 1
            poids: 2
            definition: >
              En cas de dissolution, l'actif est dévolu à un autre organisme
              désintéressé : aucun retour possible dans un patrimoine privé.
      - id: structure
        label: "La structure — nature civile et non lucrative"
        axe: 2
        criteres:
          - id: forme_non_lucrative
            label: "Forme juridique non lucrative"
            axe: 2
            poids: 2
            definition: >
              L'organisme relève d'une forme structurellement non lucrative
              (fondation, fonds de dotation, établissement public, association)
              — et non d'une société commerciale, fût-elle solidaire.
          - id: non_lucrativite_effective
            label: "Non-lucrativité effective (capital non rémunéré)"
            axe: 2
            poids: 3
            definition: >
              Le capital apporté n'est pas rémunéré : ni dividende, ni intérêt,
              ni plus-value distribuée. « partiel » si une revalorisation des
              parts existe, même plafonnée ; « non » si dividende ou plus-value
              sont possibles.
          - id: gestion_desinteressee
            label: "Gestion désintéressée, hors cercle restreint"
            axe: 2
            poids: 2
            definition: >
              Dirigeants bénévoles ou rémunération encadrée ; l'organisme ne
              fonctionne pas au profit d'un cercle restreint de personnes.
          - id: independance_rendement
            label: "Indépendance vis-à-vis d'une logique de rendement"
            axe: 2
            poids: 3
            definition: >
              Le capital n'est pas soumis à des investisseurs attendant une
              plus-value ou un dividende sur le foncier.
      - id: pouvoir
        label: "Le pouvoir — gouvernance citoyenne"
        axe: 3
        criteres:
          - id: ca_collegial
            label: "Conseil d'administration collégial et indépendant"
            axe: 3
            poids: 2
            definition: >
              Organe de direction pluraliste, indépendant du fondateur unique
              et des intérêts privés.
          - id: parties_prenantes
            label: "Parties prenantes associées à la gouvernance"
            axe: 3
            poids: 2
            definition: >
              Usager·es, citoyen·nes, collectivités ou donateur·rices sont
              représenté·es dans les instances ou réellement consulté·es.
          - id: autogestion_usagers
            label: "Voix délibérative des usager·es"
            axe: 3
            poids: 3
            definition: >
              Les usager·es du foncier porté ont voix DÉLIBÉRATIVE — non
              simplement consultative — dans les décisions du porteur sur leurs
              conditions d'usage : choix des baux, fixation des loyers et
              redevances, affectation et transmission du foncier. C'est le
              critère qui distingue le pôle « commun libre et vivant »
              (autogestion citoyenne) du pôle « intérêt général institué »
              (administration descendante par conseil, tutelle ou donateur·rices).
              « oui » : les usager·es élisent ou siègent au CA et tranchent
              les décisions structurantes ; « partiel » : consultation
              organisée et régulière mais sans pouvoir contraignant, ou
              participation à certaines décisions seulement ; « non » :
              décision purement descendante — administration publique, conseil
              de fondation, donateur·rices, tutelle —, les usager·es sont
              informé·es. Un porteur de droit public (commune, établissement
              public, conservatoire d'État) coche par défaut « non », sauf
              dispositif statutaire explicite d'association délibérative des
              usager·es à la décision.
          - id: transparence
            label: "Transparence des comptes et de l'activité"
            axe: 3
            poids: 2
            definition: >
              Publication régulière des comptes, rapports d'activité, liste
              des biens portés.
      - id: finalite
        label: "La finalité — intérêt général et du vivant"
        axe: 4
        criteres:
          - id: objet_foncier_protecteur
            label: "Objet statutaire de protection foncière"
            axe: 4
            poids: 3
            definition: >
              Les statuts mentionnent explicitement la préservation du foncier,
              sa soustraction au marché ou son affectation d'intérêt général.
          - id: agrement_ig
            label: "Reconnaissance publique ou éligibilité à l'intérêt général"
            axe: 4
            poids: 1
            definition: >
              Reconnaissance d'utilité publique, agrément public, ou
              éligibilité avérée au régime fiscal de l'intérêt général. Tag
              informatif : la reconnaissance d'État n'est pas un gage de
              libération, seulement un fait à signaler.
          - id: risque_requalification
            label: "Absence de risque de requalification fiscale"
            axe: 4
            poids: 1
            definition: >
              L'organisme n'est pas exposé à un risque sérieux de
              requalification fiscale faisant perdre la qualité d'intérêt
              général.
          - id: redevabilite_publique
            label: "Redevabilité au-delà des seuls membres"
            axe: 4
            poids: 2
            definition: >
              L'organisme rend compte de son action au-delà de ses membres :
              reddition de comptes au public, rapports accessibles à tous.
          - id: vivant_finalite
            label: "Le vivant non-humain dans la finalité"
            axe: 4
            poids: 2
            definition: >
              La vocation inclut explicitement le vivant non-humain comme
              cohabitant — non comme décor ni ressource : préservation ou
              accueil de la biodiversité affiché parmi les finalités, dans les
              statuts, la charte ou l'activité même. « oui » : finalité affirmée
              et agie ; « partiel » : présente dans le discours sans traduction
              concrète ; « non » : pensé pour ses seuls usagers humains.
      - id: usage
        label: "L'usage — régime non marchand et hospitalier"
        axe: 5
        criteres:
          - id: regime_usage_offert
            label: "Usage confié à des conditions non rentières"
            axe: 5
            poids: 3
            definition: >
              Le porteur confie l'usage de ses fonciers à titre gratuit, ou
              contre un loyer modéré couvrant ses charges sans rechercher de
              rendement. « non » si le porteur attend du foncier un revenu
              locatif de marché.
          - id: securite_usage_offerte
            label: "Sécurité d'usage durable offerte aux usufruitiers"
            axe: 5
            poids: 3
            definition: >
              Le porteur accorde des titres d'usage longs et au renouvellement
              sécurisé (bail rural, bail emphytéotique, convention pérenne),
              permettant au collectif usager de maîtriser le lieu dans la durée.
    lecture_strategique:
      enjeu: >
        Le porteur est le coffre-fort du montage. Sa valeur tient moins à sa
        taille qu'à l'irréversibilité qu'il garantit — et à la qualité des
        usages qu'il rend possibles : un foncier verrouillé mais loué au prix
        du marché n'a libéré la terre qu'à moitié.
      forces_typiques:
        - "Permanence : une personne morale ne meurt pas, contrairement à un propriétaire."
        - "Le régime du mécénat draine dons et legs vers la protection foncière."
        - "La dotation non consomptible rend la sortie du foncier très difficile."
      fragilites_typiques:
        - "Un fonds de dotation se crée sans agrément : tout dépend des statuts."
        - "Un porteur dépendant d'investisseurs en rendement n'a libéré la terre qu'en apparence."
        - "Un loyer trop élevé fragilise le collectif usager, même si le foncier est verrouillé."
      leviers:
        - "Rédiger une dotation non consomptible et un objet statutaire foncier précis."
        - "Soigner la clause de dévolution : c'est elle qui interdit le retour au privé."
        - "Confier l'usage à des conditions non rentières et à des titres longs."

  # ═══════════════════════════════════════════════════════════════════════════
  # GRILLE 2 — ORGANISME USUFRUITIER
  # ═══════════════════════════════════════════════════════════════════════════
  usufruitier:
    titre: "Grille de lecture — Organisme usufruitier"
    objet: >
      Apprécier la personne morale qui reçoit l'usufruit ou l'usage : la
      non-cessibilité de ce qu'elle détient, sa nature civile non lucrative, le
      caractère citoyen de sa gouvernance, sa vocation d'intérêt général et le
      régime d'usage qu'elle fait vivre.
    familles:
      - id: sol
        label: "Le sol — soustraction à l'exploitation abusive"
        axe: 1
        criteres:
          - id: non_appropriation
            label: "Pas d'appropriation possible du foncier"
            axe: 1
            poids: 3
            definition: >
              Les usager·es ne peuvent ni revendre, ni capter à titre privé la
              valeur du foncier.
          - id: parts_non_cessibles
            label: "Parts / titres non cessibles ou cession encadrée"
            axe: 1
            poids: 3
            definition: >
              Les parts ou titres de la structure ne sont pas librement
              cessibles : pas de capital appropriable (association), ou cession
              strictement encadrée. « oui » : aucune part appropriable, ou
              cession au nominal ; « partiel » : cession sous agrément à prix
              non plafonné ; « non » : parts librement cessibles.
          - id: devolution_usufruitier
            label: "Clause de dévolution désintéressée"
            axe: 1
            poids: 2
            definition: >
              En cas de dissolution, l'actif de l'usufruitier est dévolu à un
              organisme désintéressé : aucun retour de valeur vers les membres.
      - id: structure
        label: "La structure — nature civile et non lucrative"
        axe: 2
        criteres:
          - id: personne_morale_civile
            label: "Personne morale de droit civil non lucrative"
            axe: 2
            poids: 3
            definition: >
              Association loi 1901, société civile non lucrative, GFA ou
              coopérative à lucrativité verrouillée — et non une société
              commerciale de droit privé classique. Une SCIC est notée
              « partiel » : société commerciale, mais à lucrativité encadrée.
          - id: non_lucrativite_effective
            label: "Non-lucrativité effective"
            axe: 2
            poids: 3
            definition: >
              Absence de partage de bénéfices ; les excédents sont réinvestis
              dans l'objet et non distribués aux membres.
      - id: pouvoir
        label: "Le pouvoir — gouvernance citoyenne"
        axe: 3
        criteres:
          - id: une_voix
            label: "Principe « une personne = une voix »"
            axe: 3
            poids: 2
            definition: >
              Le pouvoir de décision n'est pas proportionnel au capital
              apporté.
          - id: usagers_decident
            label: "Les usager·es participent aux décisions"
            axe: 3
            poids: 3
            definition: >
              Les habitant·es, exploitant·es ou usager·es du lieu participent
              effectivement aux choix qui les concernent.
          - id: ouverture_entrants
            label: "Ouverture aux nouveaux entrants"
            axe: 3
            poids: 2
            definition: >
              La structure organise l'arrivée de nouveaux membres et le
              renouvellement générationnel.
          - id: transparence_interne
            label: "Transparence interne et redevabilité"
            axe: 3
            poids: 1
            definition: >
              Comptes et décisions accessibles aux membres et, autant que
              possible, au public.
      - id: finalite
        label: "La finalité — intérêt général et du vivant"
        axe: 4
        criteres:
          - id: objet_ig
            label: "Objet d'intérêt général"
            axe: 4
            poids: 3
            definition: >
              L'objet porte un intérêt général identifié : agriculture
              paysanne, accès à la terre, écologie, habitat digne, éducation.
          - id: public_non_restreint
            label: "Ne sert pas un cercle restreint"
            axe: 4
            poids: 3
            definition: >
              Le lieu et ses bénéfices ne profitent pas exclusivement aux seuls
              membres fondateurs ou à leurs familles.
          - id: vivant_finalite
            label: "Le vivant non-humain dans la finalité"
            axe: 4
            poids: 2
            definition: >
              La vocation inclut explicitement le vivant non-humain comme
              cohabitant — non comme décor ni ressource : préservation ou
              accueil de la biodiversité affiché parmi les finalités, dans les
              statuts, la charte ou l'activité même. « oui » : finalité affirmée
              et agie ; « partiel » : présente dans le discours sans traduction
              concrète ; « non » : pensé pour ses seuls usagers humains.
      - id: usage
        label: "L'usage — régime non marchand et hospitalier"
        axe: 5
        criteres:
          - id: duree_usage
            label: "Durée d'usage longue et renouvellement organisé"
            axe: 5
            poids: 3
            definition: >
              Le titre d'usage assure une jouissance durable. L'usufruit d'une
              personne morale est plafonné à 30 ans (article 619 du Code civil)
              et non renouvelable de droit ; le bail rural dure au moins 9 ans
              avec droit au renouvellement d'ordre public ; le bail
              emphytéotique court jusqu'à 99 ans. « oui » si la durée est
              longue ET le renouvellement sécurisé ; « partiel » si la durée
              est longue mais le renouvellement incertain.
          - id: clauses_usage
            label: "Clauses d'usage / environnementales inscrites"
            axe: 5
            poids: 2
            definition: >
              Le contrat inscrit des engagements d'usage : pratiques
              écologiques (bail rural environnemental), affectation maintenue.
          - id: articulation_porteur
            label: "Articulation loyale avec le porteur"
            axe: 5
            poids: 2
            definition: >
              Relation claire, contractualisée et loyale avec le porteur de
              nue-propriété ; pas de conflit d'intérêts entre les deux.
          - id: regime_usage_non_marchand
            label: "Régime d'usage non marchand"
            axe: 5
            poids: 3
            definition: >
              L'usage que l'organisme fait vivre repose sur la gratuité, le don
              ou le troc, ou sur une contribution modique. « partiel » si une
              part marchande coexiste avec une logique de partage ; « non » si
              l'accès au lieu est tarifé à un prix de marché.
          - id: loyer_soutenable
            label: "Loyer soutenable, non rentier"
            axe: 5
            poids: 3
            definition: >
              Le loyer ou la redevance versé au porteur reste soutenable pour
              le collectif et ne nourrit pas une logique de rendement. « non »
              si le loyer est calé sur le marché et grève durablement le
              collectif usager.
    lecture_strategique:
      enjeu: >
        L'usufruitier est le maillon vivant du montage : c'est lui qui fait
        exister le lieu, et lui qui en gouverne l'usage. Mais c'est aussi le
        maillon temporellement le plus faible — l'usufruit d'une personne
        morale ne dure pas plus de 30 ans.
      forces_typiques:
        - "L'association porte l'usage sans mobiliser le capital d'achat."
        - "La gouvernance peut être réellement citoyenne et ancrée localement."
        - "Le bail environnemental inscrit l'écologie dans le droit du lieu."
      fragilites_typiques:
        - "L'usufruit d'une personne morale est plafonné à 30 ans : rien n'est perpétuel."
        - "Une association peut dériver vers un cercle restreint et perdre l'intérêt général."
        - "Un loyer de marché transforme l'usager en locataire précaire."
      leviers:
        - "Anticiper le renouvellement de l'usufruit bien avant son terme."
        - "Inscrire l'ouverture aux nouveaux entrants dans les statuts."
        - "Négocier un régime d'usage non marchand et un loyer soutenable."

  # ═══════════════════════════════════════════════════════════════════════════
  # GRILLE 3 — LIEU
  # ═══════════════════════════════════════════════════════════════════════════
  lieu:
    titre: "Grille de lecture — Lieu"
    objet: >
      Apprécier un lieu concret à travers toute sa chaîne : son foncier est-il
      soustrait à l'exploitation abusive, le montage est-il de nature civile, la
      gouvernance citoyenne, la finalité ouverte à l'intérêt général et au
      vivant, et l'usage non marchand, non dégradant et hospitalier ?
    familles:
      - id: sol
        label: "Le sol — soustraction à l'exploitation abusive"
        axe: 1
        criteres:
          - id: foncier_hors_marche
            label: "Foncier effectivement soustrait au marché"
            axe: 1
            poids: 3
            definition: >
              Le foncier est porté par une structure non spéculative et n'est
              pas destiné à être revendu sur le marché libre.
          - id: montage_documente
            label: "Montage juridique documenté et lisible"
            axe: 1
            poids: 2
            definition: >
              Le montage (qui détient quoi, par quel acte) est public,
              traçable et compréhensible.
          - id: irreversibilite
            label: "Dispositif d'irréversibilité"
            axe: 1
            poids: 3
            definition: >
              Inaliénabilité, droit de veto sur revente, clause anti-spéculative
              ou dévolution désintéressée rendent le retour au marché très
              difficile.
          - id: origine_non_speculative
            label: "Acquisition non spéculative"
            axe: 1
            poids: 2
            definition: >
              Le foncier a été acquis par dons, legs, épargne solidaire ou
              fonds publics — non par un endettement attendant une plus-value.
          - id: parts_non_cessibles
            label: "Parts / titres non cessibles ou cession encadrée"
            axe: 1
            poids: 3
            definition: >
              Les parts ou titres des structures du montage ne sont pas
              librement cessibles : pas de capital appropriable, ou cession
              strictement encadrée. « oui » : aucune part appropriable, ou
              cession au nominal ; « partiel » : cession sous agrément à prix
              non plafonné ; « non » : parts librement cessibles.
          - id: milieu_protege
            label: "Protection durable du milieu"
            axe: 1
            poids: 2
            definition: >
              Le milieu du lieu — sol, eau, biodiversité — est protégé de la
              dégradation par un dispositif durable et opposable : obligation
              réelle environnementale (ORE), statut d'espace protégé, clause
              environnementale inscrite au bail ou à la convention. C'est, pour
              la face matérielle de l'abusus, l'équivalent de l'inaliénabilité
              pour sa face juridique. « oui » : dispositif opposable et durable
              en place ; « partiel » : engagement sans portée contraignante
              (charte, intention) ; « non » : aucun dispositif.
      - id: structure
        label: "La structure — nature civile et non lucrative"
        axe: 2
        criteres:
          - id: non_lucratif_global
            label: "Montage globalement non lucratif"
            axe: 2
            poids: 3
            definition: >
              Aucun maillon du montage ne capte de plus-value foncière à titre
              privé.
          - id: montage_non_commercial
            label: "Aucun maillon commercial dans la chaîne"
            axe: 2
            poids: 3
            definition: >
              Critère ALIGNÉ sur l'axe `nature_interet` (chantier 1bis, session
              #4) : se lit sur le pire maillon de la chaîne lieu/porteur/
              usufruitier. « oui » : tous les maillons sont `non_lucrative`
              ou `commerciale_desactivee` (forme commerciale dont 100 % du
              capital est aux mains d'organismes d'intérêt général) ;
              « partiel » : au moins un maillon est `commerciale_encadree`
              (SCIC, foncière solidaire agréée ESUS) ; « non » : un maillon
              est `commerciale` à lucrativité ouverte (société commerciale
              ordinaire, GAEC, EARL, société civile agricole) ou
              `privee_individuelle` (personne physique). Quel que soit le
              critère saisi, le score d'axe 2 du lieu est ensuite plafonné
              par la chaîne (session #5, `plafonds_chaine.ax2_par_nature`
              dans ranking.yml) — la chaîne reste la source unique de vérité.
      - id: pouvoir
        label: "Le pouvoir — gouvernance citoyenne"
        axe: 3
        criteres:
          - id: gouvernance_collective
            label: "Décisions prises collectivement"
            axe: 3
            poids: 3
            definition: >
              Les usager·es du lieu décident ensemble de son devenir.
          - id: tripartisme
            label: "Voisinage / citoyens / pouvoirs publics associés"
            axe: 3
            poids: 2
            definition: >
              La gouvernance dépasse le cercle des occupants : voisinage,
              citoyen·nes, collectivités sont associé·es.
          - id: perennite_gouvernance
            label: "Transmission et renouvellement organisés"
            axe: 3
            poids: 2
            definition: >
              Des dispositifs assurent la transmission du lieu et le
              renouvellement des personnes qui le gouvernent.
          - id: non_subordination
            label: "Travail non subordonné (non-salariat, sans hiérarchie)"
            axe: 3
            poids: 3
            definition: >
              Le travail qui fait vivre le lieu n'est pas subordonné : ni
              salariat sous une autorité d'employeur, ni hiérarchie de
              commandement entre les personnes qui l'animent. C'est un co-gate du
              sommet (A1, session #10) : l'idéal décommodifié du travail, lu par
              un proxy UNIDIRECTIONNEL — seuls « oui » documenté (associé·es
              non-salarié·es, gouvernance horizontale attestée) et « non »
              constaté (salariat ou hiérarchie établis) sont fiables ; l'absence
              vaut « inconnu » et ne se déduit jamais de la forme juridique.
              « oui » : travail non subordonné documenté ; « non » : salariat ou
              hiérarchie constatés ; « inconnu » : non établi (empêche le sommet,
              jamais le verdict marchand).
      - id: finalite
        label: "La finalité — intérêt général et du vivant"
        axe: 4
        criteres:
          - id: usage_interet_general
            label: "Usage au service d'un intérêt général"
            axe: 4
            poids: 3
            definition: >
              L'activité du lieu (agriculture nourricière, écologie, habitat
              digne, accueil, pédagogie) sert un intérêt qui dépasse ses
              occupants.
          - id: ancrage_territorial
            label: "Ancrage territorial et ouverture"
            axe: 4
            poids: 2
            definition: >
              Le lieu est utile à son territoire et ouvert, à un degré ou un
              autre, au-delà de ses seuls résidents.
          - id: vivant_finalite
            label: "Le vivant non-humain dans la finalité"
            axe: 4
            poids: 2
            definition: >
              La vocation du lieu inclut explicitement le vivant non-humain
              comme cohabitant — non comme décor ni ressource : préservation ou
              accueil de la biodiversité affiché parmi les finalités, dans les
              statuts, la charte ou l'activité même. « oui » : finalité affirmée
              et agie ; « partiel » : présente dans le discours sans traduction
              concrète ; « non » : pensé pour ses seuls usagers humains.
      - id: usage
        label: "L'usage — régime non marchand et hospitalier"
        axe: 5
        criteres:
          - id: usage_non_marchand
            label: "Régime d'usage non marchand"
            axe: 5
            poids: 3
            definition: >
              L'accès au lieu et à ses fruits repose sur la gratuité, le don,
              le troc ou une contribution modique. « partiel » si une part
              marchande coexiste avec une logique de partage ; « non » si
              l'accès est tarifé au prix du marché.
          - id: loyer_non_rentier
            label: "Loyer / redevance non rentier"
            axe: 5
            poids: 2
            definition: >
              Le loyer versé par les usager·es au sein du montage reste
              soutenable et ne nourrit aucune logique de rendement.
          - id: securite_jouissance
            label: "Sécurité de jouissance dans le temps"
            axe: 5
            poids: 3
            definition: >
              Le collectif usager dispose d'un titre d'usage long et au
              renouvellement sécurisé ; il peut maîtriser le lieu dans la durée
              sans précarité locative.
          - id: usage_non_degradant
            label: "Usage non dégradant, le fonds préservé"
            axe: 5
            poids: 3
            definition: >
              L'usage quotidien ne dégrade pas le fonds : les pratiques —
              agricoles, d'entretien, de construction — prélèvent sans épuiser
              et entretiennent la capacité du sol, de l'eau et du milieu à se
              régénérer. Le critère n'est pas « prélever » — tout lieu prélève —
              mais « laisser le lieu aussi vivant qu'on l'a reçu ». « oui » :
              pratiques de maintien ou de régénération attestées ; « partiel » :
              pratiques mixtes ; « non » : pratiques manifestement extractives
              (sol épuisé, milieu dégradé).
          - id: place_au_vivant
            label: "Place faite au vivant à son échelle"
            axe: 5
            poids: 3
            definition: >
              Le lieu fait concrètement une place au vivant non-humain, à la
              mesure de ce qu'il est, rural ou urbain : haies, mares, friches,
              continuités écologiques ; en ville, une cour, un pied d'immeuble,
              un toit végétalisé comptent. Critère relatif à l'échelle du lieu :
              il ne pénalise pas l'urbain. « oui » : des espaces sont
              effectivement laissés ou aménagés pour le vivant ; « partiel » :
              quelques gestes marginaux ; « non » : aucune place au non-humain.
    lecture_strategique:
      enjeu: >
        Le lieu est le point où le montage juridique devient une réalité
        vécue. Un montage parfait sur le papier peut produire un lieu fermé ou
        précaire ; un montage imparfait peut faire vivre un commun exemplaire.
        La grille lit toute la chaîne.
      forces_typiques:
        - "La terre libérée permet des activités impossibles sur le marché."
        - "La sécurité foncière autorise des investissements de long terme."
        - "Le lieu devient un bien commun transmissible entre générations."
      fragilites_typiques:
        - "Un lieu peut se refermer sur ses occupants et perdre son intérêt général."
        - "Un usage tarifé au marché trahit la promesse de libération."
        - "Sans sécurité de jouissance, le collectif reste un locataire précaire."
        - "Un lieu hors-marché et autogéré peut malgré tout épuiser son sol ou n'accueillir aucun vivant non-humain."
      leviers:
        - "Documenter et publier le montage : la transparence est un verrou."
        - "Associer le voisinage et la collectivité pour ancrer l'intérêt général."
        - "Sécuriser un titre d'usage long et un régime d'usage non marchand."
        - "Protéger durablement le milieu et lui laisser une place — à l'échelle du lieu, rural ou urbain."
