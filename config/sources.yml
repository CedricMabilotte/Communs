    mots_cles: [foncière, terres, installation paysanne, bail]

  - id: larzac
    nom: "Larzac.org — SCTL et gestion foncière"
    url: "https://larzac.org/"
    parser: html_static
    type: actualites
    categorie_probable: [lieu, usufruitier]
    mots_cles: [SCTL, terres, bail emphytéotique, gestion foncière]

  - id: reseau-cen
    nom: "Fédération des Conservatoires d'espaces naturels"
    url: "https://reseau-cen.org/"
    parser: html_static
    type: annuaire
    categorie_probable: [porteur, usufruitier]
