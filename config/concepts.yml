# ─────────────────────────────────────────────────────────────────────────────
# concepts.yml — Ontologie du fork « Terres Libérées »
# ─────────────────────────────────────────────────────────────────────────────
# Fork de « Résidence » (lui-même fork de BIBLIO). Domaine : recensement des
# lieux en France établis selon les principes de la « libération des terres »,
# c.-à-d. où la NUE-PROPRIÉTÉ du foncier est placée dans un organisme d'intérêt
# général ou d'utilité publique, et l'USUFRUIT / l'usage confié à une personne
# morale de droit civil (association loi 1901, société civile, coopérative).
# Interface publique : français.
#
# Refonte #3 (mai 2026) : le cadre est ré-adossé au triptyque usus/fructus/
# abusus ; « libérer » est élargi — soustraire à l'exploitation abusive ET
# préserver le lieu comme habitat pour le vivant. Référence : conception-
# refonte-3.md.
# ─────────────────────────────────────────────────────────────────────────────
project:
  name: "terres-liberees"
  display_name: "Terres Libérées"
  logo_mark: "TL"
  tagline: "Annuaire critique des montages de libération des terres en France."
  description: >
    Recensement et analyse stratégique des lieux français où la terre a été
    soustraite au marché spéculatif par dissociation de la propriété : la
    nue-propriété (ou la propriété sanctuarisée) est portée par un organisme
    d'intérêt général ou d'utilité publique — fondation, fonds de dotation,
    collectivité publique — et l'usufruit ou l'usage est confié à une personne
    morale de droit civil à but non lucratif. Trois catégories sont référencées
    et analysées : les organismes porteurs de nue-propriété, les organismes
    usufruitiers, et les lieux eux-mêmes. Chaque entrée est lue à travers une
    grille d'analyse stratégique et notée par un Indice de libération.
  baseline: "nue-propriété d'intérêt général · usufruit non lucratif · sortie du marché"
  language: fr
  url: "https://communs.actitude.org"

# ─────────────────────────────────────────────────────────────────────────────
# Le concept central
# ─────────────────────────────────────────────────────────────────────────────
concept_central:
  terme: "libération des terres"
  formule: >
    Une terre est libérée lorsqu'elle est soustraite à l'exploitation abusive
    et préservée comme habitat pour le vivant — humain et non-humain.
  definition: >
    Ensemble de pratiques visant à soustraire durablement un foncier — agricole
    le plus souvent, mais aussi bâti, naturel ou d'habitat — à l'exploitation
    abusive : ni vendu ni spéculé (sortie du marché), ni épuisé ni dégradé
    (préservation du fonds) ; et à le placer au service d'un usage défini
    collectivement, d'intérêt général, partagé avec le vivant non-humain. Le
    terme n'est pas un concept juridique codifié : il appartient au vocabulaire
    des mouvements de l'agriculture paysanne, des communs et de l'éducation
    populaire. Le cadre en élargit le sens — « libérer » ne se borne plus
    à « soustraire au marché », qui n'est qu'une forme d'exploitation abusive
    parmi d'autres ; un collectif hors-marché peut, lui aussi, épuiser son sol.
  en_clair: >
    Posséder une terre, aujourd'hui, c'est pouvoir la vendre, en tirer le
    maximum, et l'épuiser si cela rapporte. La libérer, c'est lui retirer ce
    sort : faire qu'on ne puisse plus ni la vendre, ni la surexploiter, ni la
    vider de sa vie — et qu'elle reste un lieu habité, partagé entre les humains
    et le reste du vivant.
  ressort_juridique: >
    La distinction entre la PROPRIÉTÉ (qui reste au collectif non lucratif) et
    l'USAGE (confié à des usagers). Le démembrement du droit de propriété
    (article 544 du Code civil) en nue-propriété et usufruit (articles 578 et s.)
    est l'une des modalités possibles ; d'autres montages — propriété
    sanctuarisée + bail de long terme, propriété publique inaliénable —
    poursuivent le même but.
  verrou_cle: >
    L'usufruit constitué au profit d'une personne morale ne peut excéder 30 ans
    (article 619 du Code civil, règle d'ordre public). L'usufruit d'une
    association n'est donc jamais perpétuel : son renouvellement dépend d'une
    volonté future. Ce plafond de 30 ans ne vise toutefois QUE les démembrements
    véritables : il ne s'applique ni aux baux ruraux (durée minimale de 9 ans,
    mais droit au renouvellement d'ordre public), ni aux baux emphytéotiques
    (jusqu'à 99 ans), ni à la propriété publique. La fragilité des 30 ans est
    donc propre aux montages réellement démembrés, et non commune à tout montage.

# ─────────────────────────────────────────────────────────────────────────────
# Le triptyque usus / fructus / abusus — ossature conceptuelle (refonte #3)
# ─────────────────────────────────────────────────────────────────────────────
# Le droit civil reconnaît trois droits sur une chose. Le commun n'invente pas un
# quatrième droit : il ré-agence collectivement les trois. Le triptyque est la
# colonne vertébrale du modèle — les cinq pôles s'y profilent, les cinq axes de
# l'Indice s'y projettent (axe 1 → abusus ; axe 2 → fructus + abusus ; axe 3 →
# usus ; axe 4 → usus ; axe 5 → les trois).
triptyque:
  chapeau: >
    Posséder une chose, en droit, c'est tenir trois droits distincts : l'usus,
    le fructus, l'abusus. La libération des terres se lit tout entière comme un
    ré-agencement collectif de ces trois droits — fructus socialisé ou supprimé,
    abusus neutralisé, usus partagé.
  en_clair: >
    Posséder, en droit, ce n'est pas une seule chose mais trois pouvoirs : se
    servir du bien, en tirer un revenu, et en disposer — jusqu'à le détruire.
    Libérer une terre, c'est remettre ces trois pouvoirs en des mains
    collectives, et désarmer le plus dangereux.
  droits:
    - id: usus
      label: "L'usus — le droit d'utiliser"
      definition: >
        Le droit de se servir de la chose : l'habiter, la cultiver, s'y réunir,
        y travailler. Le commun le confie à un collectif d'usager·es qui le
        gouverne ; et il cesse d'en faire
        un monopole humain : le vivant non-humain est reconnu cohabitant du
        lieu, dont l'usage est pris en compte.
      en_clair: >
        L'usus, c'est le droit de se servir du lieu : l'habiter, le cultiver,
        s'y réunir. Dans un commun, ce droit appartient à celles et ceux qui
        vivent le lieu — et pas seulement à eux : les oiseaux, les insectes, les
        arbres, le sol lui-même y ont aussi leur place. On n'y est pas seuls.
      portee_modele: "Sa gouvernance se note à l'axe 3 ; son ouverture au vivant, à l'axe 4."
    - id: fructus
      label: "Le fructus — le droit aux fruits"
      definition: >
        Le droit de percevoir les fruits et les revenus de la chose. Le commun
        le supprime (gratuité, don, troc) ou le redirige intégralement vers la
        mission ; il interdit son accumulation privée. C'est le droit que police
        l'échelle de marchandisation.
      en_clair: >
        Le fructus, c'est ce que la terre rapporte — une récolte, un loyer, une
        valeur. La question n'est pas qu'elle rapporte, mais où cela va : dans
        la poche de quelqu'un, ou de retour au lieu et à celles et ceux qui en
        vivent. Dans un commun, les fruits ne s'accumulent pas — ils reviennent.
      portee_modele: "Se note aux axes 2 et 5."
    - id: abusus
      label: "L'abusus — le droit d'en disposer"
      definition: >
        Le droit de disposer de la chose : la vendre, la transformer, la
        consumer, la détruire. C'est le droit le plus lourd de conséquences. Il
        a deux faces. Une face juridique — aliéner, spéculer — que le projet
        neutralise déjà par l'inaliénabilité. Une face matérielle — épuiser,
        dégrader le fonds — que le cadre neutralise à son tour.
        « Soustraire à l'exploitation abusive », c'est désarmer l'abusus dans
        ses deux faces.
      en_clair: >
        L'abusus, c'est le droit d'en faire ce qu'on veut, jusqu'à l'abîmer : la
        vendre, la bétonner, l'épuiser. C'est le pouvoir le plus dangereux. Une
        terre libérée est une terre sur laquelle ce pouvoir a été désarmé — on
        ne peut plus ni la vendre, ni la vider de sa vie. Le sol qu'on cultive,
        on doit pouvoir le transmettre aussi vivant qu'on l'a reçu.
      portee_modele: "Se note à l'axe 1 (les deux faces) et à l'axe 5."
  verification: >
    Chacun des trois droits se lit deux fois : par la POSTURE (ce que l'entité
    déclare de son orientation) et par la NATURE (ce que ses statuts établissent
    — verrou d'actif, réserves impartageables, forme juridique). La nature
    vérifie la posture ; l'écart entre une posture haute et une nature effondrée
    démasque le « communs-washing ».
  garde_fou: >
    usus/fructus/abusus est un vocabulaire de la propriété. L'élan le plus
    profond de la préservation du vivant conteste, lui, que la terre soit une
    propriété. Le triptyque reste le bon outil — le projet travaille de
    l'intérieur du droit, qu'il dissocie et ré-attache sans l'abolir — mais
    cette tension est réelle et tenue vive, non résolue.

# ─────────────────────────────────────────────────────────────────────────────
# Les 3 catégories référencées
# ─────────────────────────────────────────────────────────────────────────────
categories:
  - id: "porteur"
    label: "Porteur de nue-propriété"
    label_pluriel: "Porteurs de nue-propriété"
    slug_dir: "p"
    definition: >
      Organisme qui détient la nue-propriété — ou la pleine propriété
      sanctuarisée — du foncier, et dont la mission est de la soustraire
      durablement au marché. Typiquement : fondation reconnue d'utilité
      publique, fondation abritée, fonds de dotation, ou collectivité /
      établissement public.
    formes_attendues:
      - fondation reconnue d'utilité publique (FRUP)
      - fondation abritée
      - fonds de dotation (loi du 4 août 2008)
      - collectivité publique / établissement public
      - société à capital citoyen non spéculatif (foncière solidaire)
  - id: "usufruitier"
    label: "Organisme usufruitier"
    label_pluriel: "Organismes usufruitiers"
    slug_dir: "u"
    definition: >
      Personne morale de droit civil à but non lucratif, titulaire de l'usage du
      foncier, qui organise sa gestion au quotidien : occupation, exploitation,
      animation, gouvernance des usagers. Typiquement : association loi 1901,
      société civile, coopérative (SCIC), groupement foncier agricole.
    formes_attendues:
      - association loi 1901
      - société civile (SCI, SCTL, société civile d'exploitation)
      - société coopérative d'intérêt collectif (SCIC)
      - groupement foncier agricole (GFA mutuel / solidaire)
      - collectif d'habitant·es / d'usager·es
  - id: "lieu"
    label: "Lieu"
    label_pluriel: "Lieux"
    slug_dir: "l"
    definition: >
      Lieu physique en France — ferme, domaine, hameau, écolieu, espace
      naturel, tiers-lieu nourricier — dont le foncier a été libéré du marché
      par un montage associant un porteur de nue-propriété et un usufruitier.
      C'est l'unité concrète que l'annuaire recense et analyse.
    activites_attendues:
      - agriculture paysanne / agroécologie
      - élevage
      - habitat partagé / écohameau
      - tiers-lieu nourricier / ferme collective
      - espace naturel protégé
      - pédagogie / accueil / éducation populaire

# ─────────────────────────────────────────────────────────────────────────────
# Typologie de montage — les silhouettes (refonte #3, chantier 5 ; #4, ch. 1bis)
# ─────────────────────────────────────────────────────────────────────────────
# Typologie DESCRIPTIVE : chaque silhouette nomme le MÉCANISME de dissociation —
# la forme de l'assemblage —, jamais sa réussite ni la nature de son porteur.
# Le chantier 1bis (session #4) l'a purifiée : la qualité lucrative ou non d'un
# maillon se lit sur l'axe orthogonal `nature_interet`, et le caractère puriste
# d'un lieu sur le `verdict` calculé — pas sur la silhouette. Première couche du
# modèle à deux couches ; la seconde est l'articulation structurée (voir `titres`
# et le bloc `montage:` des fiches de lieu).
montages:
  - id: "demembrement"
    label: "Démembrement nue-propriété / usufruit"
    definition: >
      Séparation au sens strict du Code civil : un organisme reçoit la
      nue-propriété, un autre l'usufruit (articles 578 et suivants). Le porteur
      détient le sol sans en avoir l'usage ; l'usufruitier en a l'usage sans en
      être propriétaire. L'usufruit constitué au profit d'une personne morale
      est plafonné à 30 ans (article 619).
    en_clair: >
      La terre et son usage sont confiés à deux mains différentes : l'une garde
      le sol pour qu'il ne reparte jamais au marché, l'autre le fait vivre.
      Personne ne tient les deux à la fois — et c'est ce partage qui protège
      le lieu.
    outils: "Démembrement de propriété (art. 544 et 578 C. civ.), acte notarié constitutif d'usufruit."
    titres_frequents: [usufruit]
  - id: "propriete_protegee"
    label: "Propriété conservée + bail de long terme"
    definition: >
      Un porteur dédié conserve la pleine propriété du foncier et en confie
      l'usage par un bail de longue durée — bail rural, souvent environnemental,
      ou bail emphytéotique — ou par convention. La silhouette décrit ce
      mécanisme ; la nature du porteur — non lucrative, désactivée ou
      commerciale — se lit sur l'axe de lucrativité, et le caractère effectif
      de la sanctuarisation sur le verdict du lieu. Modalité dominante de
      l'annuaire.
    en_clair: >
      Une structure garde la propriété de la terre et en remet l'usage, pour
      longtemps, à celles et ceux qui la font vivre. La propriété ne circule
      pas ; seul l'usage circule. Reste à savoir qui tient cette propriété — et
      si elle est vraiment hors d'atteinte du marché.
    outils: "Pleine propriété conservée + clause statutaire ; bail rural (≥ 9 ans), bail rural environnemental, bail emphytéotique (jusqu'à 99 ans), convention."
    titres_frequents: [bail_rural, bail_emphyteotique, bail_reel_solidaire, convention]
  - id: "propriete_publique"
    label: "Propriété publique inaliénable"
    definition: >
      Le foncier appartient à une personne publique et entre dans un domaine
      inaliénable ; la gestion ou l'usage est délégué à un tiers par convention
      domaniale, autorisation d'occupation ou délégation.
    en_clair: >
      La terre est dans le domaine public — par construction, on ne peut pas la
      vendre. Une collectivité la garde ; elle en confie l'usage à un collectif
      qui l'anime.
    outils: "Domanialité publique, convention d'occupation domaniale, autorisation d'occupation temporaire, délégation de gestion."
    titres_frequents: [domanialite, convention]
  - id: "propriete_collective"
    label: "Propriété collective"
    definition: >
      Le foncier est détenu par une structure collective — société civile,
      coopérative, groupement foncier agricole. Souvent une chaîne intégrée :
      le collectif qui détient est aussi celui qui use. Le degré de verrouillage
      anti-spéculatif et la nature lucrative de la structure se lisent sur l'axe
      de lucrativité, non sur la silhouette.
    en_clair: >
      Celles et ceux qui vivent le lieu en sont aussi, ensemble, les
      propriétaires — à travers une structure qu'ils tiennent collectivement.
      Pas de propriétaire au-dessus d'eux ; reste à savoir si leurs règles
      interdisent vraiment de revendre pour un gain privé.
    outils: "Société civile, coopérative (SCIC), groupement foncier agricole."
    titres_frequents: [integre, convention]
  - id: "propriete_privee_individuelle"
    label: "Propriété privée individuelle"
    definition: >
      Le foncier reste la pleine propriété d'une ou plusieurs personnes
      physiques ; il n'est pas soustrait au marché. L'usage peut être confié par
      un titre — bail, convention, commodat —, mais le sol demeure un patrimoine
      privé, transmissible et vendable. Cas-limite de l'annuaire : une terre que
      le montage ne libère pas.
    en_clair: >
      La terre appartient à une famille, à une personne — elle peut être vendue,
      transmise, héritée comme n'importe quel bien. Un collectif peut l'occuper
      et l'animer, mais rien n'empêche, un jour, sa mise en vente. La libération
      n'a pas eu lieu.
    outils: "Pleine propriété individuelle (art. 544 C. civ.) ; usage éventuellement confié par bail, convention ou commodat."
    titres_frequents: [bail_rural, convention, commodat]
  - id: "propriete_privee_commerciale"
    label: "Propriété privée commerciale"
    definition: >
      Le foncier est détenu par une société à but lucratif — SCI patrimoniale,
      société commerciale — dont les parts portent la valeur du bien et restent
      cessibles. Le sol est un actif. L'usage peut être conventionné, mais le
      montage valorise un patrimoine privé plutôt qu'il ne libère une terre.
      Cas-limite de l'annuaire.
    en_clair: >
      La terre est logée dans une société : ce qu'on possède, ce sont des parts,
      et ces parts valent ce que vaut le bien. Le lieu peut se présenter en
      collectif ou en écolieu — il sert d'abord un patrimoine. C'est la « fausse
      libération » la plus trompeuse.
    outils: "Société commerciale ou SCI patrimoniale, parts cessibles portant la valeur du foncier ; usage éventuellement conventionné."
    titres_frequents: [convention, bail_rural]

# ─────────────────────────────────────────────────────────────────────────────
# Vocabulaire des titres d'articulation (refonte #3, chantier 5)
# ─────────────────────────────────────────────────────────────────────────────
# Seconde couche du modèle : l'ACTE qui relie le porteur à un usufruitier dans
# la chaîne d'un lieu. Énuméré, extensible. Une fiche de lieu déclare ses
# articulations dans son bloc `montage.articulations:`.
titres:
  - id: usufruit
    label: "Usufruit"
    definition: >
      Droit réel d'usage et de jouissance constitué par démembrement ; plafonné
      à 30 ans pour une personne morale (art. 619 C. civ.).
  - id: bail_rural
    label: "Bail rural"
    definition: >
      Bail d'au moins 9 ans, avec droit au renouvellement d'ordre public ; le
      bail rural environnemental y inscrit des clauses écologiques.
  - id: bail_emphyteotique
    label: "Bail emphytéotique"
    definition: >
      Bail de très longue durée — 18 à 99 ans — conférant un droit réel à
      l'usufruitier.
  - id: bail_reel_solidaire
    label: "Bail réel solidaire (BRS)"
    definition: >
      Bail de longue durée consenti par un organisme de foncier solidaire,
      dissociant durablement le bâti du foncier.
  - id: bail_a_construction
    label: "Bail à construction"
    definition: >
      Bail de 18 à 99 ans par lequel le preneur s'engage à édifier des
      constructions ; il en a la propriété et un droit réel pendant la durée du
      bail, sans transfert de la propriété du sol (art. L. 251-1 C. constr.).
  - id: convention
    label: "Convention d'usage"
    definition: >
      Convention de mise à disposition ou d'occupation ; sa solidité dépend de
      sa durée et de ses clauses de renouvellement.
  - id: commodat
    label: "Commodat (prêt à usage)"
    definition: >
      Prêt à usage à titre gratuit (art. 1875 C. civ.) ; gratuit, mais précaire
      — le prêteur peut reprendre le bien.
  - id: domanialite
    label: "Occupation domaniale"
    definition: >
      Titre d'occupation du domaine public — convention domaniale ou
      autorisation d'occupation.
  - id: integre
    label: "Chaîne intégrée"
    definition: >
      Le porteur et l'usufruitier sont une seule entité : la propriété et
      l'usage ne sont pas dissociés (coopérative d'habitants propriétaire).

# ─────────────────────────────────────────────────────────────────────────────
# Axe de lucrativité — `nature_interet` (refonte #3, chantier 1bis)
# ─────────────────────────────────────────────────────────────────────────────
# Axe DESCRIPTIF orthogonal à la silhouette : il qualifie la nature lucrative ou
# non d'un maillon — porteur ou usufruitier —, indépendamment de la forme du
# montage. Chaque fiche de porteur et d'usufruitier déclare son `nature_interet:`.
# Le seuil puriste est la DÉSACTIVATION : l'intérêt privé n'est neutralisé que
# lorsque 100 % du capital d'une société est détenu par des organismes non
# lucratifs d'intérêt général ou d'utilité publique.
nature_interet:
  - id: non_lucrative
    label: "Non lucrative"
    definition: >
      Personne morale structurellement non lucrative : association loi 1901,
      fondation, fonds de dotation, personne publique ou établissement public.
      L'intérêt privé est absent par construction — pas de capital appropriable.
    en_clair: >
      Une structure qui, par sa forme même, n'appartient à personne et ne
      rapporte à personne : rien à revendre, rien à empocher.
  - id: commerciale_desactivee
    label: "Commerciale à intérêt privé désactivé"
    definition: >
      Société — commerciale ou civile — dont la totalité des parts ou actions
      est détenue par un ou des organismes non lucratifs d'intérêt général ou
      d'utilité publique. La forme est commerciale, mais l'intérêt privé y est
      entièrement désactivé : aucune personne privée ne peut capter la valeur.
    en_clair: >
      Une société sur le papier, mais dont chaque part est aux mains d'une
      fondation ou d'un organisme d'intérêt général : la coquille est
      commerciale, le contenu ne profite à aucun particulier.
  - id: commerciale_encadree
    label: "Commerciale à lucrativité encadrée"
    definition: >
      Société à lucrativité statutairement bornée mais à capital partiellement
      privé : SCIC, société en commandite par actions à actionnariat solidaire,
      foncière solidaire agréée ESUS. L'intérêt privé y est présent mais
      discipliné — plus-value plafonnée, verrou d'actif, agrément.
    en_clair: >
      Une société qui s'impose des règles : pas de gros gains, un cadre
      solidaire. L'intérêt privé n'a pas disparu — il est tenu en bride.
  - id: exploitation_agricole
    label: "Société civile d'exploitation agricole"
    definition: >
      Société civile de travail agricole — GAEC, EARL pluripersonnelle, SCEA
      exploitante — dont les associé·es vivent du produit de leur travail sur la
      terre, sans détenir le fonds (preneur·euses d'un bail sous un porteur
      hors-marché) ou en le détenant sous verrou anti-spéculatif vérifié.
      Lucrative pour ses associé·es (appropriation du bénéfice d'exploitation),
      mais non spéculative sur le foncier et non commerciale au sens du marché
      ouvert. Sa lecture est RELATIONNELLE : preneuse d'un bail sécurisé sous un
      porteur hors-marché, elle plafonne le lieu à `hybride` ; détentrice ou
      intégrée à la propriété, elle se lit `commerciale`. Un lieu dont c'est le
      maillon le plus restrictif n'atteint jamais le sommet : l'appropriation du
      bénéfice d'exploitation l'en écarte.
    en_clair: >
      Des paysan·nes qui vivent de leur ferme sans pouvoir revendre la terre :
      une économie de travail, pas une société de marché — mais le revenu reste
      individuel. Tant qu'ils sont locataires d'un porteur qui tient le sol hors
      du marché, le lieu n'est pas marchand ; mais ce n'est pas non plus le
      sommet du commun.
  - id: commerciale
    label: "Commerciale à lucrativité ouverte"
    definition: >
      Société à but lucratif non bornée par les statuts : société commerciale
      ordinaire à parts cessibles, ou société (civile ou commerciale) qui détient
      un foncier valorisable à titre privé. La société civile d'exploitation
      agricole qui DÉTIENT le fonds, ou l'exploite sans bail sécurisé sous un
      porteur hors-marché, relève de cette nature par dérivation (voir
      `exploitation_agricole`).
    en_clair: >
      Une structure faite pour rapporter à ses membres : une société de marché,
      ou une exploitation qui détient sa terre et pourrait la valoriser. Rien
      d'illégitime — mais ce n'est pas un commun désintéressé.
  - id: privee_individuelle
    label: "Privée individuelle"
    definition: >
      Personne physique détenant un foncier en propre — patrimoine privé
      individuel, transmissible et vendable.
    en_clair: >
      Une personne, une famille : la terre est leur bien, comme une maison ou
      un terrain ordinaire.
  - id: inconnu
    label: "Nature non établie"
    definition: >
      La nature lucrative ou non du maillon n'est pas établie par les sources :
      statuts non publiés, forme juridique ambiguë (société civile d'habitants,
      GFA, collectif sans forme juridique publiée). Valeur par défaut — jamais
      fabriquée. Un maillon de nature inconnue empêche le verdict `sanctuaire`.
    en_clair: >
      On ne sait pas encore si cette structure laisse ou non capter un intérêt
      privé : faute de statuts publics, on ne tranche pas.

# ─────────────────────────────────────────────────────────────────────────────
# Le verdict du lieu — `verdict` calculé (refonte #3, chantier 1bis)
# ─────────────────────────────────────────────────────────────────────────────
# Le verdict n'est JAMAIS saisi : le générateur le calcule pour chaque lieu, à
# partir de la chaîne (axe `nature_interet` de chaque maillon), de
# l'irréversibilité du foncier et des critères d'habitat du vivant (D-B). Une
# seule source de vérité — la carte ne peut plus contredire le radar. « Sanctuariser »
# n'est pas une forme : c'est ce verdict, à son sommet.
verdict:
  regle: >
    La nature de chaque maillon est lue EFFECTIVEMENT : un maillon
    `exploitation_agricole` preneur d'un bail sécurisé sous un porteur
    hors-marché garde cette nature ; détenteur ou intégré à la propriété, il se
    lit `commerciale`. Puis : `marchand` si la chaîne compte un maillon effectif
    `commerciale` ou `privee_individuelle`. Sinon `hybride` si elle compte un
    maillon `commerciale_encadree` ou `exploitation_agricole` (intérêt privé
    encadré ou bénéfice d'exploitation approprié : plafond du sommet). Sinon —
    chaîne entièrement `non_lucrative` ou `commerciale_desactivee` —
    `sanctuaire` lorsque, de plus, TOUS les co-gates observables sont au vert :
    foncier irréversiblement hors-marché, habitat du vivant (vivant_finalite +
    place_au_vivant), régénération opposable (milieu_protege), finalité d'usage
    (usage non marchand + intérêt général) et travail non marchandisé (hors
    salariat de marché, proxy unidirectionnel). À défaut de l'un de ces
    co-gates, le lieu reste `hybride`. Le verdict `sanctuaire` ne s'allume jamais
    tant qu'un maillon est de nature `inconnu`, ni tant qu'un co-gate est
    `inconnu` : il émerge au fil du peuplement, jamais par défaut.
  degres:
    - id: marchand
      label: "Montage marchand"
      definition: >
        La chaîne comporte un maillon à lucrativité ouverte ou un propriétaire
        privé individuel : la valeur du foncier reste captable.
      en_clair: >
        Quelque part dans le montage, quelqu'un peut encore gagner de l'argent
        sur cette terre. Elle n'est pas libérée.
    - id: hybride
      label: "Montage hybride"
      definition: >
        La chaîne ne comporte aucun maillon marchand, mais au moins un maillon
        à lucrativité encadrée (intérêt privé discipliné, non désactivé) ou une
        société civile d'exploitation agricole preneuse de bail sous un porteur
        hors-marché (le bénéfice d'exploitation reste approprié par les
        associé·es). Y figure aussi le commun juridiquement abouti dont l'un des
        co-gates du sommet (habitat du vivant, régénération opposable, finalité
        d'usage non marchande, travail non marchandisé) n'est pas encore établi.
      en_clair: >
        Un montage solide et de bonne foi, mais pas tout à fait le sommet : un
        maillon garde une part d'intérêt privé, des paysan·nes vivent du produit
        de leur travail, ou l'une des conditions du commun pleinement libre
        reste à confirmer.
    - id: sanctuaire
      label: "Sanctuaire"
      definition: >
        La formule fondatrice est entièrement tenue : chaîne entièrement non
        lucrative ou à intérêt privé désactivé, ET tous les co-gates observables
        au vert — foncier irréversiblement hors-marché, habitat du vivant,
        protection durable et opposable du milieu, usage non marchand d'intérêt
        général, et travail non marchandisé (hors salariat). Incarnation visible du pôle « Le
        commun libre et vivant ». Son extrême le plus pur inclut la terre rendue
        à la vie sauvage, accès humain volontairement exclu. Sommet rare, horizon
        plus que case à remplir.
      en_clair: >
        Une terre vraiment libre : nul ne peut la vendre, nul ne peut en tirer
        un gain privé, et la vie — humaine et non-humaine — y a sa place
        pleine. C'est l'aboutissement, rare, de la démarche.

# ─────────────────────────────────────────────────────────────────────────────
# Modèles voisins de référence (comparaison — hors des 3 catégories)
# ─────────────────────────────────────────────────────────────────────────────
modeles_voisins:
  description: >
    Modèles « puristes » proches, recensés à titre de comparaison pour situer
    le montage de référence. Restent dans le droit civil et l'intérêt général
    à des degrés divers.
  exemples:
    - "Organisme de Foncier Solidaire (OFS) + Bail Réel Solidaire (BRS)"
    - "Community Land Trust (CLT) — modèle de Bruxelles"
    - "Stiftung trias (Allemagne) — fondation + droit de superficie"
    - "Mietshäuser Syndikat (Allemagne) — neutralisation de la propriété"
    - "Conservatoires d'espaces naturels (CEN)"

# ─────────────────────────────────────────────────────────────────────────────
# Les trois régimes du sol — cadre conceptuel
# ─────────────────────────────────────────────────────────────────────────────
regimes:
  chapeau: >
    En droit français, une même parcelle peut relever de logiques opposées.
    La libération des terres ne crée pas un droit nouveau : elle réemploie des
    outils de droit civil — démembrement, baux longs, statuts non lucratifs —
    pour soustraire le foncier à la logique marchande. Cette page nomme les
    trois régimes que l'annuaire oppose.
  liste:
    - id: civil_commun
      label: "Droit civil au service de l'intérêt général et des communs"
      outils: >
        Démembrement (articles 544 et 578 du Code civil), fondation, fonds de
        dotation, bail rural ou emphytéotique, association, SCIC.
      but: >
        Placer le foncier au service d'un usage collectif d'intérêt général et
        l'y maintenir durablement.
      role: "Régime de référence de l'annuaire."
    - id: commercial
      label: "Droit commercial : sociétés, lucrativité, spéculation"
      outils: >
        Société commerciale, parts ou actions librement cessibles, recherche
        de plus-value et de dividende.
      but: "Valoriser un capital ; le foncier y est un actif."
      role: "Régime repoussoir — parfois neutralisé par les statuts."
    - id: propriete_privee
      label: "Propriété privée classique"
      outils: "Pleine propriété individuelle (article 544 du Code civil)."
      but: "Maîtrise et transmission patrimoniale privées."
      role: "Point de départ ordinaire ; non référencé par l'annuaire."
  paradoxe: >
    Certains montages réels partent du droit commercial — Lurzaindia en société
    en commandite par actions, le Mietshäuser Syndikat en réseau de sociétés —
    mais en neutralisent la lucrativité par leurs statuts. La frontière entre
    les régimes ne tient pas à la seule forme juridique, mais à l'usage qu'on
    en fait.

# ─────────────────────────────────────────────────────────────────────────────
# Les cinq pôles — profils de référence sur le triptyque
# ─────────────────────────────────────────────────────────────────────────────
# Les trois régimes du sol se précisent en cinq pôles : cinq PROFILS DE RÉFÉRENCE
# sur le triptyque usus/fructus/abusus. Les pôles ne sont pas des cases — une
# entité réelle, presque toujours hybride, reçoit un profil, et l'écart entre ce
# profil et le pôle le plus proche est lui-même une information. Le pôle de tête,
# refondé par la refonte #3, n'est plus un commun purement humain : c'est le
# commun LIBRE ET VIVANT. (Son id reste `commun_citoyen` — identifiant historique
# conservé, leçon L2 : seul le label évolue, aucune fiche à migrer.)
poles:
  chapeau: >
    Du commun libre et vivant — repère du cadre — à la propriété marchande
    qu'il affronte, cinq pôles jalonnent le ré-agencement du triptyque. Le repère
    n'est pas l'intérêt général d'État mais la gouvernance citoyenne collective
    de droit civil, ouverte au vivant : une troisième voie, ni étatique ni
    marchande.
  en_clair: >
    Entre le commun le plus abouti et la pure propriété de marché, on peut
    repérer cinq grandes figures. Aucun lieu réel ne s'y range proprement :
    chacun tient un peu de plusieurs. Ces cinq repères servent à dire de quel
    côté un montage penche — pas à le ranger dans une case.
  liste:
    - id: commun_citoyen
      rang: 1
      label: "Le commun libre et vivant"
      regime: civil_commun
      role: "Pôle de référence."
      usus: >
        Partagé : gouverné par le collectif citoyen usager, autogéré et
        horizontal, et ouvert au vivant non-humain reconnu cohabitant du lieu.
      fructus: "Supprimé — gratuité, don, troc — ou intégralement réinvesti dans la mission."
      abusus: "Neutralisé dans ses deux faces : le lieu ne peut être ni vendu, ni épuisé."
      logique: "Le commun — troisième voie, ni État ni commerce, ni purement humaine."
      en_clair: >
        Le cas le plus abouti : un lieu gouverné par celles et ceux qui
        l'habitent, que personne ne peut vendre ni épuiser, dont les fruits
        reviennent au lieu, et qui fait place au vivant autant qu'aux humains.
        C'est le repère — pas une moyenne, un horizon.
    - id: ig_institue
      rang: 2
      label: "L'intérêt général institué"
      regime: civil_commun
      role: "Allié du pôle de référence — même régime, gouvernance descendante."
      usus: >
        Gouverné par une instance mandatée — conseil, tutelle, donateurs — non
        par les usager·es eux-mêmes ; cercle de souci resté humain.
      fructus: "Non lucratif : pas d'appropriation des fruits."
      abusus: "Neutralisé dans sa face juridique (inaliénabilité) ; face matérielle variable, non garantie."
      logique: "L'intérêt général administré."
      en_clair: >
        Un lieu non lucratif et protégé, mais décidé d'en haut — par un conseil,
        des donateurs, une tutelle — plutôt que par ses usager·es.
    - id: mutualisme
      rang: 3
      label: "Le mutualisme d'usagers"
      regime: commercial
      role: "Pôle des « faux amis » — lexique social, bénéfice fermé."
      usus: "Gouverné par les sociétaires — cercle fermé."
      fructus: "Lucrativité plafonnée mais réelle : les fruits servent le sociétariat."
      abusus: "Partiellement actif : parts cessibles, le foncier reste mobilisable."
      logique: "L'entraide entre membres ; SCIC, coopérative, SCOP."
      en_clair: >
        Le piège des mots : on y parle d'entraide et d'utilité sociale, mais
        c'est une société, ses fruits vont à ses membres, et le foncier reste
        mobilisable.
    - id: economie_marchande
      rang: 4
      label: "L'économie sociale marchande"
      regime: commercial
      role: "Posture sociale, structure de rentabilité."
      usus: "Décidé par les dirigeants et les investisseurs « patients »."
      fructus: "Un rendement est servi au capital."
      abusus: "Actif : le foncier est un actif que l'on valorise."
      logique: "Rentabilité tempérée par une posture sociale."
      en_clair: >
        Une posture sociale sincère, mais une structure faite pour rapporter :
        un rendement, même modéré, est servi au capital.
    - id: propriete_marchande
      rang: 5
      label: "La propriété marchande"
      regime: propriete_privee
      role: "Pôle repoussoir — c'est lui que le commun libre affronte."
      usus: "Le propriétaire seul."
      fructus: "Plus-value, spéculation."
      abusus: "Plein et entier — vendre, transformer, épuiser sans frein."
      logique: "Le marché."
      en_clair: >
        La terre comme placement : on l'achète, on la revend, on en tire le
        maximum. C'est ce que le commun cherche à défaire.
  registres:
    chapeau: >
      Chaque pôle se profile sur les trois droits du triptyque — usus, fructus,
      abusus (voir la section « Le triptyque »). Les profils ci-dessus disent,
      droit par droit, ce qui caractérise chaque pôle.

# ─────────────────────────────────────────────────────────────────────────────
# Anti-concepts — ce que l'annuaire ne référence PAS
# ─────────────────────────────────────────────────────────────────────────────
anti_concepts:
  - "propriété privée individuelle classique, même 'vertueuse'"
  - "société (SCI, GFA familial) à but lucratif et parts librement cessibles"
  - "montage dont l'objet premier est l'optimisation fiscale ou patrimoniale"
  - "lieu réservé à un cercle restreint de personnes (perte de l'intérêt général)"
  - "dispositif spéculatif déguisé en 'foncier solidaire'"
  - "projet purement privé sans personne morale non lucrative dans le montage"

# ─────────────────────────────────────────────────────────────────────────────
# Ligne éditoriale
# ─────────────────────────────────────────────────────────────────────────────
editorial:
  registres_d_ecriture:
    chapeau: >
      Le site s'écrit à deux voix, appariées partout (voir conception-refonte-3.md
      §7). Tout concept porte sa définition exacte et son champ `en_clair:`.
    voix_exacte: >
      Le mot juste — usus/fructus/abusus, les axes, les pôles, les critères.
      Elle fait l'autorité de l'annuaire ; elle tient la méthodologie, les
      définitions et les concepts.
    voix_incarnee: >
      La même chose, dite par ce qu'elle change dans une vie : le sol qu'on
      transmet, le loyer qui revient, les oiseaux qu'on entend, la sécurité de
      rester. Elle domine le front du site ; elle est portée par les champs
      `en_clair:`.
    regle_d_or: >
      La voix incarnée ajoute de la chaleur et du concret ; elle ne remplace
      jamais la rigueur et ne moralise jamais. On décrit une vie meilleure, on
      n'exhorte pas. Si elle fragilise la crédibilité de l'annuaire, elle a
      échoué.
  voice: >
    factuel, rigoureux, sobre pour la voix exacte ; concret, calme et sensible
    pour la voix incarnée — registre documentaire et juridique d'un côté, récit
    de la vie quotidienne d'un lieu de l'autre.
  audience: >
    Porteur·ses de projet foncier, juristes, collectivités, donateur·rices,
    chercheur·ses et militant·es de l'accès à la terre qui cherchent un
    référentiel clair des montages de libération des terres et de leur solidité.
  principes:
    - "Distinguer toujours les faits vérifiés des points non confirmés."
    - "Ne jamais inventer un montage, un chiffre ou un article de loi."
    - "Le classement est une évaluation au regard d'un cadre explicite et contestable, non un label."
    - "Citer les sources ; respecter le droit d'auteur (reformuler)."
    - "Écrire à deux voix : tout concept porte sa définition exacte et son `en_clair:`."
