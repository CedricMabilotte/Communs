# ─────────────────────────────────────────────────────────────────────────────
# concepts.yml — Ontologie du fork « Terres Libérées »
# ─────────────────────────────────────────────────────────────────────────────
# Fork de « Résidence » (lui-même fork de BIBLIO). Domaine : recensement des
# lieux en France établis selon les principes de la « libération des terres »,
# c.-à-d. où la NUE-PROPRIÉTÉ du foncier est placée dans un organisme d'intérêt
# général ou d'utilité publique, et l'USUFRUIT / l'usage confié à une personne
# morale de droit civil (association loi 1901, société civile, coopérative).
# Interface publique : français.
#
# Refonte #3 (mai 2026) : le cadre est ré-adossé au triptyque usus/fructus/
# abusus ; « libérer » est élargi — soustraire à l'exploitation abusive ET
# préserver le lieu comme habitat pour le vivant. Référence : conception-
# refonte-3.md.
# ─────────────────────────────────────────────────────────────────────────────
project:
  name: "terres-liberees"
  display_name: "Terres Libérées"
  logo_mark: "TL"
  tagline: "Annuaire critique des montages de libération des terres en France."
  description: >
    Recensement et analyse stratégique des lieux français où la terre a été
    soustraite au marché spéculatif par dissociation de la propriété : la
    nue-propriété (ou la propriété sanctuarisée) est portée par un organisme
    d'intérêt général ou d'utilité publique — fondation, fonds de dotation,
    collectivité publique — et l'usufruit ou l'usage est confié à une personne
    morale de droit civil à but non lucratif. Trois catégories sont référencées
    et analysées : les organismes porteurs de nue-propriété, les organismes
    usufruitiers, et les lieux eux-mêmes. Chaque entrée est lue à travers une
    grille d'analyse stratégique et notée par un Indice de libération.
  baseline: "nue-propriété d'intérêt général · usufruit non lucratif · sortie du marché"
  language: fr
  url: "https://communs.actitude.org"

# ─────────────────────────────────────────────────────────────────────────────
# Le concept central
# ─────────────────────────────────────────────────────────────────────────────
concept_central:
  terme: "libération des terres"
  formule: >
    Une terre est libérée lorsqu'elle est soustraite à l'exploitation abusive
    et préservée comme habitat pour le vivant — humain et non-humain.
  definition: >
    Ensemble de pratiques visant à soustraire durablement un foncier — agricole
    le plus souvent, mais aussi bâti, naturel ou d'habitat — à l'exploitation
    abusive : ni vendu ni spéculé (sortie du marché), ni épuisé ni dégradé
    (préservation du fonds) ; et à le placer au service d'un usage défini
    collectivement, d'intérêt général, partagé avec le vivant non-humain. Le
    terme n'est pas un concept juridique codifié : il appartient au vocabulaire
    des mouvements de l'agriculture paysanne, des communs et de l'éducation
    populaire. Le cadre en élargit le sens — « libérer » ne se borne plus
    à « soustraire au marché », qui n'est qu'une forme d'exploitation abusive
    parmi d'autres ; un collectif hors-marché peut, lui aussi, épuiser son sol.
  en_clair: >
    Posséder une terre, aujourd'hui, c'est pouvoir la vendre, en tirer le
    maximum, et l'épuiser si cela rapporte. La libérer, c'est lui retirer ce
    sort : faire qu'on ne puisse plus ni la vendre, ni la surexploiter, ni la
    vider de sa vie — et qu'elle reste un lieu habité, partagé entre les humains
    et le reste du vivant.
  ressort_juridique: >
    La distinction entre la PROPRIÉTÉ (qui reste au collectif non lucratif) et
    l'USAGE (confié à des usagers). Le démembrement du droit de propriété
    (article 544 du Code civil) en nue-propriété et usufruit (articles 578 et s.)
    est l'une des modalités possibles ; d'autres montages — propriété
    sanctuarisée + bail de long terme, propriété publique inaliénable —
    poursuivent le même but.
  verrou_cle: >
    L'usufruit constitué au profit d'une personne morale ne peut excéder 30 ans
    (article 619 du Code civil, règle d'ordre public). L'usufruit d'une
    association n'est donc jamais perpétuel : son renouvellement dépend d'une
    volonté future. Ce plafond de 30 ans ne vise toutefois QUE les démembrements
    véritables : il ne s'applique ni aux baux ruraux (durée minimale de 9 ans,
    mais droit au renouvellement d'ordre public), ni aux baux emphytéotiques
    (jusqu'à 99 ans), ni à la propriété publique. La fragilité des 30 ans est
    donc propre aux montages réellement démembrés, et non commune à tout montage.

# ─────────────────────────────────────────────────────────────────────────────
# Le triptyque usus / fructus / abusus — ossature conceptuelle (refonte #3)
# ─────────────────────────────────────────────────────────────────────────────
# Le droit civil reconnaît trois droits sur une chose. Le commun n'invente pas un
# quatrième droit : il ré-agence collectivement les trois. Le triptyque est la
# colonne vertébrale du modèle — les cinq pôles s'y profilent, les cinq axes de
# l'Indice s'y projettent (axe 1 → abusus ; axe 2 → fructus + abusus ; axe 3 →
# usus ; axe 4 → usus ; axe 5 → les trois).
triptyque:
  chapeau: >
    Posséder une chose, en droit, c'est tenir trois droits distincts : l'usus,
    le fructus, l'abusus. La libération des terres se lit tout entière comme un
    ré-agencement collectif de ces trois droits — fructus socialisé ou supprimé,
    abusus neutralisé, usus partagé.
  en_clair: >
    Posséder, en droit, ce n'est pas une seule chose mais trois pouvoirs : se
    servir du bien, en tirer un revenu, et en disposer — jusqu'à le détruire.
    Libérer une terre, c'est remettre ces trois pouvoirs en des mains
    collectives, et désarmer le plus dangereux.
  droits:
    - id: usus
      label: "L'usus — le droit d'utiliser"
      definition: >
        Le droit de se servir de la chose : l'habiter, la cultiver, s'y réunir,
        y travailler. Le commun le confie à un collectif d'usager·es qui le
        gouverne ; et il cesse d'en faire
        un monopole humain : le vivant non-humain est reconnu cohabitant du
        lieu, dont l'usage est pris en compte.
      en_clair: >
        L'usus, c'est le droit de se servir du lieu : l'habiter, le cultiver,
        s'y réunir. Dans un commun, ce droit appartient à celles et ceux qui
        vivent le lieu — et pas seulement à eux : les oiseaux, les insectes, les
        arbres, le sol lui-même y ont aussi leur place. On n'y est pas seuls.
      portee_modele: "Sa gouvernance se note à l'axe 3 ; son ouverture au vivant, à l'axe 4."
    - id: fructus
      label: "Le fructus — le droit aux fruits"
      definition: >
        Le droit de percevoir les fruits et les revenus de la chose. Le commun
        le supprime (gratuité, don, troc) ou le redirige intégralement vers la
        mission ; il interdit son accumulation privée. C'est le droit que police
        l'échelle de marchandisation.
      en_clair: >
        Le fructus, c'est ce que la terre rapporte — une récolte, un loyer, une
        valeur. La question n'est pas qu'elle rapporte, mais où cela va : dans
        la poche de quelqu'un, ou de retour au lieu et à celles et ceux qui en
        vivent. Dans un commun, les fruits ne s'accumulent pas — ils reviennent.
      portee_modele: "Se note aux axes 2 et 5."
    - id: abusus
      label: "L'abusus — le droit d'en disposer"
      definition: >
        Le droit de disposer de la chose : la vendre, la transformer, la
        consumer, la détruire. C'est le droit le plus lourd de conséquences. Il
        a deux faces. Une face juridique — aliéner, spéculer — que le projet
        neutralise déjà par l'inaliénabilité. Une face matérielle — épuiser,
        dégrader le fonds — que le cadre neutralise à son tour.
        « Soustraire à l'exploitation abusive », c'est désarmer l'abusus dans
        ses deux faces.
      en_clair: >
        L'abusus, c'est le droit d'en faire ce qu'on veut, jusqu'à l'abîmer : la
        vendre, la bétonner, l'épuiser. C'est le pouvoir le plus dangereux. Une
        terre libérée est une terre sur laquelle ce pouvoir a été désarmé — on
        ne peut plus ni la vendre, ni la vider de sa vie. Le sol qu'on cultive,
        on doit pouvoir le transmettre aussi vivant qu'on l'a reçu.
      portee_modele: "Se note à l'axe 1 (les deux faces) et à l'axe 5."
  verification: >
    Chacun des trois droits se lit deux fois : par la POSTURE (ce que l'entité
    déclare de son orientation) et par la NATURE (ce que ses statuts établissent
    — verrou d'actif, réserves impartageables, forme juridique). La nature
    vérifie la posture ; l'écart entre une posture haute et une nature effondrée
    démasque le « communs-washing ».
  garde_fou: >
    usus/fructus/abusus est un vocabulaire de la propriété. L'élan le plus
    profond de la préservation du vivant conteste, lui, que la terre soit une
    propriété. Le triptyque reste le bon outil — le projet travaille de
    l'intérieur du droit, qu'il dissocie et ré-attache sans l'abolir — mais
    cette tension est réelle et tenue vive, non résolue.

# ─────────────────────────────────────────────────────────────────────────────
# Les 3 catégories référencées
# ─────────────────────────────────────────────────────────────────────────────
categories:
  - id: "porteur"
    label: "Porteur de nue-propriété"
    label_pluriel: "Porteurs de nue-propriété"
    slug_dir: "p"
    definition: >
      Organisme qui détient la nue-propriété — ou la pleine propriété
      sanctuarisée — du foncier, et dont la mission est de la soustraire
      durablement au marché. Typiquement : fondation reconnue d'utilité
      publique, fondation abritée, fonds de dotation, ou collectivité /
      établissement public.
    formes_attendues:
      - fondation reconnue d'utilité publique (FRUP)
      - fondation abritée
      - fonds de dotation (loi du 4 août 2008)
      - collectivité publique / établissement public
      - société à capital citoyen non spéculatif (foncière solidaire)
  - id: "usufruitier"
    label: "Organisme usufruitier"
    label_pluriel: "Organismes usufruitiers"
    slug_dir: "u"
    definition: >
      Personne morale de droit civil à but non lucratif, titulaire de l'usage du
      foncier, qui organise sa gestion au quotidien : occupation, exploitation,
      animation, gouvernance des usagers. Typiquement : association loi 1901,
      société civile, coopérative (SCIC), groupement foncier agricole.
    formes_attendues:
      - association loi 1901
      - société civile (SCI, SCTL, société civile d'exploitation)
      - société coopérative d'intérêt collectif (SCIC)
      - groupement foncier agricole (GFA mutuel / solidaire)
      - collectif d'habitant·es / d'usager·es
  - id: "lieu"
    label: "Lieu"
    label_pluriel: "Lieux"
    slug_dir: "l"
    definition: >
      Lieu physique en France — ferme, domaine, hameau, écolieu, espace
      naturel, tiers-lieu nourricier — dont le foncier a été libéré du marché
      par un montage associant un porteur de nue-propriété et un usufruitier.
      C'est l'unité concrète que l'annuaire recense et analyse.
    activites_attendues:
      - agriculture paysanne / agroécologie
      - élevage
      - habitat partagé / écohameau
      - tiers-lieu nourricier / ferme collective
      - espace naturel protégé
      - pédagogie / accueil / éducation populaire

# ─────────────────────────────────────────────────────────────────────────────
# Typologie de montage — les silhouettes (refonte #3, chantier 5 ; #4, ch. 1bis)
# ─────────────────────────────────────────────────────────────────────────────
# Typologie DESCRIPTIVE : chaque silhouette nomme le MÉCANISME de dissociation —
# la forme de l'assemblage —, jamais sa réussite ni la nature de son porteur.
# Le chantier 1bis (session #4) l'a purifiée : la qualité lucrative ou non d'un
# maillon se lit sur l'axe orthogonal `nature_interet`, et le caractère puriste
# d'un lieu sur le `verdict` calculé — pas sur la silhouette. Première couche du
# modèle à deux couches ; la seconde est l'articulation structurée (voir `titres`
# et le bloc `montage:` des fiches de lieu).
montages:
  - id: "demembrement"
    label: "Dissociation propriété / usage (démembrement)"
    definition: >
      Séparation au sens strict du Code civil : un organisme reçoit la
      nue-propriété, un autre l'usufruit (articles 578 et suivants). Le porteur
      détient le sol sans en avoir l'usage ; l'usufruitier en a l'usage sans en
      être propriétaire. L'usufruit constitué au profit d'une personne morale
      est plafonné à 30 ans (article 619).
    en_clair: >
      La terre et son usage sont confiés à deux mains différentes : l'une garde
      le sol pour qu'il ne reparte jamais au marché, l'autre le fait vivre.
      Personne ne tient les deux à la fois — et c'est ce partage qui protège
      le lieu.
    outils: "Démembrement de propriété (art. 544 et 578 C. civ.), acte notarié constitutif d'usufruit."
    titres_frequents: [usufruit]
  - id: "propriete_protegee"
    label: "Propriété conservée + bail de long terme"
    definition: >
      Un porteur dédié conserve la pleine propriété du foncier et en confie
      l'usage par un bail de longue durée — bail rural, souvent environnemental,
      ou bail emphytéotique — ou par convention. La silhouette décrit ce
      mécanisme ; la nature du porteur — non lucrative, désactivée ou
      commerciale — se lit sur l'axe de lucrativité, et le caractère effectif
      de la sanctuarisation sur le verdict du lieu. Modalité dominante de
      l'annuaire.
    en_clair: >
      Une structure garde la propriété de la terre et en remet l'usage, pour
      longtemps, à celles et ceux qui la font vivre. La propriété ne circule
      pas ; seul l'usage circule. Reste à savoir qui tient cette propriété — et
      si elle est vraiment hors d'atteinte du marché.
    outils: "Pleine propriété conservée + clause statutaire ; bail rural (≥ 9 ans), bail rural environnemental, bail emphytéotique (jusqu'à 99 ans), convention."
    titres_frequents: [bail_rural, bail_emphyteotique, bail_reel_solidaire, convention]
  - id: "propriete_publique"
    label: "Propriété publique inaliénable"
    definition: >
      Le foncier appartient à une personne publique et entre dans un domaine
      inaliénable ; la gestion ou l'usage est délégué à un tiers par convention
      domaniale, autorisation d'occupation ou délégation.
    en_clair: >
      La terre est dans le domaine public — par construction, on ne peut pas la
      vendre. Une collectivité la garde ; elle en confie l'usage à un collectif
      qui l'anime.
    outils: "Domanialité publique, convention d'occupation domaniale, autorisation d'occupation temporaire, délégation de gestion."
    titres_frequents: [domanialite, convention]
  - id: "propriete_collective"
    label: "Propriété collective"
    definition: >
      Le foncier est détenu par une structure collective — société civile,
      coopérative, groupement foncier agricole. Souvent une chaîne intégrée :
      le collectif qui détient est aussi celui qui use. Le degré de verrouillage
      anti-spéculatif et la nature lucrative de la structure se lisent sur l'axe
      de lucrativité, non sur la silhouette.
    en_clair: >
      Celles et ceux qui vivent le lieu en sont aussi, ensemble, les
      propriétaires — à travers une structure qu'ils tiennent collectivement.
      Pas de propriétaire au-dessus d'eux ; reste à savoir si leurs règles
      interdisent vraiment de revendre pour un gain privé.
    outils: "Société civile, coopérative (SCIC), groupement foncier agricole."
    titres_frequents: [integre, convention]
  - id: "propriete_privee_individuelle"
    label: "Propriété privée individuelle"
    definition: >
      Le foncier reste la pleine propriété d'une ou plusieurs personnes
      physiques ; il n'est pas soustrait au marché. L'usage peut être confié par
      un titre — bail, convention, commodat —, mais le sol demeure un patrimoine
      privé, transmissible et vendable. Cas-limite de l'annuaire : une terre que
      le montage ne libère pas.
    en_clair: >
      La terre appartient à une famille, à une personne — elle peut être vendue,
      transmise, héritée comme n'importe quel bien. Un collectif peut l'occuper
      et l'animer, mais rien n'empêche, un jour, sa mise en vente. La libération
      n'a pas eu lieu.
    outils: "Pleine propriété individuelle (art. 544 C. civ.) ; usage éventuellement confié par bail, convention ou commodat."
    titres_frequents: [bail_rural, convention, commodat]
  - id: "propriete_privee_commerciale"
    label: "Propriété privée commerciale"
    definition: >
      Le foncier est détenu par une société à but lucratif — SCI patrimoniale,
      société commerciale — dont les parts portent la valeur du bien et restent
      cessibles. Le sol est un actif. L'usage peut être conventionné, mais le
      montage valorise un patrimoine privé plutôt qu'il ne libère une terre.
      Cas-limite de l'annuaire.
    en_clair: >
      La terre est logée dans une société : ce qu'on possède, ce sont des parts,
      et ces parts valent ce que vaut le bien. Le lieu peut se présenter en
      collectif ou en écolieu — il sert d'abord un patrimoine. C'est la « fausse
      libération » la plus trompeuse.
    outils: "Société commerciale ou SCI patrimoniale, parts cessibles portant la valeur du foncier ; usage éventuellement conventionné."
    titres_frequents: [convention, bail_rural]

# ─────────────────────────────────────────────────────────────────────────────
# Vocabulaire des titres d'articulation (refonte #3, chantier 5)
# ─────────────────────────────────────────────────────────────────────────────
# Seconde couche du modèle : l'ACTE qui relie le porteur à un usufruitier dans
# la chaîne d'un lieu. Énuméré, extensible. Une fiche de lieu déclare ses
# articulations dans son bloc `montage.articulations:`.
titres:
  - id: usufruit
    label: "Usufruit"
    definition: >
      Droit réel d'usage et de jouissance constitué par démembrement ; plafonné
      à 30 ans pour une personne morale (art. 619 C. civ.).
  - id: bail_rural
    label: "Bail rural"
    definition: >
      Bail d'au moins 9 ans, avec droit au renouvellement d'ordre public ; le
      bail rural environnemental y inscrit des clauses écologiques.
  - id: bail_emphyteotique
    label: "Bail emphytéotique"
    definition: >
      Bail de très longue durée — 18 à 99 ans — conférant un droit réel à
      l'usufruitier.
  - id: bail_reel_solidaire
    label: "Bail réel solidaire (BRS)"
    definition: >
      Bail de longue durée consenti par un organisme de foncier solidaire,
      dissociant durablement le bâti du foncier.
  - id: bail_a_construction
    label: "Bail à construction"
    definition: >
      Bail de 18 à 99 ans par lequel le preneur s'engage à édifier des
      constructions ; il en a la propriété et un droit réel pendant la durée du
      bail, sans transfert de la propriété du sol (art. L. 251-1 C. constr.).
  - id: convention
    label: "Convention d'usage"
    definition: >
      Convention de mise à disposition ou d'occupation ; sa solidité dépend de
      sa durée et de ses clauses de renouvellement.
  - id: commodat
    label: "Commodat (prêt à usage)"
    definition: >
      Prêt à usage à titre gratuit (art. 1875 C. civ.) ; gratuit, mais précaire
      — le prêteur peut reprendre le bien.
  - id: domanialite
    label: "Occupation domaniale"
    definition: >
      Titre d'occupation du domaine public — convention domaniale ou
      autorisation d'occupation.
  - id: integre
    label: "Chaîne intégrée"
    definition: >
      Le porteur et l'usufruitier sont une seule entité : la propriété et
      l'usage ne sont pas dissociés (coopérative d'habitants propriétaire).

# ─────────────────────────────────────────────────────────────────────────────
# Axe de lucrativité — `nature_interet` (refonte #3, chantier 1bis)
# ─────────────────────────────────────────────────────────────────────────────
# Axe DESCRIPTIF orthogonal à la silhouette : il qualifie la nature lucrative ou
# non d'un maillon — porteur ou usufruitier —, indépendamment de la forme du
# montage. Chaque fiche de porteur et d'usufruitier déclare son `nature_interet:`.
# Le seuil puriste est la DÉSACTIVATION : l'intérêt privé n'est neutralisé que
# lorsque 100 % du capital d'une société est détenu par des organismes non
# lucratifs d'intérêt général ou d'utilité publique.
nature_interet:
  - id: non_lucrative
    label: "Non lucrative"
    definition: >
      Personne morale structurellement non lucrative : association loi 1901,
      fondation, fonds de dotation, personne publique ou établissement public.
      L'intérêt privé est absent par construction — pas de capital appropriable.
    en_clair: >
      Une structure qui, par sa forme même, n'appartient à personne et ne
      rapporte à personne : rien à revendre, rien à empocher.
  - id: commerciale_desactivee
    label: "Commerciale à intérêt privé désactivé"
    definition: >
      Société — commerciale ou civile — dont la totalité des parts ou actions
      est détenue par un ou des organismes non lucratifs d'intérêt général ou
      d'utilité publique. La forme est commerciale, mais l'intérêt privé y est
      entièrement désactivé : aucune personne privée ne peut capter la valeur.
    en_clair: >
      Une société sur le papier, mais dont chaque part est aux mains d'une
      fondation ou d'un organisme d'intérêt général : la coquille est
      commerciale, le contenu ne profite à aucun particulier.
  - id: commerciale_encadree
    label: "Commerciale à lucrativité encadrée"
    definition: >
      Société à lucrativité statutairement bornée mais à capital partiellement
      privé : SCIC, société en commandite par actions à actionnariat solidaire,
      foncière solidaire agréée ESUS. L'intérêt privé y est présent mais
      discipliné — plus-value plafonnée, verrou d'actif, agrément.
    en_clair: >
      Une société qui s'impose des règles : pas de gros gains, un cadre
      solidaire. L'intérêt privé n'a pas disparu — il est tenu en bride.
  - id: exploitation_agricole
    label: "Société civile d'exploitation agricole"
    definition: >
      Société civile de travail agricole — GAEC, EARL pluripersonnelle, SCEA
      exploitante — dont les associé·es vivent du produit de leur travail sur la
      terre, sans détenir le fonds (preneur·euses d'un bail sous un porteur
      hors-marché) ou en le détenant sous verrou anti-spéculatif vérifié.
      Lucrative pour ses associé·es (appropriation du bénéfice d'exploitation),
      mais non spéculative sur le foncier et non commerciale au sens du marché
      ouvert. Sa lecture est RELATIONNELLE : preneuse d'un bail sécurisé sous un
      porteur hors-marché, elle plafonne le lieu à `hybride` ; détentrice ou
      intégrée à la propriété, elle se lit `commerciale`. Un lieu dont c'est le
      maillon le plus restrictif n'atteint jamais le sommet : l'appropriation du
      bénéfice d'exploitation l'en écarte.
    en_clair: >
      Des paysan·nes qui vivent de leur ferme sans pouvoir revendre la terre :
      une économie de travail, pas une société de marché — mais le revenu reste
      individuel. Tant qu'ils sont locataires d'un porteur qui tient le sol hors
      du marché, le lieu n'est pas marchand ; mais ce n'est pas non plus le
      sommet du commun.
  - id: commerciale
    label: "Commerciale à lucrativité ouverte"
    definition: >
      Société à but lucratif non bornée par les statuts : société commerciale
      ordinaire à parts cessibles, ou société (civile ou commerciale) qui détient
      un foncier valorisable à titre privé. La société civile d'exploitation
      agricole qui DÉTIENT le fonds, ou l'exploite sans bail sécurisé sous un
      porteur hors-marché, relève de cette nature par dérivation (voir
      `exploitation_agricole`).
    en_clair: >
      Une structure faite pour rapporter à ses membres : une société de marché,
      ou une exploitation qui détient sa terre et pourrait la valoriser. Rien
      d'illégitime — mais ce n'est pas un commun désintéressé.
  - id: privee_individuelle
    label: "Privée individuelle"
    definition: >
      Personne physique détenant un foncier en propre — patrimoine privé
      individuel, transmissible et vendable.
    en_clair: >
      Une personne, une famille : la terre est leur bien, comme une maison ou
      un terrain ordinaire.
  - id: inconnu
    label: "Nature non établie"
    definition: >
      La nature lucrative ou non du maillon n'est pas établie par les sources :
      statuts non publiés, forme juridique ambiguë (société civile d'habitants,
      GFA, collectif sans forme juridique publiée). Valeur par défaut — jamais
      fabriquée. Un maillon de nature inconnue empêche le verdict `sanctuaire`.
    en_clair: >
      On ne sait pas encore si cette structure laisse ou non capter un intérêt
      privé : faute de statuts publics, on ne tranche pas.

# ─────────────────────────────────────────────────────────────────────────────
# Le verdict du lieu — `verdict` calculé (refonte #3, chantier 1bis)
# ─────────────────────────────────────────────────────────────────────────────
# Le verdict n'est JAMAIS saisi : le générateur le calcule pour chaque lieu, à
# partir de la chaîne (axe `nature_interet` de chaque maillon), de
# l'irréversibilité du foncier et des critères d'habitat du vivant (D-B). Une
# seule source de vérité — la carte ne peut plus contredire le radar. « Sanctuariser »
# n'est pas une forme : c'est ce verdict, à son sommet.
verdict:
  regle: >
    La nature de chaque maillon est lue EFFECTIVEMENT : un maillon
    `exploitation_agricole` preneur d'un bail sécurisé — ou d'un commodat gratuit
    (décision #11) — sous un porteur hors-marché garde cette nature ; détenteur,
    intégré à la propriété, ou sous titre précaire (convention) sans porteur
    hors-marché, il se lit `commerciale`. Puis : `marchand` si la chaîne compte un maillon effectif
    `commerciale` ou `privee_individuelle`. Sinon `hybride` si elle compte un
    maillon `commerciale_encadree` ou `exploitation_agricole` (intérêt privé
    encadré ou bénéfice d'exploitation approprié : plafond du sommet). Sinon —
    chaîne entièrement `non_lucrative` ou `commerciale_desactivee` —
    `sanctuaire` lorsque, de plus, toutes les conditions observables sont
    réunies : foncier irréversiblement hors-marché, habitat du vivant, milieu
    durablement protégé, finalité d'usage (non marchand + intérêt général) et
    travail non marchandisé (hors salariat). À défaut de l'une de ces conditions,
    le lieu reste `hybride`. Le verdict `sanctuaire` ne s'allume jamais tant qu'un
    maillon est de nature inconnue, ni tant qu'une condition est inconnue : il
    émerge au fil du peuplement, jamais par défaut.
  degres:
    - id: marchand
      label: "Montage marchand"
      definition: >
        La chaîne comporte un maillon à lucrativité ouverte ou un propriétaire
        privé individuel : la valeur du foncier reste captable.
      en_clair: >
        Quelque part dans le montage, quelqu'un peut encore gagner de l'argent
        sur cette terre. Elle n'est pas libérée.
    - id: hybride
      label: "Montage hybride"
      definition: >
        La chaîne ne comporte aucun maillon marchand, mais au moins un maillon
        à lucrativité encadrée (intérêt privé discipliné, non désactivé) ou une
        société civile d'exploitation agricole preneuse de bail sous un porteur
        hors-marché (le bénéfice d'exploitation reste approprié par les
        associé·es). Y figure aussi le commun juridiquement abouti dont l'un des
        conditions du sommet (habitat du vivant, milieu durablement protégé,
        usage non marchand, travail non marchandisé) n'est pas encore réunie.
      en_clair: >
        Un montage solide et de bonne foi, mais pas tout à fait le sommet : un
        maillon garde une part d'intérêt privé, des paysan·nes vivent du produit
        de leur travail, ou l'une des conditions du commun pleinement libre
        reste à confirmer.
    - id: sanctuaire
      label: "Sanctuaire"
      definition: >
        La formule fondatrice est entièrement tenue : chaîne entièrement non
        lucrative ou à intérêt privé désactivé, ET toutes les conditions observables
        réunies — foncier irréversiblement hors-marché, habitat du vivant,
        protection durable et opposable du milieu, usage non marchand d'intérêt
        général, et travail non marchandisé (hors salariat). Incarnation visible du pôle « Le
        commun libre et vivant ». Son extrême le plus pur inclut la terre rendue
        à la vie sauvage, accès humain volontairement exclu. Sommet rare, horizon
        plus que case à remplir.
      en_clair: >
        Une terre vraiment libre : nul ne peut la vendre, nul ne peut en tirer
        un gain privé, et la vie — humaine et non-humaine — y a sa place
        pleine. C'est l'aboutissement, rare, de la démarche.

# ─────────────────────────────────────────────────────────────────────────────
# Modèles voisins de référence (comparaison — hors des 3 catégories)
# ─────────────────────────────────────────────────────────────────────────────
modeles_voisins:
  description: >
    Modèles « puristes » proches, recensés à titre de comparaison pour situer
    le montage de référence. Restent dans le droit civil et l'intérêt général
    à des degrés divers.
  exemples:
    - "Organisme de Foncier Solidaire (OFS) + Bail Réel Solidaire (BRS)"
    - "Community Land Trust (CLT) — modèle de Bruxelles"
    - "Stiftung trias (Allemagne) — fondation + droit de superficie"
    - "Mietshäuser Syndikat (Allemagne) — neutralisation de la propriété"
    - "Conservatoires d'espaces naturels (CEN)"

# ─────────────────────────────────────────────────────────────────────────────
# Les trois régimes du sol — cadre conceptuel
# ─────────────────────────────────────────────────────────────────────────────
regimes:
  chapeau: >
    En droit français, une même parcelle peut relever de logiques opposées.
    La libération des terres ne crée pas un droit nouveau : elle réemploie des
    outils de droit civil — démembrement, baux longs, statuts non lucratifs —
    pour soustraire le foncier à la logique marchande. Cette page nomme les
    trois régimes que l'annuaire oppose.
  liste:
    - id: civil_commun
      label: "Droit civil au service de l'intérêt général et des communs"
      outils: >
        Démembrement (articles 544 et 578 du Code civil), fondation, fonds de
        dotation, bail rural ou emphytéotique, association, SCIC.
      but: >
        Placer le foncier au service d'un usage collectif d'intérêt général et
        l'y maintenir durablement.
      role: "Régime de référence de l'annuaire."
    - id: commercial
      label: "Droit commercial : sociétés, lucrativité, spéculation"
      outils: >
        Société commerciale, parts ou actions librement cessibles, recherche
        de plus-value et de dividende.
      but: "Valoriser un capital ; le foncier y est un actif."
      role: "Régime repoussoir — parfois neutralisé par les statuts."
    - id: propriete_privee
      label: "Propriété privée classique"
      outils: "Pleine propriété individuelle (article 544 du Code civil)."
      but: "Maîtrise et transmission patrimoniale privées."
      role: "Point de départ ordinaire ; non référencé par l'annuaire."
  paradoxe: >
    Certains montages réels partent du droit commercial — Lurzaindia en société
    en commandite par actions, le Mietshäuser Syndikat en réseau de sociétés —
    mais en neutralisent la lucrativité par leurs statuts. La frontière entre
    les régimes ne tient pas à la seule forme juridique, mais à l'usage qu'on
    en fait.

# ─────────────────────────────────────────────────────────────────────────────
# Les cinq pôles — profils de référence sur le triptyque
# ─────────────────────────────────────────────────────────────────────────────
# Les trois régimes du sol se précisent en cinq pôles : cinq PROFILS DE RÉFÉRENCE
# sur le triptyque usus/fructus/abusus. Les pôles ne sont pas des cases — une
# entité réelle, presque toujours hybride, reçoit un profil, et l'écart entre ce
# profil et le pôle le plus proche est lui-même une information. Le pôle de tête,
# refondé par la refonte #3, n'est plus un commun purement humain : c'est le
# commun LIBRE ET VIVANT. (Son id reste `commun_citoyen` — identifiant historique
# conservé, leçon L2 : seul le label évolue, aucune fiche à migrer.)
poles:
  chapeau: >
    Du commun libre et vivant — repère du cadre — à la propriété marchande
    qu'il affronte, cinq pôles jalonnent le ré-agencement du triptyque. Le repère
    n'est pas l'intérêt général d'État mais la gouvernance citoyenne collective
    de droit civil, ouverte au vivant : une troisième voie, ni étatique ni
    marchande.
  en_clair: >
    Entre le commun le plus abouti et la pure propriété de marché, on peut
    repérer cinq grandes figures. Aucun lieu réel ne s'y range proprement :
    chacun tient un peu de plusieurs. Ces cinq repères servent à dire de quel
    côté un montage penche — pas à le ranger dans une case.
  liste:
    - id: commun_citoyen
      rang: 1
      label: "Le commun libre et vivant"
      regime: civil_commun
      role: "Pôle de référence."
      usus: >
        Partagé : gouverné par le collectif citoyen usager, autogéré et
        horizontal, et ouvert au vivant non-humain reconnu cohabitant du lieu.
      fructus: "Supprimé — gratuité, don, troc — ou intégralement réinvesti dans la mission."
      abusus: "Neutralisé dans ses deux faces : le lieu ne peut être ni vendu, ni épuisé."
      logique: "Le commun — troisième voie, ni État ni commerce, ni purement humaine."
      en_clair: >
        Le cas le plus abouti : un lieu gouverné par celles et ceux qui
        l'habitent, que personne ne peut vendre ni épuiser, dont les fruits
        reviennent au lieu, et qui fait place au vivant autant qu'aux humains.
        C'est le repère — pas une moyenne, un horizon.
    - id: ig_institue
      rang: 2
      label: "L'intérêt général institué"
      regime: civil_commun
      role: "Allié du pôle de référence — même régime, gouvernance descendante."
      usus: >
        Gouverné par une instance mandatée — conseil, tutelle, donateurs — non
        par les usager·es eux-mêmes ; cercle de souci resté humain.
      fructus: "Non lucratif : pas d'appropriation des fruits."
      abusus: "Neutralisé dans sa face juridique (inaliénabilité) ; face matérielle variable, non garantie."
      logique: "L'intérêt général administré."
      en_clair: >
        Un lieu non lucratif et protégé, mais décidé d'en haut — par un conseil,
        des donateurs, une tutelle — plutôt que par ses usager·es.
    - id: mutualisme
      rang: 3
      label: "Le mutualisme d'usagers"
      regime: commercial
      role: "Pôle des « faux amis » — lexique social, bénéfice fermé."
      usus: "Gouverné par les sociétaires — cercle fermé."
      fructus: "Lucrativité plafonnée mais réelle : les fruits servent le sociétariat."
      abusus: "Partiellement actif : parts cessibles, le foncier reste mobilisable."
      logique: "L'entraide entre membres ; SCIC, coopérative, SCOP."
      en_clair: >
        Le piège des mots : on y parle d'entraide et d'utilité sociale, mais
        c'est une société, ses fruits vont à ses membres, et le foncier reste
        mobilisable.
    - id: economie_marchande
      rang: 4
      label: "L'économie sociale marchande"
      regime: commercial
      role: "Posture sociale, structure de rentabilité."
      usus: "Décidé par les dirigeants et les investisseurs « patients »."
      fructus: "Un rendement est servi au capital."
      abusus: "Actif : le foncier est un actif que l'on valorise."
      logique: "Rentabilité tempérée par une posture sociale."
      en_clair: >
        Une posture sociale sincère, mais une structure faite pour rapporter :
        un rendement, même modéré, est servi au capital.
    - id: propriete_marchande
      rang: 5
      label: "La propriété marchande"
      regime: propriete_privee
      role: "Pôle repoussoir — c'est lui que le commun libre affronte."
      usus: "Le propriétaire seul."
      fructus: "Plus-value, spéculation."
      abusus: "Plein et entier — vendre, transformer, épuiser sans frein."
      logique: "Le marché."
      en_clair: >
        La terre comme placement : on l'achète, on la revend, on en tire le
        maximum. C'est ce que le commun cherche à défaire.
  registres:
    chapeau: >
      Chaque pôle se profile sur les trois droits du triptyque — usus, fructus,
      abusus (voir la section « Le triptyque »). Les profils ci-dessus disent,
      droit par droit, ce qui caractérise chaque pôle.

# ─────────────────────────────────────────────────────────────────────────────
# Anti-concepts — ce que l'annuaire ne référence PAS
# ─────────────────────────────────────────────────────────────────────────────
anti_concepts:
  - "propriété privée individuelle classique, même 'vertueuse'"
  - "société (SCI, GFA familial) à but lucratif et parts librement cessibles"
  - "montage dont l'objet premier est l'optimisation fiscale ou patrimoniale"
  - "lieu réservé à un cercle restreint de personnes (perte de l'intérêt général)"
  - "dispositif spéculatif déguisé en 'foncier solidaire'"
  - "projet purement privé sans personne morale non lucrative dans le montage"

# ─────────────────────────────────────────────────────────────────────────────
# Ligne éditoriale
# ─────────────────────────────────────────────────────────────────────────────
editorial:
  registres_d_ecriture:
    chapeau: >
      Le site s'écrit à deux voix, appariées partout (voir conception-refonte-3.md
      §7). Tout concept porte sa définition exacte et son champ `en_clair:`.
    voix_exacte: >
      Le mot juste — usus/fructus/abusus, les axes, les pôles, les critères.
      Elle fait l'autorité de l'annuaire ; elle tient la méthodologie, les
      définitions et les concepts.
    voix_incarnee: >
      La même chose, dite par ce qu'elle change dans une vie : le sol qu'on
      transmet, le loyer qui revient, les oiseaux qu'on entend, la sécurité de
      rester. Elle domine le front du site ; elle est portée par les champs
      `en_clair:`.
    regle_d_or: >
      La voix incarnée ajoute de la chaleur et du concret ; elle ne remplace
      jamais la rigueur et ne moralise jamais. On décrit une vie meilleure, on
      n'exhorte pas. Si elle fragilise la crédibilité de l'annuaire, elle a
      échoué.
  voice: >
    factuel, rigoureux, sobre pour la voix exacte ; concret, calme et sensible
    pour la voix incarnée — registre documentaire et juridique d'un côté, récit
    de la vie quotidienne d'un lieu de l'autre.
  audience: >
    Porteur·ses de projet foncier, juristes, collectivités, donateur·rices,
    chercheur·ses et militant·es de l'accès à la terre qui cherchent un
    référentiel clair des montages de libération des terres et de leur solidité.
  principes:
    - "Distinguer toujours les faits vérifiés des points non confirmés."
    - "Ne jamais inventer un montage, un chiffre ou un article de loi."
    - "Le classement est une évaluation au regard d'un cadre explicite et contestable, non un label."
    - "Citer les sources ; respecter le droit d'auteur (reformuler)."
    - "Écrire à deux voix : tout concept porte sa définition exacte et son `en_clair:`."

# ─────────────────────────────────────────────────────────────────────────────
# Glossaire des Enjeux (session #12, 10 octobre 2026) — source unique des termes
# introduits par les analyses stratégiques (enjeux/etudes/*.md, champ concepts:),
# consolidés ici. Lu par generate_site.py (page glossaire, section « Les mots des
# Enjeux ») et exporté vers le glossaire commun de l'agora
# (scripts/export_enjeux_transverse.py). Premier pas vers la migration du
# glossaire codé en dur (GLOSSAIRE) dans ce fichier.
# ─────────────────────────────────────────────────────────────────────────────
glossaire:
- terme: Agriculture biologique
  definition: 'Mode de production défini par le règlement (UE) 2018/848 : interdiction des engrais minéraux
    azotés, des pesticides de synthèse et des OGM, rotation pluriannuelle avec légumineuses, culture dans
    le sol vivant, contrôle et certification par un organisme tiers. C''est le seul courant doté d''une
    définition publique opposable.'
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Agriculture de conservation des sols
  definition: 'Système qui associe couverture permanente du sol, travail du sol réduit ou supprimé (semis
    direct) et diversification des cultures. Il n''exclut pas les pesticides : en grandes cultures, il
    repose le plus souvent sur le glyphosate pour détruire les couverts (INRA, 2017).'
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Agriculture de firme
  definition: Terme des sociologues François Purseigle, Geneviève Nguyen et Pierre Blanc pour désigner
    des entreprises agricoles orientées vers la concentration productive, dont le capital et le travail
    ne sont plus familiaux et qui reposent sur le salariat ou la délégation.
  registre: économique
  etudes:
  - 03-moins-de-fermes-plus-grandes
- terme: Agriculture intensive
  definition: Système qui maximise le rendement par unité de surface grâce aux intrants achetés (engrais
    et pesticides de synthèse, semences sélectionnées, énergie), à la spécialisation et souvent à la monoculture
    et au travail profond du sol ; il rend la ferme dépendante de ses fournisseurs et de ses acheteurs.
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Agriculture naturelle
  definition: 'Méthode formulée par l''agronome japonais Masanobu Fukuoka : ni labour, ni engrais préparés,
    ni désherbage, ni pesticides ; on sème dans un couvert vivant et on laisse faire les cycles naturels.'
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Agriculture régénératrice
  definition: Terme sans définition légale ni réglementaire, défini selon les auteurs par des pratiques
    (couverts, pâturage, non-labour) ou par des résultats (carbone du sol, biodiversité) (Newton et al.,
    2020). Il est repris par des groupes agroalimentaires dans leurs programmes d'approvisionnement (Nestlé,
    selon son propre document).
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Agrivoltaïsme
  definition: Au sens de l'article L. 314-36 du code de l'énergie (loi APER, 2023), installation photovoltaïque
    placée sur une parcelle agricole, qui rend au moins un service direct à la production (potentiel agronomique,
    adaptation au changement climatique, protection contre les aléas, bien-être animal) en garantissant
    une production agricole significative et un revenu durable (instruction DGPE/SDPE/2025-93).
  registre: juridique
  etudes:
  - 09-la-rente-du-soleil
- terme: Agroécologie
  definition: À la fois une science (l'écologie appliquée aux agroécosystèmes), une pratique et un mouvement
    social (Wezel et al., 2009). En France, le mot désigne surtout des pratiques ; il n'a ni cahier des
    charges ni certification.
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Agroécologie paysanne
  definition: 'Version de l''agroécologie portée par les mouvements paysans : pratiques économes en intrants,
    autonomie de la ferme, vente de proximité, et revendication d''accès à la terre et de souveraineté
    alimentaire. Ce n''est pas un label mais une position politique.'
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Agroforesterie
  definition: Association, sur une même parcelle, d'arbres et de cultures ou d'élevage (haies, alignements
    intraparcellaires, vergers pâturés). C'est une pratique, compatible avec tous les autres courants,
    pas un système défini.
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Agrostockage de carbone
  definition: Activité agricole ou forestière qui augmente le carbone stocké dans les sols ou la biomasse,
    certifiable en unités temporaires au titre du règlement (UE) 2024/3012 ; l'unité expire à la fin de
    la période de surveillance.
  registre: agronomique
  etudes:
  - 13-des-sols-qu-on-epuise
- terme: Aire d'alimentation de captage
  definition: Territoire sur lequel l'eau qui s'infiltre ou ruisselle alimente un captage d'eau potable.
    C'est sur ce territoire que la loi du 27 décembre 2019 permet d'instituer un droit de préemption des
    surfaces agricoles.
  registre: écologique
  etudes:
  - 12-l-eau-condition-de-la-terre
- terme: Arrêté de cessibilité
  definition: Acte préfectoral qui désigne, parcelle par parcelle, les terrains à exproprier après la
    déclaration d'utilité publique. À Notre-Dame-des-Landes, ceux du 13 septembre 2011 sont devenus définitifs
    en 2014.
  registre: juridique
  etudes:
  - 17-defendre-la-terre
- terme: Artificialisation des sols
  definition: « L'altération durable de tout ou partie des fonctions écologiques d'un sol » (article L.
    101-2-1 du code de l'urbanisme, issu de la loi de 2021). Plus large que la consommation d'espaces,
    elle se mesure par l'occupation du sol à grande échelle (OCS GE) de l'IGN.
  registre: juridique
  etudes:
  - 08-le-beton-avance-moins
- terme: Association foncière pastorale
  definition: Association de propriétaires, libre ou autorisée, qui regroupe des parcelles pastorales
    morcelées pour en organiser la mise en valeur par le pâturage. Dans les Alpes, elle concerne 18 %
    des alpages en 2012-2014.
  registre: juridique
  etudes:
  - 11-terres-oubliees-communs-effaces
- terme: Associé coopérateur
  definition: Agriculteur·rice membre d'une coopérative agricole, qui en détient des parts sociales et
    s'engage à lui livrer tout ou partie de sa production pour une durée fixée par les statuts. L'ordonnance
    du 24 avril 2019 et les nouveaux modèles de statuts qui en découlent ont renforcé son information
    et facilité son départ dans certains cas (HCCA).
  registre: économique
  etudes:
  - 06-la-dette-qui-fait-vendre
- terme: Bail cessible hors cadre familial
  definition: Bail rural notarié d'au moins dix-huit ans que le preneur peut céder à la personne de son
    choix, y compris hors de sa famille (art. L. 418-1 et suivants du Code rural, créés en 2006).
  registre: foncier
  etudes:
  - 01-a-qui-va-la-ferme
- terme: Bail emphytéotique
  definition: Location de 18 à 99 ans, à loyer modique, qui confère au preneur un droit réel cessible
    et n'est pas soumise au statut du fermage (article L. 451-1 du code rural). Outil usuel des développeurs
    solaires, il est aussi celui de plusieurs montages de libération.
  registre: juridique
  etudes:
  - 09-la-rente-du-soleil
  - 17-defendre-la-terre
- terme: Bail rural environnemental
  alias:
  - Bail rural à clauses environnementales
  definition: Bail rural ordinaire assorti de clauses de pratiques protectrices (couverts, limitation
    des intrants), que certains bailleurs, notamment publics, peuvent inscrire au contrat. Eau du Bassin
    Rennais l'utilise sur les terres de ses captages.
  registre: écologique
  etudes:
  - 12-l-eau-condition-de-la-terre
  - 13-des-sols-qu-on-epuise
- terme: Bien sans maître
  definition: Immeuble qui fait partie d'une succession ouverte depuis plus de trente ans (dix ans dans
    certains périmètres) sans successible, ou immeuble sans propriétaire connu dont les taxes foncières
    ne sont plus payées depuis plus de trois ans. Il revient à la commune, ou à défaut à l'intercommunalité,
    au Conservatoire du littoral, à un conservatoire d'espaces naturels ou à l'État (art. 713 du code
    civil, L. 1123-1 du code général de la propriété des personnes publiques).
  registre: juridique
  etudes:
  - 11-terres-oubliees-communs-effaces
- terme: Bilan des flux de bois
  definition: Production biologique des arbres, diminuée de la mortalité et des prélèvements. Positif,
    il signale une forêt qui accumule du bois et du carbone ; il est de +19,5 millions de m³ par an sur
    2014-2022, contre +41,7 sur 2005-2013 (IGN, mémento 2024).
  registre: foncier
  etudes:
  - 15-la-foret-nouvel-actif
- terme: Biodynamie
  definition: Courant né en 1924 des conférences de Rudolf Steiner, qui ajoute à l'agriculture biologique
    des préparations et un calendrier propres. Le règlement européen autorise les préparations biodynamiques
    ; la mention « biodynamie » relève de labels privés.
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Capitalisation des aides
  definition: 'Part d''une aide agricole qui, au lieu de rester dans le revenu de l''exploitant, se retrouve
    dans le loyer ou le prix de la terre. Elle s''exprime en pourcentage de l''aide : le Centre commun
    de recherche de la Commission l''estime entre 9 et 46 % à court terme pour les loyers dans l''Union
    (2021).'
  registre: économique
  etudes:
  - 05-une-terre-bon-marche-inaccessible
- terme: Carbone organique du sol
  definition: Carbone contenu dans les matières organiques du sol (résidus végétaux, organismes, humus).
    En France métropolitaine, le stock des 30 premiers centimètres est estimé à 3,58 milliards de tonnes
    hors surfaces artificialisées (INRAE, 2020, d'après le RMQS).
  registre: agronomique
  etudes:
  - 13-des-sols-qu-on-epuise
- terme: CDPENAF
  definition: Commission départementale de la préservation des espaces naturels, agricoles et forestiers,
    prévue à l'article L. 112-1-1 du Code rural. Elle rend un avis sur les STECAL et les extensions de
    maisons en zone agricole, et un avis conforme sur les changements de destination en zone A.
  registre: juridique
  etudes:
  - 10-le-droit-d-habiter-la-terre
- terme: Cession partielle de parts
  definition: 'Vente d''une fraction seulement du capital d''une société. Avant 2023, la SAFER ne pouvait
    préempter que la cession de la totalité des parts : céder 99 % suffisait à échapper à son droit de
    préemption (Assemblée nationale, rapport n° 1460, 2018).'
  registre: juridique
  etudes:
  - 04-quand-la-terre-devient-un-actif
- terme: Changement de destination
  definition: Transformation d'un bâtiment existant, par exemple une grange, en logement. En zone agricole,
    il n'est possible que pour les bâtiments désignés par le règlement du PLU et après avis conforme de
    la CDPENAF (art. L. 151-11 du Code de l'urbanisme).
  registre: juridique
  etudes:
  - 10-le-droit-d-habiter-la-terre
- terme: Charge de la dette
  definition: 'Somme des remboursements d''emprunts à moyen et long terme et des frais financiers, rapportée
    à l''excédent brut d''exploitation. Agreste l''appelle « poids de l''endettement dans l''EBE » : 46
    % en 2024.'
  registre: économique
  etudes:
  - 06-la-dette-qui-fait-vendre
- terme: CIVE
  definition: 'Culture intermédiaire à vocation énergétique : culture semée entre deux cultures principales
    et récoltée pour alimenter un méthaniseur. Les cultures principales sont plafonnées à 15 % du tonnage
    des intrants des méthaniseurs (ministère de la Transition écologique).'
  registre: juridique
  etudes:
  - 09-la-rente-du-soleil
- terme: Coefficient de Gini
  definition: Indicateur d'inégalité compris entre 0 (répartition égale) et 1 (tout chez un seul). Appliqué
    à la surface des exploitations françaises, il vaut 0,60 en 2020 (Centre d'études et de prospective,
    2024).
  registre: économique
  etudes:
  - 03-moins-de-fermes-plus-grandes
- terme: Compensation agricole collective
  definition: Obligation, pour le maître d'ouvrage d'un grand projet prélevant des terres agricoles, de
    réaliser une étude préalable et de financer des mesures qui consolident l'économie agricole du territoire
    (article L. 112-1-3 du code rural). Elle compense une perte économique, pas les hectares.
  registre: juridique
  etudes:
  - 08-le-beton-avance-moins
- terme: Consommation d'espaces naturels, agricoles et forestiers (ENAF)
  definition: « La création ou l'extension effective d'espaces urbanisés sur le territoire concerné »
    (loi Climat et résilience, 2021). Elle est mesurée chaque année par le Cerema à partir des fichiers
    fonciers, au changement de nature fiscale d'une parcelle, et sert d'indicateur légal pour la période
    2021-2031.
  registre: juridique
  etudes:
  - 08-le-beton-avance-moins
- terme: Contrat d'intégration
  definition: Contrat par lequel une entreprise d'amont ou d'aval fournit à l'éleveur une partie des moyens
    de production (aliment, jeunes animaux), planifie la production et reprend les animaux. L'éleveur
    possède souvent les bâtiments. Plus de 90 % des volumes de volailles de chair sont produits sous de
    tels contrats (OFPM, 2026).
  registre: économique
  etudes:
  - 06-la-dette-qui-fait-vendre
- terme: Contrôle des structures
  definition: Régime d'autorisation administrative préalable du droit d'exploiter (art. L. 331-1 et suivants
    du code rural), délivrée par le préfet de région selon un schéma directeur régional (SDREA). Il vise
    d'abord l'installation et limite les agrandissements et concentrations jugés excessifs.
  registre: juridique
  etudes:
  - 07-une-regulation-a-trois-etages
- terme: Coût de la libération
  definition: 'Somme que quelqu''un accepte de payer, ou de ne pas récupérer, pour qu''une terre cesse
    d''être un actif revendable : prix d''achat, frais, part de l''épargne immobilisée sans rendement,
    part remboursée par l''impôt.'
  registre: communs
  etudes:
  - 18-ce-que-la-liberation-change
- terme: Débit d'étiage (QMNA)
  definition: Débit mensuel le plus bas de l'année d'un cours d'eau. C'est l'indicateur le plus directement
    lié aux restrictions d'irrigation.
  registre: écologique
  etudes:
  - 12-l-eau-condition-de-la-terre
- terme: Déclaration d'utilité publique
  definition: Acte (décret ou arrêté) qui autorise l'expropriation des terrains nécessaires à un projet
    public. Celle de l'aéroport de Notre-Dame-des-Landes date du 9 février 2008.
  registre: juridique
  etudes:
  - 17-defendre-la-terre
- terme: Délégation intégrale
  definition: Situation où un exploitant confie la totalité des travaux de son exploitation à une entreprise
    de travaux agricoles, tout en gardant son statut d'exploitant, ses terres ou ses baux et ses aides.
    Elle permet d'éviter le bail rural et, dans certains cas, le contrôle des structures (rapport d'information
    de l'Assemblée nationale n° 1460, 2018).
  registre: économique
  etudes:
  - 03-moins-de-fermes-plus-grandes
  - 07-une-regulation-a-trois-etages
- terme: Démantèlement d'exploitation
  definition: Issue d'une cessation où les terres d'une ferme sont réparties entre plusieurs exploitations
    voisines au lieu d'être reprises ensemble. La terre reste agricole, l'exploitation disparaît comme
    unité.
  registre: foncier
  etudes:
  - 01-a-qui-va-la-ferme
- terme: Document-cadre départemental
  definition: Liste des surfaces agricoles, naturelles ou forestières ouvertes aux centrales photovoltaïques
    compatibles, proposée par la chambre d'agriculture et arrêtée par le préfet, révisée au moins tous
    les cinq ans (article R. 111-61-1 du code de l'urbanisme ; Conseil d'État, 16 mars 2026, n° 495025).
  registre: juridique
  etudes:
  - 09-la-rente-du-soleil
- terme: Droit à paiement de base (DPB)
  definition: Droit attaché à l'exploitant qui ouvre l'aide découplée de la PAC sur un hectare admissible.
    Créé en 2015 à la suite des droits à paiement unique de 2006, il est devenu en 2023 l'aide de base
    au revenu pour un développement durable (ABRSD). Il peut être cédé ou loué, avec ou sans terre (Cour
    des comptes, 2023).
  registre: économique
  etudes:
  - 05-une-terre-bon-marche-inaccessible
- terme: Droit de préemption de la SAFER
  definition: Droit, créé par la loi du 8 août 1962, d'acheter par priorité un bien agricole mis en vente,
    à la place de l'acquéreur choisi par le vendeur, pour l'un des objectifs de l'article L. 143-2 du
    code rural. Il peut s'accompagner d'une offre de prix inférieure (révision de prix), que le vendeur
    peut refuser en retirant son bien.
  registre: juridique
  etudes:
  - 07-une-regulation-a-trois-etages
- terme: Droit de préférence forestier
  definition: Droit des propriétaires de parcelles boisées contiguës, et de la commune, à être informés
    et à se porter acquéreurs, au prix notifié, lors de la vente d'une propriété classée en nature de
    bois de moins de 4 hectares (code forestier, art. L. 331-19 et suivants, présentés par le CNPF).
  registre: foncier
  etudes:
  - 15-la-foret-nouvel-actif
- terme: Droit de rétrocession
  definition: Droit des anciens propriétaires expropriés de récupérer leurs biens lorsque ceux-ci ne reçoivent
    pas la destination prévue. Au Larzac, ce droit a pesé sur la recherche d'un montage après 1981 (Crisenoy
    et Boscheron, INRA, 1986).
  registre: juridique
  etudes:
  - 17-defendre-la-terre
- terme: Entreprise de travaux agricoles (ETA)
  definition: Société commerciale qui réalise pour le compte d'exploitations des travaux de culture ou
    d'élevage (semis, traitements, récolte…). Elle se distingue de la coopérative d'utilisation de matériel
    agricole (Cuma), propriété collective d'agriculteur·rices.
  registre: économique
  etudes:
  - 03-moins-de-fermes-plus-grandes
- terme: Faire-valoir direct, faire-valoir indirect
  definition: 'Le faire-valoir est le titre par lequel un exploitant cultive une terre : en propriété
    (direct) ou par location, métayage ou mise à disposition (indirect). En 2020, le faire-valoir direct
    ne couvre qu''environ 20 % de la surface agricole métropolitaine (Insee, 2024).'
  registre: foncier
  etudes:
  - 02-qui-possede-la-terre
- terme: Fichiers fonciers
  definition: Base de données issue des fichiers fiscaux MAJIC de la DGFiP, enrichie par le Cerema, qui
    décrit les parcelles et leurs propriétaires. Elle n'est accessible qu'à des ayants droit (État, collectivités,
    SAFER, recherche), et anonymisée pour les personnes physiques.
  registre: foncier
  etudes:
  - 02-qui-possede-la-terre
- terme: Financiarisation de la terre
  definition: 'Processus par lequel la terre agricole est détenue, valorisée et échangée comme un actif
    financier : par des titres de sociétés plutôt que par des parcelles, avec une logique de rendement
    du capital. On distingue une financiarisation exogène (investisseurs extérieurs) et endogène (sociétés
    et holdings d''agriculteurs).'
  registre: juridique
  etudes:
  - 04-quand-la-terre-devient-un-actif
- terme: Fonds de dotation
  definition: Personne morale à but non lucratif créée par la loi du 4 août 2008, qui reçoit des biens
    de façon irrévocable. Les dons et legs qui lui sont faits sont exonérés de droits de mutation s'il
    est d'intérêt général ; il n'ouvre pas droit à la réduction d'IFI, réservée notamment aux fondations
    reconnues d'utilité publique.
  registre: communs
  etudes:
  - 18-ce-que-la-liberation-change
- terme: Forme sociétaire
  definition: 'Exploitation tenue par une société plutôt que par une personne : EARL (exploitation agricole
    à responsabilité limitée), GAEC (groupement agricole d''exploitation en commun, réservé aux associé·es
    qui y travaillent), SCEA (société civile d''exploitation agricole, ouverte à des associé·es non exploitant·es).'
  registre: économique
  etudes:
  - 03-moins-de-fermes-plus-grandes
- terme: Garantie communale
  definition: Surface minimale de développement d'un hectare garantie aux communes pour la période 2021-2031,
    sans condition de densité, quelle que soit la trajectoire régionale (loi n° 2023-630 du 20 juillet
    2023).
  registre: juridique
  etudes:
  - 08-le-beton-avance-moins
- terme: Groupement de droit particulier local (GDPL)
  definition: Personne morale de droit coutumier calédonien, créée notamment pour recevoir des terres
    attribuées dans le cadre de la réforme foncière ; ses membres peuvent y habiter, les cultiver ou les
    mettre à disposition de porteurs de projet extérieurs (ISEE).
  registre: foncier
  etudes:
  - 16-outre-mer-la-terre-apres-la-plantation
- terme: Groupement de fait
  definition: Collectif sans statut juridique, identifiable par son nom et ses publications, qui peut
    être dissous par décret au titre de l'article L. 212-1 du code de la sécurité intérieure. Le Conseil
    d'État a qualifié ainsi les Soulèvements de la Terre (2023).
  registre: juridique
  etudes:
  - 17-defendre-la-terre
- terme: Groupement foncier agricole d'investissement (GFAI)
  definition: Société de portage foncier ouverte aux épargnants et aux fonds d'investissement, prévue
    par le projet de loi d'orientation agricole de 2024, retirée par les député·es en commission et absente
    de la loi n° 2025-268 du 24 mars 2025.
  registre: juridique
  etudes:
  - 04-quand-la-terre-devient-un-actif
- terme: Groupement forestier
  definition: Société civile qui détient des bois et forêts et dont les parts bénéficient, sous engagement
    de gestion durable, des allègements fiscaux applicables à la forêt (droits de mutation, IFI, crédit
    d'impôt à l'acquisition) (CNPF).
  registre: foncier
  etudes:
  - 15-la-foret-nouvel-actif
- terme: Groupement pastoral
  definition: Groupement d'éleveurs agréé qui gère collectivement une estive ou un alpage, souvent sur
    des terrains communaux ou d'une association foncière pastorale, sous convention pluriannuelle de pâturage.
  registre: juridique
  etudes:
  - 11-terres-oubliees-communs-effaces
- terme: Habitation légère de loisirs (HLL)
  definition: 'Construction démontable ou transportable destinée à une occupation temporaire ou saisonnière
    de loisirs (art. R. 111-37 du Code de l''urbanisme), dont l''implantation est prévue sur des terrains
    spécialement aménagés : parcs résidentiels de loisirs, villages de vacances, campings (art. R. 111-38).
    À ne pas confondre avec la résidence démontable, qui est un habitat permanent.'
  registre: juridique
  etudes:
  - 10-le-droit-d-habiter-la-terre
- terme: Holding agricole
  definition: Société dont l'objet est de détenir des parts d'autres sociétés, ici des sociétés qui exploitent
    ou possèdent des terres. Elle ne déclare pas de surface en propre ; le Groupe Safer en a recensé 100
    déclarations en 2025, pour 613 millions d'euros.
  registre: juridique
  etudes:
  - 04-quand-la-terre-devient-un-actif
- terme: HRI1 (indicateur de risque harmonisé 1)
  definition: Indicateur européen qui somme les quantités de substances vendues en les pondérant selon
    quatre groupes de danger. Il est devenu en 2024 l'indicateur principal de la stratégie Écophyto 2030,
    à la place du NODU.
  registre: agronomique
  etudes:
  - 13-des-sols-qu-on-epuise
- terme: Indice national des fermages
  definition: Indice fixé chaque année par arrêté du ministre de l'Agriculture, qui sert à actualiser
    les loyers des baux ruraux. Il combine pour 60 % le revenu brut d'entreprise agricole à l'hectare
    (moyenne sur cinq ans) et pour 40 % l'indice de prix du PIB.
  registre: foncier
  etudes:
  - 02-qui-possede-la-terre
- terme: Indivision successorale
  definition: Situation où plusieurs héritier·es détiennent ensemble un bien sans que leurs parts soient
    matérialisées. Le droit commun exige l'unanimité pour vendre ou partager ; dans les outre-mer, la
    loi n° 2018-1244 dite Letchimy permet, pour les successions ouvertes depuis plus de dix ans, de vendre
    ou partager à la majorité des droits indivis.
  registre: foncier
  etudes:
  - 16-outre-mer-la-terre-apres-la-plantation
- terme: Installation hors cadre familial
  definition: Installation d'un·e agriculteur·rice sur une exploitation qui n'appartenait pas à sa famille.
    En 2020, 39 % des chef·fes installé·es après 2010 étaient dans ce cas (Insee, d'après le recensement
    agricole).
  registre: foncier
  etudes:
  - 01-a-qui-va-la-ferme
- terme: Installation photovoltaïque compatible
  definition: Centrale au sol autorisable hors agrivoltaïsme, seulement sur des terrains réputés incultes
    ou non exploités et identifiés dans un document-cadre départemental (article L. 111-29 du code de
    l'urbanisme).
  registre: juridique
  etudes:
  - 09-la-rente-du-soleil
- terme: Label bas-carbone
  definition: Cadre de certification volontaire de l'État qui reconnaît des réductions d'émissions ou
    des absorptions de carbone (boisement, reconstitution de forêts dégradées, pratiques agricoles…) et
    permet à des financeurs d'acheter les crédits correspondants.
  registre: foncier
  etudes:
  - 15-la-foret-nouvel-actif
- terme: Lien de nécessité agricole
  definition: 'Condition posée par la jurisprudence administrative pour admettre une construction en zone
    agricole : elle doit être nécessaire à l''exploitation. Pour un logement, le juge exige que l''activité
    impose la présence permanente et rapprochée de l''exploitant·e (CE, 14 mai 1986, Loberot).'
  registre: juridique
  etudes:
  - 10-le-droit-d-habiter-la-terre
- terme: Marché sociétaire
  definition: 'Ensemble des opérations sur les sociétés qui possèdent ou exploitent des terres agricoles
    : cessions de parts ou d''actions, augmentations ou réductions de capital, modifications des droits
    de vote. Le Groupe Safer l''observe depuis 2016 et, dans un cadre élargi, depuis 2023.'
  registre: juridique
  etudes:
  - 04-quand-la-terre-devient-un-actif
- terme: Niveaux de restriction sécheresse
  definition: 'Vigilance, alerte, alerte renforcée, crise : quatre niveaux fixés par arrêté préfectoral,
    qui limitent ou interdisent progressivement les usages de l''eau. Au niveau crise, seuls les usages
    prioritaires (santé, sécurité, eau potable) sont maintenus.'
  registre: écologique
  etudes:
  - 12-l-eau-condition-de-la-terre
- terme: NODU (nombre de doses unités)
  definition: 'Indicateur d''intensité d''usage des pesticides : surface qui serait traitée une année,
    à la dose maximale homologuée, avec les produits vendus. Il neutralise le remplacement d''une substance
    par une autre efficace à plus faible dose.'
  registre: agronomique
  etudes:
  - 13-des-sols-qu-on-epuise
- terme: Obligation réelle environnementale (ORE)
  definition: Contrat notarié par lequel un propriétaire attache à son terrain, pour lui et ses successeurs,
    des obligations de protection de la biodiversité ou des fonctions écologiques, pour 99 ans au plus
    (article L. 132-3 du code de l'environnement).
  registre: juridique
  etudes:
  - 08-le-beton-avance-moins
- terme: Organisme unique de gestion collective (OUGC)
  definition: Structure qui détient, pour tout un bassin, l'autorisation de prélèvement d'eau pour l'irrigation
    et répartit le volume entre irrigant·es. Dans le Marais poitevin, c'est l'Établissement public du
    Marais poitevin.
  registre: écologique
  etudes:
  - 12-l-eau-condition-de-la-terre
- terme: Pas-de-porte
  definition: Somme versée, en dehors du loyer, pour obtenir la reprise d'un bail rural, souvent dissimulée
    dans une surévaluation du matériel ou des bâtiments. La pratique est pénalement réprimée par le code
    rural (rapport d'information de l'Assemblée nationale n° 1460, 2018).
  registre: foncier
  etudes:
  - 02-qui-possede-la-terre
- terme: Permaculture
  definition: Méthode de conception de lieux de vie et de production qui imite les relations observées
    dans la nature, fondée dans les années 1970 par Bill Mollison et David Holmgren ; à la fois conception,
    pratiques, vision du monde et mouvement, restée largement à l'écart de la recherche scientifique (Ferguson
    et Lovell, 2014).
  registre: agronomique
  etudes:
  - 14-vers-une-agriculture-du-vivant
- terme: Personne non issue du milieu agricole (NIMA)
  definition: Personne qui s'installe sans avoir grandi dans une famille d'agriculteurs. Catégorie d'usage
    des réseaux d'accompagnement, sans définition statistique officielle stable ; elle recoupe en partie
    l'installation hors cadre familial.
  registre: foncier
  etudes:
  - 01-a-qui-va-la-ferme
- terme: Plan simple de gestion (PSG)
  definition: Document de gestion durable d'une forêt privée, agréé par le Centre national de la propriété
    forestière, qui programme coupes et travaux. Il couvre 3,1 millions d'hectares, soit 18 % de la forêt
    française (IGN, 2024).
  registre: foncier
  etudes:
  - 15-la-foret-nouvel-actif
- terme: Point d'accueil départemental unique
  definition: Porte d'entrée, dans chaque département, du réseau France services agriculture créé par
    la loi du 24 mars 2025 ; il propose aux exploitant·es, cinq ans avant l'âge légal de la retraite,
    de recenser leur ferme et leur projet de cession.
  registre: foncier
  etudes:
  - 01-a-qui-va-la-ferme
- terme: Point de capture
  definition: 'Maillon d''un montage par lequel la valeur ou le pouvoir sur une terre libérée peut être
    repris : parts cessibles, option d''achat, terme d''un titre, gouvernance fermée ou porteur devenu
    bailleur ordinaire.'
  registre: communs
  etudes:
  - 18-ce-que-la-liberation-change
- terme: Portage foncier
  definition: Acquisition et détention temporaire ou durable d'une terre par un tiers (SAFER, collectivité,
    foncière, fondation) qui la loue à l'exploitant·e, lequel peut parfois la racheter plus tard. Le CGAAER
    distingue un portage court (jusqu'à 2 ans), moyen (2 à 12 ans) et long (10 à 30 ans).
  registre: économique
  etudes:
  - 06-la-dette-qui-fait-vendre
- terme: Principes de conception (Ostrom)
  definition: 'Régularités observées par Elinor Ostrom dans les institutions de communs qui durent : limites
    claires des usagers et de la ressource, règles adaptées au lieu, décision collective, surveillance,
    sanctions graduées, règlement local des conflits, reconnaissance externe, emboîtement des niveaux.'
  registre: communs
  etudes:
  - 18-ce-que-la-liberation-change
- terme: Prise de contrôle
  definition: Au sens du code de commerce auquel renvoie la loi Sempastous, situation d'un associé qui
    détient, directement ou indirectement, plus de 40 % des droits de vote sans qu'un autre en détienne
    davantage, ou la majorité.
  registre: juridique
  etudes:
  - 04-quand-la-terre-devient-un-actif
- terme: Production brute standard (PBS)
  definition: Valeur potentielle de la production d'une exploitation, calculée à partir de coefficients
    par hectare et par animal. Elle classe les fermes en micro (moins de 25 000 euros), petites, moyennes
    et grandes (250 000 euros ou plus).
  registre: économique
  etudes:
  - 03-moins-de-fermes-plus-grandes
- terme: Projet d'envergure nationale ou européenne
  definition: Grand projet (infrastructure, industrie, énergie) dont la consommation d'espaces est décomptée
    dans un forfait national mutualisé plutôt que dans l'enveloppe de la région qui l'accueille (loi de
    2023). Le Cerema évoque 12 500 hectares réservés à ce titre.
  registre: juridique
  etudes:
  - 08-le-beton-avance-moins
- terme: Projet de territoire pour la gestion de l'eau (PTGE)
  definition: Démarche de concertation entre usagers d'un bassin pour adapter les prélèvements à la ressource
    disponible, encadrée par une instruction du Gouvernement du 7 mai 2019. L'objectif affiché était d'au
    moins 50 projets en 2022 et 100 en 2027.
  registre: écologique
  etudes:
  - 12-l-eau-condition-de-la-terre
- terme: Propriétaire-bailleur
  definition: Personne ou société qui possède une terre agricole et la loue à un exploitant sous le statut
    du fermage. Le CGAAER en estime le nombre à plus de deux millions (2023).
  registre: foncier
  etudes:
  - 02-qui-possede-la-terre
- terme: Raison impérative d'intérêt public majeur
  definition: 'Condition à laquelle un projet peut déroger à l''interdiction de détruire des espèces protégées
    ou leurs habitats. Elle a été au cœur du contentieux de l''A69 : refusée par le tribunal de Toulouse
    (2025), admise par la cour d''appel (2025).'
  registre: juridique
  etudes:
  - 17-defendre-la-terre
- terme: Réforme foncière guadeloupéenne
  definition: Programme engagé en 1981 par lequel la SAFER de Guadeloupe a acquis environ 10 500 hectares
    d'anciens domaines sucriers et installé environ 700 agriculteurs regroupés en 38 groupements fonciers
    agricoles (Sénat, 2023).
  registre: foncier
  etudes:
  - 16-outre-mer-la-terre-apres-la-plantation
- terme: Régime forestier
  definition: Ensemble de règles de gestion et de conservation qui s'applique aux forêts de l'État et
    des collectivités ; l'Office national des forêts en est le gestionnaire unique et élabore, avec la
    commune, l'aménagement forestier qui programme coupes et travaux (ONF).
  registre: foncier
  etudes:
  - 15-la-foret-nouvel-actif
- terme: Régime Monichon
  definition: 'Allègement des droits de succession et de donation sur les bois et forêts et les parts
    de groupements forestiers : seul un quart de la valeur est taxé, contre un engagement de gestion durable
    pendant trente ans (CNPF, d''après l''article 793 du code général des impôts).'
  registre: foncier
  etudes:
  - 15-la-foret-nouvel-actif
- terme: Rendement locatif brut
  definition: Rapport entre le loyer annuel d'un hectare loué et son prix d'achat, avant impôts. Il s'établit
    à 2,88 % en 2025 selon le Groupe Safer.
  registre: économique
  etudes:
  - 05-une-terre-bon-marche-inaccessible
- terme: Répertoire départ-installation (RDI)
  definition: Fichier, tenu par les chambres d'agriculture, qui met en relation cédant·es sans successeur
    et candidat·es à l'installation. La Cour des comptes a recommandé en 2023 d'en faire le bilan et de
    le mettre en réseau national.
  registre: foncier
  etudes:
  - 01-a-qui-va-la-ferme
- terme: Réserve de substitution
  definition: Retenue remplie en hiver par pompage dans une nappe ou une rivière, pour irriguer l'été
    à la place de prélèvements estivaux. La substitution suppose que le prélèvement d'été diminue d'autant
    ; le tribunal administratif de Poitiers a annulé en 2023 des projets qui augmentaient au contraire
    le prélèvement annuel.
  registre: écologique
  etudes:
  - 12-l-eau-condition-de-la-terre
  - 17-defendre-la-terre
- terme: Résidence démontable constituant l'habitat permanent
  definition: Installation sans fondation, pouvant être autonome vis-à-vis des réseaux publics, occupée
    comme résidence principale au moins huit mois par an et facilement et rapidement démontable à tout
    moment (art. R. 111-51 du Code de l'urbanisme, issu du décret n° 2015-482 du 27 avril 2015).
  registre: juridique
  etudes:
  - 10-le-droit-d-habiter-la-terre
- terme: Rétention foncière
  definition: Fait, pour un propriétaire, de ne pas louer ni vendre une terre agricole, souvent dans l'attente
    d'un classement constructible ou par défiance envers le bail rural. La mission parlementaire de 2018
    la juge peu documentée.
  registre: juridique
  etudes:
  - 11-terres-oubliees-communs-effaces
- terme: Revenu d'entreprise agricole
  definition: Solde des comptes économiques de l'agriculture qui rémunère le travail non salarié et les
    capitaux propres des exploitants, après salaires, fermages et intérêts. Il inclut les subventions
    d'exploitation (Eurostat, aact_eaa01).
  registre: économique
  etudes:
  - 05-une-terre-bon-marche-inaccessible
- terme: Révision de prix
  definition: Préemption assortie d'une offre d'achat à un prix inférieur à celui notifié, quand la SAFER
    juge ce dernier exagéré. Le vendeur peut accepter, retirer son bien de la vente ou demander au juge
    de fixer le prix.
  registre: juridique
  etudes:
  - 07-une-regulation-a-trois-etages
- terme: RMQS (Réseau de mesures de la qualité des sols)
  definition: 'Réseau national du Gis Sol : 2 240 sites sur une grille de 16 km, échantillonnés tous les
    quinze ans. La première campagne métropolitaine date de 2000-2009, la seconde court de 2016 à 2027.'
  registre: agronomique
  etudes:
  - 13-des-sols-qu-on-epuise
- terme: SAFER
  definition: 'Société d''aménagement foncier et d''établissement rural : société anonyme sans but lucratif,
    créée par la loi d''orientation du 5 août 1960, chargée d''une mission de service public d''aménagement
    rural sous la tutelle des ministères de l''Agriculture et des Finances. Elle achète des biens ruraux
    pour les revendre ou les louer à des attributaires choisis selon des objectifs fixés par la loi.'
  registre: juridique
  etudes:
  - 07-une-regulation-a-trois-etages
- terme: Secteur de taille et de capacité d'accueil limitées (STECAL)
  definition: Secteur que le règlement d'un plan local d'urbanisme peut délimiter « à titre exceptionnel
    » dans une zone agricole, naturelle ou forestière pour y autoriser des constructions, des terrains
    destinés aux gens du voyage ou des résidences démontables, après avis de la CDPENAF (art. L. 151-13
    du Code de l'urbanisme).
  registre: juridique
  etudes:
  - 10-le-droit-d-habiter-la-terre
- terme: Section de commune
  definition: Partie d'une commune qui possède à titre permanent et exclusif des biens ou des droits distincts
    de ceux de la commune. C'est une personne morale de droit public ; ses membres, les habitant·es domicilié·es
    sur son territoire, ont la jouissance des biens mais pas leur propriété (art. L. 2411-1 du CGCT, Conseil
    constitutionnel, 2011).
  registre: juridique
  etudes:
  - 11-terres-oubliees-communs-effaces
- terme: Seuil d'agrandissement significatif
  definition: Surface, fixée par le préfet de région entre 1,5 et 3 fois la surface agricole utile régionale
    moyenne, au-delà de laquelle une prise de contrôle de société agricole est soumise à autorisation
    (article L. 333-2 du code rural, issu de la loi n° 2021-1756).
  registre: juridique
  etudes:
  - 04-quand-la-terre-devient-un-actif
- terme: Société foncière solidaire
  definition: Entreprise agréée ESUS dont l'activité principale est, notamment, l'installation d'agriculteurs
    en systèmes agroécologiques ; une souscription à son capital ouvre droit à une réduction d'impôt sur
    le revenu (art. 199 terdecies-0 AB du CGI), de 25 % pour les versements de 2026 et 2027.
  registre: communs
  etudes:
  - 18-ce-que-la-liberation-change
- terme: Solde disponible
  definition: Ce qui reste à l'exploitant·e une fois déduits de l'excédent brut d'exploitation les annuités
    d'emprunts, les frais financiers et ses cotisations sociales. Il sert à vivre et à autofinancer (Agreste,
    Rica).
  registre: économique
  etudes:
  - 06-la-dette-qui-fait-vendre
- terme: Substitution
  definition: 'Opération par laquelle la SAFER désigne l''acquéreur d''un bien sans l''acheter elle-même
    : la vente est conclue directement entre le vendeur et l''attributaire qu''elle a retenu. La Cour
    des comptes (2014) a relevé qu''elle était devenue un mode d''intervention dominant.'
  registre: juridique
  etudes:
  - 07-une-regulation-a-trois-etages
- terme: Taux d'endettement
  definition: Rapport entre l'ensemble des dettes d'une exploitation et le total de son actif, tel que
    le calcule le Rica. Il s'établit à 42,1 % en moyenne en 2024 (Agreste).
  registre: économique
  etudes:
  - 06-la-dette-qui-fait-vendre
- terme: Taux de couverture
  definition: Rapport entre la surface projetée au sol des modules et celle de la parcelle. Plafonné à
    40 % pour les installations agrivoltaïques de plus de 10 MWc hors technologies éprouvées ; des chercheur·es
    de l'INRAE recommandaient 25 % (rapport AN n° 2200, 2024).
  registre: juridique
  etudes:
  - 09-la-rente-du-soleil
- terme: Taux de remplacement des départs
  definition: Rapport, calculé par la MSA, entre les entrées et les sorties de chef·fes d'exploitation
    dans le régime des non-salariés agricoles une année donnée. En dessous de 100 %, la population des
    chef·fes diminue.
  registre: foncier
  etudes:
  - 01-a-qui-va-la-ferme
- terme: Tenure inversée
  definition: Situation où de petits propriétaires louent leurs terres à des exploitants plus grands et
    mieux dotés qu'eux. L'expression est de Jean-Philippe Colin (Études rurales, 2014), reprise par la
    mission d'information de l'Assemblée nationale sur le foncier agricole (2018).
  registre: foncier
  etudes:
  - 02-qui-possede-la-terre
- terme: Terres communes
  definition: 'Catégorie de l''enquête européenne sur la structure des exploitations (« common land »)
    : terres qui n''appartiennent directement à aucune exploitation mais sur lesquelles s''exercent des
    droits d''usage collectifs, comme les estives et pâturages communaux.'
  registre: juridique
  etudes:
  - 11-terres-oubliees-communs-effaces
- terme: Terres coutumières
  definition: 'En Nouvelle-Calédonie, terres régies par la coutume kanak : réserves, terres attribuées
    aux groupements de droit particulier local et terres attribuées au titre du lien à la terre. L''article
    18 de la loi organique du 19 mars 1999 les déclare inaliénables, incessibles, incommutables et insaisissables
    (ISEE).'
  registre: foncier
  etudes:
  - 16-outre-mer-la-terre-apres-la-plantation
  - 18-ce-que-la-liberation-change
- terme: Terres incultes ou manifestement sous-exploitées
  alias:
  - Procédure des terres incultes
  definition: Procédure du code rural (art. L. 125-1 et suivants) qui permet d'imposer à un propriétaire
    la remise en valeur d'une parcelle abandonnée, par lui-même ou par un exploitant à qui elle est louée,
    au besoin d'office. Selon le ministère, elle dure trois ans en moyenne et reste peu utilisée (2021).
  registre: juridique
  etudes:
  - 11-terres-oubliees-communs-effaces
  - 16-outre-mer-la-terre-apres-la-plantation
- terme: Terres libres, terres louées
  definition: 'Une terre est vendue libre quand aucun bail rural ne la grève au moment de la vente ; louée
    quand un fermier en place la cultive. La terre louée se vend moins cher : 17 % de moins en 2025 selon
    le Groupe Safer, écart qui mesure en partie la valeur du droit du fermier.'
  registre: économique
  etudes:
  - 05-une-terre-bon-marche-inaccessible
- terme: Titrement
  definition: Opération qui donne à un occupant de longue date un titre de propriété opposable, par exemple
    un acte de notoriété acquisitive établi par un·e notaire. Dans plusieurs outre-mer, une part importante
    des terres est occupée sans titre ou sous des titres anciens non mis à jour (Sénat, 2023).
  registre: foncier
  etudes:
  - 16-outre-mer-la-terre-apres-la-plantation
- terme: Transfert entre époux
  definition: Reprise de l'exploitation par le conjoint quand l'exploitant·e prend sa retraite. La MSA
    l'isole dans ses statistiques d'installation ; en 2025, 88,7 % de ces transferts se font de l'homme
    vers la femme.
  registre: foncier
  etudes:
  - 01-a-qui-va-la-ferme
- terme: Trois couches de la terre
  definition: Distinction entre l'exploitation (qui cultive), la propriété (qui possède le sol) et le
    capital (qui détient les parts des sociétés qui exploitent ou possèdent). La statistique publique
    mesure bien la première, mal les deux autres.
  registre: foncier
  etudes:
  - 02-qui-possede-la-terre
- terme: Valeur de reprise
  definition: Prix payé par qui reprend une exploitation pour ses bâtiments, son matériel, son cheptel,
    ses droits et parfois l'accès aux baux. La Cour des comptes (2023) relève qu'aucune série statistique
    ne la suit dans le temps.
  registre: économique
  etudes:
  - 05-une-terre-bon-marche-inaccessible
- terme: Zéro artificialisation nette (ZAN)
  definition: 'Objectif fixé pour 2050 par la loi Climat et résilience : toute surface nouvellement artificialisée
    devra être compensée par une surface équivalente rendue à la nature ou à l''agriculture. L''étape
    intermédiaire est une division par deux de la consommation d''espaces entre 2021 et 2031.'
  registre: juridique
  etudes:
  - 08-le-beton-avance-moins
- terme: Zone détendue (zone C)
  definition: Communes où l'offre de logements excède ou équilibre la demande selon le zonage ABC du code
    de la construction et de l'habitation. Le Cerema y situe la majorité de la consommation d'espaces.
  registre: juridique
  etudes:
  - 08-le-beton-avance-moins
- terme: Zone témoin
  definition: Parcelle sans panneaux, d'au moins 5 % de la parcelle équipée et d'un hectare au plus, qui
    sert de référence pour vérifier que le rendement sous panneaux reste supérieur à 90 % (article R.
    314-114 du code de l'énergie).
  registre: juridique
  etudes:
  - 09-la-rente-du-soleil
