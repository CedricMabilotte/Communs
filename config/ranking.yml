# ─────────────────────────────────────────────────────────────────────────────
# ranking.yml — L'Indice de libération (modèle v2, à 5 axes)
# ─────────────────────────────────────────────────────────────────────────────
# L'Indice mesure à quel point un montage (porteur, usufruitier ou lieu) se
# rapproche d'une libération réelle des terres. Il décompose le montage en CINQ
# axes indépendants, du sol vers les gens puis vers le temps :
#
#   1 — Le sol        soustraction à l'exploitation abusive (marché + dégradation)
#   2 — La structure  nature civile et non lucrative du montage
#   3 — Le pouvoir    gouvernance citoyenne et collective de l'usage
#   4 — La finalité   finalité ouverte — intérêt général et habitat du vivant
#   5 — L'usage       usage non marchand, non abusif et hospitalier
#
# Refonte #3 (mai 2026) : l'axe 1 passe de « soustraction au marché » à
# « soustraction à l'exploitation abusive » (abusus, deux faces) ; les axes 4 et
# 5 accueillent l'habitat du vivant. Référence : conception-refonte-3.md.
#
# Chaque critère des grilles (grilles.yml) est rattaché à un axe et pondéré.
# Pour une fiche : score_axe = Σ(poids × facteur) / Σ(poids) × 100, où le
# facteur dépend de la valeur cochée (voir `valeurs`). Les critères « inconnu »
# sont EXCLUS du dénominateur (non pénalisants, mais signalés comme angle mort).
#
# L'Indice de libération global est une AGRÉGATION NON COMPENSATOIRE des axes
# (moyenne géométrique) : l'axe le plus faible commande le résultat, de sorte
# qu'une force ne puisse jamais racheter une faiblesse. Voir `indice`.
# ─────────────────────────────────────────────────────────────────────────────
version: 2
date: 2026-05-23
remplace: "modèle v1 à 3 axes (A/B/C) — voir recherche/04-methodologie-cadre-conceptuel.pdf"

# ── Mapping des valeurs cochées dans les fiches → facteur de score ───────────
valeurs:
  oui:     1.0      # critère pleinement rempli
  partiel: 0.5      # critère partiellement rempli
  non:     0.0      # critère non rempli
  inconnu: null     # exclu du calcul (angle mort signalé)

# ── Les cinq axes ────────────────────────────────────────────────────────────
# `domicile` : maillon de la chaîne lieu/porteur/usufruitier où l'axe se joue
# réellement (voir `chaine`). Pour une fiche notée seule, l'axe est lu sur la
# fiche elle-même ; pour un lieu, il est lu au domicile indiqué.
axes:
  - id: 1
    label: "Le sol"
    court: "Soustraction à l'exploitation abusive"
    couleur: "#bc5d3a"
    domicile: porteur
    question: >
      Le foncier est-il soustrait à l'exploitation abusive — ni vendu ni
      spéculé, ni épuisé ni dégradé — et cette sortie est-elle irréversible ?
    description: >
      Mesure la neutralisation de l'abusus dans ses deux faces. Face juridique :
      la soustraction au marché — inaliénabilité, parts ou titres non cessibles,
      nature protectrice du porteur, clause de dévolution désintéressée, origine
      non spéculative de l'acquisition. Face matérielle (refonte #3) : la
      non-dégradation du fonds — le sol et le milieu ne sont ni épuisés ni
      consumés. Les critères de la face juridique se lisent chez le porteur ;
      ceux de la face matérielle, sur le lieu lui-même.
    en_clair: >
      Une terre libérée est une terre qu'on ne peut plus ni vendre, ni abîmer.
      Cet axe regarde les deux verrous : celui qui empêche de la remettre sur
      le marché, et celui qui empêche d'en épuiser le sol. Le second est
      l'apport de la refonte — un sol qu'on cultive doit pouvoir se transmettre
      aussi vivant qu'on l'a reçu.
  - id: 2
    label: "La structure"
    court: "Nature civile et non lucrative"
    couleur: "#4a6b8a"
    domicile: chaine_min
    question: >
      Le montage relève-t-il du droit civil non lucratif, avec des verrous
      statutaires effectifs — et non du droit commercial, fût-il habillé de
      vocabulaire social ?
    description: >
      Mesure la nature juridique : forme non lucrative, non-lucrativité
      effective (capital non rémunéré), indépendance vis-à-vis d'une logique de
      rendement, gestion désintéressée. C'est l'axe qui démasque les « faux
      amis ». La nature commerciale s'y lit aussi, concrètement, comme la
      subordination d'un travail salarié à une autorité de marché (refonte #3 —
      une lecture, sans critère neuf). Lu sur toute la chaîne : le maillon le
      plus faible commande.
    en_clair: >
      Cet axe vérifie que le montage est vraiment de nature non lucrative, et
      non une société qui se donne le vocabulaire du social. Là où un travail
      est subordonné à une logique de rendement, c'est cette nature commerciale
      qui parle.
  - id: 3
    label: "Le pouvoir"
    court: "Gouvernance citoyenne"
    couleur: "#36748a"
    domicile: usufruitier
    question: >
      L'usage est-il gouverné collectivement par ses usager·es-citoyen·nes, de
      façon autogérée et horizontale, plutôt que par un conseil mandaté, un
      sociétariat fermé ou un actionnariat ?
    description: >
      Mesure la gouvernance citoyenne : décision collective, principe « une
      personne = une voix », usager·es décideur·ses, ouverture aux nouveaux
      entrants, transparence interne. Un travail subordonné à une autorité
      marchande — qui n'est pas une gouvernance d'usager·es — pèse ici aussi.
    en_clair: >
      Cet axe regarde qui décide de l'usage du lieu : celles et ceux qui
      l'habitent et le font vivre, à égalité de voix — ou un conseil, un
      employeur, un actionnariat.
  - id: 4
    label: "La finalité"
    court: "Intérêt général et du vivant"
    couleur: "#4a7a3a"
    domicile: chaine_min
    question: >
      Le projet porte-t-il une finalité ouverte — un bénéficiaire au-delà du
      cercle des membres, et au-delà du seul cercle des humains — affirmée
      indépendamment de toute reconnaissance d'État ?
    description: >
      Mesure la vocation d'intérêt général d'initiative citoyenne : objet
      d'intérêt général, public non restreint, ancrage territorial et
      ouverture, redevabilité publique. La reconnaissance d'État est un simple
      tag informatif, jamais un bonus. La refonte #3 élargit le cercle des
      bénéficiaires : faire du lieu un habitat pour le vivant non-humain —
      cohabitant, et non décor — est une finalité à part entière. Lu sur toute
      la chaîne.
    en_clair: >
      Cet axe demande pour qui le lieu existe : pour ses seuls membres, ou
      au-delà — un voisinage, un territoire ? Et, depuis la refonte, pas
      seulement pour les humains : un lieu qui fait place aux vivants qui
      l'habitent porte, lui aussi, une finalité ouverte.
  - id: 5
    label: "L'usage"
    court: "Usage non marchand et hospitalier"
    couleur: "#b0822f"
    domicile: convention
    question: >
      L'usage repose-t-il sur la gratuité, le don ou le troc — ou un loyer
      modéré intégralement réinvesti — plutôt que sur une rentabilité ?
      N'épuise-t-il pas le lieu, et fait-il une place au vivant à son échelle ?
      Et le collectif usager peut-il maîtriser le lieu durablement ?
    description: >
      Mesure le régime d'usage et sa sécurité dans le temps. Non marchand :
      gratuité, don, troc, ou loyer soutenable et réinvesti. Non abusif
      (refonte #3) : l'usage ne dégrade pas le lieu — il prélève sans épuiser.
      Hospitalier (refonte #3) : le lieu fait une place au vivant non-humain à
      son échelle, qu'il soit rural ou urbain — une haie, une mare, une cour
      comptent. Et sûr : durée et renouvellement de l'usage, sécurité de
      jouissance, articulation loyale avec le porteur. C'est l'axe relationnel,
      et le plus dense : il se joue dans la convention qui lie porteur et
      usufruitier ; ses faces « non abusif » et « hospitalier » se lisent aussi
      sur le lieu.
    en_clair: >
      Cet axe regarde comment le lieu est habité au jour le jour : si l'on y
      paie un loyer de marché ou si l'usage y est libre et soutenable, si l'on
      en prend soin sans l'épuiser, si l'on y laisse vivre autre chose que des
      humains — et si le collectif peut compter y rester.

# ── Composition de l'Indice de libération ───────────────────────────────────
indice:
  label: "Indice de libération"
  abrev: "IdL"
  max: 100
  representation_premiere: >
    La lecture première de l'Indice est le PROFIL : le radar à cinq branches
    qui donne, d'un coup d'œil, la silhouette du montage. Le chiffre 0-100
    n'est qu'une synthèse de ce profil.
  agregation: geometrique
  formule: >
    IdL_brut = (score_1 × score_2 × … × score_k) ^ (1 / k), où k est le nombre
    d'axes effectivement renseignés (axes entièrement « inconnu » exclus).
    Chaque axe est planché à 1 dans le produit : un axe nul écrase l'Indice
    très bas, sans l'annuler purement — un montage fort sur quatre axes et
    effondré sur un cinquième vaut « éloigné », non « rien ». Le profil affiché
    conserve le 0 réel de l'axe.
  justification_agregation: >
    L'agrégation est NON COMPENSATOIRE. Une moyenne arithmétique laisserait un
    montage solide sur quatre axes mais commercial de nature (axe 2 effondré)
    racheter sa faiblesse par ses forces. La moyenne géométrique fait peser
    l'axe le plus faible : un « faux ami » ne peut structurellement pas
    afficher un score élevé. Le jugement est porté par la forme mathématique,
    sans règle ad hoc.
  penalite_completude: >
    Pour ne pas surnoter les fiches lacunaires, l'indice affiché est pénalisé
    par la complétude : idl_affiche = round(idl_brut × (0,5 + 0,5 × complétude)).
    Une fiche entièrement renseignée n'est pas pénalisée ; une fiche dont la
    moitié des critères sont « inconnu » voit son indice ramené aux trois quarts
    de l'indice brut. C'est l'indice affiché qui sert au badge, au classement
    et à l'export data.json ; l'indice brut reste conservé pour information.

# ── La chaîne lieu / porteur / usufruitier ───────────────────────────────────
# Le modèle évalue des CHAÎNES, pas des entités isolées. Chaque axe a un
# domicile : le maillon où il se joue réellement. Ce n'est pas un sixième axe,
# c'est la règle qui dit quel maillon alimente quel axe.
chaine:
  domiciliage:
    - axe: 1
      regle: "Face juridique (soustraction au marché) lue chez le PORTEUR —
              seul détenteur de la nue-propriété. Face matérielle
              (non-dégradation du fonds, refonte #3) lue sur le LIEU —
              réalisée par le critère `milieu_protege` logé dans la grille du
              lieu."
    - axe: 2
      regle: "Lu sur TOUTE la chaîne — maillon le plus faible : un seul lien
              commercial contamine l'axe."
    - axe: 3
      regle: "Lu chez l'USUFRUITIER — qui gouverne l'usage au quotidien."
    - axe: 4
      regle: "Lu sur TOUTE la chaîne — maillon le plus faible."
    - axe: 5
      regle: "Régime marchand et sécurité lus dans la CONVENTION porteur/
              usufruitier — bail, loyer, sécurité de jouissance. Le caractère
              non abusif et hospitalier de l'usage (refonte #3) se lit sur le
              LIEU — critères `usage_non_degradant` et `place_au_vivant` logés
              dans la grille du lieu."
  coherence: >
    Une chaîne est saine tant qu'aucun maillon ne bascule dans le régime
    commercial, idéalement avec une entité du pôle « commun citoyen » à
    l'extrémité usage. Une collectivité publique en nue-propriété (commune,
    région, État) et une association citoyenne en usufruit forment une
    excellente chaîne : l'adversaire est le commerce, non l'institution.
  cas_integre: >
    Le porteur et l'usufruitier peuvent être une seule et même entité : c'est
    le cas de la coopérative d'habitants, propriétaire de son immeuble et
    gouvernée par ses usager·es. Ce cas est légitime et le modèle l'admet — la
    chaîne est dite « intégrée ». Il a une force (aucune précarité locative
    vis-à-vis d'un tiers) et une faiblesse propre (l'entité est juge et partie,
    sans contre-pouvoir externe entre propriété et usage, ce qui fragilise la
    pérennité du modèle). La chaîne intégrée est signalée comme telle sur la
    fiche du lieu, et l'axe 5 (critère d'articulation porteur/usufruitier) en
    porte la nuance.

# ── Option A intelligente : indice intrinsèque et indice effectif ────────────
# Un porteur (ou un usufruitier) noté seul est jugé sur ce qu'il EST, mais
# aussi sur les chaînes qu'il NOUE : une entité n'existe, comme actrice de la
# libération des terres, qu'à travers ses montages réels.
option_a:
  indice_intrinseque: >
    Note l'entité sur ses propres critères. Stable, ne dépend pas des
    partenaires.
  indice_effectif: >
    Relit l'indice intrinsèque à travers les chaînes de l'entité. C'est
    l'indice affiché et classant ; l'écart avec l'intrinsèque est toujours
    annoté avec sa cause.
  disciplines:
    - "Plafonner, pas moyenner : une mauvaise chaîne plafonne un axe ; une
       bonne chaîne ne rehausse pas au-delà du plafond intrinsèque (asymétrie
       probatoire)."
    - "Cibler, pas globaliser : la contamination ne touche que les axes où la
       chaîne fait preuve sur l'entité (axe 5, et axes 2 et 4) ; l'axe 1 reste
       intrinsèque au porteur."
    - "Lire le motif, pas l'instance : la contamination lit la distribution
       des chaînes, pas un cas isolé."
    - "Lire la trajectoire, pas l'instantané : une chaîne en cours de
       dé-précarisation compte comme l'entité faisant son travail."
    - "Rendre lisible : l'écart intrinsèque/effectif est toujours affiché et
       annoté — un score instable mais expliqué vaut mieux qu'un score stable
       mais fictif."
  mise_en_oeuvre: >
    Pour chaque axe contaminable (2, 4, 5), l'indice effectif retient le
    minimum entre le score intrinsèque de l'entité et le score médian de cet
    axe sur ses chaînes. L'axe 1 et l'axe 3 ne sont pas contaminés. Faute de
    chaîne renseignée, l'indice effectif égale l'indice intrinsèque.

# ── Paliers (tiers) de lecture de l'Indice ───────────────────────────────────
# Seuils VALIDÉS (session #2, 24 mai 2026). La distribution réelle des 28
# entrées notées a été mesurée : moyenne 63,9 — l'agrégation géométrique n'a
# pas écrasé le corpus — et les seuils hauts coïncident avec les quintiles
# observés. Conservés tels quels. Voir audit/B1-paliers-distribution.md.
paliers:
  - id: abouti
    min: 78
    label: "Libération aboutie"
    couleur: "#356026"
    sens: >
      Les cinq axes sont tenus : foncier verrouillé, montage civil non
      lucratif, gouvernance citoyenne, finalité ouverte, usage non marchand et
      sécurisé. Profil de référence.
  - id: solide
    min: 64
    label: "Montage solide"
    couleur: "#4a7a3a"
    sens: >
      Le montage atteint l'ensemble des finalités avec une ou deux marges de
      consolidation, sans axe effondré.
  - id: engage
    min: 50
    label: "Engagement réel"
    couleur: "#b08431"
    sens: >
      La démarche est sincère et avancée, mais un axe reste nettement en
      retrait et tire l'ensemble vers le bas.
  - id: partiel
    min: 35
    label: "Libération partielle"
    couleur: "#bc5d3a"
    sens: >
      Le montage emprunte au modèle sans en réunir les garanties : au moins un
      axe est faible — nature commerciale, usage rentier ou gouvernance fermée.
  - id: eloigne
    min: 0
    label: "Éloigné du modèle"
    couleur: "#8f3829"
    sens: >
      Plusieurs axes sont faibles ou effondrés ; la parenté avec la libération
      des terres est surtout revendiquée.

# ── Indicateur complémentaire : intégrité du montage ─────────────────────────
# N'entre PAS dans l'Indice. Situe le montage par rapport aux cinq pôles
# (voir concepts.yml). Remplace l'ancien indicateur « pureté juridique ».
integrite_montage:
  label: "Intégrité du montage"
  question: >
    Toute la chaîne lieu/porteur/usufruitier tient-elle dans le droit civil
    d'intérêt général, sans maillon commercial ?
  note_lecture: >
    Cet indicateur situe — il ne classe pas. La protection effective du
    foncier est mesurée par l'axe 1, la nature par l'axe 2. Ici on indique
    seulement le pôle dominant du montage (voir la page « Cinq pôles »).
  niveaux:
    - id: commun_citoyen
      label: "Commun libre et vivant"
      sens: "Chaîne entièrement en droit civil non lucratif, gouvernance citoyenne autogérée ; le lieu est soustrait à l'exploitation abusive et ouvert au vivant."
    - id: ig_institue
      label: "Intérêt général institué"
      sens: "Droit civil non lucratif, mais gouvernance descendante (conseil, tutelle, donateurs)."
    - id: mutualisme
      label: "Mutualisme d'usagers"
      sens: "Forme sociétaire (SCIC, coopérative) ; bénéficiaire = le sociétariat."
    - id: economie_marchande
      label: "Économie sociale marchande"
      sens: "Société commerciale à rendement modéré et posture sociale."
    - id: propriete_marchande
      label: "Propriété marchande"
      sens: "Propriété privée ordinaire ; le foncier reste un actif."

# ── Drapeaux de fiabilité affichés sur chaque fiche ──────────────────────────
fiabilite:
  seuil_completude_bon: 0.80      # ≥ 80 % de critères renseignés → fiche fiable
  seuil_completude_moyen: 0.55    # 55-80 % → fiable avec réserves
  # en dessous → fiche signalée « à compléter »
